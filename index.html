    const t12 = RK.ALL_TIERS_FULL[1];
    t12.posts.forEach(p => {
      const n = /政治局委员|副总理|副委员长|政协副主席/.test(p) ? 2 : 1;
      for (let i = 0; i < n; i++) {
        const it = mk(t12, p);
        it.seq = i;   /* 同岗位第几个人 */
        list.push(it);
      }
    });

    /* 3. 各省：书记 / 人大主任 / 省长 / 政协主席 / 常委 / 副省长 */
    PROV.forEach(([prov, w]) => {
      const t11 = RK.ALL_TIERS_FULL[2], t10 = RK.ALL_TIERS_FULL[3];
      /* 省级正职：书记 → 人大主任 → 省长 → 政协主席（全国统一序位） */
      /* 规范称呼：省→省委书记、直辖市→市委书记、自治区→党委书记 */
      const isShi = /市$/.test(prov);
      const isZi = /自治区$/.test(prov);
      const provName = prov.replace(/省$|市$|自治区$/, '');
      const topSec = isShi ? provName + '市委书记'
                   : isZi ? provName + '自治区党委书记'
                   : provName + '省委书记';
      const govHead = isShi ? provName + '市长'
                    : isZi ? provName + '自治区人民政府主席'
                    : provName + '省长';
      const npcHead = isShi ? provName + '市人大常委会主任'
                    : isZi ? provName + '自治区人大常委会主任'
                    : provName + '省人大常委会主任';
      const cppccHead = isShi ? provName + '市政协主席'
                      : isZi ? provName + '自治区政协主席'
                      : provName + '省政协主席';
      list.push(mk(t11, topSec, { province: prov, weight: w, fixOrder: 0 }));
      list.push(mk(t11, npcHead, { province: prov, weight: w, fixOrder: 1 }));
      list.push(mk(t11, govHead, { province: prov, weight: w, fixOrder: 2 }));
      list.push(mk(t11, cppccHead, { province: prov, weight: w, fixOrder: 3 }));

      /* 省委常委 10 人 */
      if (false) {
      const stan = ['常务副省长', '组织部长', '宣传部长', '政法委书记', '纪委书记', '秘书长', '统战部长'];
      const stanPre = isShi ? provName + '市委常委、' : isZi ? provName + '自治区党委常委、' : provName + '省委常委、';
      stan.forEach((s, i) => list.push(mk(t10, stanPre + s, { province: prov, weight: w * (0.95 - i * 0.01) })));
      /* 副职 4 人 */
      const depPost = isShi ? provName + '副市长' : isZi ? provName + '自治区人民政府副主席' : provName + '副省长';
      for (let i = 0; i < 4; i++) list.push(mk(t10, depPost, { province: prov, weight: w * (0.86 - i * 0.01) }));
      }
    });

    /* 只保留正国级 / 副国级 / 正部级 —— 不再生成厅局级及以下 */

    /* 排序：权力分 desc → 省份权重 desc */
    list.forEach(x => {
      /* 权力分优先，同分看岗位序位，再看省份权重 */
      if (x.fixOrder != null) x.order = x.fixOrder;
      x.score = x.power * 1000 - (x.order || 0) * 10 - (x.seq || 0) * 0.5 + (x.weight || 0) * 0.001;
    });
    list.sort((a, b) => b.score - a.score);
    list.forEach((x, i) => x.rank = i + 1);
    return list;
  };

  /* ---------------- 渲染 ---------------- */
  const state = { filter: 'all', prov: '' };

  window.renderRankPage = function (g) {
    const p = g.player;
    const key = 'rankv2|' + (g.seed || 0);
    if (!g.__rankV || g.__rankV.key !== key) {
      g.__rankV = { key, list: RK.build(g.seed) };
    }
    let all = g.__rankV.list.slice();

    /* 插入玩家：只有正部级及以上才进榜 */
    const gameLv = p.level || 0;
    const mi = RK.lvInfo(gameLv);          /* 真实职级信息 */
    const pos = p.position || {};
    const myPost = (pos.title || p.title || mi.name);
    const eligible = gameLv >= 8;          /* 正部级(8) / 省委书记(9) 才能进榜 */
    const me = eligible ? {
      id: 0, tier: 'mine', level: mi.lv, tierName: mi.name,
      power: mi.power, post: myPost, name: (p.name || '你') + '（你）',
      age: p.age, faction: '—', me: true,
      province: pos.province || '', weight: 1,
    } : null;
    if (me) {
      me.order = 5;
      me.score = me.power * 1000 - 5;
    }
    if (me) all = all.concat([me]);
    all.sort((a, b) => b.score - a.score || (b.me ? 1 : -1));
    all.forEach((x, i) => x.rank = i + 1);
    const meRow = all.find(x => x.me);
    const myRank = meRow ? meRow.rank : 0;
    const total = all.length;

    /* 筛选 */
    let shown = all;
    if (state.filter === 'prov' && state.prov) shown = all.filter(x => x.province === state.prov || x.me);
    if (state.filter === 'top') shown = all.slice(0, 60);
    if (state.filter === 'near') {
      const idx = all.findIndex(x => x.me);
      if (idx >= 0) shown = all.slice(Math.max(0, idx - 15), idx + 16);
      else shown = all.slice(-30);   /* 不在榜 → 看最后 30 名（最接近正部级的） */
    }

    /* 按职级分组 */
    const groups = [];
    let last = '';
    shown.forEach(x => {
      if (x.tier !== last) { groups.push({ tier: x.tier, level: x.level, rows: [] }); last = x.tier; }
      
      groups[groups.length - 1].rows.push(x);
    });

    const tierMeta = function (id) {
      if (id === 'mine') {
        const mi2 = RK.lvInfo(p.level || 0);
        return { id: 'mine', level: mi2.lv, name: mi2.name, short: mi2.short,
                 power: mi2.power, color: '#8a6a33', posts: [mi2.name] };
      }
      return RK.TIERS.find(t => t.id === id) || RK.TIERS[0];
    };

    const row = x => {
      const tm = tierMeta(x.tier);
      return '<div style="display:flex;align-items:center;gap:7px;padding:5px 9px;font-size:11.5px;' +
        'border-bottom:1px dotted rgba(91,59,111,.12);' + (x.me ? 'background:#fdf4e4;' : '') + '">' +
        '<span style="width:36px;text-align:right;color:#b0a288;font-size:10.5px;flex:none">' + x.rank + '</span>' +
        (window.AV ? AV.box(x.name, { size: 22, age: x.age, sex: x.sex }) : '') +
        '<span style="min-width:64px;font-weight:600;' + (x.me ? 'color:#8a6a33' : 'color:#3a3548') + '">' + x.name +
          (x.me ? '<span class="tag" style="font-size:9px;background:#fdf4e4;color:#8a6a33;margin-left:3px">你</span>' : '') + '</span>' +
        '<span style="flex:1;color:#3a3548;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + x.post + '</span>' +
        (x.province ? '<span class="sm dim" style="font-size:9.5px;flex:none">' + x.province.replace(/省$|市$|自治区$|壮族|回族|维吾尔/g, '') + '</span>' : '') +
        '<span style="width:48px;text-align:right;font-size:10px;color:' + tm.color + ';font-weight:600;flex:none">' + x.power + '</span>' +
        '</div>';
    };

    const head =
      '<div class="ch"><span class="ic">榜</span><h3>全国干部排行榜</h3>' +
        '<span class="tail">正国级 · 副国级 · 正部级 · 共 ' + total + ' 人</span></div>' +

      /* 我的位置 */
      (me
        ? '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:10px;' +
            'background:linear-gradient(100deg,#fdf4e4,#f7eef8);border:1px solid #e8dcc4;margin-bottom:10px">' +
            '<div style="text-align:center"><div style="font-size:21px;font-weight:700;color:#8a6a33">' + myRank + '</div>' +
              '<div class="sm dim" style="font-size:9.5px">全国排名</div></div>' +
            '<div style="width:1px;height:32px;background:#e0d6c2"></div>' +
            '<div><div style="font-size:13.5px;font-weight:600;color:#5b3b6f">' + myPost + '</div>' +
              '<div class="sm dim">' + mi.name + ' · 权力分 ' + mi.power + ' · 超过全国 ' +
                Math.round((1 - myRank / total) * 100) + '% 的干部</div></div>' +
          '</div>'
        : '<div style="padding:10px 12px;border-radius:10px;background:#faf8fc;border:1px solid #e6dcc8;margin-bottom:10px">' +
            '<div style="font-size:12.5px;font-weight:600;color:#7a7186">你不在这个榜单里</div>' +
            '<div class="sm dim" style="font-size:11px;margin-top:3px">' +
              '本榜只列正国级、副国级、正部级三个层级。你当前是 <b style="color:#5b3b6f">' + mi.name + '</b>' +
              '（' + myPost + ' · 权力分 ' + mi.power + '），' +
              '距正部级还差 <b style="color:#a5463e">' + (8 - gameLv) + ' 级</b>。</div>' +
          '</div>') +

      /* 筛选 */
      '<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px">' +
        [['all', '全部'], ['top', '前 60 名'], ['near', '我附近']].map(([k, n]) =>
          '<button data-rkfilter="' + k + '" style="border:1px solid ' + (state.filter === k ? '#8a6a33' : '#ddd') + ';' +
            'background:' + (state.filter === k ? '#8a6a33' : '#fff') + ';color:' + (state.filter === k ? '#fff' : '#666') + ';' +
            'border-radius:6px;padding:3px 11px;font-size:11px;cursor:pointer">' + n + '</button>').join('') +
        '<select data-rkprov style="margin-left:6px;padding:3px 8px;border:1px solid #ddd;border-radius:6px;font-size:11px;background:#fff">' +
          '<option value="">按省份筛选</option>' +
          PROV.map(([n]) => '<option value="' + n + '"' + (state.prov === n ? ' selected' : '') + '>' + n + '</option>').join('') +
        '</select>' +
      '</div>';

    /* 职级阶梯图例 */
    const ladder = '<div style="display:flex;gap:3px;flex-wrap:wrap;margin-bottom:10px;font-size:9.5px">' +
      RK.TIERS.map(t =>
        '<span style="background:' + t.color + '1a;color:' + t.color + ';border-radius:4px;padding:2px 7px">' +
          t.short + '</span>').join('') + '</div>';

    const body = groups.map(gr => {
      const tm = tierMeta(gr.tier);
      return '<div style="margin-bottom:9px">' +
        '<div style="display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:7px 7px 0 0;' +
          'background:' + tm.color + '14;border-left:3px solid ' + tm.color + '">' +
          '<b style="color:' + tm.color + ';font-size:12px">' + tm.name + '</b>' +
          '<span class="sm dim" style="font-size:10px">' + tm.posts.slice(0, 3).join(' / ') +
            (tm.posts.length > 3 ? ' 等' : '') + '</span>' +
          '<span style="margin-left:auto;font-size:10px;color:#7a7186">' + gr.rows.length + ' 人 · 权力分 ' + tm.power + '</span>' +
        '</div>' +
        '<div style="border:1px solid ' + tm.color + '22;border-top:0;border-radius:0 0 7px 7px;overflow:hidden;background:#fffdfb">' +
          gr.rows.map(row).join('') + '</div></div>';
    }).join('');

    return '<div class="card">' + head + ladder +
      '<div id="rankList" style="max-height:62vh;overflow:auto;padding-right:4px">' + body + '</div>' +
    '</div>';
  };

  window.bindRankPage = function (g) {
    document.querySelectorAll('[data-rkfilter]').forEach(e => e.onclick = () => {
      state.filter = e.dataset.rkfilter;
      if (state.filter !== 'prov') state.prov = '';
      window.__render && window.__render();
    });
    document.querySelectorAll('[data-rkprov]').forEach(e => e.onchange = () => {
      state.prov = e.value;
      state.filter = e.value ? 'prov' : 'all';
      window.__render && window.__render();
    });
  };
})();
</script>
<script>/* ============================================================
   治理者之路 · 纪律审查 / 强制问话
   风险 0 = 廉洁；>60 警示；>=70 强制问话；>=80 双开
   ============================================================ */
(function () {
  'use strict';
  const cl = (v, a, b) => Math.max(a, Math.min(b, v));
  const DC = {};
  window.DC = DC;

  /* 问话选项（结果不写在按钮上） */
  DC.OPTS = [
    { key: 'A', label: '坦白事情' },
    { key: 'B', label: '有所顾虑，不回答，只承认一小部分问题' },
    { key: 'C', label: '拒不承认，对抗审查' },
  ];

  DC.risk = function (g) {
    if (window.RISK && RISK.get) return RISK.get(g);
    const p = g.player;
    let base = cl(70 - (p.attrs.clean || 60), 0, 55);
    (p.riskLog || []).forEach(x => { base += x.v; });
    return Math.round(cl(base, 0, 100));
  };

  DC.levelOf = function (r) {
    if (r >= 80) return 'expel';     /* 双开 */
    if (r >= 70) return 'interrogate'; /* 强制问话 */
    if (r > 60) return 'review';     /* 纪律审查警示 */
    return 'none';
  };

  /* 生成问题：按风险来源，逐条问 */
  DC.questions = function (g) {
    const p = g.player;
    const log = (p.riskLog || []).slice();
    if (!log.length) {
      return [{ note: '有人反映你作风不检点，你怎么解释？', v: 10 }];
    }
    /* 严重的排前面 */
    log.sort((a, b) => b.v - a.v);
    return log.slice(0, 6).map(x => ({ note: x.note, v: x.v, date: x.date }));
  };

  DC.start = function (g) {
    g.disc = {
      forced: true,
      qs: DC.questions(g),
      idx: 0,
      answers: [],
    };
    return g.disc;
  };

  /* 回答一题 */
  DC.answer = function (g, optKey) {
    const d = g.disc;
    if (!d || !d.forced) return { done: true };
    d.answers.push(optKey);

    if (optKey === 'B') {
      return { over: true, end: 'expel_party', msg: '开除党籍' };
    }
    if (optKey === 'C') {
      return { over: true, end: 'double', msg: '双开并移交司法机关' };
    }
    /* A：坦白，继续下一题 */
    d.idx++;
    if (d.idx >= d.qs.length) {
      /* 全部坦白 → 连降三级 */
      const p = g.player;
      const before = p.level || 0;
      const beforeName = window.RANK ? RANK.byIndex(before).name : '科员';
      const beforeTitle = (p.position && p.position.title) || beforeName;
      p.level = Math.max(0, before - 3);
      p.rank = window.RANK ? RANK.byIndex(p.level).name : '科员';
      p.rankId = p.rank;
      p.tenureInLevel = 0;
      p.attrs.clean = cl((p.attrs.clean || 60) + 20, 0, 100);
      p.riskLog = [];
      if (window.RISK && RISK.clearSome) RISK.clearSome(g, 0.95);
      /* 职务名跟着变 */
      if (p.position) {
        const t2 = window.titleForLevel ? titleForLevel(p.level) : p.rank;
        p.position.title = t2;
        p.position.role = t2;
        p.position.rankTitle = p.rank;
        /* 单位按职务对应调整 */
        const county = p.position.county || '';
        if (p.level >= 4) { p.position.org = county + '人民政府'; p.position.sec = '政府办公室'; p.position.kind = 'gov'; }
        else if (p.level >= 2) { p.position.org = county + '人民政府'; p.position.sec = '综合科'; p.position.kind = 'gov'; }
        else { p.position.org = county + '办公室'; p.position.sec = '综合科'; p.position.kind = 'gov'; }
      }
      p.title = p.position ? p.position.title : p.rank;
      /* 清组织架构缓存，确保降级后席位重建 */
      g.__orgX2 = null; g.__orgX = null; g.__roster = null;
      /* 写进动态 */
      if (window.AP) AP.push(g, '降', p.name, beforeTitle, (p.position ? p.position.title : p.rank), 'self');
      if (g.news) {
        g.news.unshift({
          t: '【处分决定】组织决定给予你连降三级处分：从' + beforeName + '（' + beforeTitle + '）降为' + p.rank + '（' + (p.position ? p.position.title : p.rank) + '）',
          date: (g.year || '') + '/' + (g.month || ''),
          eff: '连降 ' + (before - p.level) + ' 级 · 风险清零 · 廉洁 +20',
          effColor: '#a5463e', kind: 'bad',
        });
      }
      if (p.history) p.history.push((g.year || '') + '年' + (g.month || '') + '月 · 纪律审查后连降三级，降为' + p.rank);
      d.forced = false;
      return { done: true, demote: before - p.level, from: before, to: p.level, fromName: beforeName, toName: p.rank };
    }
    return { next: d.idx };
  };

  /* 渲染强制审查层 */
  DC.renderOverlay = function (g) {
    const d = g.disc;
    if (!d || !d.forced) return '';
    const q = d.qs[d.idx];
    if (!q) return '';
    const total = d.qs.length;
    return '<div style="position:fixed;inset:0;z-index:200;background:rgba(40,28,50,.72);' +
      'display:flex;align-items:center;justify-content:center;padding:16px">' +
      '<div style="width:min(560px,96vw);max-height:90vh;overflow:auto;background:#fffdfb;' +
        'border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 70px rgba(40,20,60,.5)">' +
        '<div style="padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px">' +
          '<span style="width:24px;height:24px;border-radius:7px;background:#fbe6e4;color:#a5463e;' +
            'display:grid;place-items:center;font-size:12px">纪</span>' +
          '<b style="color:#a5463e;font-size:15px">纪律审查 · 组织谈话</b>' +
          '<span style="margin-left:auto;font-size:11.5px;color:#7a7186">第 ' + (d.idx + 1) + ' / ' + total + ' 问</span>' +
        '</div>' +
        '<div style="padding:16px 20px">' +
          '<div style="font-size:12.5px;color:#7a7186;margin-bottom:10px">' +
            '省纪委监委的同志坐在你对面，桌上摊着一叠材料。' +
          '</div>' +
          '<div style="border:1px solid #e0b8b2;background:#fff8f7;border-radius:11px;padding:13px 15px;margin-bottom:14px">' +
            '<div style="font-size:13.5px;color:#7a2b3a;line-height:1.8">' +
              '「' + q.note + '」' +
              '<span style="color:#a5463e;font-size:11.5px;margin-left:6px">（风险 +' + q.v + '）</span>' +
            '</div>' +
            '<div style="font-size:12px;color:#7a7186;margin-top:6px">这件事你怎么解释？</div>' +
          '</div>' +
          DC.OPTS.map(o =>
            '<button data-disc="' + o.key + '" style="display:block;width:100%;text-align:left;' +
            'margin-bottom:7px;padding:11px 14px;border:1px solid var(--line);background:#fffdfa;' +
            'border-radius:10px;font-size:13px;cursor:pointer">' +
            '<b style="color:#5b3b6f;margin-right:6px">' + o.key + '.</b>' + o.label + '</button>'
          ).join('') +
        '</div>' +
        '<div style="padding:10px 20px 14px;border-top:1px solid var(--line);font-size:11.5px;color:#a5463e">' +
          '审查期间不得离开，必须逐条回答。' +
        '</div>' +
      '</div></div>';
  };

  /* 结局层 */
  DC.renderEnding = function (g, kind) {
    const p = g.player;
    const data = {
      expel_party: {
        title: '开除党籍',
        color: '#a5463e',
        line: '组织认定你「对党不忠诚、不老实，隐瞒事实」，决定给予你开除党籍处分。',
        sub: '政治生命到此为止。',
      },
      double: {
        title: '双开 · 移交司法',
        color: '#7a2b3a',
        line: '组织认定你「对抗组织审查」，决定开除党籍、开除公职，并将问题线索移交司法机关。',
        sub: '后面的事，不再由你决定。',
      },
    }[kind] || {};
    return '<div style="position:fixed;inset:0;z-index:210;background:rgba(30,20,38,.86);' +
      'display:flex;align-items:center;justify-content:center;padding:16px">' +
      '<div style="width:min(520px,94vw);background:#fffdfb;border-radius:16px;padding:28px 26px;text-align:center;' +
        'box-shadow:0 24px 70px rgba(20,10,30,.6)">' +
        '<div style="font-size:11.5px;color:#7a7186;letter-spacing:4px">处 分 决 定</div>' +
        '<div style="font-size:28px;font-weight:700;color:' + data.color + ';letter-spacing:4px;margin:14px 0">' + data.title + '</div>' +
        '<div style="font-size:13.5px;color:#4c4159;line-height:2;text-align:left;margin:14px 0">' + data.line + '</div>' +
        '<div style="font-size:13px;color:#7a7186;margin-bottom:18px">' + data.sub + '</div>' +
        '<div style="border-top:1px dashed var(--line);padding-top:14px;font-size:12px;color:#7a7186;text-align:left">' +

<script>/* ============================================================

   ============================================================ */
window.RANK = window.RANK || {};
var RANK = window.RANK;

/* 每一级的：名称、权力分、任期月数、晋升所需考察分、姓名池规模 */
RANK.LEVELS = [
  { i: 0,  name: '科员',     short: '科员',   power: 1,   term: 40, need: 52,  seats: 1,  title: '一级科员' },

  { i: 8,  name: '正部级',   short: '正部',   power: 90,  term: 60, need: 98,  seats: 1,  title: '省长' },
  { i: 9,  name: '省委书记', short: '省委书记', power: 100, term: 60, need: 999, seats: 1, title: '省委书记' },
];

RANK.byIndex = i => RANK.LEVELS[clampInt(i, 0, RANK.LEVELS.length - 1)];
function clampInt(v, a, b) { return Math.max(a, Math.min(b, Math.round(v || 0))); }

/* 每一级的岗位称呼（按机构类型给不同的叫法） */
RANK.TITLES = {
  0: { party: '一级科员', gov: '一级科员', other: '书记员', union: '干事', town: '科员' },
  1: { party: '副部长', gov: '副科长', other: '副庭长', union: '副主席', town: '副书记' },
  2: { party: '部长', gov: '科长', other: '庭长', union: '主席', town: '副书记（主持工作）' },
  3: { party: '副部长', gov: '副局长', other: '副院长', union: '副主席', town: '副乡长' },

  5: { party: '副书记', gov: '副市长', other: '副院长', union: '副主席', town: '副县长' },
  6: { party: '书记', gov: '市长', other: '院长', union: '主席', town: '县委书记' },

};
RANK.titleFor = (idx, kind) => (RANK.TITLES[idx] && (RANK.TITLES[idx][kind] || RANK.TITLES[idx].gov)) || RANK.byIndex(idx).description || '';

/* 单位名称（随职级变化） */
RANK.unitFor = function (idx, pos) {
  const area = pos.area || '本地';
  const city = pos.city || '本市';
  const prov = pos.province || '本省';
  if (idx <= 2) return area + '·' + (pos.org || '机关') + (pos.sec ? '·' + pos.sec : '');
  if (idx === 3) return area + '·' + (pos.org || '机关') + '·副局长';
  if (idx === 4) return area + '·' + (pos.org || '机关') + '·局长';
  if (idx === 5) return city + '·副市长';
  if (idx === 6) return city + '·市长';
  if (idx === 7) return prov + '·副省长';
  if (idx === 8) return prov + '·省长';
  return prov + '·省委书记';
};

/* ---------- 全省干部序列（排行榜：从省委书记到科员） ---------- */
RANK.buildCadreList = function (seedStr, province) {
  const rnd = seededRand(seedStr);
  const list = [];
  const pick = a => a[Math.floor(rnd() * a.length)];
  const SUR = window.__FY_SUR || ['王','李','张','刘','陈','杨','黄','赵','周','吴','徐','孙','马','朱','胡','郭','何','高','林','罗','郑','梁','谢','宋','唐','许','韩','冯'];
  const GIV = window.__FY_GIV || ['建军','志明','文博','海峰','晓峰','立新','永鹏','天佑','子明','振华','国强','春生','承志','向东','卫东','俊杰','晓东','继伟','培源','思远','浩然','欣怡','雨桐','静怡','雅琴','秀兰','桂英'];
  const nm = () => pick(SUR) + pick(GIV);
  const cities = (window.__GEO && window.__GEO.CITIES && window.__GEO.CITIES[provKey(province)]) || ['省会市', '地级市一', '地级市二'];
  const city = i => cities[i % cities.length];

  /* 省委书记 1 人 */
  list.push({ name: nm(), lv: 9, title: '省委书记', unit: province + '省委', city: province });
  /* 省长、副书记、省委常委、副省长 —— 副部级及以上 */
  list.push({ name: nm(), lv: 8, title: '省长', unit: province + '人民政府', city: province });
  list.push({ name: nm(), lv: 8, title: '省委副书记', unit: province + '省委', city: province });
  for (const t of ['常务副省长', '组织部长', '宣传部长', '政法委书记', '纪委书记']) {
    list.push({ name: nm(), lv: 7, title: '省委常委·' + t, unit: province + '省委', city: province });
  }
  for (let i = 0; i < 6; i++) list.push({ name: nm(), lv: 7, title: '副省长', unit: province + '人民政府', city: province });
  /* 正厅级：各市书记、市长 + 省直部门厅长 */
  const nCity = Math.min(12, cities.length);
  for (let i = 0; i < nCity; i++) {
    list.push({ name: nm(), lv: 6, title: '市委书记', unit: city(i) + '市委', city: city(i) });
    list.push({ name: nm(), lv: 6, title: '市长', unit: city(i) + '人民政府', city: city(i) });
  }
  for (const d of ['省发改委', '省财政厅', '省公安厅', '省教育厅', '省卫健委', '省交通厅', '省人社厅', '省住建厅']) {
    list.push({ name: nm(), lv: 6, title: '厅长', unit: province + '·' + d, city: province });
  }
  /* 副厅级：各市副市长、市局局长 */
  for (let i = 0; i < nCity; i++) {
    for (let k = 0; k < 3; k++) list.push({ name: nm(), lv: 5, title: '副市长', unit: city(i) + '人民政府', city: city(i) });
    for (let k = 0; k < 4; k++) list.push({ name: nm(), lv: 5, title: '市局局长', unit: city(i) + '·' + pick(['财政局', '公安局', '教育局', '住建局']), city: city(i) });
  }
  /* 正处级：区长、县长、市局副局长 */
  for (let i = 0; i < nCity; i++) {
    for (let k = 0; k < 3; k++) list.push({ name: nm(), lv: 4, title: '区长（县长）', unit: city(i) + '·' + pick(['东城区', '西城区', '城南区', '北河县', '青山县']), city: city(i) });
    for (let k = 0; k < 3; k++) list.push({ name: nm(), lv: 4, title: '市局副局长', unit: city(i) + '·' + pick(['财政局', '人社局', '交通局']), city: city(i) });
  }
  /* 副处级：区县副局长、乡镇书记 */
  for (let i = 0; i < nCity; i++) {
    for (let k = 0; k < 4; k++) list.push({ name: nm(), lv: 3, title: '副局长', unit: city(i) + '·' + pick(['住建局', '民政局', '水务局', '卫健委']) + '·副局长', city: city(i) });
    for (let k = 0; k < 2; k++) list.push({ name: nm(), lv: 3, title: '乡党委书记', unit: city(i) + '·' + pick(['梧桐街道', '武陵乡', '永安街道']), city: city(i) });
  }
  /* 正科级：科长、乡长、股长 */
  for (let i = 0; i < nCity; i++) {
    for (let k = 0; k < 5; k++) list.push({ name: nm(), lv: 2, title: '科长', unit: city(i) + '·' + pick(['财政局', '教育局', '住建局', '人社局', '交通局']) + '·' + pick(['办公室', '综合科', '人事科', '财务科']), city: city(i) });
    for (let k = 0; k < 3; k++) list.push({ name: nm(), lv: 2, title: '乡长', unit: city(i) + '·' + pick(['武陵乡', '荷塘乡', '龙泉乡']), city: city(i) });
  }
  /* 副科级：副科长、副乡长 */
  for (let i = 0; i < nCity; i++) {
    for (let k = 0; k < 5; k++) list.push({ name: nm(), lv: 1, title: '副科长', unit: city(i) + '·' + pick(['财政局', '教育局', '住建局', '民政局', '水务局']) + '·' + pick(['办公室', '综合科', '业务科']), city: city(i) });
    for (let k = 0; k < 3; k++) list.push({ name: nm(), lv: 1, title: '副乡长', unit: city(i) + '·' + pick(['荷塘乡', '集市乡']), city: city(i) });
  }
  /* 科员：大量 */
  for (let i = 0; i < nCity; i++) {
    for (let k = 0; k < 18; k++) {
      list.push({ name: nm(), lv: 0, title: '一级科员', unit: city(i) + '·' + pick(['财政局', '教育局', '人社局', '住建局', '交通局', '农业农村局', '司法局']) + '·' + pick(['办公室', '综合科', '人事科', '业务一科', '财务科']), city: city(i) });
    }
  }
  /* 按权力排序 */
  list.forEach(x => { x.power = RANK.byIndex(x.lv).power; });
  list.sort((a, b) => b.power - a.power || a.name.localeCompare(b.name, 'zh'));
  list.forEach((x, i) => x.rank = i + 1);
  return list;
};

function provKey(name) {
  const m = { '北京市': 'BJ', '天津市': 'TJ', '河北省': 'HE', '山西省': 'SX', '内蒙古自治区': 'NM', '辽宁省': 'LN',
    '吉林省': 'JL', '黑龙江省': 'HL', '上海市': 'SH', '江苏省': 'JS', '浙江省': 'ZJ', '安徽省': 'AH', '福建省': 'FJ',
    '江西省': 'JX', '山东省': 'SD', '河南省': 'HA', '湖北省': 'HB', '湖南省': 'HN', '广东省': 'GD', '广西壮族自治区': 'GX',
    '海南省': 'HI', '重庆市': 'CQ', '四川省': 'SC', '贵州省': 'GZ', '云南省': 'YN', '西藏自治区': 'XZ', '陕西省': 'SN',
    '甘肃省': 'GS', '青海省': 'QH', '宁夏回族自治区': 'NX', '新疆维吾尔自治区': 'XJ' };
  return m[name] || 'HN';
}

function seededRand(str) {
  let h = 2166136261;
  const s = String(str);
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return function () {
    h ^= h << 13; h ^= h >>> 17; h ^= h << 5;
    return ((h >>> 0) % 1000000) / 1000000;
  };
}

      '</div>' +

      /* 学校 */
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap">' +
        '<span style="width:56px;font-size:13px;color:#5b3b6f;font-weight:600">学校</span>' +
        '<select id="setSchool" style="padding:9px 12px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:13.5px;background:#fffdf9;min-width:220px">' +
        schools.map(sc => '<option value="' + sc + '"' + (p.school === sc ? ' selected' : '') + '>' + sc + '</option>').join('') +
        '</select>' +
      '</div>' +

      /* 专业（按类分组） */
      '<div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;flex-wrap:wrap">' +
        '<span style="width:56px;font-size:13px;color:#5b3b6f;font-weight:600;padding-top:8px">专业</span>' +
        '<select id="setMajor" style="padding:9px 12px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:13.5px;background:#fffdf9;min-width:280px">' +
        (function () {
          const groups = {};
          (FY.MAJORS || []).forEach(mj => {
            const k = (FY.MAJOR_KIND && FY.MAJOR_KIND[mj]) || '其他';
            (groups[k] = groups[k] || []).push(mj);
          });
          return Object.keys(groups).map(k =>
            '<optgroup label="' + k + '">' +

            '</optgroup>').join('');
        })() +
        '</select>' +
        '<span class="sm dim" style="padding-top:9px">共 ' + (FY.MAJORS || []).length + ' 个专业</span>' +
      '</div>' +

      '<div style="background:#faf8fc;border:1px solid var(--line);border-radius:10px;padding:12px;margin:14px 0">' +
        '<div class="sm dim" style="margin-bottom:6px">入仕起点</div>' +
        '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">' +
          '<div><label class="sm dim">起点能力</label><b style="font-size:15px">' + Math.round(p.attrs.ability) + '</b></div>' +
          '<div><label class="sm dim">起点执行力</label><b style="font-size:15px">' + Math.round(p.attrs.exec) + '</b></div>' +

    $('#takeBar').classList.add('hidden');

    /* --- 交互 --- */
    const re = () => renderSetup();
    $$('[data-sex]').forEach(b => b.onclick = () => { G.player.sex = b.dataset.sex; save(); re(); });
    $$('[data-nation]').forEach(b => b.onclick = () => { G.player.nation = b.dataset.nation; save(); re(); });
    $$('[data-edu]').forEach(b => b.onclick = () => { G.player.edu = b.dataset.edu; save(); re(); });
    const sn = $('#setSchool'); if (sn) sn.onchange = () => { G.player.school = sn.value; save(); };
    const mj = $('#setMajor'); if (mj) mj.onchange = () => { G.player.major = mj.value; save(); };

      nm.oninput = () => {

        if (v) { G.player.customName = v; G.player.name = v; }

      };
    }
    $$('[data-randname]').forEach(b => b.onclick = () => {
      G.player.name = pick(FY.SURNAMES) + pick(FY.GIVEN);
      G.player.customName = G.player.name;
      save(); re();
    });

    const btn = $('#btnToPost');
    if (btn) btn.onclick = () => {
      const p2 = G.player;
      const nmv = ($('#setName') || {}).value;
      if (nmv && nmv.trim()) { p2.name = nmv.trim(); p2.customName = p2.name; }
      const snv = ($('#setSchool') || {}).value; if (snv) p2.school = snv;
      const mjv = ($('#setMajor') || {}).value; if (mjv) p2.major = mjv;
      /* 起点属性（不考试，随机一个不错的起点） */
      p2.attrs.ability = clamp(Math.round(rnd(58, 72)), 40, 92);
      p2.attrs.exec = clamp(Math.round(rnd(55, 70)), 38, 95);
      p2.attrs.bold = clamp(Math.round(rnd(48, 62)), 35, 85);
      p2.attrs.clean = clamp(Math.round(rnd(68, 85)), 30, 95);
      p2.examGrade = '合格';
      p2.career = 0;
      if (p2.nation === '少数民族') p2.examPts = (p2.examPts || 50.6) + 1;
      save();
      renderPost();

    if (window.__boot) setTimeout(function () { window.__boot.done(); }, 80);

  function gradeOf(score) {
    return score >= 85 ? '甲等' : score >= 65 ? '乙等' : '丙等';
  }

  /* ================= 选岗（真实行政区划 + 真实机构序列） ================= */
  function areaKey() { return G.post.province + '|' + G.post.city; }
  function areasOfCity() { return (FY.areaMap[areaKey()] || [G.post.city]).slice(); }
  function citiesOfProvince() { return (FY.cityMap[G.post.province] || [G.post.province]).slice(); }

  function buildGroups() {
    const R = seeded(G.seed + '|' + G.post.province + '|' + G.post.city + '|' + G.post.area);
    const groups = [];
    const loc = G.post;
    /* 1. 党委 / 政府 / 人大政协法检 / 群团 —— 全部真实机构 */
    FY.orgGroups().forEach(({ n, t, kind, sect }) => {
      const posts = [];
      const nPost = 3 + Math.floor(R() * 6);
      for (let i = 0; i < nPost; i++) {
        const sec = sect[Math.floor(R() * sect.length)];
        posts.push({
          org: n, sec, type: t, kind,
          power: r1(clamp(0.35 + R() * 0.6, 0.2, 0.98)),
          level: 'county', rank: '科员',
        });
      }
      groups.push({ name: n, kind, posts, type: t });
    });
    /* 2. 街道乡镇：由区县下辖乡镇街道组成（真实地名 → 用「XX县城区街道」等规整名） */
    const towns = ['城关街道', '城南街道', '城北街道', '东城街道', '西城街道', 'XX镇', 'XX乡']
      .map(x => x.replace('XX', G.post.area.replace(/(区|县|市|旗|林区)$/, '')));
    towns.forEach(tn => {
      const posts = [];
      const nPost = 4 + Math.floor(R() * 5);
      for (let i = 0; i < nPost; i++) {
        const o = FY.orgGroups()[Math.floor(R() * FY.orgGroups().length)];
        const sec = (o && o.sect ? o.sect : ['办公室'])[Math.floor(R() * 4)];
        posts.push({
          org: tn, sec, type: o ? o.t : '综合', kind: 'town',
          power: r1(0.25 + R() * 0.45),
          level: 'town', rank: '科员',
          sub: o ? o.n : '',
        });
      }
      groups.push({ name: tn, kind: 'town', posts, type: '综合' });
    });
    G.post.groups = groups;
  }

  let lastOrgScroll = 0;
  function renderPost() {
    $('#setup').classList.remove('hidden');
    $('#game').classList.add('hidden');
    const p = G.player;
    const groups = G.post.groups || [];
    const total = groups.reduce((a, g) => a + g.posts.length, 0);
    const areas = areasOfCity();
    const cities = citiesOfProvince();

    let html = `<div class="card" style="max-width:1180px;margin:0 auto">
      <div class="ch"><span class="ic green">岗</span><h3>选择开局岗位</h3>
        <span class="tail">人生事业，始于岗位。不同的岗位，代表着不同的资源和挑战。</span></div>
      <p class="sm" style="margin:0 0 8px">人生事业，始于岗位。街道乡镇岗始终可去；区县部门岗按含权量分三段，起点越好能碰的部门岗越硬。</p>

      <div class="flex g6 ac" style="margin:10px 0;flex-wrap:wrap">
        <span class="sm dim">省份</span>
        <select id="selProv" style="padding:6px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;max-width:200px">
          ${FY.PROVINCES.map(x => `<option value="${x.n}" ${x.n === G.post.province ? 'selected' : ''}>${x.n}</option>`).join('')}
        </select>
        <span class="sm dim">地市</span>
        <select id="selCity" style="padding:6px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;max-width:220px">
          ${cities.map(x => `<option value="${x}" ${x === G.post.city ? 'selected' : ''}>${x}</option>`).join('')}
        </select>
      </div>

      <div style="display:flex;flex-wrap:wrap;gap:6px;margin:8px 0">
        ${areas.map(c => `<button class="chip${c === G.post.area ? ' on' : ''}" data-area="${c}">${c}</button>`).join('')}
      </div>

      <div class="flex g6" style="margin:8px 0">
        <input id="postSearch" placeholder="搜索机构或职务，如「公安局」「政委」「副局长」"
          style="flex:1;padding:7px 12px;border:1px solid var(--line);border-radius:8px;font:inherit">
        <button class="btn sm" id="expandAll">全部展开</button>
        <button class="btn sm" id="collapseAll">全部收起</button>
      </div>
      <p class="sm dim">${G.post.province} · ${G.post.city} · ${G.post.area} —— 共 ${total} 个岗、${groups.length} 个机构。</p>
      <div class="scroll" id="orgList" style="max-height:58vh"></div></div>`;
    $('#setupBody').innerHTML = html;

    $('#orgList').innerHTML = groups.map((g, gi) => {
      const open = G.post.open[g.name];
      let h = `<div class="org"><div class="oh" data-org="i:${gi}"><b>${g.name}</b>
        <span class="tag">${FY.ORG_KINDS[g.kind] || '机构'}</span><span class="sm dim">${g.posts.length} 岗</span>
        <span class="lk">${open ? '收起 ▲' : '展开 ▼'}</span></div>`;
      if (open) {
        h += g.posts.map((po, pi) => {
          const on = G.post.selected && G.post.selected.gi === gi && G.post.selected.pi === pi;
          return `<div class="post${on ? ' on' : ''}" data-post="${gi}:${pi}">
            <span class="tag">${po.kind === 'town' ? '街' : '区'}</span>
            <div class="grow"><b>${G.post.area}·${po.org}${po.sub ? '·' + po.sub : ''}·${po.sec} · 科员</b>
              <div class="sm dim">机构层级 ${po.kind === 'town' ? '街道乡镇' : '区县'} · 角色 科员</div></div>
            <div class="sm dim r">岗位类型：${po.type}<br>含权量：${po.power.toFixed(2)}</div>
            <span class="gb">选择</span></div>`;
        }).join('');
      }
      return h + '</div>';
    }).join('');

    const sel = G.post.selected;
    const bar = $('#takeBar');
    bar.classList.remove('hidden');
    bar.classList.toggle('dis', !sel);
    bar.textContent = sel
      ? `就任「${G.post.province}·${G.post.city}·${G.post.area}·${sel.org}${sel.sub ? '·' + sel.sub : ''}·${sel.sec} · 科员」`
      : '请选择一个岗位';
    bar.onclick = () => { if (G.post.selected) takePost(); };

    $('#selProv').onchange = e => {
      G.post.province = e.target.value;
      const cs = (FY.cityMap[G.post.province] || [G.post.province]);
      G.post.city = cs[0];
      const as = FY.areaMap[G.post.province + '|' + G.post.city] || [G.post.city];
      G.post.area = as[0];
      G.post.selected = null; G.post.open = {};
      buildGroups(); renderPost();
    };
    $('#selCity').onchange = e => {
      G.post.city = e.target.value;
      const as = FY.areaMap[G.post.province + '|' + G.post.city] || [G.post.city];
      G.post.area = as[0];
      G.post.selected = null; G.post.open = {};
      buildGroups(); renderPost();
    };
    $$('[data-area]').forEach(b => b.onclick = () => {
      G.post.area = b.dataset.area; G.post.selected = null; G.post.open = {};
      buildGroups(); renderPost();
    });
    $$('[data-org]').forEach(e => e.onclick = () => {
      const gi = Number(e.dataset.org.split(':')[1]);
      const name = groups[gi].name;
      G.post.open[name] = !G.post.open[name];
      renderPost();
    });
    $$('[data-post]').forEach(e => e.onclick = ev => {
      ev.stopPropagation();
      const [gi, pi] = e.dataset.post.split(':').map(Number);
      G.post.selected = Object.assign({ gi, pi }, groups[gi].posts[pi]);
      renderPost();
    });
    $('#expandAll').onclick = () => { groups.forEach(g => G.post.open[g.name] = true); renderPost(); };
    $('#collapseAll').onclick = () => { G.post.open = {}; renderPost(); };
    /* 恢复滚动位置 */
    const ol = $('#orgList');
    if (ol) {
      if (typeof lastOrgScroll === 'number') ol.scrollTop = lastOrgScroll;
      ol.onscroll = () => { lastOrgScroll = ol.scrollTop; };
    }

    const ps = $('#postSearch');
    if (ps) ps.oninput = e => {
      const kw = e.target.value.trim();
      if (!kw) return;
      groups.forEach(g => { if (g.name.includes(kw) || g.posts.some(x => x.sec.includes(kw))) G.post.open[g.name] = true; });
      renderPost();
      const el2 = $('#postSearch');
      if (el2) { el2.value = kw; el2.focus(); }
    };
  }

  function takePost() {
    const s = G.post.selected;
    const p = G.player;
    p.position = {
      province: G.post.province, city: G.post.city, county: G.post.area,
      org: s.org, sub: s.sub || '', sec: s.sec, role: '科员', title: '一级科员',
      type: s.type, power: s.power, kind: s.kind,
    };
    p.tenure = 0;
    if (window.TASK) TASK.init(G, p.level || 0);
    const full = `${G.post.province}·${G.post.city}·${G.post.area}·${s.org}${s.sub ? '·' + s.sub : ''}·${s.sec}`;
    if (window.AP) AP.push(G, '任', p.name, '待分配', s.org + '·' + s.sec + '·科员', 'self');
    p.history.push(`${G.year}年${G.month}月 · 就任 ${full} · 一级科员`);
    /* 科室名与机构名重复时只显示一次 */
    const orgClean = String(s.org || '').replace(/（[^）]*）/g, '');
    const secShow = (s.sec === s.org || s.sec === orgClean) ? '' : '·' + s.sec;
    addNews(`你到 ${G.post.area}·${s.org}${secShow} 报到，任一级科员。`);
    save();
    $('#setup').classList.add('hidden');
    $('#takeBar').classList.add('hidden');
    toast('已就任：' + s.org + '·' + s.sec);
    renderGame();
  }

  /* ================= 职位库（晋升时自己挑） ================= */
  const JOB = {};

  /* 每个职级可去的职位池：同单位内晋升 + 跨单位平调/上调 */
  /* 职位池改为动态生成：调 window.JOBPOOL.poolFor(职级, 行政区名) */
  JOB.POOL = new Proxy({}, {
    get(_, lv) {
      const area = window.JOBPOOL && JOBPOOL.areaOf ? JOBPOOL.areaOf(G) : '';
      return (window.JOBPOOL ? JOBPOOL.poolFor(Number(lv), area) : []);
    },
    has() { return true; },
  });;

  function jobPoolLegacy(level) {
    const p = G.player;
    const pos = p.position || {};
    const area = pos.county || '本地';
    const city = pos.city || '本市';
    const prov = pos.province || '本省';
    /* 区县名去掉后缀，再拼「XX县人民医院」这类单位 */
    const areaBase = area.replace(/(区|县|市|旗|林区)$/, '');
    const suffix = (area.match(/(区|县|市|旗|林区)$/) || [, ''])[1];
    const town = areaBase + (suffix === '区' ? '街道' : '乡');
    return (JOB.POOL[level] || []).map(j => {
      let unit = '';
      let orgName = pos.org || '机关';
      let secName = pos.sec || '综合科';
      if (j.org === '本机关') {
        unit = area + '·' + orgName + '·' + (j.sec === '同上' ? secName : j.sec);
        orgName = orgName;
      } else if (j.org === '街道乡镇') {
        orgName = town;
        unit = area + '·' + town + '（' + j.title.replace(/副?乡长|乡党委书记/, '党政办') + '）';
      } else if (j.org === '县委办公室') {
        orgName = '县委办公室';
        unit = area + '·县委办公室';
      } else if (j.org === '区县人民政府') {
        orgName = area + '人民政府';
        unit = areaBase + (suffix === '区' ? '区' : '县') + '人民政府';
      } else if (j.org === '县委') {
        orgName = '县委';
        unit = area + '·县委';
      } else if (j.org === '上级市局') {
        orgName = orgName;
        unit = city + '·' + orgName;
      } else if (j.org === '市人民政府') {
        orgName = city + '人民政府';
        unit = city + '人民政府';
      } else if (j.org === '市委') {
        orgName = city + '市委';
        unit = city + '市委';
      } else if (j.org === '市委办公室') {
        orgName = city + '市委办公室';
        unit = city + '·市委办公室';
      } else if (j.org === '自治州人民政府') {
        orgName = city + '人民政府';
        unit = city + '人民政府';
      } else if (j.org === '省人民政府') {
        orgName = prov + '人民政府';
        unit = prov + '人民政府';
      } else if (j.org === '省委') {
        orgName = prov + '省委';
        unit = prov + '·省委·' + j.sec;
      } else if (j.org === '省直部门') {
        orgName = prov + '·' + orgName;
        unit = prov + '·' + orgName;
      } else if (j.org === '省发展和改革委员会') {
        orgName = prov + '发展和改革委员会';
        unit = prov + '·发展和改革委员会';
      } else if (j.org === '省会市委') {
        orgName = city + '市委';
        unit = city + '市委';
      } else if (j.org === '省人大常委会') {
        orgName = prov + '人大常委会';
        unit = prov + '人大常委会';
      } else if (j.org === '省政协') {
        orgName = prov + '政协';
        unit = prov + '政协';
      } else if (j.org === '区人民法院') {
        orgName = area + '人民法院';
        unit = area + '人民法院';

  /* ---------- 中栏 ---------- */
  /* 稳定的种子随机 */
  function sd2(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return function () { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; h |= 0; return ((h >>> 0) % 10000) / 10000; };
  }

  /* 核心数据：按玩家当前所在层级（省/市/区县）实时取数 */
  function coreScope() {
    const p = G.player || {};
    const pos = p.position || {};
    const prov = pos.province || (G.city && G.city.province) || '';
    const city = pos.city || (G.city && G.city.city) || '';
    const county = pos.county || '';
    const lv = p.level || 0;
    const org = pos.org || '';
    const CD = window.CDATA;
    if (!CD) return { scope: 'city', label: '全市口径', prov: prov, city: city, d: G.city };

    /* 判断层级：省/市/区县 */
    let kind;
    if (/省委|省政府|省人大|省政协|自治区/.test(org)) kind = 'prov';
    else if (lv >= 7) kind = 'prov';
    else if (lv >= 5) kind = 'city';
    else if (lv >= 2) kind = 'county';
    else kind = /^省/.test(org) ? 'prov' : 'city';

    const cleanCity = String(city || '').replace(/(市|地区|自治州|盟)$/, '');
    const cleanProv = String(prov || '').replace(/(省|市|自治区|壮族|回族|维吾尔)/g, '');

    const mood = (G.city && G.city.mood) || 80;
    const mk = function (fiscal, gdp, pop, income) {
      const r0 = sd2('core|' + prov + '|' + city + '|' + county + '|' + kind);
      return {
        fiscal: fiscal, gdp: gdp, pop: pop, income: income,
        spend: Math.round(fiscal * (1.12 + r0() * 0.18) * 100) / 100,
        gdpG: Math.round((4.3 + r0() * 2.9) * 10) / 10,
        popAll: Math.round(pop * (1.03 + r0() * 0.07) * 10) / 10,
        mood: mood,
      };
    };
    if (kind === 'prov') {
      const avg = (CD.PROV_AVG || {})[prov] || (CD.PROV_AVG || {})[cleanProv];
      if (avg) {
        return { scope: 'prov', label: prov + ' · 全省口径', prov: prov, city: city,
                 d: mk(avg.rev, avg.gdp, avg.pop, avg.income) };
      }
    }
    if (kind === 'county' && county) {
      const dd = CD.district(prov, city, county);
      if (dd) {
        return { scope: 'county', label: county + ' · 本区县口径', prov: prov, city: city,
                 d: mk(dd.rev, dd.gdp, dd.pop, dd.income) };
      }
    }
    /* 市级 */
    const c = CD.city(prov, city) || G.city || {};
    return { scope: 'city', label: (city || '本市') + ' · 全市口径', prov: prov, city: city,
             d: mk(c.rev || c.fiscal || 0, c.gdp || 0, c.pop || 0, c.income || 0) };
  }

      <div class="ch"><span class="ic green">记</span><h3>最新动态</h3><span class="tail">共 ${G.news.length} 条</span></div>
      <div class="news">
        ${G.news.slice(0, 12).map(n => `<div class="nw"><span class="dot" style="background:${n.kind === 'bad' ? '#a5463e' : n.kind === 'good' ? '#4a8c5c' : '#b9a6cc'}"></span>
          <span class="grow">${n.t}${n.eff ? `<div class="sm" style="color:${n.effColor || '#7a7186'}">${n.eff}</div>` : ''}</span>
          <span class="tm">${n.date}</span></div>`).join('')}
      </div>
      <button class="btn sm ghost" style="width:100%;margin-top:6px" data-nav="chron">展开全部 ${G.news.length} 条（还藏着 ${Math.max(0, G.news.length - 12)} 条）</button>
    </div>`;
  }

  function cardPromo() {
    const p = G.player;
    const lv = p.level || 0;
    const cur = window.RANK ? RANK.byIndex(lv) : { name: '科员', power: 1 };
    const next = window.RANK ? RANK.LEVELS[lv + 1] : null;
    const tenure = p.tenureInLevel || 0;
    const tasksOK = window.TASK ? TASK.allDone(G) : true;
    const taskPct = window.TASK ? Math.round(TASK.progress(G) * 100) : 100;
    const riskV = window.RISK ? RISK.get(G) : 0;
    const termOK = next ? tenure >= cur.term : true;
    const scoreOK = next ? p.examPts >= next.need : true;
    const riskOK = riskV < 70;

    if (!next) {
      return `<div class="card">
        <div class="ch"><span class="ic orange">任</span><h3>你已经到顶了</h3></div>
        <p class="sm dim" style="margin:0">省委书记 · 权力分 100。省内再没有更高的位置。</p>
      </div>`;
    }

    const rows = [
      ['任务', tasksOK, tasksOK ? '全部完成' : taskPct + '%', tasksOK],
      ['任职年限', termOK, tenure + ' / ' + cur.term + ' 个月', termOK],
      ['考察分', scoreOK, p.examPts.toFixed(1) + ' / ' + next.need, scoreOK],
      ['风险', riskOK, riskV + ' / 70', riskOK],
    ];
    const allOK = tasksOK && termOK && scoreOK && riskOK;

    return `<div class="card">
      <div class="ch"><span class="ic orange">任</span><h3>${cur.name} → ${next.name}</h3>
        <span class="tail">权力分 ${cur.power} → ${next.power}</span></div>
      ${rows.map(([n, ok, v]) => `<div class="kv" style="padding:4px 0;border-bottom:1px dashed rgba(91,59,111,.1)">
        <span>${n}</span><span style="color:${ok ? '#3f7d5c' : '#a5463e'}">${ok ? '✓ ' : '✗ '}${v}</span></div>`).join('')}
      <p class="sm dim" style="margin:9px 0 0">${allOK
        ? '四项条件全部满足，可以去首页「晋升」卡片申请提拔。'
        : '四项缺一不可。任务在首页「工作任务」里做，风险超过 70 会先被约谈。'}</p>
      ${!allOK && !riskOK ? '<p class="sm" style="color:#a5463e;margin:4px 0 0">⚠ 风险过高，先降下来再谈提拔。</p>' : ''}
      ${window.FAVOR && FAVOR.canBreakPromote(G) ? '<p class="sm" style="color:#8a6a33;margin:6px 0 0">另外，领导好感已够，可以走「破格提拔」。</p>' : ''}
    </div>`;
  }

  /* ---------- 子页面 ---------- */
  const PAGE_VIEW = {

    faction: () => (window.renderFaction ? renderFaction(G) : '<p class="sm dim">派系未加载</p>'),

    life: () => `<div class="card"><div class="ch"><span class="ic">生</span><h3>人生</h3></div>
      <div class="kv"><span>年龄</span><span>${G.player.age} 岁</span></div>

      ${G.player.history.slice().reverse().map(h => `<div style="border-bottom:1px dashed var(--line);padding:5px 0;font-size:12.5px">${h}</div>`).join('') || '<p class="sm dim">还没有记录</p>'}
    </div>
    ${window.lifeHouse ? lifeHouse() + lifeGovern() + lifeRetire() : ''}`,
    market: () => {
      const p = G.player;
      const pos = p.position || {};
      const myRank = p.rank || '科员';
      const allowed = CAR.allowed(myRank).map(m => m.id);
      const mine = p.garage || [];
      const canBuy = (m) => {
        if (mine.some(x => x.model === m.id)) return { ok: false, why: '已拥有' };
        if (!allowed.includes(m.id)) return { ok: false, why: '职级不够' };
        if (p.netWorth < m.price) return { ok: false, why: '钱不够' };
        return { ok: true };
      };
      const myPlate = mine.length ? mine[0].plate : '—';
      return `<div class="card">
        <div class="ch"><span class="ic">市</span><h3>公车市场</h3>
          <span class="tail">按职级配额 · 车牌按位次自动编号</span></div>
        <p class="sm dim" style="margin:0 0 10px">
          你是 <b>${myRank}</b>，当前可配车型：${CAR.allowed(myRank).map(m => m.t).join(' / ')}。<br>
          车牌规则：<b>${CAR.PLATE_SHORT[pos.province] || '临'}${CAR.plateLetter(pos.province, pos.city)}00001</b> = 一把手；
          你当前职级能拿到 <b>${myPlate}</b> 这类号段。
        </p>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px">
          ${CAR.MODELS.map(m => {
            const st = canBuy(m);
            const owned = mine.find(x => x.model === m.id);
            const plate = owned ? owned.plate : (allowed.includes(m.id) ? (p.pendingPlate || prevPlate(0)) : '—');
            return `<div style="border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fffdfa">
              <div class="carBox" data-model="${m.id}" data-plate="${plate}" data-prov="${pos.province || ''}"
                   style="height:186px;background:linear-gradient(180deg,#eef2f6,#dbe3ea)"></div>
              <div style="padding:9px 11px">
                <div style="display:flex;align-items:baseline;gap:6px">
                  <b style="font-size:13.5px">${m.t}</b>
                  <span class="tag">${m.cls}</span>
                  <span class="sm dim">${m.cc}</span>
                  <span style="margin-left:auto;color:var(--plum);font-weight:700">${m.price.toFixed(1)} 万</span>
                </div>
                <div class="sm dim" style="margin:3px 0 6px">${m.note}</div>
                <div class="flex ac g6">
                  ${owned ? CAR.plateSvg(owned.plate, pos.province, false) : `<span class="sm dim">${st.why || '可购置'}</span>`}
                  <button class="btn sm ${st.ok ? 'primary' : ''}" data-buy="${m.id}" ${st.ok ? '' : 'disabled'}
                    style="margin-left:auto">${owned ? '已上牌' : st.ok ? '购置上牌' : st.why}</button>
                </div>
              </div>
            </div>`;
          }).join('')}
        </div>
        ${mine.length ? `<div class="ch" style="margin-top:16px"><span class="ic green">牌</span><h3>我的车与车牌</h3></div>
          ${mine.map(x => {
            const m = CAR.modelById(x.model);
            return `<div style="display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px;background:#fffdfa">
              <div class="carBox" data-model="${m.id}" data-plate="${x.plate}" data-prov="${pos.province || ''}"
                   style="width:240px;height:140px;background:linear-gradient(180deg,#eef2f6,#dbe3ea);border-radius:8px"></div>
              <div class="grow">
                <b>${m.t}</b> · <span class="sm dim">${m.cls} / ${m.cc}</span>
                <div style="margin-top:6px">${CAR.plateSvg(x.plate, pos.province, true)}</div>
                <div class="sm dim" style="margin-top:4px">${pos.province || ''}${pos.city || ''} · 第 ${x.party} 届公务车 · 购置于 ${x.date}</div>
              </div>
            </div>`;
          }).join('')}` : ''}
      </div>`;
    },
    map: () => (window.renderChinaMap ? renderChinaMap(G) : '<p class="sm dim">地图模块没加载</p>'),
    plan: () => (window.renderCityPlanner ? renderCityPlanner(G) : '<p class="sm dim">城市规划模块没加载</p>'),

    org: () => (window.renderOrgPage ? renderOrgPage(G) : '<p class="sm dim">组织架构未加载</p>'),
    rank: () => (window.renderRankPage ? renderRankPage(G) : '<p class="sm dim">排行榜未加载</p>'),
    chron: () => cardNews(),
    tutor: () => (window.renderTutor ? renderTutor(G) : '<p class="sm dim">教程未加载</p>'),
  };
  PAGE_VIEW.home = () => '';

  /* ---------- 交互 ---------- */
  function bindActions() {
    $$('[data-nav]').forEach(e => e.onclick = ev => { ev.preventDefault(); PAGE = e.dataset.nav; renderGame(); });
    $$('[data-detail]').forEach(e => e.onclick = () => {
      if (e.dataset.detail === 'hist') {
        modal('履职纪事', G.player.history.length
          ? G.player.history.slice().reverse().map(h => `<div style="border-bottom:1px dashed var(--line);padding:5px 0">${h}</div>`).join('')
          : '<p class="dim">还没有记录</p>');
      } else {
        const p = G.player;
        modal('考察分明细', `<div class="kv"><span>起点入仕</span><span>${p.examGrade || '合格'}</span></div>
          <div class="kv"><span>年度考核累计</span><span>${p.evalYears.reduce((a, y) => a + y.points, 0).toFixed(1)}</span></div>
          <div class="kv"><span>走动与汇报</span><span>${(p.examPts - 50.6).toFixed(1)}</span></div>
          <div class="kv"><span>合计考察分</span><span><b>${p.examPts.toFixed(1)}</b></span></div>
          <p class="sm dim">考察分只看硬指标，不看你说了什么。</p>`);
      }
    });
    $$('[data-move]').forEach(e => e.onclick = () => doMove(e.dataset.move));
    $$('[data-buy]').forEach(e => e.onclick = () => buyCar(e.dataset.buy));
    /* 车图：放进容器后统一绘制（优先真照片，否则渲染） */
    $$('.carBox').forEach(box => {
      const m = CAR.modelById(box.dataset.model);
      if (m) CAR.paint(box, m, box.dataset.plate, { province: box.dataset.prov });
    });
    const nw = $('#btnNextWeek');
    if (nw) nw.onclick = nextWeek;
    document.querySelectorAll('[data-marry]').forEach(e => e.onclick = () => {
      const i = Number(e.dataset.marry);
      const c = (G.candidates || [])[i];
      if (!c) return;
      EX.marry(G, c);
      G.candidates = [];
      save(); renderGame();
      modal('喜结连理', '<div style="text-align:center;padding:10px 0">' +
        '<div style="font-size:13px;color:#7a7186;letter-spacing:4px">结 婚 证</div>' +
        '<div style="font-size:26px;font-weight:700;color:#7a2b3a;letter-spacing:4px;margin:14px 0">' + (G.player.name) + ' ❤ ' + c.name + '</div>' +
        '<div style="font-size:14px;color:#5b3b6f">' + c.role + ' · ' + c.age + ' 岁</div>' +
        '<div class="sm" style="color:#7a5c1e;margin-top:8px">' + c.desc + '</div></div>' +
        '<div class="note" style="margin-top:14px">婚后配偶月收入会并入家庭净资产，帮你更快买车。</div>',
        [{ n: '好', c: 'primary' }]);
    });
    document.querySelectorAll('[data-child]').forEach(e => e.onclick = () => {
      const r = EX.haveChild(G);
      if (!r.ok) { toast(r.msg); return; }
      save(); renderGame(); toast('孩子出生了：' + r.name);
    });
    document.querySelectorAll('[data-navto]').forEach(e => e.onclick = () => { PAGE = e.dataset.navto; renderGame(); });
    /* ==== 地图：点省 ==== */
    /* 排行榜 */
    if (window.bindRankPage && document.querySelector('[data-rkfilter]')) bindRankPage(G);
    /* 政府网站 */
    if (window.bindGovSite && document.querySelector('[data-gwtab]')) bindGovSite(G);
    /* 组织架构展开 */
    if (window.bindOrgPage && (document.querySelector('[data-orgopen]') || document.querySelector('[data-orgdept]') || document.querySelector('[data-orgperson]') || document.querySelector('[data-orgtable]') || document.querySelector('[data-orgsecperson]'))) bindOrgPage(G);
    /* 排行榜：点人看档案 */
    if (window.__bindCardNames && document.querySelector('[data-cardname]')) window.__bindCardNames(G);
    /* 任免通知：点人看档案 */
    if (window.AP && AP.bind && document.querySelector('[data-appname]')) AP.bind(G);
    /* 人物关系：点人看档案 */
    if (window.PL && PL.bindPersonClick && document.querySelector('[data-personid]')) PL.bindPersonClick(G);
    /* 人物关系：用人权 */
    /* 破格提拔 */
    document.querySelectorAll('[data-break]').forEach(e => e.onclick = () => {
      const pid = Number(e.getAttribute('data-break'));
      const person = PL.roster(G).list.find(x => x.id === pid);
      if (!person) { toast('找不到该领导'); return; }
      modal('找' + person.name + '破格提拔',
        '<p class="sm" style="margin:0 0 10px;line-height:1.7">' +
          '当前你是 <b>' + (G.player.rank || '') + '</b>，下一级是 <b>' +
          ((window.LVNAMES || {})[(G.player.level || 0) + 1] || '') + '</b>。<br>' +
          '托 <b>' + person.name + '</b>（' + person.title + '）向上做工作，可以跳过任职年限直接提拔。' +
        '</p>' +
        '<div style="background:#fdf4e4;border:1px solid #e0d2a8;border-radius:8px;padding:8px 10px;font-size:11px;line-height:1.7">' +
          '· 好感 <b>' + (person.favor || 0) + '</b>/100 → 成功率约 <b>' +
            Math.round(Math.min(0.90, 0.35 + ((person.favor || 0) - 70) * 0.025) * 100) + '%</b><br>' +
          '· 消耗 <b>6 行动点</b><br>' +
          '· 成功后好感 <b>-15</b>，风险 <b>+22</b>（走关系）<br>' +
          '· 失败好感 <b>-12</b>' +
        '</div>',
        [{ n: '取消', c: 'ghost' }, { n: '托他办', c: 'primary', fn: () => {
          const r = PL.breakPromote(G, person);
          toast(r.msg);
          save(); renderGame();
        } }]);
    });
    document.querySelectorAll('[data-pl]').forEach(e => e.onclick = () => {
      const [pid, kind] = e.dataset.pl.split(':');
      const r = PL.act(G, Number(pid), kind);
      if (!r.ok) { toast(r.msg); return; }
      toast(r.msg);
      save(); renderGame();
    });
    /* 升职 / 平调：先选职位 */
    document.querySelectorAll('[data-pick]').forEach(e => e.onclick = () => {
      const [pid, kind] = e.dataset.pick.split(':');
      const person = PL.roster(G).list.find(x => x.id === Number(pid));
      if (!person) return;
      /* 送礼拉关系：不问岗位，直接加好感 */
      if (kind === 'favor') {
        const gifts = [
          { n: '土特产一提', cost: 2, add: 3, risk: 0.2 },
          { n: '名茶一斤', cost: 6, add: 6, risk: 0.4 },
          { n: '两瓶茅台', cost: 15, add: 10, risk: 0.9 },
          { n: '一块手表', cost: 28, add: 14, risk: 1.8 },
          { n: '一幅字画', cost: 60, add: 20, risk: 3.0 },
        ];
        const nw = G.player.netWorth || 0;
        modal('给' + person.name + '送礼',
          '<p class="sm" style="margin:0 0 10px;line-height:1.7">' +
            '当前好感 <b>' + (person.favor || 0) + '/100</b>　净资产 <b>' + nw.toFixed(1) + ' 万</b><br>' +
            '<span style="color:#8a8a94;font-size:10.5px">挑一件，送出去涨好感，也会留下风险记录。</span>' +
          '</p>' +
          gifts.map(function (gf, gi) {
            const ok = nw >= gf.cost;
            const over = (person.favor || 0) + gf.add > 100;
            return '<button data-gift="' + gi + '"' + (ok && !over ? '' : ' disabled') + ' style="display:block;width:100%;' +
              'text-align:left;margin-bottom:6px;padding:8px 11px;border-radius:8px;' +
              'background:' + (ok && !over ? '#fffdfa' : '#f4f1ec') + ';' +
              'border:1px solid ' + (ok && !over ? (gf.risk >= 1.5 ? '#e0b8b2' : '#e8e0d0') : '#e8e0d8') + ';' +
              'font-size:12px;cursor:' + (ok && !over ? 'pointer' : 'not-allowed') + '">' +
              '<b style="color:' + (ok && !over ? '#5b3b6f' : '#b0b0b0') + '">' + gf.n + '</b>' +
              '<span style="float:right;color:#8a6a33">' + gf.cost + ' 万 · 好感 +' + gf.add + '</span>' +
              '<div style="font-size:10px;color:' + (gf.risk >= 1.5 ? '#a5463e' : '#a89878') + ';margin-top:2px">' +
                '风险 +' + Math.round(gf.risk * 10) + (ok ? '' : ' · 钱不够') + '</div>' +
              '</button>';
          }).join(''),
          [{ n: '取消', c: 'ghost' }]);
        setTimeout(function () {
          document.querySelectorAll('[data-gift]').forEach(function (b) {
            b.onclick = function () {
              const gf = gifts[Number(b.dataset.gift)];
              if (!gf) return;
              const p2 = G.player;
              if ((p2.netWorth || 0) < gf.cost) { toast('钱不够'); return; }
              p2.netWorth = Math.round((p2.netWorth - gf.cost) * 10) / 10;
              person.favor = Math.min(100, (person.favor || 0) + gf.add);
              if (window.RISK) RISK.add(G, 'gift', '给' + person.name + '送了' + gf.n, gf.risk);
              if (g_news()) g_news().unshift({
                t: '你给' + person.name + '（' + person.title + '）送了' + gf.n,
                date: (G.year || '') + '/' + (G.month || ''),
                eff: '好感 +' + gf.add + ' · 花 ' + gf.cost + ' 万', effColor: '#8a6a33', kind: 'info',
              });
              window.__closeModal && window.__closeModal();
              toast('送出去了，' + person.name + ' 好感 ' + person.favor);
              save(); renderGame();
            };
          });
        }, 40);
        return;
      }
      if (kind !== 'promote' && kind !== 'transfer') return;
      modal(kind === 'promote' ? '提拔 · 选择岗位' : '平调 · 选择岗位',
        renderJobPicker(G, person, kind), [{ n: '取消', c: 'ghost' }]);
      setTimeout(() => {
        document.querySelectorAll('[data-jobpick]').forEach(b => b.onclick = () => {
          const [pid2, kind2, idx] = b.dataset.jobpick.split(':');
          const r = PL.act(G, Number(pid2), kind2, Number(idx));
          const bigModal = document.getElementById('modalHost');
          if (r.vote) {
            modal(r.ok ? '常委会表决通过' : '常委会表决未通过',
              renderVoteResult(r.vote) + (r.ok ? '<p class="sm" style="margin-top:10px;color:#3f7d5c">已任命：' + r.msg + '</p>' : ''),
              [{ n: '知道了', c: 'primary' }]);
          } else {
            bigModal.innerHTML = '';
            toast(r.ok ? r.msg : r.msg);
          }
          save(); renderGame();
        });
      }, 40);
    });
    /* 给配偶安排编制 */
    document.querySelectorAll('[data-spouse]').forEach(e => e.onclick = () => {
      const sp = G.player.spouse;
      if (!sp) return;
      const posts = PL.SPOUSE_POSTS || [];
      modal('安排配偶 · ' + sp.name,
        '<p class="sm dim" style="margin:0 0 10px">把妻子安排进编制，需 8 万打点，岗位越高风险越大：</p>' +
        posts.map((po, i) => '<button data-spousepick="' + i + '" style="display:block;width:100%;text-align:left;' +
          'margin-bottom:6px;padding:9px 12px;border:1px solid ' + (po.risk >= 35 ? '#e0b8b2' : 'var(--line)') + ';' +
          'background:' + (po.risk >= 35 ? '#fff8f7' : '#fffdfa') + ';border-radius:9px;font-size:12.5px;cursor:pointer">' +

  const MOVE_FX = {
    report: p => { p.examPts += 3; p.attrs.loyal += 0.4; },
    ask: p => { p.examPts += 2; p.attrs.bold += 0.4; },
    share: p => { p.examPts += 5; p.perf += 0.6; p.attrs.exec += 0.4; },
    guard: p => { p.examPts += 5; p.mentorTrain = (p.mentorTrain || 0) + 1; },
    peer: p => { p.examPts += 7; p.attrs.ambition += 0.3; },
    climb: p => { const ok = Math.random() < clamp(p.examPts / 130, 0.1, 0.6); p.examPts += ok ? 4 : -1; toast(ok ? '打听到了一个位置' : '没打听到什么'); },
    gift: p => { p.netWorth -= 10; const risk = clamp((100 - p.attrs.clean) / 100, 0.05, 0.6); if (Math.random() < risk * 0.4) { G.risk += 1; p.attrs.clean -= 5; toast('这笔礼惹了闲话（廉政风险 +1）'); } else { p.examPts += 6; toast('关系走近了些'); } },
    askinfo: p => { p.examPts += 1; },
    walk: p => { p.examPts += 2; },
    local: p => { p.netWorth -= 0.5; p.examPts += 3; },
    gift2: p => MOVE_FX.gift(p),
    goods: p => { p.examPts += 4; },
    tea: p => { p.energy = Math.min(100, p.energy + 15); },
    cover: p => { p.examPts += 3; p.perf += 0.3; },
  };

  function doMove(k) {
    const p = G.player;
    const a = [...FY.MOVE_ACTIONS, ...FY.VISIT_ACTIONS, ...FY.REST_ACTIONS].find(x => x.k === k);
    if (!a) return;
    if (p.ap < (a.cost || 0)) { toast('行动点不够了，先推进一周'); return; }
    if ((a.money || 0) > p.netWorth) { toast('钱不够'); return; }
    p.ap -= (a.cost || 0);
    MOVE_FX[k](p);
    p.examPts = r1(p.examPts);
    p.attrs.clean = clamp(p.attrs.clean, 0, 100);
    p.attrs.exec = clamp(p.attrs.exec, 0, 100);
    addNews(`${G.player.name} ${a.n}${a.add ? `，考察分 +${a.add}` : ''}`);
    save();
    renderGame();
  }

  function nextWeek() {
    const p = G.player;
    G.day += 7;
    if (G.day > 28) {
      G.day = 1; G.month++; p.tenure++; p.months++;
      p.tenureInLevel = (p.tenureInLevel || 0) + 1;
      G.monthsWorked = (G.monthsWorked || 0) + 1;
      /* 招商项目按月推进 */
      if (window.PROJ && PROJ.tick) PROJ.tick(G);
      /* ===== 发工资 ===== */
      if (window.EX) {
        const lvNow = p.level || 0;
        const amount = EX.salaryOf(lvNow);
        p.netWorth += amount / 10000;
        const pay = { date: G.year + '年' + G.month + '月', amount, bonus: 0 };
        /* 配偶收入 */
        if (p.spouse) p.netWorth += (p.spouse.salary || 0) / 10000;
        p.salaryLog = p.salaryLog || [];
        p.salaryLog.push(pay);
        if (p.salaryLog.length > 60) p.salaryLog.shift();
        p.lastPay = pay;
        addNews(G.year + '年' + G.month + '月 工资到账 ' + money(amount) + (p.spouse ? '（含配偶收入）' : ''));
        EX.familyTick(G);
      }
    }
    if (G.month > 12) {
      G.month = 1; G.year++; p.age++;
      /* 纪委约谈（每年一次机会） */
      if (window.LF) {
        /* 风险 > 70 必约谈 */
        let q = null;
        if (window.RISK && RISK.get(G) >= 70) {
          const qq = window.__EXAM ? window.__EXAM[Math.floor(Math.random() * window.__EXAM.length)] : null;
          if (qq) q = qq;
        }
        if (!q && window.LF) q = LF.maybeDiscipline(G);
        if (q) {
          setTimeout(() => {
            modal('纪委约谈',
              '<p style="margin:0 0 10px">县纪委监委的同志请你过去谈一次话。</p>' +
              '<div style="border:1px solid var(--line);border-radius:10px;padding:12px;background:#fffdfa">' +
              '<b style="color:#7a2b3a">问：</b>' + q.q + '</div>' +
              '<p class="sm dim" style="margin:10px 0 0">廉洁：' + Math.round(p.attrs.clean || 60) + ' · 关注度：' + (p.exposure || 0) + '</p>',
              [{ n: '如实说明', c: 'primary', fn: () => { document.querySelector('[data-disc-good]') && null; } }]);
          }, 400);
        }
      }
      const score = p.perf + p.examPts * 0.2;
      const grade = score >= 90 ? '优秀' : score >= 70 ? '称职' : '基本称职';
      const pts = grade === '优秀' ? 1.2 : grade === '称职' ? 0.6 : 0.2;
      p.evalYears.push({ y: G.year - 1, grade, points: pts });
      p.career = r1(p.career + pts);
      p.examPts = r1(p.examPts + (grade === '优秀' ? 2.5 : grade === '称职' ? 1.2 : 0.3));
      addNews(G.year - 1 + '年度考核：' + grade + '，生涯分 +' + pts);
      /* 年终奖 */
      if (window.EX) {
        const bonus = EX.yearEndBonus(G, p);
        p.netWorth += bonus / 10000;
        if (p.lastPay) p.lastPay.bonus = bonus;
        addNews('年终奖到账 ' + money(bonus));
      }
      toast(`年度考核 ${grade}，生涯分 +${pts}`);
    }
    p.ap = p.apMax;
    if (p.months >= 60) { p.months = 0; p.part++; addNews(`届满，进入第 ${p.part} 届`); }

    /* 人大罢免案表决 */
    if (window.PERM && PERM.tickMonth) PERM.tickMonth(G);
    /* 空岗满 3 个月 → 中央派人 */
    if (window.PERSON && PERSON.tickMonth) PERSON.tickMonth(G);
    /* 时间消磨风险 */
    if (window.RISK && RISK.tick) {
      const faded = RISK.tick(G);
      if (faded) addNews('时间久了，「' + faded.note.slice(0, 16) + '」这条线索淡了（风险 -' + faded.v + '）');
    }

    /* 晋升检查：通过后弹出职位选择器，由玩家自己挑岗位 */
    const r = checkPromotion(G);
    if (r) {
      save();
      renderGame();
      return;
    }

    /* 经济波动 */
    if (Math.random() < 0.5) {
      G.city.gdp = r1(G.city.gdp * (1 + rnd(-0.01, 0.02)));
      G.city.fiscal = r1(G.city.fiscal * (1 + rnd(-0.02, 0.03)));
      FY.METRICS.forEach(m => {
        p.metrics[m.k] = r1(clamp(p.metrics[m.k] + rnd(-1.2, 1.8), 0, 100));
      });
    }
    addNews(`本周办公例会研究${pick(FY.NEWS_ITEMS)}，形成纪要 ${irnd(3, 9)} 条。`);
    save();
    renderGame();
  }

  /* ================= 晋升面板 ================= */
  function cardPromote() {
    const p = G.player;
    if (p.level == null) p.level = 0;
    const lv = p.level;
    const cur = RANK.byIndex(lv);
    const next = RANK.LEVELS[lv + 1] || null;
    const tenure = p.tenureInLevel || 0;
    const termOK = tenure >= cur.term;
    const scoreOK = next ? p.examPts >= next.need : true;
    const ready = next && termOK && scoreOK;
    const termPct = clamp(tenure / cur.term * 100, 0, 100);
    const scorePct = next ? clamp((p.examPts - (lv ? RANK.LEVELS[lv - 1].need : 0)) / Math.max(1, next.need - (lv ? RANK.LEVELS[lv-1].need : 0)) * 100, 0, 100) : 100;

    return `<div class="card">
      <div class="ch"><span class="ic orange">升</span><h3>晋升</h3>
        <span class="tail">${cur.name} · 权力分 ${cur.power}</span></div>
      ${next ? `
      <div class="kv"><span>下一级</span><span><b>${next.name}</b>（权力分 ${next.power}）</span></div>
      <div style="margin:8px 0">
        <div class="flex" style="justify-content:space-between;font-size:12px;color:#7a7186">
          <span>任职年限 ${tenure} / ${cur.term} 个月</span><span>${termOK ? '✓ 已满' : '未满'}</span></div>
        <div class="prog" style="margin-top:3px"><i style="width:${termPct}%;background:${termOK ? '#4a8c5c' : '#9a79bd'}"></i></div>
      </div>
      <div style="margin:8px 0">
        <div class="flex" style="justify-content:space-between;font-size:12px;color:#7a7186">
          <span>考察分 ${p.examPts.toFixed(1)} / ${next.need}</span><span>${scoreOK ? '✓ 达标' : '不够'}</span></div>
        <div class="prog" style="margin-top:3px"><i style="width:${scorePct}%;background:${scoreOK ? '#4a8c5c' : '#c99a5b'}"></i></div>

  function tryPromote() {
    const p = G.player;
    const lv = p.level || 0;
    /* 任务必须全部完成 */
    if (window.TASK && !TASK.allDone(G)) {
      toast('任务没干完，无法提拔（进度 ' + Math.round(TASK.progress(G) * 100) + '%）');
      return;
    }
    /* 风险超过 70，先被约谈 */
    if (window.RISK && RISK.get(G) >= 70) {
      toast('风险过高（' + RISK.get(G) + '），先等纪委谈完话');
      return;
    }
    const cur = RANK.byIndex(lv);
    const next = RANK.LEVELS[lv + 1];
    if (!next) return;
    if ((p.tenureInLevel || 0) < cur.term) { toast('任职年限未满（' + (p.tenureInLevel || 0) + '/' + cur.term + ' 个月）'); return; }
    if (p.examPts < next.need) { toast('考察分不够（' + p.examPts.toFixed(1) + '/' + next.need + '）'); return; }
    const r = checkPromotion(G, false) || checkPromotionWithBoost();
    if (!r) {
      toast('这次没排上，再走动走动');
      p.examPts = r1(p.examPts - 1);
      save(); renderGame();
      return;
    }
    /* 通过后会弹出职位选择器，由玩家自己挑岗位 */
    save();
    renderGame();
  }

  function checkPromotionWithBoost() {
    /* 玩家主动申请时，成功率更高 */
    const p = G.player;
    const lv = p.level || 0;
    const next = RANK.LEVELS[lv + 1];
    if (!next) return null;
    if (Math.random() > clamp((p.examPts - next.need) / 20 + 0.55, 0.35, 0.95)) return null;
    return checkPromotion(G, true);
  }

  /* ================= 晋升系统 ================= */
  function promotable(lv) {
    if (lv >= RANK.LEVELS.length - 1) return null;
    return RANK.LEVELS[lv + 1];
  }

  function addLog(t) {
    const p = G && G.player; if (!p) return;
    p.history.push(G.year + '年' + G.month + '月 · ' + t);
    if (p.history.length > 200) p.history.shift();
  }

  function checkPromotion(g, force) {
    const p = g.player;
    if (p.level == null) p.level = 0;
    const lv = p.level;
    const cur = RANK.byIndex(lv);
    const next = promotable(lv);
    if (!next) return false;
    if (!force) {
      if ((p.tenureInLevel || 0) < cur.term) return false;
      if (p.examPts < next.need) return false;
      const luck = clamp((p.examPts - next.need) / 25 + 0.35, 0.15, 0.9);
      if (Math.random() > luck) return false;
    }
    /* 通过后不直接分配 —— 弹出职位选择器，让玩家自己挑 */
    const lvl = lv + 1;
    openJobPicker(lvl);
    return { picker: true, level: lvl, name: RANK.byIndex(lvl).name, power: RANK.byIndex(lvl).power };
  }

  /* 车牌规则：省委书记/省长 00001~；市委书记 00002；区长 00101。
     玩家按职级落到不同号段，买第一辆车时分配号码。 */
  const RANK_BASE = {
    '科员': 3000, '副科': 2600, '正科': 2200, '正处': 1500, '副厅': 900,
    '正厅': 300, '副部': 100, '正部': 2, '省委常委': 1,
  };
  function prevPlate(offset) {
    const p = G.player;
    const pos = p.position || {};
    const rank = p.rank || '科员';
    const base = RANK_BASE[rank] != null ? RANK_BASE[rank] : 3000;

  function buyCar(id) {
    const p = G.player;
    const m = CAR.modelById(id);
    if (!m) return;
    const pos = p.position || {};
    if (!p.garage) p.garage = [];
    /* 一个人只能有一辆车 */
    const cur = p.garage[0];
    if (cur && cur.model === id) { toast('这辆车已经是你的了'); return; }
    if (!CAR.allowed(p.rank).some(x => x.id === id)) { toast('按你的职级，配不了这款车'); return; }
    if (p.netWorth < m.price) { toast('钱不够（净资产 ' + p.netWorth.toFixed(1) + ' 万）'); return; }

    /* 已有车 → 先问换不换 */
    if (cur) {
      const cm = CAR.modelById(cur.model);
      const oldName = cm ? cm.t : cur.model;
      const oldPlate = cur.plate;
      const ok = window.confirm('你名下已有「' + oldName + '」（' + oldPlate + '）。\n\n' +
        '一个人只能有一辆车。确定要用「' + m.t + '」换掉它吗？\n' +
        '原车折价回收，可抵 ' + Math.round(m.price * 0.55) + ' 万元。');
      if (!ok) return;
      /* 旧车折价 */
      p.netWorth = r1(p.netWorth + m.price * 0.55);
      p.garage = [];
      p.history.push(G.year + '年' + G.month + '月 · 卖掉 ' + oldName + '（' + oldPlate + '），折价 ' + Math.round(m.price * 0.55) + ' 万');
    }

    p.netWorth = r1(p.netWorth - m.price);
    p.carSeq = (p.carSeq || 0) + 1;
    const lvForPlate = p.level || 0;
    const isLeader = ['书记', '市长', '省长', '常委', '部长', '厅长', '局长'].some(k => (p.rank || '').indexOf(k) >= 0) || lvForPlate >= 7;
    p.usedPlates = p.usedPlates || [];
    const usedSet = new Set(p.usedPlates);
    const plate = (window.EX && EX.genPlate) ? EX.genPlate(G, lvForPlate, isLeader, usedSet) : prevPlate(0);
    p.usedPlates.push(plate);
    p.garage.push({
      model: id, plate, date: `${G.year}年${G.month}月`,
      party: p.part, province: pos.province, city: pos.city,
    });
    p.history.push(`${G.year}年${G.month}月 · 购置公车 ${m.t}，车牌 ${plate}`);

    save();

    renderGame();
  }

    const u = (window.AUTH && AUTH.current()) || {};

    const inp = document.createElement('input');
    inp.type = 'file';

      const f = inp.files && inp.files[0];

      const rd = new FileReader();
      rd.onload = function () {
        const txt = String(rd.result || '');
        /* 预览信息 */

        try {
          const o = JSON.parse(txt);
          const d2 = o.data || o;
          if (d2.player) {
            info = '存档来自：' + (o.user || '未知账号') + '\n' +
                   '玩家：' + (d2.player.name || '?') + '（' + (d2.player.rank || '?') + '）\n' +
                   '时间：' + (d2.year || '?') + '年' + (d2.month || '?') + '月\n' +
                   '导入时间：' + (o.at ? new Date(o.at).toLocaleString('zh-CN') : '未知');
          }
        } catch (e) {
          alert('文件不是有效的存档 JSON');
          return;
        }
        /* 当前有存档 → 先自动备份 */
        const cur = AUTH.loadSave(u.user);
        let backed = false;
        if (cur && cur.player) {
          try {
            const bk = AUTH.exportSave(u.user);
            if (bk) {
              localStorage.setItem('fy_backup_before_import_' + u.user, bk);
              backed = true;
            }
          } catch (e) {}
        }
        const msg2 = '即将导入存档，会覆盖当前进度。\n\n' + info +
          (backed ? '\n\n（原存档已自动备份，可在控制台执行 AUTH.restoreBackup(\'' + u.user + '\') 找回）' : '') +
          '\n\n确定吗？';

          location.reload();

      const p = G.player;
      p.level = 6; p.rank = '正厅级'; p.rankId = '正厅级';
      p.position.title = '市长'; p.position.role = '市长'; p.position.rankTitle = '正厅级';
      p.position.org = p.position.city + '人民政府';
      p.position.sec = '政府办公室';
      p.position.kind = 'gov';
      p.title = '市长';
      p.attrs.clean = 65;
      p.name = '陈国威';
      p.riskLog = [
        { kind: 'gift',     note: '省纪委收到举报：你在任市长期间，收受某地产商赠送的一块百达翡丽手表', v: 38, date: '2029/4' },
        { kind: 'nepotism', note: '你安排表弟进入县文联工作，未参加公开招考', v: 18, date: '2030/9' },
        { kind: 'fire',     note: '你免去市财政局一位副局长的职务，对方实名举报你打击报复', v: 14, date: '2031/2' },
      ];
      p.history.push('2031年11月 · 省纪委监委对你立案审查');
      G.news = [
        { t: '【重要】省纪委监委决定对你涉嫌严重违纪问题立案审查。', kind: 'bad', date: '2031/11/9', eff: '风险 ' + (window.DC ? DC.risk(G) : '?') + ' · 已立案', effColor: '#a5463e' },
        { t: '审查期间，你不得离开、不得对外联系。', kind: 'bad', date: '2031/11/9' },
      ];
      save();
      renderGame();
      return;
    }
    if (window.__TOPMODE || /[?&]top=1/.test(location.search)) {
      G = window.G = makeTopSave();
      save();
      renderGame();
      return;
    }
    const s = load();
    if (s) {
      G = window.G = s;
      if (G.player && G.player.position) { renderGame(); return; }
      if (G.player && G.player.examGrade && G.player.examGrade !== '—') { renderPost(); return; }
      if (G.exam && G.exam.answers.some(x => x !== null)) { renderPost(); return; }
    }
    newGame();
    renderSetup();
  }

  $('#btnRestart') && $('#btnRestart');
  document.addEventListener('DOMContentLoaded', () => {
    const bx = document.getElementById('btnExport');
    if (bx) bx.onclick = function (e) { e.preventDefault(); window.__exportSave(); };
    const bi = document.getElementById('btnImport');
    if (bi) bi.onclick = function (e) { e.preventDefault(); window.__importSave(); };
    const bl = document.getElementById('btnLogout');
    if (bl) bl.onclick = function (e) { e.preventDefault(); window.__logout(); };
    const rb = $('#btnRestart');
    if (rb) rb.onclick = () => modal('重开一局？', '<p>会清空当前存档。</p>', [
      { n: '取消' }, { n: '确定重开', c: 'primary', fn: () => { clearSave(); location.reload(); } },
    ]);
    boot();
  });
})();
</script>
</body>
</html>
