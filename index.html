      '<div id="orgGrid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:9px;' +
        'max-height:66vh;overflow:auto;padding-right:4px">' +
        x.columns.map(c => renderCol(g, c, myOrg, mySec, x)).join('') +
      '</div>' +
    '</div>';
  };

  function HG_date(g) {
    const w = ['一','二','三','四','五','六','日'];
    return g.year + '年' + g.month + '月' + g.day + '日 星期' + w[((g.day || 1) - 1) % 7];
  }

  function renderCol(g, c, myOrg, mySec, x2) {
    const head = '<div style="display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:9px 9px 0 0;' +
      'background:' + c.color + '14;border-bottom:1px solid ' + c.color + '33">' +
      '<span style="width:19px;height:19px;border-radius:5px;background:' + c.color + '22;color:' + c.color + ';' +
        'display:grid;place-items:center;font-size:10px;font-weight:700">' + c.icon + '</span>' +
      '<b style="color:' + c.color + ';font-size:12.5px">' + c.name + '</b>' +
      '<span style="margin-left:auto;font-size:10px;color:#7a7186">下设 ' + c.orgs.length + ' 个机构</span>' +
      '</div>';

    /* 常委席（仅党委系统有） */
    const A2 = window.ADM;
    const seatName = x2.scope === 'province' ? '省委常委' : x2.scope === 'city' ? '市委常委' : A2.standing(g.player.position ? g.player.position.county : '');
    const seatBlock = c.seats.length ? '<div style="padding:7px 8px 3px">' +
      '<div class="sm dim" style="font-size:10.5px;margin-bottom:4px">' +
        seatName + ' 共 ' + c.seats.length + ' 席 · 编制表点名</div>' +
      c.seats.map(s => {
        const pe = s.person;
        /* 有空缺记录 → 渲染空缺卡 */
        const vac = window.PERSON && window.PERSON.vacancies(g)[window.PERSON.vacKey(g, s.title)];
        if (vac) {
          return '<div style="padding:3px 0">' + window.renderVacancyCard(g, s.title) + '</div>';
        }
        const isMe = g.player.name === pe.name;
        return '<div data-orgcard="' + pe.name + '" style="display:flex;gap:7px;padding:5px 0;' +
          'border-bottom:1px dotted rgba(91,59,111,.12);cursor:pointer;' + (isMe ? 'background:#fdf4e4;' : '') + '">' +
          (window.AV ? AV.box(pe.name, { size: 26, sex: pe.sex, age: pe.age }) : pe.name[0]) +
          '<div style="min-width:0">' +
            '<div style="font-size:12px;font-weight:600">' + pe.name + '</div>' +
            '<div style="font-size:10.5px;color:#5b3b6f;line-height:1.5">' + pe.title + '</div>' +
            (function () {
              const sup = pe.supervise || (window.guessSupervise ? window.guessSupervise(pe.title, c.title || c.name, s.org) : '');
              return sup ? '<div style="font-size:10px;color:#8a6a33;line-height:1.4">分管：' + sup + '</div>' : '';
            })() +
            '<div style="font-size:10px;color:#7a7186">' + pe.level + ' · ' + pe.age + '岁·' + pe.sex + '·' + pe.edu + '·' + pe.faction + '</div>' +
          '</div></div>';
      }).join('') + '</div>' : '';

    /* 下设机构 */
    const orgBlock = c.orgs.map(o => {
      const openKey = c.key + '|' + o.name;
      const opened = openSet[openKey];
      const isMine = myOrg && (o.name === myOrg || myOrg.indexOf(o.name.replace(/^(区|市|省|县)/, '').replace(/（.*?）/g, '')) >= 0);
      return '<div style="border-top:1px dotted rgba(91,59,111,.14)">' +
        '<div data-orgopen="' + openKey + '" style="display:flex;align-items:center;gap:5px;padding:6px 9px;' +
          'cursor:pointer;font-size:11.5px;' + (isMine ? 'background:#fdf4e4;' : '') + '">' +
          '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;' +
            (isMine ? 'font-weight:700;color:#8a6a33' : '') + '">' + o.name + '</span>' +
          '<span class="sm dim" style="font-size:9.5px;flex:none">已列内设 ' + o.secs.length + '</span>' +
          (isMine ? '<span class="tag" style="font-size:9px;background:#fdf4e4;color:#8a6a33;flex:none">你在这里</span>' : '') +
          '<span style="margin-left:auto;font-size:10px;color:#7a7186;flex:none">' + (opened ? '收起 ▲' : '展开 ▾') + '</span>' +
        '</div>' +
        (opened ? '<div style="padding:1px 9px 7px 18px">' +
          o.secs.map(s => {
            const here = isMine && s.name === mySec;
            return '<div style="display:flex;align-items:center;gap:5px;padding:3px 0;font-size:11px;' +
              'border-bottom:1px dotted rgba(91,59,111,.08)">' +
              '<span style="color:#b9a6cc">└</span>' +
              '<span style="color:#5b3b6f">' + s.head + '</span>' +
              '<span class="sm dim" style="font-size:10px">' + s.post + '</span>' +
              '<span>' + s.name + '</span>' +
              '<span class="sm dim" style="font-size:9.5px">' + s.rank + '</span>' +
              (here ? '<span class="tag" style="font-size:9px;background:#e6f2e9;color:#3f7d5c;margin-left:auto">你在</span>' : '') +
              '</div>';
          }).join('') + '</div>' : '') +
        '</div>';
    }).join('');

    return '<div style="border:1px solid ' + c.color + '33;border-radius:9px;overflow:hidden;background:#fffdfb">' +
      head + seatBlock + orgBlock + '</div>';
  }

  /* 绑定 */
  window.bindOrgPage = function (g) {
    document.querySelectorAll('[data-orgopen]').forEach(e => {
      e.onclick = () => {
        const k = e.dataset.orgopen;
        const grid = document.getElementById('orgGrid');
        const top = grid ? grid.scrollTop : 0;
        openSet[k] = !openSet[k];
        window.__render && window.__render();
        setTimeout(() => { const g2 = document.getElementById('orgGrid'); if (g2) g2.scrollTop = top; }, 20);
      };
    });
    document.querySelectorAll('[data-orglevel]').forEach(e => {
      e.onclick = () => {
        const v = e.dataset.orglevel;
        viewScope = v === 'auto' ? null : (['province', 'city', 'district'][Number(v)] || null);
        openSet = {};
        g.__orgX = null;   /* 清缓存，强制重建 */
        window.__render && window.__render();
      };
    });
        /* 点人 → 完整档案卡 */
    document.querySelectorAll('[data-orgcard]').forEach(e => {
      e.onclick = () => {
        const name = e.dataset.orgcard;
        const x = O.build(g);
        let found = null;
        x.columns.forEach(c => c.seats.forEach(s => { if (s.person && s.person.name === name) found = s.person; }));
        if (!found) return;
        const pos = g.player.position || {};
        window.openPersonCard(found, {
          area: (pos.county || '') ,
          moves: (g.player.history || []).filter(h => String(h).indexOf(found.name) >= 0).map(h => ({ date: '', text: h })),
        });
      };
    });
    /* 空缺补位 */
    if (window.bindVacancy) bindVacancy(g);

  };
})();
</script>
<script>/* ============================================================
   治理者之路 · 组织架构（照搬参考站四列结构）
   四列：党委系统 / 行政系统 / 人大 / 政协
   每列：主席 → 席位卡（头像+姓名+职务+分管+职级） → 下设机构
   ============================================================ */
(function () {
  'use strict';
  const OX = {};
  window.__orgOpen = window.__orgOpen || {};
  window.ORGX2 = OX;

  const pick = (r, a) => a[Math.floor(r() * a.length)];
  const hsh = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return Math.abs(h); };
  const sd = k => { let s = hsh(k) || 1; return () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; }; };

  const SUR = ['高','崔','丁','赵','唐','沈','郭','曹','周','肖','林','罗','李','王','张','刘','陈','杨','黄','吴','徐','孙','马','朱'];
  const GIV = ['彬刚','平鹏','远勇','睿涛','旭浩','斌宇','凯鹏','伟旭','文涛','丹欣','超','磊','嘉','明志','建华','国强','海峰','志明'];
  const FACTION = ['学院派', '组织系统', '无派系', '改革派', '本地派', '军转干部', '技术官僚'];
  const EDU = ['本科', '硕士', '博士'];


  /* 用 window 上的全局变量，避免闭包内变量在重建时读不到 */

  /* ---------------- 建四列数据 ---------------- */
  OX.build = function (g, forceScope) {
    const p = g.player;
    const pos = p.position || {};
    const lv = p.level || 0;
    const A = window.ADM;
    if (!A) return null;

    /* 层级：职级优先 */
    /* 层级按当前职级实时算，不缓存 */
    const auto = lv >= 7 ? 'province' : lv >= 5 ? 'city' : 'district';
    const scope = forceScope || window.__orgViewScope || auto;
    const area = scope === 'province' ? (pos.province || pos.county || '')
               : scope === 'city' ? (pos.city || pos.county || '')
               : (pos.county || '');
    /* key 必须包含玩家职级 + 职务，否则降级后还是旧数据 */
    const key = 'orgx4|' + (g.seed || 0) + '|' + area + '|' + scope + '|' + (window.__orgViewScope || 'auto') + '|' + lv + '|' + (pos.title || '') + '|' + (p.name || '');
    if (g.__orgX2 && g.__orgX2.key === key) return g.__orgX2;

    const r = sd(key);
    const names = new Set();
    const nm = () => { let n, gd = 0; do { n = pick(r, SUR) + pick(r, GIV); } while (names.has(n) && gd++ < 99); names.add(n); return n; };

    const c = A.char(area);                    /* 省 / 市 / 区 / 县 / 旗 */
    const party = A.prefix(area);              /* 省委 / 市委 / 区委 */
    const gov = A.gov(area);                   /* 省政府 / 市政府 / 区政府 */
    const top = A.topTitle(area);              /* 省委书记 / 县委书记 … */
    const head = A.headTitle(area);            /* 省长 / 市长 / 县长 … */
    const ORGS = A.orgsFor(area);

    const lvl0 = scope === 'province' ? '正部级' : scope === 'city' ? '正厅级' : '正处级';
    const lvl1 = scope === 'province' ? '副部级' : scope === 'city' ? '副厅级' : '副处级';

    /* 造一个人 */
    const mkPerson = (title, level, extra) => {
      const age = 42 + Math.floor(r() * 17);
      const sex = r() < 0.75 ? '男' : '女';
      const edu = pick(r, EDU);
      const facts = ORGS.gov.filter(x => /局|委|办/.test(x));
      const sup = [];
      const used = {};
      for (let k = 0; k < 4; k++) {
        const one = pick(r, facts);
        if (!used[one]) { used[one] = 1; sup.push(one); }
      }
      return {
        name: extra && extra.name || nm(),
        title, level, age, sex, edu,
        faction: pick(r, FACTION),
        supervise: sup.join('、'),
        isPlayer: extra && extra.isPlayer,
      };
    };

    /* ---- 党委 ---- */
    const standingPosts = [
      top,
      A.govHead(area),
      party + '常委、专职副书记',
      party + '常委、' + A.execHead(area),
      party + '常委、' + c + '纪委书记',
      party + '常委、组织部部长',
      party + '常委、宣传部部长',
      party + '常委、统战部部长',
      party + '常委、政法委书记',
      party + '常委、办公室主任',
    ];

    const partySeats = standingPosts.map((t, i) => mkPerson(t, i === 0 ? lvl0 : lvl1));
    /* 玩家占位 */
    /* 玩家实际职务（降级后会被重写） */
    const myTitle = (pos.title || p.title || '').trim();
    let hit = -1;
    if (myTitle) {
      hit = partySeats.findIndex(s => s.title === myTitle);
      if (hit < 0) hit = partySeats.findIndex(s => s.title.indexOf(myTitle) >= 0 || myTitle.indexOf(s.title) >= 0);
    }
    /* 只有省委书记（lv9）才无条件坐第 0 席 */
    if (hit < 0 && lv >= 9) hit = 0;
    if (hit >= 0 && partySeats[hit]) {
      partySeats[hit] = Object.assign({}, partySeats[hit], {
        name: p.name || '你', age: p.age, sex: p.sex, edu: p.edu,
        faction: '—', supervise: '主持全面工作', isPlayer: true,
        title: myTitle || partySeats[hit].title,
      });
    }
    /* 匹配不上 → 玩家不占常委席（只显示在个人信息里） */

    /* ---- 行政 ---- */
    const govSeats = [
      mkPerson(A.govHead(area), lvl0),
      mkPerson(party + '常委、' + A.execHead(area), lvl1),
      mkPerson(A.deputy(area) + '、党组成员', lvl1),
      mkPerson(A.deputy(area), lvl1),
      mkPerson(A.deputy(area) + '、党组成员', lvl1),
      mkPerson(A.deputy(area), lvl1),
      mkPerson(A.deputy(area) + '、党组成员', lvl1),
      mkPerson(c + '政府秘书长', lvl1),
    ];

    /* ---- 人大 ---- */
    const npcSeats = [
      mkPerson(c + '人大常委会主任', lvl0),
      mkPerson(c + '人大常委会副主任', lvl1),
      mkPerson(c + '人大常委会副主任', lvl1),
      mkPerson(c + '人大常委会秘书长', lvl1),
    ];

    /* ---- 政协 ---- */
    const cppccSeats = [
      mkPerson(c + '政协主席', lvl0),
      mkPerson(c + '政协副主席', lvl1),
      mkPerson(c + '政协副主席', lvl1),
      mkPerson(c + '政协副主席', lvl1),
      mkPerson(c + '政协秘书长', lvl1),
    ];

    /* 下设机构 */
    const dept = (name, isMine) => {
      const nsec = 3 + Math.floor(r() * 5);
      const secs = [];
      const pool = ['办公室', '综合科', '人事科', '财务科', '法制科', '行政审批科', '监督管理科', '执法监督科', '规划科', '第一业务科', '第二业务科', '信息技术科'];
      for (let k = 0; k < nsec && pool.length; k++) {
        const idx = Math.floor(r() * pool.length);
        const sn = pool.splice(idx, 1)[0];
        secs.push({ name: sn, head: nm(), post: '主任', rank: '科员' });
      }
      return { name, secs, staff: secs.length, mine: isMine };
    };

    const cols = [
      { key: 'party', sys: '党委系统', title: party, seatLabel: party + '常委', color: '#c0392b', seats: partySeats,
        depts: ORGS.party.map(nm2 => dept(nm2, pos.org === nm2)) },
      { key: 'gov', sys: '行政系统', title: gov, seatLabel: c + '政府班子', color: '#2b6cb0', seats: govSeats,
        depts: ORGS.gov.map(nm2 => dept(nm2, pos.org === nm2)) },
      { key: 'npc', sys: '人大', title: c + '人大', seatLabel: c + '人大常委会', color: '#6b477f', seats: npcSeats,
        depts: ORGS.npc.map(nm2 => dept(nm2, pos.org === nm2)) },
      { key: 'cppcc', sys: '政协', title: c + '政协', seatLabel: c + '政协班子', color: '#3f7d5c', seats: cppccSeats,
        depts: ORGS.cppcc.map(nm2 => dept(nm2, pos.org === nm2)) },
      { key: 'cdi', sys: '纪委监委', title: c + '纪委监委', seatLabel: c + '纪委监委班子', color: '#8a4038',
        seats: [
          mkPerson(party + '常委、' + c + '纪委书记', lvl1),
          mkPerson(c + '纪委副书记', lvl1),
          mkPerson(c + '纪委副书记', lvl1),
          mkPerson(c + '纪委常委、监委委员', lvl1),
          mkPerson(c + '纪委常委、监委委员', lvl1),
        ],
        depts: ORGS.cdi.map(nm2 => dept(nm2, pos.org === nm2)) },
      { key: 'court', sys: '两院', title: c + '两院', seatLabel: c + '两院班子', color: '#4a5f8a',
        seats: [
          mkPerson(c + '人民法院院长', lvl1),
          mkPerson(c + '人民检察院检察长', lvl1),
          mkPerson(c + '人民法院副院长', lvl1),
          mkPerson(c + '人民检察院副检察长', lvl1),
        ],
        depts: ORGS.court.map(nm2 => dept(nm2, pos.org === nm2)) },
      { key: 'union', sys: '群团 · 街镇', title: c + '群团', seatLabel: c + '群团组织', color: '#7a5a96',
        seats: [
          mkPerson(c + '总工会主席', lvl1),
          mkPerson('团' + c + '委书记', lvl1),
          mkPerson(c + '妇联主席', lvl1),
          mkPerson(c + '工商联主席', lvl1),
        ],
        depts: ORGS.union.concat(ORGS.town).map(nm2 => dept(nm2, pos.org === nm2)) },
    ];

    g.__orgX2 = { key, scope, area, cols };
    return g.__orgX2;
  };

  /* ---------------- 渲染 ---------------- */
  OX.render = function (g) {
    let x = OX.build(g);
    if (!x) return '<p class="sm dim">组织架构未加载</p>';
    const lvNames = { province: '省级', city: '市级', district: '区县' };
    const cnt = x.cols.reduce((a, c) => a + c.seats.length + c.depts.length, 0);
    /* 搜索过滤 */
    const kw = (window.__orgSearch || '').trim();
    let cnt2 = 0;
    if (kw) {
      x = JSON.parse(JSON.stringify(x));
      x.cols.forEach(c => {
        c.seats = c.seats.filter(s => s.name.indexOf(kw) >= 0 || s.title.indexOf(kw) >= 0);
        c.depts = c.depts.filter(dp => {
          if (dp.name.indexOf(kw) >= 0) return true;
          dp.secs = dp.secs.filter(sc => sc.head.indexOf(kw) >= 0 || sc.name.indexOf(kw) >= 0);
          return dp.secs.length > 0;
        });
        cnt2 += c.seats.length + c.depts.length;
      });
    }

    const head =
      '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px">' +
        '<span style="font-size:11px;color:#7a7186">层级</span>' +
        ['省级', '市级', '区县'].map((n, i) =>
          '<button class="btn sm ' + (x.scope === ['province','city','district'][i] ? 'primary' : '') + '" ' +
          'data-orglvv="' + ['province','city','district'][i] + '" style="font-size:11px">' + n + '</button>').join('') +
        '<button class="btn sm ' + (!window.__orgViewScope ? 'primary' : '') + '" data-orglvv="auto" style="font-size:11px">跟随职级</button>' +
        '<input id="orgSearch" placeholder="搜机构 / 职务 / 人名" value="' + (window.__orgSearch || '') + '" ' +
          'style="margin-left:6px;padding:3px 9px;border:1px solid #ddd;border-radius:6px;font-size:11px;width:150px;background:#fff">' +
        '<button class="btn sm ' + (window.__orgTable ? 'primary' : '') + '" data-orgtable="1" style="font-size:11px">含权量表</button>' +
        '<span id="orgHint" style="margin-left:auto;font-size:10.5px;color:#a89878">' +
          (window.__orgSearch ? '命中 ' + (cnt2 || 0) + ' 条' : '点人看人物卡 · 点机构展开全班人马（排不下自动换行）') + '</span>' +
      '</div>';

    /* ---- 含权量表模式 ---- */
    if (window.__orgTable) {
      const rows = [];
      x.cols.forEach(col => {
        col.seats.forEach(s => rows.push({ seat: s.title, level: s.level, col: col.title, name: s.name }));
        col.depts.forEach(dp => dp.secs.forEach(sc => rows.push({ seat: dp.name + '·' + sc.name, level: sc.rank, col: col.title, name: sc.head })));
      });
      rows.sort((a, b) => (b.level.length - a.level.length));
      const lvWeight = { '正部级': 100, '副部级': 85, '正厅级': 70, '副厅级': 58, '正处级': 45, '副处级': 33, '正科级': 22, '副科级': 14, '科员': 6 };
      return '<div class="card">' +
        '<div class="ch"><span class="ic">构</span><h3>含权量表</h3>' +
          '<span class="tail">' + x.area + ' · 按职务名 + 职级 + 类别列一张表</span></div>' +
        '<div style="display:flex;align-items:center;gap:6px;margin-bottom:10px">' +
          '<button class="btn sm primary" data-orgtable="1" style="font-size:11px">返回组织架构</button>' +
          '<span class="sm dim" style="font-size:10.5px">共 ' + rows.length + ' 个岗位</span></div>' +
        '<div style="display:flex;padding:5px 9px;font-size:10px;color:#8a8a94;border-bottom:1px solid #e6dcc8">' +
          '<span style="flex:1">职务名</span><span style="width:96px">职级</span>' +
          '<span style="width:64px">权重</span><span style="width:90px">所属</span><span style="width:70px">在任</span></div>' +
        '<div style="max-height:60vh;overflow:auto">' + rows.map(rw => {
          const w = lvWeight[rw.level] || 6;
          return '<div style="display:flex;align-items:center;padding:3px 9px;font-size:11px;border-bottom:1px dotted rgba(91,59,111,.1)">' +
            '<span style="flex:1;color:#3a3548">' + rw.seat + '</span>' +
            '<span style="width:96px;color:#5b3b6f">' + rw.level + '</span>' +
            '<span style="width:64px;color:' + (w >= 70 ? '#8b2020' : w >= 40 ? '#8a6a33' : '#7a7186') + ';font-weight:600">' + w + '</span>' +
            '<span style="width:90px;color:#7a7186;font-size:10px">' + rw.col + '</span>' +
            '<span style="width:70px;color:#3a3548">' + rw.name + '</span></div>';
        }).join('') + '</div></div>';
    }

    const colHtml = x.cols.map(col => {
      const isMine = col.depts.some(d => d.mine);
      /* 席位卡 */
      const seatCard = s => {
        const vac = window.PERSON && window.PERSON.vacancies(g)[window.PERSON.vacKey(g, s.title)];
        if (vac) {
          return '<div style="grid-column:span 1">' + window.renderVacancyCard(g, s.title) + '</div>';
        }
        const big = /书记$|长、党组书记|主任$|主席$/.test(s.title);
        return '<button data-orgperson="' + encodeURIComponent(s.name) + '" data-title="' + encodeURIComponent(s.title) + '" ' +
          'style-card="1" ' +
          'style="width:calc(50% - 4px);box-sizing:border-box;display:flex;gap:7px;align-items:flex-start;text-align:left;border:1px solid ' +
            (s.isPlayer ? '#e0c37a' : '#e8e0d0') + ';border-radius:9px;padding:7px 9px;background:' +
            (s.isPlayer ? '#fffbf0' : '#fffdfa') + ';cursor:pointer;width:100%;' + (big ? '' : '') + '">' +
          (window.AV ? AV.box(s.name, { size: big ? 34 : 26, sex: s.sex, age: s.age }) : '') +
          '<span style="min-width:0;flex:1">' +
            '<span style="display:flex;align-items:center;gap:4px">' +
              '<b style="font-size:12px;color:' + (s.isPlayer ? '#8a6a33' : '#3a3548') + '">' + s.name +
                (s.isPlayer ? '<span style="background:#fdf4e4;color:#8a6a33;font-size:9px;border-radius:3px;padding:0 4px;margin-left:3px">你</span>' : '') +
              '</b></span>' +
            '<span style="display:block;font-size:11px;color:#5b3b6f;line-height:1.5">' + s.title + '</span>' +
            (s.supervise ? '<span style="display:block;font-size:10px;color:#8a6a33;line-height:1.4">分管：' + s.supervise + '</span>' : '') +
            '<span style="display:block;font-size:10px;color:#7a7186">' +
              s.level + ' · ' + s.age + '岁·' + s.sex + '·' + s.edu + '·' + s.faction + '</span>' +
          '</span></button>';
      };

      /* 机构卡 */
      const deptCard = d => {
        const k = col.key + '|' + d.name;
        const opened = window.__orgOpen[k];
        return '<div data-orgdeptwrap="1" style="border:1px solid #e8e0d0;border-radius:8px;background:#fffdfa;overflow:hidden;' +
          (d.mine ? 'border-color:#e0c37a;background:#fffbf0;' : '') + '">' +
          '<div data-orgdept="' + k + '" style="display:flex;align-items:center;gap:5px;padding:5px 8px;cursor:pointer;font-size:11px">' +
            '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;' +
              (d.mine ? 'font-weight:700;color:#8a6a33' : '') + '">' + d.name + '</span>' +
            (d.mine ? '<span style="font-size:8.5px;background:#fdf4e4;color:#8a6a33;border-radius:3px;padding:0 3px">你在这</span>' : '') +
            '<span style="font-size:9.5px;color:#a89878;flex:none">已列内设 ' + d.secs.length + '</span>' +
            '<span style="font-size:10px;color:#8a8a94;flex:none">' + (opened ? '▴' : '▾') + '</span>' +
          '</div>' +
          (opened ? '<div style="padding:0 8px 6px 16px">' + d.secs.map(s =>
            '<button data-orgsecperson="' + encodeURIComponent(s.head) + '" data-secname="' + encodeURIComponent(s.name) + '" ' +
              'data-sectitle="' + encodeURIComponent(d.name + '·' + s.name + '·' + s.post) + '" ' +
              'style="display:flex;align-items:center;gap:4px;padding:2px 0;font-size:10.5px;border:0;border-top:1px dotted #efe7d6;' +
              'background:transparent;width:100%;text-align:left;cursor:pointer">' +
              '<span style="color:#b9a6cc">└</span>' +
              (window.AV ? AV.box(s.head, { size: 15 }) : '') +
              '<span style="color:#5b3b6f">' + s.head + '</span>' +
              '<span style="color:#a89878">' + s.post + '</span>' +
              '<span style="color:#3a3548">' + s.name + '</span>' +
              '<span style="margin-left:auto;color:#b0a288">' + s.rank + '</span>' +
            '</button>').join('') + '</div>' : '') +
        '</div>';
      };

      return '<section style="border:1px solid ' + col.color + '33;border-radius:10px;overflow:hidden;background:#fffdfb;' +
        'display:flex;flex-direction:column;min-height:0">' +
        /* 列头 */
        '<header style="display:flex;align-items:center;gap:6px;padding:8px 11px;background:' + col.color + '14;' +
          'border-bottom:2px solid ' + col.color + '44;flex:none">' +
          '<span style="font-size:10px;color:' + col.color + 'aa">' + col.sys + '</span>' +
          '<b style="font-size:13px;color:' + col.color + '">' + col.title + '</b>' +
          (isMine ? '<span style="font-size:8.5px;background:#e6f2e9;color:#3f7d5c;border-radius:3px;padding:0 4px">你在这条线上</span>' : '') +
        '</header>' +
        /* 席位区 */
        '<div data-orgcolbody="1" style="padding:7px 8px;flex:1;overflow:auto;max-height:62vh">' +
          '<div style="font-size:10px;color:#8a8a94;margin-bottom:5px;display:flex;align-items:center;gap:5px">' +
            '<span style="font-weight:600;color:#5b3b6f">' + (col.seatLabel || col.title) + '</span>' +
            '<span>共 ' + col.seats.length + ' 席 · 编制表点名</span></div>' +
          '<div id="orgSeatGrid" style="display:flex;flex-wrap:wrap;gap:7px">' +
            col.seats.map(seatCard).join('') + '</div>' +
          /* 下设机构 */
          '<div style="display:flex;align-items:center;gap:6px;margin:9px 0 5px">' +
            '<span style="font-size:10px;color:#8a8a94">下设 ' + col.depts.length + ' 个机构</span>' +
            '<button data-orgall="' + col.key + '" style="margin-left:auto;border:1px solid #e0d6c2;background:#fff;' +
              'border-radius:4px;padding:0 7px;font-size:9.5px;color:#7a7186;cursor:pointer">展开</button>' +
          '</div>' +
          '<div style="display:flex;flex-direction:column;gap:3px">' + col.depts.map(deptCard).join('') + '</div>' +
        '</div>' +
      '</section>';
    }).join('');

    return '<div class="card">' +
      '<div class="ch"><span class="ic">构</span><h3>组织架构</h3>' +
        '<span class="tail">' + g.year + '年' + g.month + '月' + g.day + '日 · ' + x.area +
          ' · ' + (x.scope === 'province' ? '省委 · 省政府 · 省人大 · 省政协 · 省纪委监委 · 两院'
                : x.scope === 'city' ? '市委 · 市政府 · 市人大 · 市政协 · 纪委监委 · 两院'
                : '四大班子 · 纪委监委 · 两院 · 群团 · 街镇') + '</span></div>' +
      head +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:8px">' + colHtml + '</div>' +
    '</div>';
  };

  /* ---------------- 绑定 ---------------- */
  OX.bind = function (g) {
    document.querySelectorAll('[data-orglvv]').forEach(b => b.onclick = () => {
      const v = b.dataset.orglvv;
      window.__orgViewScope = v === 'auto' ? null : v;
      window.__orgOpen = {};
      g.__orgX2 = null;
      g.__orgX = null;
      window.__render && window.__render();
    });
    document.querySelectorAll('[data-orgdept]').forEach(b => b.onclick = () => {
      const k = b.dataset.orgdept;
      window.__orgOpen[k] = !window.__orgOpen[k];
      window.__render && window.__render();
    });
    document.querySelectorAll('[data-orgall]').forEach(b => b.onclick = () => {
      const ck = b.dataset.orgall;
      const x = OX.build(g);
      const col = x.cols.find(c => c.key === ck);
      if (!col) return;
      const allOpen = col.depts.every(d => window.__orgOpen[ck + '|' + d.name]);
      col.depts.forEach(d => { window.__orgOpen[ck + '|' + d.name] = !allOpen; });
      window.__render && window.__render();
    });
    document.querySelectorAll('[data-orgperson]').forEach(b => b.onclick = function () {
      const name = decodeURIComponent(b.dataset.orgperson || '');
      const title = b.getAttribute('data-title') ? decodeURIComponent(b.getAttribute('data-title')) : '';
      const x = OX.build(g);
      let found = null;
      if (x) x.cols.forEach(c => c.seats.forEach(s => {
        if (!found && s.name === name && (!title || s.title === title)) found = s;
      }));
      if (x) x.cols.forEach(c => c.seats.forEach(s => { if (!found && s.name === name) found = s; }));
      if (!found) found = { name: name, title: title, level: '', age: 50, sex: '男', edu: '本科', faction: '无派系', supervise: '' };
      const actHtml = window.renderActionBar ? renderActionBar(g, found) : '';

      /* 直接领导：同列里职级更高的最近一个；没有就用玩家 */
      let superior = null;
      const lvNum = function (t, lv) {
        const s = String(t || '');
        /* 一把手：各级书记 */
        if (/省委书记|自治区党委书记/.test(s)) return 9;
        if (/市委书记|县委书记|区委书记|旗委书记/.test(s)) return 6;
        /* 省级 */
        if (/省委副书记|省政协主席|省人大常委会主任/.test(s)) return 8;
        if (/省长/.test(s)) return 8;
        if (/副省长|省委常委|省高院|省人民检察/.test(s)) return 7;
        /* 市级 */
        if (/市人大常委会主任|市政协主席|省厅厅长/.test(s)) return 6;
        if (/市人民政府市长|市政府市长|市长/.test(s)) return 6;
        if (/市委常委|副市长|市局.*副局长/.test(s)) return 5;
        /* 区县级 */
        if (/县长|区长|县人大常委会主任|区人大常委会主任|县政协主席|区政协主席/.test(s)) return 4;
        if (/区委常委|县委常委|副县长|副区长/.test(s)) return 3;
        /* 中层 */
        if (/科长|乡镇长|乡长|镇长|街道办事处主任|街道办主任/.test(s)) return 2;
        if (/副科长|副乡镇长|副局长/.test(s)) return 1;
        return 1;
      };
      const myLvNum = lvNum(found.title, found.lv);
      const ftitle = found.title || '';

      /* 只在「党委」「行政」两列里找上级 */
      const leadCols = (x ? x.cols.filter(function (c) { return c.key === 'party' || c.key === 'gov'; }) : []);
      const allCols = (x ? x.cols : []);

      /* ---- 上级判定 ---- */
      const isProvSec = /省委书记|自治区党委书记/.test(ftitle);

      if (isProvSec) {
        /* 只有省级党委书记无上级 */
        superior = { name: '—', title: '无上级（一方主官）', none: true };
      } else {
        const pos2 = g.player.position || {};
        const prov2 = pos2.province || '';
        const city2 = pos2.city || '';
        const county2 = pos2.county || '';
        const am = window.ADM;

        /* 上级名称：按职务类型决定「归谁管」 */
        const upName = function () {
          /* 市委书记 → 省委书记 */
          if (/^市委书记$/.test(ftitle)) return { t: ((prov2 || '本省').replace(/省$/, '')) + '省委书记', lv: 9, kind: 'prov' };
          /* 县委书记 / 区委书记 → 市委书记 */
          if (/县委书记|区委书记|旗委书记/.test(ftitle)) return { t: ((city2 || '本市').replace(/市$/, '')) + '市委书记', lv: 6, kind: 'city' };
          /* 市长 / 县长 / 区长 → 同级党委书记 */
          if (/市长$|县长$|区长$|旗长$/.test(ftitle)) {
            if (/^市长$/.test(ftitle)) return { t: ((city2 || '本市').replace(/市$/, '')) + '市委书记', lv: 6, kind: 'city' };
            return { t: ((county2 || '本区').replace(/(区|县|市)$/, '')) + (String(county2||'').endsWith('县') ? '县委书记' : '区委书记'), lv: 4, kind: 'county' };
          }
          /* 市人大主任 / 市政协主席 → 市委书记 */
          if (/市人大常委会|市政协/.test(ftitle)) return { t: ((city2 || '本市').replace(/市$/, '')) + '市委书记', lv: 6, kind: 'city' };
          if (/区人大常委会|区政协|县人大常委会|县政协/.test(ftitle)) return { t: ((county2 || '本区').replace(/(区|县|市)$/, '')) + (String(county2||'').endsWith('县') ? '县委书记' : '区委书记'), lv: 4, kind: 'county' };
          /* 省人大 / 省政协（含副职）→ 省委书记 */
          if (/省人大常委会/.test(ftitle)) return { t: ((prov2 || '本省').replace(/省$/, '')) + '省委书记', lv: 9, kind: 'prov' };
          if (/省政协/.test(ftitle)) return { t: ((prov2 || '本省').replace(/省$/, '')) + '省委书记', lv: 9, kind: 'prov' };
          /* 如为省委书记本人的副职（副书记），上级就是书记 */
          if (/^省委副书记$/.test(ftitle)) return { t: ((prov2 || '本省').replace(/省$/, '')) + '省委书记', lv: 9, kind: 'prov' };
          /* 其他：按职级找同级的书记 */
          if (myLvNum >= 7) return { t: ((prov2 || '本省').replace(/省$/, '')) + '省委书记', lv: 9, kind: 'prov' };
          if (myLvNum >= 5) return { t: ((city2 || '本市').replace(/市$/, '')) + '市委书记', lv: 6, kind: 'city' };
          return { t: ((county2 || '本区').replace(/(区|县|市)$/, '')) + (String(county2||'').endsWith('县') ? '县委书记' : '区委书记'), lv: 4, kind: 'county' };
        };
        let up = upName();
        if (!up || !up.t || String(up.t).indexOf('undefined') >= 0) {
          up = { t: ((prov2 || '本省').replace(/省$/, '')) + '省委书记', lv: 9, kind: 'prov' };
        }

        /* 1. 先在当前组织架构里找这个人 */
        let hitName = null;
        allCols.forEach(function (c) {
          c.seats.forEach(function (s) {
            if (s.name === found.name) return;
            if (!s.name || String(s.name).indexOf('undefined') >= 0) return;
            if (s.title === up.t || (s.title || '').indexOf(up.t) >= 0) hitName = s.name;
          });
        });

        /* 2. 找不到 → 用 ADM 造一个（该级党委书记一定存在） */
        if (!hitName) {
          const seedN = (function () { let hh = 2166136261; const s2 = up.t + (g.seed || 0); for (let i2 = 0; i2 < s2.length; i2++) { hh ^= s2.charCodeAt(i2); hh = Math.imul(hh, 16777619); } return hh >>> 0; })();
          const SUR = ['高','崔','丁','赵','唐','沈','郭','曹','周','肖','谢','林','罗','李','王','张','刘','陈','杨','黄','吴','徐','孙','马','朱','胡','何','宋','许','韩'];
          const GIV = ['彬刚','平鹏','远勇','睿涛','旭浩','斌宇','凯鹏','伟旭','文涛','丹欣','建华','国强','海峰','志明','建军','文博','承志','向东','卫东','俊杰','晓东'];
          hitName = SUR[Math.abs(seedN) % SUR.length] + GIV[Math.abs(Math.floor(seedN / 31)) % GIV.length];
          if (!hitName || String(hitName).indexOf('undefined') >= 0) hitName = '张明';
        }
        if (!hitName || String(hitName).indexOf('undefined') >= 0) hitName = '张明';
        superior = { name: hitName, title: up.t };
      }

      /* 下属：党委/行政列里职级低一级的 */
      let subs = [];
      if (x) {
        x.cols.filter(function (c) { return c.key === 'party' || c.key === 'gov'; }).forEach(function (c) {
          c.seats.forEach(function (s) {
            if (s.name === found.name) return;
            const sl = lvNum(s.title, s.lv);
            if (sl === myLvNum - 1) subs.push({ name: s.name, title: s.title });
          });
        });
      }

            if (window.openPersonCard) window.openPersonCard(found, {
        area: x ? x.area : '', moves: [],
        superior: superior, subordinates: subs.slice(0, 10),
        actions: actHtml,
        onAction: function (act, per) {
          window.__closeModal && window.__closeModal();
          if (act === 'promote' || act === 'transfer') { window.__openJobPicker && window.__openJobPicker(per.id, act, { name: per.name, title: per.title, dept: per.title, faction: per.faction, sex: per.sex }); }
          else if (act === 'fire') { window.__doFire && window.__doFire(per.id, { name: per.name, title: per.title, faction: per.faction, sex: per.sex }); }
          else if (act === 'recall') { window.__doRecall && window.__doRecall(per.id, { name: per.name, title: per.title, faction: per.faction, sex: per.sex }); }
          else if (act === 'suggest') { window.__doSuggest && window.__doSuggest(per.id, { name: per.name, title: per.title, faction: per.faction, sex: per.sex }); }
        },
      });
    });
    /* 内设科室人员 → 档案卡 */
    document.querySelectorAll('[data-orgsecperson]').forEach(b => b.onclick = function (ev) {
      ev.stopPropagation();
      const name = decodeURIComponent(b.getAttribute('data-orgsecperson') || '');
      const secName = b.getAttribute('data-secname') ? decodeURIComponent(b.getAttribute('data-secname')) : '';
      const title = b.getAttribute('data-sectitle') ? decodeURIComponent(b.getAttribute('data-sectitle')) : '';
      /* 内设科室人员：职级由职务名推 */
      const lvNum2 = function (t) {
        const s = String(t || '');
        if (/书记/.test(s)) return 4;
        if (/主任$/.test(s)) return 3;
        if (/副主任/.test(s)) return 2;
        if (/科长/.test(s)) return 2;
        if (/副科长/.test(s)) return 1;
        return 0;
      };
      const person = {
        name: name, title: title, lv: lvNum2(title), level: '',
        age: 28 + (name.length * 7) % 22, sex: '男', edu: '本科',
        faction: '无派系', supervise: '', isStaff: true,
      };

      /* 直接领导：科室主任的上级 = 该机构的分管领导（一把手） */
      const pos3 = g.player.position || {};
      const county3 = pos3.county || '';
      const city3 = pos3.city || '';
      const prov3 = pos3.province || '';
      const myLv2 = lvNum2(title);

      /* 上级名称 */
      let upTitle, upName2 = null;
      if (myLv2 >= 3) {
        /* 主任 → 该级党委书记 */
        upTitle = county3 + '委书记';
      } else {
        /* 科员/副职 → 科室主任或该机构负责人 */
        upTitle = secName ? secName + ' 主任' : county3 + '委书记';
      }
      /* 先在实际组织架构里找 */
      const xx = OX.build(g);
      if (xx) {
        xx.cols.forEach(function (c) {
          c.seats.forEach(function (s) {
            if (!s.name || s.name === name) return;
            if (s.title === upTitle || (s.title || '').indexOf(upTitle) >= 0) upName2 = s.name;
          });
        });
      }
      if (!upName2) {
        const seedU = (function () { let hh = 2166136261; const q = upTitle + (g.seed || 0) + name; for (let i3 = 0; i3 < q.length; i3++) { hh ^= q.charCodeAt(i3); hh = Math.imul(hh, 16777619); } return Math.abs(hh); })();
        const SUR2 = ['高','崔','丁','赵','唐','沈','郭','曹','周','肖','谢','林','罗','李','王','张','刘','陈','杨','黄','吴','徐','孙','马','朱','胡','何','宋','许','韩'];
        const GIV2 = ['彬刚','平鹏','远勇','睿涛','旭浩','斌宇','凯鹏','伟旭','文涛','丹欣','建华','国强','海峰','志明','建军','文博','承志','向东','卫东','俊杰','晓东'];
        upName2 = SUR2[seedU % SUR2.length] + GIV2[(seedU >> 5) % GIV2.length];
      }

      /* 下属：同科室/同机构的其他人 */
      let subs2 = [];
      if (secName) {
        document.querySelectorAll('[data-orgsecperson]').forEach(function (el) {
          const nm = decodeURIComponent(el.getAttribute('data-orgsecperson') || '');
          const sc = el.getAttribute('data-secname') ? decodeURIComponent(el.getAttribute('data-secname')) : '';
          const tl = el.getAttribute('data-sectitle') ? decodeURIComponent(el.getAttribute('data-sectitle')) : '';
          if (nm && nm !== name && sc === secName) subs2.push({ name: nm, title: tl });
        });
      }
      if (!subs2.length) {
        /* 同机构其他科室的人 */
        document.querySelectorAll('[data-orgsecperson]').forEach(function (el) {
          const nm = decodeURIComponent(el.getAttribute('data-orgsecperson') || '');
          const sc = el.getAttribute('data-secname') ? decodeURIComponent(el.getAttribute('data-secname')) : '';
          const tl = el.getAttribute('data-sectitle') ? decodeURIComponent(el.getAttribute('data-sectitle')) : '';
          if (nm && nm !== name && subs2.length < 8) subs2.push({ name: nm, title: (sc ? sc + ' ' : '') + tl });
        });
      }
      if (!subs2.length) {
        const rsList = window.PL ? PL.roster(g).list : [];
        subs2 = rsList.slice(0, 8).map(function (u) { return { name: u.name, title: u.title }; });
      }

      const actHtml2 = window.renderActionBar ? window.renderActionBar(g, person) : '';
      if (window.openPersonCard) window.openPersonCard(person, {
        area: county3, province: prov3, city: city3,
        superior: { name: upName2, title: upTitle },
        subordinates: subs2,
        moves: [],
        actions: actHtml2,
        onAction: function (act, per) {
          window.__closeModal && window.__closeModal();
          const info = { name: per.name, title: per.title, faction: per.faction, sex: per.sex };
          if (act === 'promote' || act === 'transfer') { window.__openJobPicker && window.__openJobPicker(per.id, act, info); }
          else if (act === 'fire') { window.__doFire && window.__doFire(per.id, info); }
          else if (act === 'recall') { window.__doRecall && window.__doRecall(per.id, info); }
          else if (act === 'suggest') { window.__doSuggest && window.__doSuggest(per.id, info); }
        },
      });
    });
    /* 搜索：DOM 级过滤，不重绘（避免输入框失焦/清空） */
    const si = document.getElementById('orgSearch');
    if (si) {
      const applyFilter = function (kw) {
        kw = (kw || '').trim();
        let hit = 0;
        document.querySelectorAll('[data-orgperson]').forEach(el => {
          const txt = el.textContent || '';
          const show = !kw || txt.indexOf(kw) >= 0;
          /* 用移除方式彻底不占位 */
          if (!show) { el.style.display = 'none'; el.setAttribute('data-hidden', '1'); }
          else { el.style.display = ''; el.removeAttribute('data-hidden'); }
          if (show && kw) hit++;
        });
        document.querySelectorAll('[data-orgdept]').forEach(el => {
          const txt = el.textContent || '';
          const show = !kw || txt.indexOf(kw) >= 0;
          el.style.display = show ? '' : 'none';
          if (show && kw) hit++;
        });
        document.querySelectorAll('[data-orgsecperson]').forEach(el => {
          const txt = el.textContent || '';
          const show = !kw || txt.indexOf(kw) >= 0;
          el.style.display = show ? '' : 'none';
          if (show && kw) hit++;
        });
        /* 机构被过滤时，整个机构块（含边框）一起隐藏 */
        document.querySelectorAll('[data-orgdeptwrap]').forEach(el => {
          const body = el.querySelector('[data-orgdept]');
          const vis = body && body.style.display !== 'none';
          el.style.display = vis ? '' : 'none';
        });
        /* 更新命中数 */
        const hint = document.getElementById('orgHint');
        if (hint) hint.textContent = kw ? ('命中 ' + hit + ' 条') : '点人看人物卡 · 点机构展开全班人马（排不下自动换行）';
        /* 列保留，但没命中的列加灰色提示 */
        document.querySelectorAll('[data-orgcolbody]').forEach(cb => {
          const any = Array.from(cb.querySelectorAll('[data-orgperson],[data-orgdept]'))
            .some(x => x.style.display !== 'none');
          const sec = cb.closest('section');
          if (!sec) return;
          sec.style.opacity = (kw && !any) ? '0.45' : '1';
        });
      };
      si.oninput = function () { window.__orgSearch = si.value; applyFilter(si.value); };
      /* 重绘后恢复过滤 */
      if (window.__orgSearch) applyFilter(window.__orgSearch);
      si.onkeydown = function (ev) { if (ev.key === 'Enter') ev.preventDefault(); };
    }
    /* 含权量表切换 */
    document.querySelectorAll('[data-orgtable]').forEach(b => b.onclick = () => {
      window.__orgTable = !window.__orgTable;
      window.__render && window.__render();
    });
    if (window.bindVacancy) window.bindVacancy(g);
  };

  /* 兼容旧接口 */
  window.renderOrgPage = function (g) { return OX.render(g); };
  window.bindOrgPage = function (g) { OX.bind(g); };
})();
</script>
<script>/* ============================================================
   治理者之路 · 政府网站（政府门户站）
   5 个栏目：首页 / 新闻中心 / 政务公开 / 政务服务 / 政民互动
   ============================================================ */
(function () {
  'use strict';
  const GW = {};
  window.GW = GW;

  const SUR = ['高','崔','丁','赵','唐','沈','郭','曹','周','肖','林','罗','李','王','张','刘','陈','杨','黄','吴'];
  const GIV = ['彬刚','平鹏','远勇','睿涛','旭浩','斌宇','凯鹏','伟旭','文涛','丹欣','超','磊','嘉','明志','建华'];
  const hsh = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return Math.abs(h); };
  const sd = k => { let s = hsh(k) || 1; return () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; }; };
  const pk = (r, a) => a[Math.floor(r() * a.length)];

  const NAV = ['首页', '新闻中心', '政务公开', '政务服务', '政民互动'];

  /* 政务服务事项 */
  const AFFAIRS = [

  /* 生成政府网站数据 */
  GW.data = function (g) {
    const pos = g.player.position || {};
    const lv = g.player.level || 0;
    /* ---- 层级判定：看所在单位是哪一级，而不是看地名后缀 ---- */
    const orgName = pos.org || '';
    const prov = pos.province || '';
    const city = pos.city || '';
    const county = pos.county || '';

    /* 单位名里带"省/省委"→ 省级；带"市/市委"→ 市级；否则区县级 */
    const isProvOrg = /^省/.test(orgName) || /省委|省政府|自治区|省人大|省政协/.test(orgName);
    const isCityOrg = /^市|市委|市政府/.test(orgName);
    let scope = isProvOrg ? 'province' : isCityOrg ? 'city' : 'district';
    /* 直辖市：province 字段就是"北京市/上海市"，直接按市级处理 */
    const ZXS = ['北京市', '天津市', '上海市', '重庆市'];
    if (ZXS.includes(prov)) scope = 'city';

    /* 该级对应的行政区名：省 → 广东省；市 → 广州市；区县 → 越秀区 */
    const area = ZXS.includes(prov) ? prov
               : scope === 'province' ? (prov || county || '本省')
               : scope === 'city' ? (city || county || '本市')
               : (county || '本区');

    const key = 'gw4|' + (g.seed || 0) + '|' + area + '|' + orgName + '|' + scope;
    if (g.__gw && g.__gw.key === key) return g.__gw;

    const r = sd(key);
    const areaClean = area.replace(/[省市]$|自治区$|特别行政区$/, '').replace(/壮族|回族|维吾尔/g, '');
    /* 英文地名：去区/县后缀 */
    const pfx = scope === 'province' ? '省' : scope === 'city' ? '市' : (window.ADM ? window.ADM.char(area) : '区');
    const org = orgName || (pfx + '政府办公室');

    /* 站名：广东省人民政府网 / 广州市人民政府网 / 越秀区人民政府网 */
    const suf = scope === 'province'
      ? (/自治区$/.test(area) ? '人民政府网' : /市$/.test(area) ? '人民政府网' : '人民政府网')
      : scope === 'city' ? '人民政府网' : '人民政府网';
    const title = area + suf;
    /* 英文名 */
    const enSuffix = scope === 'province'
      ? (/自治区$/.test(area) ? ' Autonomous Region' : ' Province')
      : scope === 'city' ? ' Municipality' : (/县$/.test(area) ? ' County' : ' District');
    const en = "The People's Government of " + (area.replace(/[省市区县]$/, '').replace(/壮族|回族|维吾尔/g, '') || 'Local') + enSuffix;
    /* 徽标 */
    const badge = window.ADM ? window.ADM.badge(area) : '县级政府';
    /* 域名：guangdong.gov.cn / guangzhou.gov.cn / yuexiu.gov.cn */
    /* 域名：统一走 ADM.urlName（全国 3351 个行政区通用） */
    const urlHost = (window.ADM ? window.ADM.urlName(area) : 'gov') + '.gov.cn';

    /* 新闻 */
    const news = [];
    let nid = 0;
    const mkNews = (col, list, count) => {
      for (let i = 0; i < count; i++) {
        const [tpl, deptTpl, lead, tag] = pk(r, list);
        const ch = scope === 'province' ? '省' : scope === 'city' ? '市' : (window.ADM ? window.ADM.char(area) : '区');
        const cw = scope === 'province' ? '省委' : scope === 'city' ? '市委' : (window.ADM ? window.ADM.prefix(area) : '区委');
        const t = tpl.split('{P}').join(ch).split('{C}').join(cw).split('{Q}').join('');
        news.push({
          id: ++nid, col, tag,
          title: t,
          dept: deptTpl.split('{P}').join(scope === 'province' ? '省' : scope === 'city' ? '市' : (window.ADM ? window.ADM.char(area) : '区')).split('{C}').join(scope === 'province' ? '省委' : scope === 'city' ? '市委' : (window.ADM ? window.ADM.prefix(area) : '区委')),
          _p: true,
          date: (g.year || 2024) + '-' + String(Math.max(1, (g.month || 1) - Math.floor(r() * 2))).padStart(2, '0') + '-' + String(1 + Math.floor(r() * 27)).padStart(2, '0'),
          lead: lead,
          kind: ['red', 'blue', 'gold', 'green', 'gray', 'purple'][Math.floor(r() * 6)],
          body: [lead, '会议强调，要认真贯彻落实上级决策部署，结合本地实际抓好落实，确保各项任务落地见效。', '会议还研究了其他事项。'],
          doc: /条例|办法|实施意见|规定/.test(t) ? { no: (area.replace(/[区县]$/, '')) + '政发〔' + (g.year || 2024) + '〕' + (1 + Math.floor(r() * 40)) + '号', from: pfx + '人民政府', kind: pk(r, ['通知', '办法', '意见', '通告']) } : null,
        });
      }
    };
    mkNews('要闻', NEWS.要闻, 8);
    mkNews('公告', NEWS.通知, 6);
    mkNews('公示', NEWS.公示, 5);
    mkNews('要闻', NEWS.领导活动, 5);
    mkNews('财政', NEWS.财政, 4);
    mkNews('解读', NEWS.解读, 5);
    news.sort((a, b) => (a.date < b.date ? 1 : -1));

    /* 领导之窗：四个班子 */
    const leaders = [];
    const nms = new Set();
    const nm = () => { let n, gd = 0; do { n = pk(r, SUR) + pk(r, GIV); } while (nms.has(n) && gd++ < 99); nms.add(n); return n; };
    const A = window.ADM;
    /* 按 scope 直接定称呼，不再二次推断 */
    const isCounty = /县$|自治县$/.test(area);
    const pfxName = scope === 'province' ? '省委' : scope === 'city' ? '市委' : (isCounty ? '县委' : '区委');
    const charN = scope === 'province' ? '省' : scope === 'city' ? '市' : (isCounty ? '县' : '区');
    const headT = window.ADM ? window.ADM.headTitle(area) : '市长';
    const execT = window.ADM ? window.ADM.execHead(area) : '常务副市长';
    const depT = window.ADM ? window.ADM.deputy(area) : '副市长';
    const base = window.ADM ? window.ADM.char(area) : (scope === 'province' ? '省' : scope === 'city' ? '市' : (isCounty ? '县' : '区'));
    const GN = window.ADM ? window.ADM.groups(area) : [base + '委领导', base + '政府领导', base + '人大领导', base + '政协领导'];
    const groups = [
      [GN[0], []],
      [GN[1], [headT, execT, depT]],
      [GN[2], [base + '人大常委会主任', '副主任']],
      [GN[3], [base + '政协主席', '副主席']],
    ];

    /* 复用组织架构的常委席（同一批人） */
    const orgX = window.ORGX && window.ORGX.build(g);
    const seatPeople = orgX ? orgX.columns[0].seats.map(s => s.person) : [];
    /* 常委席职务按当前层级重写（省委书记/市委书记/县委书记/区委书记） */
    const seatTitlesByScope = window.ADM ? window.ADM.standingPosts(area) : [];
    groups.forEach((g2, gi) => {
      const gn = g2[0];
      const posts = gi === 0 && seatPeople.length
        ? seatTitlesByScope.slice(0, seatPeople.length)
        : (g2[1] || []);
      posts.forEach((pt, pi) => {
        const sp = gi === 0 ? seatPeople[pi] : null;
        leaders.push({
          group: gn, post: sp ? pt : pt, name: sp ? sp.name : nm(),
          sex: sp ? sp.sex : (r() < 0.75 ? '男' : '女'),
          age: sp ? sp.age : 40 + Math.floor(r() * 18),
          edu: sp ? sp.edu : pk(r, ['本科', '硕士', '博士']),
          duty: sp ? (sp.supervise ? '分管' + sp.supervise : '主持全面工作')
                    : (/主任$|主席$/.test(pt) ? '主持' + gn.replace(/领导$/, '') + '工作'
                       : '分管' + pk(r, ['经济发展', '民生保障', '城市建设', '社会治理', '教育科技', '农业农村']) + '工作'),
        });
      });
    });

    /* 政务服务事项 */
    const affairs = AFFAIRS.map(a => ({ entry: a.entry, items: a.items.map(([n, kind]) => ({ name: n, kind })) }));

    /* 政民互动：留言 */
    const msgs = [];
    for (let i = 0; i < 6; i++) {
      msgs.push({
        title: pk(r, ['建议增设公交线路', '关于老旧小区改造的建议', '反映夜间施工扰民问题', '咨询公积金提取流程', '建议优化路口红绿灯配时', '反映小区停车难问题']),
        from: pk(r, ['王先生', '李女士', '张先生', '刘女士', '陈先生']),
        date: (g.year || 2024) + '-' + String(1 + Math.floor(r() * 12)).padStart(2, '0') + '-' + String(1 + Math.floor(r() * 27)).padStart(2, '0'),
        status: pk(r, ['已办结', '办理中', '已受理']),
        reply: pk(r, ['已责成相关部门调查处理，感谢您的关注。', '经核实，已协调施工单位调整作业时间。', '相关流程已在政务服务网公示，请查阅。']),
      });
    }

    g.__gw = {
      key, scope, area, pfx, org, title, en, badge, urlHost,
      weather: { text: pk(r, ['多云', '晴', '小雨', '阴']), low: 2 + Math.floor(r() * 8), high: 8 + Math.floor(r() * 12), air: pk(r, ['优', '良']) },
      news, leaders, affairs, msgs,
    };
    return g.__gw;
  };

    const list = (items, n) => '<div>' + items.slice(0, n || 6).map(x =>
      '<button data-gwnews="' + x.id + '" style="display:flex;align-items:center;gap:8px;width:100%;' +

    const chipColor = k => ({ red: '#c0392b', blue: '#2b6cb0', gold: '#b8860b', green: '#3f7d5c', purple: '#6b477f', gray: '#8a8a8a' })[k] || '#8a8a8a';

                ' · 发文单位 ' + it.doc.from + ' · 文种 ' + it.doc.kind + '</div></div>' : '') +
            it.body.map(p => '<p style="font-size:12.5px;line-height:2;color:#3a3529;text-indent:2em;margin:0 0 8px">' + p + '</p>').join('') +
            '<div style="font-size:10.5px;color:#b0a288;border-top:1px dashed #e6dcc8;padding-top:8px;margin-top:10px">' +
              '本条信息已获全网重点推荐 · 由「' + d.title + '」发布 · 阅读完整原文请以正式文件为准。</div>'
          ) + '</div>';
      }
    }

    /* 首页 */
    if (cur.tab === '首页') {
      const lead = d.news.find(x => x.col === '要闻') || d.news[0];
      return head +
        '<div style="display:grid;grid-template-columns:1.35fr 1fr;gap:10px;margin-top:10px">' +
          card('头条', '权威时政 · 围绕中心 · 服务大局',
            '<button data-gwnews="' + (lead ? lead.id : '') + '" style="display:block;width:100%;text-align:left;' +
              'border:1px solid #e8d9b8;background:linear-gradient(180deg,#fffdf5,#fdf6e8);border-radius:9px;' +
              'padding:12px;cursor:pointer">' +
              '<span style="font-size:9.5px;background:#8b2020;color:#fff;border-radius:3px;padding:1px 6px">权威头条</span>' +
              '<span style="font-size:10.5px;color:#a89878;margin-left:7px">' + (lead ? lead.dept + ' · ' + lead.date : '') + '</span>' +
              '<b style="display:block;font-size:15px;color:#3a3529;margin:7px 0 5px;line-height:1.5">' + (lead ? lead.title : '暂无') + '</b>' +
              '<p style="font-size:11.5px;color:#7a6d55;line-height:1.7;margin:0">' + (lead ? lead.lead : '') + '</p>' +
              '<span style="font-size:10.5px;color:#b8860b;margin-top:6px;display:block">本条信息已获全网重点推荐 · 阅读全文 ›</span>' +
            '</button>') +
          card('通知公告', '停电 · 招聘 · 公示 · 征求意见',
            list(d.news.filter(x => x.col === '公告' || x.col === '公示'), 6)) +
        '</div>' +
        card('领导之窗', '四个班子 · 点姓名看分工', renderLeaders(d), true);

    }

    /* 新闻中心 */
    if (cur.tab === '新闻中心') {
      const lead = d.news.find(x => x.col === '要闻');
      return head +
        '<div style="display:grid;grid-template-columns:1.35fr 1fr;gap:10px;margin-top:10px">' +
          card('头条', '权威时政 · 置顶头条',
            '<button data-gwnews="' + (lead ? lead.id : '') + '" style="display:block;width:100%;text-align:left;' +
              'border:1px solid #e8d9b8;background:linear-gradient(180deg,#fffdf5,#fdf6e8);border-radius:9px;padding:12px;cursor:pointer">' +
              '<span style="font-size:9.5px;background:#8b2020;color:#fff;border-radius:3px;padding:1px 6px">权威头条</span>' +
              '<b style="display:block;font-size:15px;color:#3a3529;margin:7px 0 5px">' + (lead ? lead.title : '') + '</b>' +
              '<p style="font-size:11.5px;color:#7a6d55;margin:0;line-height:1.7">' + (lead ? lead.lead : '') + '</p>' +
            '</button>') +
          card('今日要闻', '本窗口期内的全部要闻', list(d.news.filter(x => x.col === '要闻'), 12)) +
        '</div>' +
        card('领导活动', '调研 · 走访 · 慰问',
          list(d.news.filter(x => x.tag === '领导活动' || /调研|走访|检查/.test(x.title)), 6), true);
    }

    /* 政务公开 */
    if (cur.tab === '政务公开') {
      const doc = d.news.find(x => x.doc);
      return head +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">' +
          card('政策文件', '行政规范性文件 · 政府会议纪要',
            doc ? '<button data-gwnews="' + doc.id + '" style="display:block;width:100%;text-align:left;' +
              'border:1px solid #e8c9c4;background:#fdf6f5;border-radius:9px;padding:11px;cursor:pointer">' +
              '<span style="font-size:9.5px;background:#c0392b;color:#fff;border-radius:3px;padding:1px 6px">最新红头公文</span> ' +
              '<b style="font-size:11.5px;color:#8b2020">' + doc.doc.no + '</b>' +
              '<div style="font-size:10.5px;color:#9a8c72;margin:5px 0">发布日期 ' + doc.date + ' · 发文单位 ' + doc.dept + '</div>' +
              '<b style="display:block;font-size:13px;color:#3a3529;line-height:1.5">' + doc.title + '</b>' +
              '<span style="font-size:10.5px;color:#b8860b;display:block;margin-top:5px">阅读红头公文全文 ›</span>' +

          card('公示公告', '干部任前公示 · 事项公示', list(d.news.filter(x => x.col === '公示'), 6)) +
        '</div>' +
        card('财政信息', '财政收支 · 预算执行', list(d.news.filter(x => x.col === '财政'), 5), true) +

    }

    /* 政务服务 */
    if (cur.tab === '政务服务') {
      return head +
        '<div style="margin-top:10px;border-radius:10px;padding:16px 18px;color:#fff;' +
          'background:linear-gradient(120deg,#8b2020,#a8392f)">' +
          '<b style="font-size:15px">' + d.area + '政务服务中心 · 一网通办大厅</b>' +
          '<div style="font-size:11.5px;opacity:.9;margin-top:5px">坚持以人民为中心，全面推进「一网通办、一次办成」，让政务服务更有温度。</div>' +
        '</div>' +
        card('一、办事服务', '共 ' + d.affairs.reduce((a, x) => a + x.items.length, 0) + ' 项标准化事项',
          d.affairs.map(a =>
            '<div style="margin-bottom:10px">' +
              '<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:5px">' +
                '<b style="font-size:12.5px;color:#8b2020">' + a.entry + '</b>' +
                '<span style="font-size:10.5px;color:#a89878">民生直达 · 便民利企</span></div>' +
              '<div style="display:flex;flex-wrap:wrap;gap:6px">' +
                a.items.map(i =>
                  '<div style="border:1px solid #e6dcc8;background:#fffdf8;border-radius:7px;padding:6px 10px;' +
                    'font-size:11.5px;color:#3a3529;min-width:150px">' +
                    '<div>' + i.name + '</div>' +
                    '<div style="margin-top:3px">' +
                      '<span style="font-size:9px;background:' + (i.kind === '即办' ? '#e6f2e9' : '#eef2f8') + ';' +
                        'color:' + (i.kind === '即办' ? '#3f7d5c' : '#2b6cb0') + ';border-radius:3px;padding:0 5px">' +
                        (i.kind === '即办' ? '即办件' : '承诺件') + '</span> ' +
                      '<span style="font-size:9px;background:#f2ede1;color:#8a7a5c;border-radius:3px;padding:0 5px">全程网办</span>' +
                    '</div></div>').join('') +
              '</div></div>').join(''), true);
    }

    /* 政民互动 */
    return head +
      card('我要留言', '倾听民声 · 汇聚民智',
        '<div style="font-size:11.5px;color:#7a6d55;margin-bottom:8px">' +
          '对政府工作有意见建议、遇到问题需要反映，可在此留言。办理结果一般在 5 个工作日内答复。</div>' +
        '<div style="display:flex;gap:6px">' +
          '<input placeholder="请输入您的留言内容" style="flex:1;padding:7px 11px;border:1px solid #e0d6c2;' +
            'border-radius:7px;font:inherit;font-size:12px;background:#fff">' +
          '<button data-gwsubmit="1" style="border:0;background:#8b2020;color:#fff;border-radius:7px;' +
            'padding:7px 18px;font-size:12px;cursor:pointer">提交</button>' +
        '</div>', true) +
      card('留言办理情况', '公开答复 · 接受监督',
        d.msgs.map(m =>
          '<div style="border-bottom:1px dotted #e6dcc8;padding:7px 0">' +
            '<div style="display:flex;align-items:center;gap:7px;font-size:12px;color:#3a3529">' +
              '<span style="flex:1">' + m.title + '</span>' +
              '<span style="font-size:9.5px;border-radius:3px;padding:0 5px;' +
                (m.status === '已办结' ? 'background:#e6f2e9;color:#3f7d5c' : m.status === '办理中' ? 'background:#fdf4e4;color:#8a6a33' : 'background:#eef2f8;color:#2b6cb0') + '">' + m.status + '</span>' +
              '<span style="font-size:10.5px;color:#b0a288">' + m.date + '</span>' +
            '</div>' +
            '<div style="font-size:11px;color:#7a6d55;margin-top:3px">' + m.from + '：' + m.reply + '</div>' +
          '</div>').join(''), true);
  };

  function renderLeaders(d) {
    return '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px">' +
      d.leaders.reduce((acc, l) => {
        const gi = acc.find(x => x.group === l.group);
        if (gi) gi.items.push(l); else acc.push({ group: l.group, items: [l] });
        return acc;
      }, []).map(g =>
        '<div>' +
          '<div style="font-size:11.5px;font-weight:700;color:#8b2020;margin-bottom:5px">' + g.group +
            '<span style="font-weight:400;color:#a89878;font-size:10px"> 共 ' + g.items.length + ' 人</span></div>' +
          g.items.map(l =>
            '<div data-gwleader="' + l.name + '" style="display:flex;gap:7px;padding:5px 0;border-bottom:1px dotted #e6dcc8;cursor:pointer">' +
              (window.AV ? AV.box(l.name, { size: 28, sex: l.sex, age: l.age }) : l.name[0]) +
              '<div style="min-width:0">' +
                '<div style="font-size:11.5px;font-weight:600;color:#3a3529">' + l.name + '</div>' +
                '<div style="font-size:10px;color:#8b2020">' + l.post + '</div>' +
                '<div style="font-size:9.5px;color:#a89878">' + l.sex + '，' + l.age + ' 岁，' + l.edu + '</div>' +
              '</div></div>').join('') +
        '</div>').join('') +
    '</div>';
  }

  /* 绑定 */
  window.bindGovSite = function (g) {
    document.querySelectorAll('[data-gwtab]').forEach(e => e.onclick = () => {
      cur.tab = e.dataset.gwtab; cur.detail = null;
      window.__render && window.__render();
    });
    document.querySelectorAll('[data-gwnews]').forEach(e => e.onclick = () => {
      cur.detail = Number(e.dataset.gwnews);
      window.__render && window.__render();
    });
    document.querySelectorAll('[data-gwback]').forEach(e => e.onclick = () => {
      cur.detail = null; window.__render && window.__render();
    });
    document.querySelectorAll('[data-gwleader]').forEach(e => e.onclick = () => {
      const d2 = GW.data(g);
      const l = d2.leaders.find(x => x.name === e.dataset.gwleader);
      if (!l) return;
      window.__modal && window.__modal('领导之窗 · ' + l.name,
        '<div style="text-align:center;padding:6px 0 12px">' +
          '<div style="margin:0 auto 8px;width:64px;height:64px">' + (window.AV ? AV.box(l.name, { size: 64, sex: l.sex, age: l.age }) : '') + '</div>' +
          '<div style="font-size:18px;font-weight:700;color:#8b2020">' + l.name + '</div>' +
          '<div style="font-size:12px;color:#7a6d55;margin-top:3px">' + l.post + '</div>' +
        '</div>' +
        '<div class="kv"><span>班子</span><span>' + l.group + '</span></div>' +
        '<div class="kv"><span>性别</span><span>' + l.sex + '</span></div>' +
        '<div class="kv"><span>年龄</span><span>' + l.age + ' 岁</span></div>' +
        '<div class="kv"><span>学历</span><span>' + l.edu + '</span></div>' +
        '<div class="kv"><span>工作分工</span><span>' + l.duty + '</span></div>',
        [{ n: '关闭', c: 'primary' }]);
    });
    document.querySelectorAll('[data-gwsubmit]').forEach(e => e.onclick = () => {
      window.__toast && window.__toast('留言已提交，等待办理');
    });
  };
})();
</script>
<script>/* ============================================================
   治理者之路 · 招商引资 & 项目审批
   完整流程：洽谈意向 → 立项 → 审批 → 开工 → 竣工投产
   ============================================================ */
(function () {
  'use strict';
  const PROJ = {};
  window.PROJ = PROJ;

  const rnd = () => Math.random();
  const pick = a => a[Math.floor(rnd() * a.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const fmt = n => {
    if (n >= 1e8) return (n / 1e8).toFixed(1) + ' 亿';
    if (n >= 1e4) return (n / 1e4).toFixed(0) + ' 万';
    return String(Math.round(n));
  };

  /* ---------------- 产业类型 ---------------- */
  PROJ.INDUSTRIES = [
    { k: 'manufacture', n: '先进制造', ic: '⚙', inv: [2, 30], land: [50, 400], jobs: [300, 3000], tax: 0.06, risk: 12, gdpK: 1.4,
      desc: '投资大、就业多、税收稳定，但环保压力也大' },
    { k: 'digital',    n: '数字经济', ic: '◈', inv: [1, 15], land: [10, 80],  jobs: [80, 600],  tax: 0.10, risk: 5,  gdpK: 1.8,
      desc: '轻资产、附加值高，最受上级欢迎' },
    { k: 'bio',        n: '生物医药', ic: '❋', inv: [3, 25], land: [40, 250], jobs: [150, 1500], tax: 0.11, risk: 8, gdpK: 1.7,
      desc: '周期长、门槛高，一旦落地就是政绩' },
    { k: 'newenergy',  n: '新能源',   ic: '☀', inv: [5, 60], land: [200, 1200], jobs: [200, 2000], tax: 0.07, risk: 15, gdpK: 1.5,
      desc: '用地需求极大，征地是难点' },
    { k: 'logistics',  n: '现代物流', ic: '⇄', inv: [1, 12], land: [100, 500], jobs: [200, 1200], tax: 0.05, risk: 6, gdpK: 1.2,
      desc: '见效快、风险低，但税收贡献一般' },
    { k: 'culture',    n: '文旅产业', ic: '❖', inv: [1, 20], land: [80, 400], jobs: [100, 900], tax: 0.04, risk: 7, gdpK: 1.1,
      desc: '带动消费和形象，见效慢' },
    { k: 'agri',       n: '现代农业', ic: '✦', inv: [0.5, 8], land: [300, 2000], jobs: [100, 800], tax: 0.02, risk: 4, gdpK: 0.9,
      desc: '税收低但是乡村振兴的硬指标' },
  ];

  /* ---------------- 企业名 ---------------- */
  const CORP_PRE = ['华', '中', '恒', '宏', '泰', '瑞', '鼎', '鑫', '立', '远', '天', '光', '金', '新', '创'];
  const CORP_MID = ['盛', '晟', '晟', '昌', '源', '通', '禾', '元', '拓', '越', '联', '科', '达', '图'];
  const CORP_SUF = ['集团', '控股', '实业', '科技', '产业', '投资', '发展', '股份'];

  PROJ.corpName = function (seed) {
    const h = Math.abs(Math.floor(seed * 9301 + 49297) % 233280);
    const a = CORP_PRE[h % CORP_PRE.length];
    const b = CORP_MID[(h >> 3) % CORP_MID.length];
    const c = CORP_SUF[(h >> 6) % CORP_SUF.length];
    return a + b + c;
  };

  /* ---------------- 生成一个意向项目 ---------------- */
  PROJ.makeIntention = function (g, lv) {
    const ind = pick(PROJ.INDUSTRIES);
    const seed = (g.seed || 1) + (g.month || 1) * 137 + (g.player.projects || []).length * 31 + Math.floor(rnd() * 9999);
    /* 职位越高，招到的项目越大 */
    const lvK = 0.45 + (lv || 0) * 0.16;  /* 处级约 1.1 倍，省级约 1.9 倍 */
    const inv = (ind.inv[0] + rnd() * (ind.inv[1] - ind.inv[0])) * lvK;
    const land = Math.round((ind.land[0] + rnd() * (ind.land[1] - ind.land[0])) * lvK);
    const jobs = Math.round((ind.jobs[0] + rnd() * (ind.jobs[1] - ind.jobs[0])) * lvK);
    /* 税收：投资 × 税率 × 波动 */
    const tax = inv * 10000 * ind.tax * (0.7 + rnd() * 0.6);
    /* 谈判难度：投资越大越难搞 */
    const diff = clamp(Math.round(30 + inv * 2.2 + rnd() * 18), 22, 90);
    return {
      id: 'p' + Date.now().toString(36) + Math.floor(rnd() * 1000),
      corp: PROJ.corpName(seed),
      ind: ind.k,
      indName: ind.n,
      ic: ind.ic,
      inv: Math.round(inv * 10) / 10,      /* 亿元 */
      land,
      jobs,
      tax: Math.round(tax),                 /* 万元/年 */
      diff,
      stage: 'intent',                      /* intent → approved → building → done */
      months: 0,
      created: g.year + '年' + g.month + '月',
      note: '',
    };
  };

  /* ---------------- 项目阶段文案 ---------------- */
  PROJ.STAGES = {
    intent:   { n: '意向洽谈', c: '#8a6a33', d: '企业有投资意向，需你去谈' },
    approved: { n: '已立项',   c: '#2b6cb0', d: '已批立项，等开工' },
    building: { n: '建设中',   c: '#6b477f', d: '工地正在施工' },
    done:     { n: '已投产',   c: '#3f7d5c', d: '项目投产，开始贡献税收' },
    dead:     { n: '已黄了',   c: '#a5463e', d: '项目没谈成或中途退出' },
  };

  /* ---------------- 洽谈：花 1 行动点 + 2 万 ---------------- */
  PROJ.talk = function (g, projId) {
    const p = g.player;
    p.projects = p.projects || [];
    const pj = p.projects.find(x => x.id === projId);
    if (!pj) return { ok: false, msg: '找不到这个项目' };
    if (pj.stage !== 'intent') return { ok: false, msg: '这个项目已经谈过了' };
    if ((p.ap || 0) < 2) return { ok: false, msg: '行动点不够（需 2 点）' };
    if ((p.netWorth || 0) < 2) return { ok: false, msg: '接待经费不够（需 2 万）' };

    p.ap -= 2;
    p.netWorth -= 2;

    /* 成功率：考察分、能力、学历、是否有关系 */
    const base = 0.30
      + (p.attrs.ability || 50) / 500
      + (p.attrs.exec || 50) / 600
      + Math.min(p.exam || 0, 120) / 400;
    const rate = clamp(base * (1 - pj.diff / 150), 0.08, 0.85);
    const ok = rnd() < rate;

    if (ok) {
      pj.stage = 'approved';
      pj.note = '已立项，可推进开工';
      p.exam = (p.exam || 0) + 4 + Math.round(pj.inv);
      p.perf = (p.perf || 0) + 3;
      g.player.projLog = g.player.projLog || [];
      g.player.projLog.unshift({ d: g.year + '年' + g.month + '月', t: '签约 ' + pj.corp + ' · ' + pj.indName + '（投资 ' + pj.inv + ' 亿）' });
      if (g.player.projLog.length > 40) g.player.projLog.pop();
      return { ok: true, msg: '谈成了！' + pj.corp + ' 决定在我们这里投资 ' + pj.inv + ' 亿元', rate: Math.round(rate * 100) };
    }

    /* 失败：可能直接黄掉 */
    if (rnd() < 0.20) {
      pj.stage = 'dead';
      pj.note = '企业转投别处';
      return { ok: false, msg: '没谈成，' + pj.corp + ' 转投了邻市', rate: Math.round(rate * 100) };
    }
    pj.note = '意向还在，可以再谈一次';
    return { ok: false, msg: '这次没谈下来，但企业还没走，可以再试', rate: Math.round(rate * 100) };
  };

  /* ---------------- 审批开工：花 3 行动点 ---------------- */
  PROJ.approve = function (g, projId) {
    const p = g.player;
    const pj = (p.projects || []).find(x => x.id === projId);
    if (!pj) return { ok: false, msg: '找不到这个项目' };
    if (pj.stage !== 'approved') return { ok: false, msg: '这个项目现在不能开工' };
    if ((p.ap || 0) < 3) return { ok: false, msg: '行动点不够（需 3 点）' };

    /* 用地越大，审批越难（征地、环保） */
    const landDiff = pj.land > 500 ? 0.35 : pj.land > 200 ? 0.2 : 0.1;
    const riskAdd = Math.round(pj.land / 120);
    const ok = rnd() > landDiff;

    p.ap -= 3;

    if (ok) {
      pj.stage = 'building';
      pj.months = 0;
      /* 开工要担风险：征地、环保投诉 */
      if (riskAdd > 0) {
        p.riskLog = p.riskLog || [];
        p.riskLog.push({ v: riskAdd, note: pj.corp + ' 项目征地拆迁争议', date: g.year + '年' + g.month + '月', kind: 'land' });
      }
      return { ok: true, msg: '开工了！' + pj.corp + ' 项目正式动工' + (riskAdd ? '（征地风险 +' + riskAdd + '）' : '') };
    }
    pj.note = '审批卡在用地指标，可再推一次';
    return { ok: false, msg: '用地指标卡住了，项目还没能动工' };
  };

  /* ---------------- 每月推进 ----------------
     building 阶段经过 6~14 个月自动投产 */
  PROJ.tick = function (g) {
    const p = g.player;
    (p.projects || []).forEach(pj => {
      if (pj.stage !== 'building') return;
      pj.months++;
      const need = Math.round(6 + pj.land / 200);
      if (pj.months >= need) {
        pj.stage = 'done';
        pj.note = '已投产';
        p.projLog = p.projLog || [];
        p.projLog.unshift({ d: g.year + '年' + g.month + '月', t: pj.corp + ' 项目竣工投产，年税收 ' + fmt(pj.tax) });
        /* 政绩与 GDP */
        p.perf = (p.perf || 0) + 6 + Math.round(pj.inv / 2);
        g.metrics = g.metrics || {};
        g.metrics.gdp = (g.metrics.gdp || 0) + pj.inv * 0.8;
      }
    });
  };

  /* ---------------- 已投产项目的年税收合计（万元） ---------------- */
  PROJ.annualTax = function (g) {
    const p = g.player;
    return (p.projects || []).filter(x => x.stage === 'done').reduce((a, b) => a + (b.tax || 0), 0);
  };

  /* ---------------- 渲染 ---------------- */
  PROJ.render = function (g) {
    const p = g.player;
    p.projects = p.projects || [];
    const lv = p.level || 0;
    const canCreate = lv >= 3;
    const done = p.projects.filter(x => x.stage === 'done');
    const totalTax = PROJ.annualTax(g);
    const totalInv = done.reduce((a, b) => a + b.inv, 0);

    /* 顶部统计 */
    let head = '<div class="card">' +
      '<div class="ch"><span class="ic green">商</span><h3>招商引资与项目审批</h3>' +
      '<span class="tail">' + (canCreate ? '本级可自主招商' : '需正处级（市长/县委书记）以上') + '</span></div>';

    head += '<div class="row flex" style="gap:9px;margin-bottom:12px">' +
      '<div class="stat"><div class="lab">已投产项目</div><div class="val">' + done.length + ' <span class="sm dim">个</span></div></div>' +
      '<div class="stat"><div class="lab">累计投资</div><div class="val">' + totalInv.toFixed(1) + ' <span class="sm dim">亿</span></div></div>' +
      '<div class="stat"><div class="lab">年税收贡献</div><div class="val">' + fmt(totalTax) + ' <span class="sm dim">元</span></div></div>' +
      '</div>';

    if (!canCreate) {
      head += '<p class="sm dim" style="margin:0">招商引资需要一定职权。晋升到<b>正处级</b>（市长、县委书记）后即可主导项目。</p></div>';
      return head;
    }

    /* 洽谈按钮 */
    head += '<div style="display:flex;gap:7px;align-items:center;margin-bottom:12px;flex-wrap:wrap">' +
      '<button class="btn primary" data-proj-new="1" ' + ((p.ap || 0) < 1 ? 'disabled' : '') + '>＋ 接待一家意向企业（1 行动点）</button>' +
      '<span class="sm dim">找项目、谈投资，每谈成一个都是硬政绩</span></div>';

    /* 项目列表 */
    const active = p.projects.filter(x => x.stage !== 'dead');
    if (!active.length) {
      head += '<div style="text-align:center;padding:26px 0;color:#a89878">' +
        '<div style="font-size:26px;margin-bottom:8px">◇</div>' +
        '<div class="sm">还没有在谈的项目</div>' +
        '<div class="sm dim" style="margin-top:4px">点上面的按钮，接待一家意向企业</div></div></div>';
      return head;
    }

    head += active.map(pj => {
      const st = PROJ.STAGES[pj.stage] || PROJ.STAGES.intent;
      const ind = PROJ.INDUSTRIES.find(x => x.k === pj.ind) || {};
      let actions = '';
      if (pj.stage === 'intent') {
        actions = '<button class="btn sm primary" data-proj-talk="' + pj.id + '" ' + ((p.ap || 0) < 2 ? 'disabled' : '') + '>去谈（2 点 · 2 万）</button>';
      } else if (pj.stage === 'approved') {
        actions = '<button class="btn sm primary" data-proj-approve="' + pj.id + '" ' + ((p.ap || 0) < 3 ? 'disabled' : '') + '>推开工（3 点）</button>';
      } else if (pj.stage === 'building') {
        const need = Math.round(6 + pj.land / 200);
        const pct = Math.min(100, Math.round(pj.months / need * 100));
        actions = '<div style="min-width:110px"><div class="prog" style="height:5px"><i style="width:' + pct + '%"></i></div>' +
          '<div class="sm dim" style="margin-top:2px">工期 ' + pj.months + '/' + need + ' 月</div></div>';
      } else {
        actions = '<span class="tag" style="background:#e6f2e9;color:#3f7d5c">年税收 ' + fmt(pj.tax) + '</span>';
      }
      return '<div style="border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fffdfa">' +
        '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
          '<span style="font-size:16px;color:' + st.c + '">' + (pj.ic || '◇') + '</span>' +
          '<b style="font-size:13px">' + pj.corp + '</b>' +
          '<span class="tag" style="font-size:10px;background:#f3edf8;color:#6b477f">' + pj.indName + '</span>' +
          '<span class="tag" style="font-size:10px;background:' + st.c + '15;color:' + st.c + '">' + st.n + '</span>' +
          '<span style="margin-left:auto">' + actions + '</span>' +
        '</div>' +
        '<div style="display:flex;gap:14px;margin-top:6px;font-size:11px;color:#7a7186;flex-wrap:wrap">' +
          '<span>投资 <b style="color:#5b3b6f">' + pj.inv + '</b> 亿</span>' +
          '<span>用地 <b style="color:#5b3b6f">' + pj.land + '</b> 亩</span>' +
          '<span>就业 <b style="color:#5b3b6f">' + pj.jobs + '</b> 人</span>' +
          '<span>年税收 <b style="color:#3f7d5c">' + fmt(pj.tax) + '</b></span>' +
          '<span>难度 <b style="color:' + (pj.diff > 70 ? '#a5463e' : pj.diff > 50 ? '#8a6a33' : '#3f7d5c') + '">' + pj.diff + '</b></span>' +
        '</div>' +
        (ind.desc ? '<div class="sm dim" style="margin-top:4px;font-size:10px">' + ind.desc + '</div>' : '') +
        (pj.note ? '<div class="sm" style="margin-top:4px;font-size:10.5px;color:#8a6a33">' + pj.note + '</div>' : '') +
      '</div>';
    }).join('');

    head += '</div>';

    /* 项目日志 */
    if ((p.projLog || []).length) {
      head += '<div class="card">' +
        '<div class="ch"><span class="ic blue">记</span><h3>招商与项目台账</h3></div>' +
        p.projLog.slice(0, 12).map(x =>
          '<div style="display:flex;gap:8px;font-size:11.5px;padding:4px 0;border-bottom:1px dashed var(--line)">' +
          '<span class="dim" style="flex:none">' + x.d + '</span>' +
          '<span style="color:#5b3b6f">' + x.t + '</span></div>').join('') +
        '</div>';
    }
    return head;
  };

  /* ---------------- 绑定 ---------------- */
  PROJ.bind = function (g) {
    document.querySelectorAll('[data-proj-new]').forEach(el => {
      el.onclick = () => {
        const p = g.player;
        if ((p.ap || 0) < 1) { if (window.toast) toast('行动点不够'); return; }
        p.ap -= 1;
        p.projects = p.projects || [];
        const pj = PROJ.makeIntention(g, p.level || 0);
        p.projects.push(pj);
        if (window.toast) toast('接待了 ' + pj.corp + '，正在洽谈 ' + pj.indName + ' 项目');
        if (window.save) save();
        if (window.renderGame) renderGame();
      };
    });

    document.querySelectorAll('[data-proj-talk]').forEach(el => {
      el.onclick = () => {
        const r = PROJ.talk(g, el.dataset.projTalk);
        if (window.modal) {
          modal(r.ok ? '签约成功' : '谈判结果',
            '<div style="text-align:center;padding:10px 0">' +
            '<div style="font-size:15px;color:' + (r.ok ? '#3f7d5c' : '#a5463e') + ';margin-bottom:8px">' + r.msg + '</div>' +
            '<div class="sm dim">本次成功率 ' + (r.rate || 0) + '%</div></div>',
            [{ n: '知道了', c: 'primary' }]);
        }
        if (window.save) save();
        if (window.renderGame) renderGame();
      };
    });

    document.querySelectorAll('[data-proj-approve]').forEach(el => {
      el.onclick = () => {
        const r = PROJ.approve(g, el.dataset.projApprove);
        if (window.toast) toast(r.msg);
        if (window.save) save();
        if (window.renderGame) renderGame();
      };
    });
  };
})();
</script>

    },
  ];

  /* 排行榜只展示这三档 */

  RK.tierOf = lv => RK.TIERS.find(t => t.level === lv) || RK.TIERS[RK.TIERS.length - 1];

  RK.tierByName = n => RK.TIERS.find(t => t.name === n || t.short === n);

  /* 游戏职级（0-9） → 排行榜职级 */
  /* 游戏职级 0-9 → 排行榜职级 3-11
     0 科员→3、1 副科→4、2 正科→5、3 副处→6、4 正处→7
     5 副厅→8、6 正厅→9、7 副部→10、8 正部→11、9 省委书记→11 */
  /* 游戏 0-9 → 三档职级：0-6 一律算正部级以下（归入正部级展示），7-8 正部级，9 正部级 */
  /* 游戏职级 0-9 → 排行榜职级标签 + 权力分 */
  RK.GAME_LV = [
    { lv: 0, name: '科员',     short: '科员',   power: 6  },

  /* ---------------- 生成全国干部 ---------------- */
  const SUR = ['高','崔','丁','赵','唐','沈','郭','曹','周','肖','谢','林','罗','李','王','张','刘','陈','杨','黄','吴','徐','孙','马','朱','胡','何','宋','许','韩'];

  const hsh = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return Math.abs(h); };

    const mk = (tier, post, extra) => ({

    const t13 = RK.ALL_TIERS_FULL[0];
