    document.querySelectorAll('[data-cardact]').forEach(b => {
      b.onclick = function () {
        const act = b.getAttribute('data-cardact');
        if (o.onAction) o.onAction(act, p);
      };
    });
  };

  /* 生成操作按钮 HTML（升职 / 平调 / 免职 / 罢免案 / 建议） */
  window.renderActionBar = function (g, person) {
    const PL = window.PL;
    if (!PL) return '';
    const myLv = g.player.level || 0;
    const myName = g.player.name || '你';

    /* 1. 先按姓名在人物关系里找 */
    let x = PL.roster(g).list.find(function (y) { return y.name === person.name; });

    /* 2. 找不到 → 用组织架构的席位构造一个（按职务判权限） */
    if (!x) {
      const lvOfTitle = function (t) {
        if (/省委书记|省委副书记|省长$|省政协主席|省人大常委会主任/.test(t)) return 8;
        if (/副省长|省委常委|省高院|省检察/.test(t)) return 7;
        if (/市委书记$|市长$|市人大常委会主任|市政协主席|省厅厅长/.test(t)) return 6;
        if (/市委常委|副市长|市局副局长/.test(t)) return 5;
        if (/区委书记|县委书记|区长|县长|市局局长/.test(t)) return 4;
        if (/区委常委|县委常委|副县长|副区长/.test(t)) return 3;
        if (/科长|乡镇长|街道办主任/.test(t)) return 2;
        if (/副科长|副乡镇长|副局长/.test(t)) return 1;
        return 0;
      };
      const tl = person.title || '';
      x = {
        id: -1,
        name: person.name,
        title: person.title,
        level: person.level || '',
        lv: typeof person.lv === 'number' ? person.lv : lvOfTitle(tl),
        rel: 'down',
        faction: person.faction || '',
      };
    }

    /* 3. 判定 */
    const myLvNum = myLv;
    let can, reason;
    if (x.lv >= myLvNum) {
      can = false;
      reason = '职级不低于你，无权直接处理';
    } else if (window.PERM) {
      const chk = PERM.check(g, x, 'fire');
      can = chk.pass;
      reason = chk.pass ? '' : chk.msg;
    } else {
      can = true;
      reason = '';
    }

    const btn = function (act, label, color, border) {
      return '<button data-cardact="' + act + '" style="padding:5px 13px;border-radius:7px;font-size:11.5px;cursor:pointer;' +
        'background:#fff;border:1px solid ' + (border || color) + ';color:' + color + '">' + label + '</button>';
    };

    /* 上级 / 同级：不给调动按钮 */
    const isUp = (person.rel === 'up') || (x && x.rel === 'up');
    if (isUp) {
      const fv = person.favor || 0;
      const canBreak = fv >= 70 && (g.player.level || 0) < 9;
      return '<div style="border-top:1px dashed #e6dcc8;margin-top:12px;padding-top:10px">' +
        '<div style="font-size:10.5px;color:#8a8a94;margin-bottom:6px">这是你的上级（' + (person.title || '') + '）· 你动不了他</div>' +
        '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
          '<button data-cardact="favor" style="padding:5px 13px;border-radius:7px;font-size:11.5px;cursor:pointer;background:#fff;border:1px solid #e0d2a8;color:#8a6a33">送礼拉关系</button>' +
          (canBreak ? '<button data-cardact="break" style="padding:5px 13px;border-radius:7px;font-size:11.5px;cursor:pointer;background:#fffdf4;border:1px solid #e0d2a8;color:#8a6a33;font-weight:600">找领导破格提拔</button>' : '') +
        '</div>' +
        '<div style="font-size:10px;color:#b0806e;margin-top:5px">好感 ' + fv + '/70' + (canBreak ? ' · 可以请他出面提拔你了' : ' · 好感满 70 才能请他出面提拔你') + '</div>' +
      '</div>';
    }

    let btns;
    if (can) {
      btns = btn('promote', '提拔', '#3f7d5c', '#bfd8c7') + btn('transfer', '平调', '#2b6cb0', '#c2d5e6') +
             btn('fire', '免职', '#a5463e', '#e0b8b2');
    } else {
      /* 仍然给按钮，但点击时会提示原因 */
      btns = btn('promote', '提拔', '#3f7d5c', '#bfd8c7') + btn('transfer', '平调', '#2b6cb0', '#c2d5e6') +
             btn('fire', '免职（受限）', '#c0a09a', '#e8dcd8');
      if (window.PERM) {
        const chk2 = PERM.check(g, x, 'fire');
        if (chk2.stage === 3) btns += btn('recall', '提交罢免案', '#6b477f', '#d8cbe2');
        else if (chk2.action === 'suggest') btns += btn('suggest', '提处分建议', '#8a6a33', '#e0d2a8');
      }
    }

    const LVNAMES = { 0:'科员',1:'副科级',2:'正科级',3:'副处级',4:'正处级',5:'副厅级',6:'正厅级',7:'副部级',8:'正部级',9:'省委书记',10:'副国级',11:'正国级' };
    const lvName = LVNAMES[x.lv] || (window.RANK ? (RANK.byIndex(Math.min(9, x.lv)) || {}).name : '') || '';
    return '<div style="border-top:1px dashed #e6dcc8;margin-top:12px;padding-top:10px">' +
      '<div style="font-size:10.5px;color:#8a8a94;margin-bottom:6px">用人权（' + (x.title || '') + ' · ' + lvName + '）</div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap">' + btns + '</div>' +
      (reason ? '<div style="font-size:10px;color:#b0806e;margin-top:5px">' + reason + '</div>' : '') +
      '</div>';
  };

  /* 卡片内的名字点击 → 打开新卡片（递归） */
  window.__bindCardNames = function (g) {
    document.querySelectorAll('[data-cardname]').forEach(function (el) {
      el.onclick = function (ev) {
        ev.stopPropagation();
        const nm = decodeURIComponent(el.getAttribute('data-cardname') || '');
        const tl = decodeURIComponent(el.getAttribute('data-cardtitle') || '');
        if (!nm) return;
        /* 已经在看这个人 → 不重复打开 */
        if (window.__cardCurName === nm) return;
        window.__openByName(nm, tl);
      };
    });
  };

  /* 按姓名打开档案（统一入口） */
  window.__openByName = function (name, title) {
    const g = window.G;
    if (!g || !name) return;
    const PL = window.PL;
    const area = (window.JOBPOOL && JOBPOOL.areaOf) ? JOBPOOL.areaOf(g) : ((g.player.position || {}).county || '');
    const prov = (g.player.position || {}).province || '';
    const city = (g.player.position || {}).city || '';
    const lvNum = function (t) {
      const s = String(t || '');
      /* 国家级 */
      if (/中共中央总书记|国家主席|中央军委主席|全国人大常委会委员长|国务院总理|全国政协主席/.test(s)) return 11;
      if (/中央政治局常委|中央政治局委员|中央书记处书记|全国人大常委会副委员长|国务院副总理|国务委员|全国政协副主席|国家副主席|中央纪委书记|最高人民法院院长|最高人民检察院检察长/.test(s)) return 10;
      /* 省级正职 */
      if (/省委书记|自治区党委书记|省长|省政协主席|省人大常委会主任/.test(s)) return 8;
      /* 省级副职 */
      if (/副省长|省委常委|省人大常委会副主任|省政协副主席|省高级人民法院院长|省人民检察院检察长|省高院|省检察/.test(s)) return 7;
      /* 市级正职 */
      if (/市委书记|市长|市政协主席|市人大常委会主任/.test(s)) return 6;
      /* 市级副职 */
      if (/市委常委|副市长|市人大常委会副主任|市政协副主席/.test(s)) return 5;
      /* 区县正职 */
      if (/县委书记|区委书记|县长|区长|县人大常委会主任|区人大常委会主任|县政协主席|区政协主席/.test(s)) return 4;
      /* 区县副职 */
      if (/区委常委|县委常委|副县长|副区长|区人大常委会副主任|县人大常委会副主任/.test(s)) return 3;
      /* 中层 */
      if (/科长|乡镇长|乡长|镇长|街道办事处主任|街道办主任/.test(s)) return 2;
      if (/副科长|副局长/.test(s)) return 1;
      return 0;
    };
    let person = PL ? PL.roster(g).list.find(function (x) { return x.name === name; }) : null;
    if (!person) person = { id: -1, name: name, title: title || '', lv: lvNum(title), rel: 'down', favor: 50, sex: '男' };
    else if (title) person = Object.assign({}, person, { title: title });

    /* 从组织架构里找上级/信息 */
    const x = window.ORGX2 ? ORGX2.build(g) : null;
    let superior = null, subs = [];
    const myLv = person.lv || lvNum(title);
    if (x) {
      const all = [];
      x.cols.forEach(function (c) { c.seats.forEach(function (s) { all.push(s); }); });
      /* 上级 */
      if (myLv >= 10) {
        superior = { name: '—', title: '无上级（党和国家领导人）', none: true };
        subs = [];
        all.forEach(function (s) { if (s.name !== name && s.name) subs.push({ name: s.name, title: s.title }); });
      } else if (!/省委书记|自治区党委书记/.test(person.title || '')) {
        let top = null;
        all.forEach(function (s) { if (s.name !== name && /省委书记|自治区党委书记/.test(s.title || '')) top = s; });
        let best = null;
        all.forEach(function (s) {
          if (s.name === name || !s.name) return;
          const sl = lvNum(s.title);
          if (sl > myLv && (!best || sl < best.lv)) best = { name: s.name, title: s.title, lv: sl };
        });
        if (best) superior = { name: best.name, title: best.title };
        else if (top) superior = { name: top.name, title: top.title };
        /* 市长/县长/区长 → 同级书记 */
        if (/市长|县长|区长/.test(person.title || '')) {
          const tgt = /市/.test(person.title) ? (city + '委书记') : (area + '委书记');
          all.forEach(function (s) { if (s.name !== name && (s.title || '').indexOf(tgt) >= 0) superior = { name: s.name, title: s.title }; });
        }
      } else {
        superior = { name: '—', title: '无上级（一方主官）', none: true };
      }
      /* 下属 */
      all.forEach(function (s) { if (lvNum(s.title) === myLv - 1 && s.name !== name) subs.push({ name: s.name, title: s.title }); });
    }
    if (PL && !subs.length) {
      subs = PL.roster(g).list.filter(function (u) { return u.lv === myLv - 1; })
        .map(function (u) { return { name: u.name, title: u.title }; });
    }

    const actHtml = window.renderActionBar ? window.renderActionBar(g, person) : '';
    window.__cardCurName = name;
    window.openPersonCard(person, {
      area: area, province: prov, city: city,
      superior: superior, subordinates: subs.slice(0, 12),
      moves: [], actions: actHtml,
      onAction: function (act, per) {
        window.__closeModal && window.__closeModal();
        const info = { name: per.name, title: per.title, faction: per.faction, sex: per.sex };
        if (act === 'promote' || act === 'transfer') { window.__openJobPicker && window.__openJobPicker(per.id, act, info); }
        else if (act === 'fire') { window.__doFire && window.__doFire(per.id, info); }
        else if (act === 'recall') { window.__doRecall && window.__doRecall(per.id, info); }
        else if (act === 'suggest') { window.__doSuggest && window.__doSuggest(per.id, info); }
      },
    });
    setTimeout(function () { window.__bindCardNames(g); }, 40);
  };

  /* 空缺卡片 */
  window.renderVacancyCard = function (g, title, X) {
    const key = PX.vacKey(g, title);
    const V = PX.vacancies(g);
    const v = V[key];
    const months = v ? v.monthsEmpty || 0 : 0;
    const cands = v ? v.candidates || [] : [];
    return '<div style="border:1.5px dashed #d8b8b0;border-radius:10px;padding:9px 11px;background:#fdf6f4">' +
      '<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px">' +
        '<span style="background:#a5463e;color:#fff;font-size:9.5px;border-radius:3px;padding:1px 6px">空缺</span>' +
        '<b style="font-size:12px;color:#8b2020">' + title + '</b>' +
        '<span style="margin-left:auto;font-size:10px;color:#a5463e">空岗 ' + months + '/3 个月</span>' +
      '</div>' +
      '<div class="sm dim" style="font-size:10.5px;margin-bottom:6px">' +
        (v && v.formerName ? '原任 ' + v.formerName + ' 已免职。' : '本格空编（建册起就没人）。') +
        '满 3 个月中央自动派人。</div>' +
      (cands.length ? '<div style="font-size:10.5px;color:#5c5268;margin-bottom:4px">可提名：</div>' +
        cands.map((c, i) =>
          '<div style="display:flex;align-items:center;gap:5px;padding:3px 0;border-top:1px dotted #ecd4ce">' +
          '<span style="font-size:11px;font-weight:600">' + c.name + '</span>' +
          '<span class="sm dim" style="font-size:9.5px">' + c.age + '岁·' + c.edu + '</span>' +
          '<span class="sm dim" style="font-size:9.5px">能力' + c.cap + ' 执行' + c.exec + '</span>' +
          '<button data-vacfill="' + encodeURIComponent(title) + ':' + i + '" style="margin-left:auto;border:1px solid #8a6a33;' +
          'background:#fffdf8;color:#8a6a33;border-radius:5px;padding:1px 8px;font-size:10px;cursor:pointer">提名</button>' +
          '</div>').join('') : '') +
      '</div>';
  };

  window.bindVacancy = function (g) {
    document.querySelectorAll('[data-vacfill]').forEach(b => b.onclick = (ev) => {
      ev.stopPropagation();
      const [t, i] = b.dataset.vacfill.split(':');
      const r = PX.fill(g, decodeURIComponent(t), Number(i));
      window.__toast && window.__toast(r.ok ? r.msg : r.msg);
      window.__save && window.__save();
      window.__render && window.__render();
    });
  };
})();
</script>
<script>/* ============================================================
   治理者之路 · 开除权限三道判定
   ① 职级压制：你的级别必须大于目标
   ② 管辖权限：目标必须是你的"下管一级"（本区管 / 市管 / 省管）
   ③ 身份限制：人大选举产生的干部，必须先过人大常委会罢免案
   ============================================================ */
(function () {
  'use strict';
  const PERM = {};
  window.PERM = PERM;

  let g_ = null;   /* 当前游戏 */

  /* 职级 → 数字（越大越高） */
  const LV = {
    '科员': 0, '副科级': 1, '正科级': 2, '副处级': 3, '正处级': 4,
    '副厅级': 5, '正厅级': 6, '副部级': 7, '正部级': 8, '省委书记': 9,
    /* 国家级 */
    '国家级副职': 10, '副国级': 10,
    '国家级正职': 11, '正国级': 11,
    /* 别名 */
    '一级科员': 0, '二级科员': 0, '三级科员': 0, '四级科员': 0,
    '副科长': 1, '科长': 2, '副局长': 3, '局长': 4,
    '副市长': 5, '市长': 6, '副省长': 7, '省长': 8,
  };

  /* 从职务名推断职级 */
  PERM.levelOf = function (person) {
    if (!person) return 0;
    /* 先看职级字符串 */
    const lvName = person.level || '';
    if (LV[lvName] != null) return LV[lvName];
    /* 再看职务名 */
    const t0 = person.title || '';
    /* 最后看 lv 数字（游戏内 0-9） */
    if (person.lv != null && typeof person.lv === 'number') return person.lv;
    const t = t0;
    if (/省委书记|省委副书记|省长|省政协主席|省人大.*主任/.test(t)) return 8;
    if (/副省长|省委常委|省高院|省检察/.test(t)) return 7;
    if (/市委书记|市长|市人大.*主任|市政协主席|省厅厅长/.test(t)) return 6;
    if (/市委常委|副市长|市局.*副局长/.test(t)) return 5;
    if (/区委书记|县委书记|区长|县长|市局局长|市政府秘书长/.test(t)) return 4;
    if (/区委常委|县委常委|副县长|副区长|市局副局长/.test(t)) return 3;
    if (/科长|乡镇长|街道办主任|县局局长/.test(t)) return 2;
    if (/副科长|副乡镇长|副局长/.test(t)) return 1;
    return 0;
  };

  /* 管理归属：谁的人谁管 */
  PERM.ownerOf = function (person) {
    if (!person) return '本区管';
    const t = person.title || '';
    const lv = PERM.levelOf(person);
    /* 1. 人大选举产生（优先级最高） */
    if (PERM.elected(person)) return '人大选举';
    /* 2. 市管干部：区长/县长/市局局长等核心正职（但不含副职） */
    if (/^(区长|县长|市长|市局局长|市政府秘书长)$/.test(t) || /市局.*局长/.test(t) && !/副/.test(t)) return '市管';
    /* 3. 省管干部：厅局级及以上 */
    if (lv >= 5) return '省管';
    return '本区管';
  };

  /* 是否由人大选举产生 */
  /* 是否由人大选举产生：区长/县长/副区长/副县长/乡镇长 */
  PERM.elected = function (person) {
    const t = (person && person.title) || '';
    if (/副区长.*党组/.test(t)) return false;
    return /(区长|县长|副区长|副县长|乡镇长|乡长|镇长)$/.test(t) || /^(区长|县长|副区长|副县长|乡镇长)/.test(t);
  };

  /* ---------------- 三道判定 ---------------- */
  /* 返回 { pass, stage, msg, hint } */
  PERM.check = function (g, target, action) {
    const act = action || 'fire';
    const me = g.player;
    const myLv = me.level || 0;
    const lvTarget = PERM.levelOf(target);

    /* ---- 第一道：职级压制（最先判） ---- */
    const hasLv = (target.level != null && target.level !== '') || (target.lv != null);
    if (hasLv && lvTarget >= myLv) {
      return {
        pass: false, stage: 1,
        msg: '权限不足，无权直接处理该干部',
        hint: '第一道判定【职级压制】：你是' + (window.RANK ? RANK.byIndex(myLv).name : myLv) +
              '，目标' + (target.level || '同级') + '。你的级别必须严格大于目标。',
      };
    }

    /* ---- 第二道：管辖权限 ---- */
    const owner = PERM.ownerOf(target);
    if (owner === '市管') {
      return {
        pass: false, stage: 2,
        msg: '这是市管干部，你只能提交处分建议',
        hint: '第二道判定【管辖权限】：该干部是市管干部（如区长、市局局长），' +
              '即使你是区委书记，也只能向上级（市委）提交"处分建议"，不能直接免职。',
        action: 'suggest',   /* 可提交建议 */
      };
    }
    if (owner === '省管') {
      return {
        pass: false, stage: 2,
        msg: '这是省管干部，不在你的管辖范围',
        hint: '第二道判定【管辖权限】：厅局级及以上属于省管干部，需由省委组织部按程序办理。',
        action: 'suggest',
      };
    }

    /* ---- 第三道：人大罢免 ---- */
    if (PERM.elected(target)) {
      const rec = PERM.recallRecord(g, target.name);
      if (!rec || !rec.passed) {
        return {
          pass: false, stage: 3,
          msg: '人大选举产生的干部，须先过罢免案',
          hint: '第三道判定【身份特殊限制】：' + target.title + '由' +
                (window.ADM ? ADM.char((g.player.position || {}).county || '') : '区') +
                '人民代表大会选举产生，不能直接免职。\n' +
                '必须先在"会议系统"中向人大常委会提交罢免案，通过后才能开除公职。',
          action: 'recall',
        };
      }
    }

    return { pass: true, msg: '三道判定通过，可以免职' };
  };

  /* ---------------- 人大罢免案 ---------------- */
  /* 记录：g.__recalls = { '姓名': { since, votes, passed, at } } */
  PERM.recalls = function (g) {
    if (!g.__recalls) g.__recalls = {};
    return g.__recalls;
  };
  PERM.recallRecord = function (g, name) {
    const R = PERM.recalls(g);
    return R[name] || null;
  };

  /* 提交罢免案 */
  PERM.submitRecall = function (g, person) {
    const p = g.player;
    const R = PERM.recalls(g);
    if (R[person.name] && !R[person.name].passed) {
      return { ok: false, msg: '该罢免案已在人大常委会审议中' };
    }
    if ((p.ap || 0) < 2) return { ok: false, msg: '行动点不够（需 2 点）' };
    p.ap -= 2;
    R[person.name] = {
      since: { y: g.year, m: g.month },
      votes: 0, total: 11, passed: false, months: 0,
      reason: '涉嫌严重违纪违法',
    };
    if (g.news) g.news.unshift({
      t: '你向' + (window.ADM ? ADM.npc((p.position || {}).county || '') : '区人大') + '常委会提交对' + person.name + '（' + person.title + '）的罢免案',
      date: (g.year || '') + '/' + (g.month || ''),
      eff: '等待常委会表决', effColor: '#8a6a33', kind: 'info',
    });
    return { ok: true, msg: '罢免案已提交人大常委会，下个月表决' };
  };

  /* ---------------- 处分建议（待上会队列） ---------------- */
  PERM.suggestions = function (g) {
    if (!g.__suggestions) g.__suggestions = [];
    return g.__suggestions;
  };

  PERM.suggest = function (g, person) {
    const p = g.player;
    if ((p.ap || 0) < 1) return { ok: false, msg: '行动点不够' };
    const Q = PERM.suggestions(g);
    if (Q.some(function (x) { return x.name === person.name; })) {
      return { ok: false, msg: '该干部的处分建议已在上级审议中' };
    }
    p.ap -= 1;
    const owner = PERM.ownerOf(person);
    const to = owner === '市管' ? '市委组织部' : '省委组织部';
    Q.push({
      name: person.name, title: person.title, lv: person.level || '',
      rel: person.rel, owner: owner, to: to,
      submitted: (g.year || 2024) + '/' + (g.month || 1), months: 0,
    });
    if (g.news) g.news.unshift({
      t: '你向' + to + '提交对' + person.name + '（' + person.title + '）的处分建议',
      date: (g.year || '') + '/' + (g.month || ''),
      eff: '已列上会 · 下周研究', effColor: '#8a6a33', kind: 'info',
    });
    return { ok: true, msg: '建议已提交，' + to + '将在下周会上研究' };
  };

  /* 每周推进：罢免案表决 + 处分建议上会 */
  PERM.tickMonth = function (g) {
    const news = [];

    /* ---- 1. 罢免案表决 ---- */
    const R = PERM.recalls(g);
    Object.keys(R).forEach(name => {
      const r = R[name];
      if (r.passed) return;
      r.months = (r.months || 0) + 1;
      if (r.months >= 1) {
        const need = Math.ceil(r.total / 2);
        const yes = need + Math.floor(Math.random() * 3);
        r.votes = Math.min(r.total, yes);
        r.passed = r.votes >= need;
        r.at = g.year + '/' + g.month;
        if (r.passed) {
          news.push({ t: '人大常委会表决通过：罢免' + name + '的职务（' + r.votes + '/' + r.total + ' 票赞成）',
            date: r.at, eff: '可以开除公职了', effColor: '#3f7d5c', kind: 'info' });
        } else {
          news.push({ t: '人大常委会未通过罢免' + name + '的议案（' + r.votes + '/' + r.total + ' 票赞成）',
            date: r.at, eff: '罢免失败 · 可重新提交', effColor: '#a5463e', kind: 'bad' });
          delete R[name];
        }
      }
    });

    /* ---- 2. 处分建议上会（一次会议议一件） ---- */
    const Q = PERM.suggestions(g);
    if (Q.length) {
      const it = Q.shift();
      const rs = window.PL && PL.roster(g);
      const person = rs ? rs.list.find(x => x.name === it.name) : null;
      const roll = Math.random();
      if (roll < 0.30) {
        news.push({ t: it.to + '召开务虚会，研究对' + it.name + '（' + it.title + '）的处分建议',
          date: g.year + '/' + g.month, eff: '未通过 · 建议不予采纳', effColor: '#8a8a94', kind: 'info' });
      } else if (roll < 0.70) {
        if (person) {
          const oldT = person.title, oldLv = person.lv;
          person.lv = Math.max(0, (person.lv || 1) - 1);
          const pool = (window.JOBPOOL && JOBPOOL.titlesFor) ? JOBPOOL.titlesFor(person.lv, (g.player.position || {}).county || '') : [];
          person.title = pool.length ? pool[Math.floor(Math.random() * pool.length)] : oldT;
          if (window.AP) AP.push(g, '降', it.name, oldT, person.title);
          news.push({ t: it.to + '研究决定：' + it.name + '因' + oldT + '问题被降职',
            date: g.year + '/' + g.month, eff: oldT + ' → ' + person.title + '（降一级）', effColor: '#a5463e', kind: 'bad' });
          if (window.PERSON && oldT !== person.title) PERSON.vacate(g, oldT, { name: it.name, level: it.lv });
        } else {
          news.push({ t: it.to + '研究决定：' + it.name + '被降职', date: g.year + '/' + g.month,
            eff: '降一级', effColor: '#a5463e', kind: 'bad' });
        }
      } else {
        if (person && rs) {
          const idx = rs.list.indexOf(person);
          if (idx >= 0) rs.list.splice(idx, 1);
          g.player.enemies = g.player.enemies || [];
          g.player.enemies.push({ name: person.name, at: g.year + '/' + g.month, reason: '被处分建议免职' });
        }
        if (window.PERSON) PERSON.vacate(g, it.title, { name: it.name, level: it.lv });
        if (window.AP) AP.push(g, '免', it.name, it.title, '免职');
        news.push({ t: it.to + '研究决定：免去' + it.name + '的' + it.title + '职务',
          date: g.year + '/' + g.month, eff: '免职 · 岗位空缺', effColor: '#8b2020', kind: 'bad' });
      }
    }

    if (news.length && g.news) news.forEach(n => g.news.unshift(n));
    return news;
  };

  /* ---------------- 渲染：权限说明 ---------------- */
  window.renderPermNotice = function (g, person) {
    const res = PERM.check(g, person);
    if (res.pass) {
      return '<div style="background:#f0f8f2;border:1px solid #c8e0cf;border-radius:7px;padding:7px 10px;font-size:11px;color:#3f7d5c;margin:6px 0">' +
        '✓ 三道判定已通过，可以免职</div>';
    }
    const stageNames = ['', '职级压制', '管辖权限', '身份限制'];
    const col = res.stage === 1 ? '#a5463e' : res.stage === 2 ? '#8a6a33' : '#6b477f';
    return '<div style="background:#fdf6f4;border:1px solid #e8cfc9;border-radius:7px;padding:8px 10px;margin:6px 0">' +
      '<div style="font-size:11px;font-weight:700;color:' + col + '">第' + ['','一','二','三'][res.stage] + '道判定【' +
        stageNames[res.stage] + '】未通过</div>' +
      '<div style="font-size:10.5px;color:#5c5268;margin-top:4px;white-space:pre-wrap;line-height:1.6">' + res.hint + '</div>' +
      '</div>';
  };
})();
</script>
<script>/* ============================================================
   治理者之路 · 纪律审查
   列出所有风险行为（时间 / 类别 / 事项 / 风险值）
   ============================================================ */
(function () {
  'use strict';
  const DIS = {};
  window.renderDiscipline = function (g) {
    const p = g.player;
    const log = (p.riskLog || []).slice().sort((a, b) => (a.date < b.date ? 1 : -1));
    const clean = Math.round(p.attrs ? p.attrs.clean : 0);
    const total = window.RISK ? RISK.get(g) : 0;
    const base = Math.max(0, Math.round(55 - clean));

    /* 风险等级 */
    const lvl = total >= 80 ? { n: '极危险', c: '#8b2020', d: '随时可能被双开' }
             : total >= 70 ? { n: '高危', c: '#a5463e', d: '会被约谈、进入审查' }
             : total > 60 ? { n: '警戒', c: '#b8801e', d: '纪检部门已掌握线索' }
             : total > 40 ? { n: '偏高', c: '#8a6a33', d: '注意言行' }
             : { n: '安全', c: '#3f7d5c', d: '暂时没人动你' };

    /* 类别中文 + 颜色 */
    const KIND = {
      gift: ['收受礼品', '#a5463e'], house: ['违规置产', '#a5463e'],
      nepotism: ['任人唯亲', '#8a6a33'], fire: ['违规用人', '#b8801e'],
      promoteOwn: ['提拔亲信', '#8a6a33'], drink: ['违规吃喝', '#7a7186'],
      travel: ['公款旅游', '#7a7186'], car: ['公车私用', '#7a7186'],
      bribe: ['权钱交易', '#8b2020'], land: ['土地违规', '#a5463e'],
      project: ['工程插手', '#a5463e'], casino: ['涉赌', '#8b2020'],
      other: ['其他', '#7a7186'],
    };
    const kindOf = k => KIND[k] || [k || '其他', '#7a7186'];

    /* 按类别汇总 */
    const byKind = {};
    log.forEach(x => {
      const k = x.kind || 'other';
      byKind[k] = byKind[k] || { n: 0, v: 0 };
      byKind[k].n++;
      byKind[k].v += x.v || 0;
    });
    const kindRows = Object.keys(byKind).sort((a, b) => byKind[b].v - byKind[a].v);

    let h = '<div class="card">' +
      '<div class="ch"><span class="ic">纪</span><h3>纪律审查</h3>' +
        '<span class="tail">' + (g.year || '') + '年' + (g.month || '') + '月 · 廉洁 ' + clean + '</span></div>';

    /* 总览 */
    h += '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">' +
      '<div style="flex:1;min-width:110px;border:1px solid ' + lvl.c + '44;border-radius:9px;padding:9px 12px;background:' + lvl.c + '0d">' +
        '<div class="sm dim" style="font-size:10px">当前风险</div>' +
        '<div style="font-size:24px;font-weight:700;color:' + lvl.c + '">' + total + '</div>' +
        '<div style="font-size:10px;color:' + lvl.c + '">' + lvl.n + ' · ' + lvl.d + '</div></div>' +
      '<div style="flex:1;min-width:100px;border:1px solid #e6dcc8;border-radius:9px;padding:9px 12px;background:#fffdf8">' +
        '<div class="sm dim" style="font-size:10px">廉洁</div>' +
        '<div style="font-size:24px;font-weight:700;color:' + (clean >= 70 ? '#3f7d5c' : clean >= 40 ? '#8a6a33' : '#a5463e') + '">' + clean + '</div>' +
        '<div style="font-size:10px;color:#a89878">基础风险 ' + base + '</div></div>' +
      '<div style="flex:1;min-width:100px;border:1px solid #e6dcc8;border-radius:9px;padding:9px 12px;background:#fffdf8">' +
        '<div class="sm dim" style="font-size:10px">风险事项</div>' +
        '<div style="font-size:24px;font-weight:700;color:#5b3b6f">' + log.length + '</div>' +
        '<div style="font-size:10px;color:#a89878">共 ' + kindRows.length + ' 类</div></div>' +
      '</div>';

    /* 处置线 */
    h += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;font-size:10.5px">' +
      [['> 60', '进入审查', '#b8801e'], ['≥ 70', '被约谈', '#a5463e'], ['≥ 80', '双开+移交司法', '#8b2020']]
        .map(x => '<span style="border:1px solid ' + x[2] + '55;border-radius:6px;padding:3px 9px;background:' + x[2] + '0d;color:' + x[2] + '">' +
          '<b>' + x[0] + '</b> ' + x[1] + '</span>').join('') + '</div>';

    /* 按类别汇总 */
    if (kindRows.length) {
      h += '<div class="sm dim" style="margin-bottom:5px;font-size:10.5px">按类别</div>' +
        '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">' +
        kindRows.map(k => {
          const kn = kindOf(k);
          return '<span style="border:1px solid ' + kn[1] + '55;border-radius:6px;padding:3px 9px;font-size:10.5px;background:' + kn[1] + '0d;color:' + kn[1] + '">' +
            kn[0] + ' <b>' + byKind[k].n + '</b> 次 · +' + byKind[k].v + '</span>';
        }).join('') + '</div>';
    }

    /* 待上会的处分建议 */
    const Q = (window.PERM && PERM.suggestions) ? PERM.suggestions(g) : [];
    if (Q.length) {
      h += '<div class="sm dim" style="margin-bottom:5px;font-size:10.5px">已提交、等待上会（' + Q.length + ' 件）</div>' +
        Q.map(x => '<div style="display:flex;align-items:center;gap:7px;padding:5px 9px;font-size:11.5px;' +
          'border:1px solid #e0d2a8;border-radius:6px;background:#fffdf5;margin-bottom:4px">' +
          '<span style="font-size:9.5px;background:#fdf4e4;color:#8a6a33;border-radius:3px;padding:1px 5px">待审</span>' +
          '<b>' + x.name + '</b>' +
          '<span class="sm dim" style="font-size:10.5px">' + x.title + '</span>' +
          '<span style="margin-left:auto;font-size:10px;color:#8a6a33">' + x.to + ' · ' + x.submitted + ' 提交</span>' +
          '</div>').join('') +
        '<div class="sm dim" style="font-size:10px;margin-bottom:10px">每推进一周，上级会开一次会研究一件。结果见「最新动态」。</div>';
    }

    /* 明细台账 */
    h += '<div class="sm dim" style="margin-bottom:5px;font-size:10.5px">风险行为台账（时间倒序）</div>';
    if (!log.length) {
      h += '<div style="padding:14px;text-align:center;color:#a89878;font-size:11.5px;border:1px dashed #e6dcc8;border-radius:8px">' +
        '暂时没什么把柄在别人手上。</div>';
    } else {
      h += '<div style="display:flex;padding:5px 9px;font-size:10px;color:#8a8a94;border-bottom:1px solid #e6dcc8">' +
        '<span style="width:60px">时间</span><span style="width:66px">类别</span>' +
        '<span style="flex:1">事项</span><span style="width:44px;text-align:right">风险</span></div>' +
        '<div style="max-height:48vh;overflow:auto">' + log.map((x, i) => {
          const kn = kindOf(x.kind);
          const v = x.v || 0;
          return '<div style="display:flex;align-items:center;padding:5px 9px;font-size:11.5px;' +
            'border-bottom:1px dotted rgba(91,59,111,.1);' + (i % 2 ? 'background:#fdfbf7;' : '') + '">' +
            '<span style="width:60px;color:#8a8a94;font-size:10.5px">' + (x.date || '—') + '</span>' +
            '<span style="width:66px"><span style="font-size:9.5px;border-radius:3px;padding:1px 5px;' +
              'background:' + kn[1] + '18;color:' + kn[1] + '">' + kn[0] + '</span></span>' +
            '<span style="flex:1;color:#3a3548">' + (x.note || '（未记录事项）') + '</span>' +
            '<span style="width:44px;text-align:right;font-weight:600;color:' + (v >= 20 ? '#8b2020' : v >= 10 ? '#a5463e' : '#8a6a33') + '">+' + v + '</span>' +
            '</div>';
        }).join('') + '</div>';
    }

    /* ---- 降低风险 ---- */
    const ap = p.ap || 0;
    const nw = p.netWorth || 0;
    const ops = [];

    /* 1. 打点关系：花钱消掉最重的一条 */
    const topItem = log.slice().sort(function (a, b) { return (b.v || 0) - (a.v || 0); })[0];
    const cost1 = 30;
    ops.push({
      k: 'bribe', n: '打点关系',
      d: topItem ? '花 ' + cost1 + ' 万，消掉最重的一条：' + (topItem.note || '') + '（+' + (topItem.v || 0) + '）' : '目前没有可消的记录',
      ok: !!topItem && nw >= cost1, cost: cost1,
      tip: !topItem ? '无记录' : nw < cost1 ? '钱不够' : '',
      color: '#8b2020',
    });

    /* 2. 专项整治：花行动点，降一条风险 */
    ops.push({
      k: 'campaign', n: '专项整治',
      d: '花 2 行动点，本季度开展专项整治，随机消掉一条（清退违纪资金、追缴资产）',
      ok: ap >= 2, cost: '2 行动点',
      tip: ap < 2 ? '行动点不够' : '', color: '#b8801e',
    });

    /* 3. 提高廉洁：花行动点，廉洁 +8 */
    ops.push({
      k: 'clean', n: '提高廉洁',
      d: '花 3 行动点，集中学习、廉政家访，廉洁 +8（廉洁越高，基础风险越低）',
      ok: ap >= 3 && clean < 100, cost: '3 行动点',
      tip: ap < 3 ? '行动点不够' : clean >= 100 ? '已满分' : '', color: '#3f7d5c',
    });

    /* 4. 主动说明：风险 40-60 时可用 */
    ops.push({
      k: 'report', n: '主动向组织说明',
      d: '花 4 行动点，主动向纪检部门说明问题，风险 -12（仅在 40~65 时可用）',
      ok: ap >= 4 && total >= 40 && total <= 65, cost: '4 行动点',
      tip: ap < 4 ? '行动点不够' : total < 40 ? '风险较低，不必' : total > 65 ? '已过线，说明无效' : '',
      color: '#2b6cb0',
    });

    /* 5. 时间消磨：等满 6 个月 */
    const monthsToFade = 6;
    ops.push({
      k: 'fade', n: '时间消磨',
      d: '每过 6 个月，最早的一条风险记录自动淡出（不花钱、不花行动点）',
      ok: false, cost: '被动',
      tip: '推进 ' + monthsToFade + ' 周', color: '#7a7186',
    });

    h += '<div class="sm dim" style="margin:12px 0 5px;font-size:10.5px">降低风险</div>';
    h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:7px">' +
      ops.map(function (o) {
        const dis = !o.ok;
        return '<div style="border:1px solid ' + (dis ? '#e8e0d8' : o.color + '44') + ';border-radius:8px;padding:8px 10px;' +
          'background:' + (dis ? '#fdfcfa' : o.color + '08') + '">' +
          '<div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">' +
            '<b style="font-size:11.5px;color:' + (dis ? '#a89878' : o.color) + '">' + o.n + '</b>' +
            '<span style="margin-left:auto;font-size:9.5px;color:#a89878">' + o.cost + '</span>' +
          '</div>' +
          '<div style="font-size:10px;color:#8a8a94;line-height:1.5;margin-bottom:5px">' + o.d + '</div>' +
          (o.k === 'fade' ? '' :
            '<button data-riskop="' + o.k + '"' + (dis ? ' disabled' : '') + ' style="width:100%;padding:4px;border-radius:5px;' +
            'font-size:10.5px;cursor:' + (dis ? 'not-allowed' : 'pointer') + ';' +
            'background:' + (dis ? '#f4f1ec' : '#fff') + ';border:1px solid ' + (dis ? '#e8e0d8' : o.color + '66') + ';' +
            'color:' + (dis ? '#c0b8ac' : o.color) + '">' + (dis ? (o.tip || '不可用') : '执行') + '</button>') +
          '</div>';
      }).join('') + '</div>';

    /* 底注 */
    h += '<div class="sm dim" style="margin-top:10px;padding-top:8px;border-top:1px dashed #e6dcc8;font-size:10px;line-height:1.7">' +
      '风险 = 廉洁基础风险 ' + base + ' + 各事项累计。' +
      '「打点关系」可消掉最重的一条；专项整治每次降一点；每过 6 个月最早的一条会淡出。</div>';

    /* 绑定降风险按钮 */
    setTimeout(function () {
      document.querySelectorAll('[data-riskop]').forEach(function (b) {
        b.onclick = function () {
          const k = b.getAttribute('data-riskop');
          const g2 = window.G;
          const pp = g2.player;
          const log2 = pp.riskLog || [];
          let msg = '', ok = false;

          if (k === 'bribe') {
            const cost = 30;
            if (pp.netWorth < cost) { msg = '钱不够，需要 ' + cost + ' 万'; }
            else {
              const gone = window.RISK && RISK.clearTop(g2);
              if (gone) {
                pp.netWorth = Math.round((pp.netWorth - cost) * 10) / 10;
                msg = '已花 ' + cost + ' 万打点，消掉：' + (gone.note || '') + '（+' + gone.v + '）';
                ok = true;
              } else msg = '没有可消的记录';
            }
          } else if (k === 'campaign') {
            if (pp.ap < 2) msg = '行动点不够';
            else {
              pp.ap -= 2;
              const gone = window.RISK && RISK.clearSome(g2, 0.35);
              const after = (pp.riskLog || []).length;
              msg = '专项整治完成，风险记录从 ' + log2.length + ' 条降到 ' + after + ' 条';
              ok = true;
            }
          } else if (k === 'clean') {
            if (pp.ap < 3) msg = '行动点不够';
            else {
              pp.ap -= 3;
              pp.attrs.clean = Math.min(100, (pp.attrs.clean || 0) + 8);
              msg = '集中学习 + 廉政家访，廉洁 +8（现 ' + Math.round(pp.attrs.clean) + '）';
              ok = true;
            }
          } else if (k === 'report') {
            if (pp.ap < 4) msg = '行动点不够';
            else {
              pp.ap -= 4;
              /* 风险 -12：消掉最小几条，凑够 12 */
              const lg = (pp.riskLog || []).slice().sort(function (a, b) { return (a.v || 0) - (b.v || 0); });
              let need = 12;
              while (need > 0 && lg.length) { const it = lg.shift(); need -= (it.v || 0); const idx = pp.riskLog.indexOf(it); if (idx >= 0) pp.riskLog.splice(idx, 1); }
              msg = '主动说明情况，风险降低，当前 ' + (window.RISK ? RISK.get(g2) : '?');
              ok = true;
            }
          }

          if (window.__toast) window.__toast(msg);
          if (ok) {
            if (window.__save) window.__save();
            if (window.__render) window.__render();
          }
        };
      });
    }, 60);

    return h + '</div>';
  };
})();
</script>
<script>/* ============================================================
   治理者之路 · 任免通知 + 派系
   任免通知：记录全省人事变动（含自己）
   派系：按派系聚合人物，显示每个派系的人数和骨干
   ============================================================ */
(function () {
  'use strict';

  /* ---------------- 任免通知 ---------------- */
  /* 数据结构：g.__appoints = [{ no, date, action, name, from, to, kind }] */
  const AP = {};
  window.AP = AP;

  AP.list = function (g) {
    if (!g.__appoints) g.__appoints = [];
    return g.__appoints;
  };

  /* 记一条任免 */
  AP.push = function (g, act, name, from, to, kind) {
    const L = AP.list(g);
    const c = window.ADM ? ADM.char((g.player.position || {}).county || '') : '区';
    const seq = L.length + 1;
    L.unshift({
      no: c + '组干〔' + (g.year || 2024) + '〕' + seq + '号',
      date: (g.year || '') + '/' + (g.month || ''),
      act: act,          /* 任 / 免 / 调 / 降 */
      name: name,
      from: from || '',
      to: to || '',
      kind: kind || 'info',
    });
  };

  /* 渲染任免通知 */
  window.renderAppoint = function (g) {
    const L = AP.list(g);
    const pos = g.player.position || {};
    const prov = pos.province || '';

    const ACT = {
      '任': { n: '任命', c: '#3f7d5c' },
      '免': { n: '免职', c: '#a5463e' },
      '调': { n: '调任', c: '#2b6cb0' },
      '降': { n: '降职', c: '#8b2020' },
      '升': { n: '提拔', c: '#3f7d5c' },
    };

    let h = '<div class="card">' +
      '<div class="ch"><span class="ic">免</span><h3>任免通知</h3>' +
        '<span class="tail">' + prov + ' · 共 ' + L.length + ' 条</span></div>';

    if (!L.length) {
      h += '<div style="padding:20px;text-align:center;color:#a89878;font-size:12px;border:1px dashed #e6dcc8;border-radius:8px">' +
        '本省暂无人事变动。<br><span style="font-size:10.5px">你或你管辖的干部被提拔、平调、免职时，这里会留档。</span></div>';
    } else {
      h += '<div style="max-height:66vh;overflow:auto">' + L.map(function (x, i) {
        const a = ACT[x.act] || ACT['任'];
        return '<div style="display:flex;gap:9px;padding:8px 6px;border-bottom:1px dotted rgba(91,59,111,.12);' +
          (i === 0 ? 'background:#fdfbf7;' : '') + '">' +
          '<div style="flex:none;width:118px">' +
            '<div style="font-size:10px;color:#8a8a94;font-family:monospace">' + x.no + '</div>' +
            '<div style="font-size:10px;color:#b0a288;margin-top:2px">' + x.date + '</div>' +
          '</div>' +
          '<div style="flex:1;min-width:0">' +
            '<div style="display:flex;align-items:center;gap:6px;margin-bottom:2px">' +
              '<span style="font-size:9.5px;border-radius:3px;padding:1px 6px;background:' + a.c + '18;color:' + a.c + '">' + a.n + '</span>' +
              '<b data-appname="' + encodeURIComponent(x.name) + '" data-apptitle="' + encodeURIComponent(x.to || '') + '" ' +
              'style="font-size:12px;color:#5b3b6f;cursor:pointer;border-bottom:1px dashed #c9b8d4">' + x.name + '</b>' +
            '</div>' +
            '<div style="font-size:11px;color:#5c5268">' +
              (x.from ? '<span style="color:#a89878">' + x.from + '</span> → ' : '') +
              '<b style="color:#5b3b6f">' + x.to + '</b></div>' +
          '</div></div>';
      }).join('') + '</div>';
    }

    h += '<div class="sm dim" style="margin-top:10px;padding-top:8px;border-top:1px dashed #e6dcc8;font-size:10px">' +
      '包括你本人、你提拔/平调/免职的干部，以及上级处分决定。' +
      '（省级任免由省委组织部办理，此处记录本地口径）</div>';
    return h + '</div>';
  };

  /* 点人看档案 */
  AP.bind = function (g) {
    document.querySelectorAll('[data-appname]').forEach(function (el) {
      el.onclick = function () {
        const name = decodeURIComponent(el.getAttribute('data-appname') || '');
        const title = decodeURIComponent(el.getAttribute('data-apptitle') || '');
        if (!name || !window.openPersonCard) return;
        const PL = window.PL;
        let person = PL ? PL.roster(g).list.find(function (x) { return x.name === name; }) : null;
        if (!person) {
          /* 不在名单 → 造一份（只读展示） */
          const lvNum = function (t) {
            const s = String(t || '');

      rs.list.forEach(function (p) {

            '<span style="margin-left:auto;font-size:10px;color:#8a8a94">' + cnt + ' 人</span>' +
          '</div>' +
          '<div style="padding:6px 9px">' +
            '<div class="sm dim" style="font-size:10px;margin-bottom:5px">' + d.d + '</div>' +
            gg.members.slice(0, 6).map(function (m) {
              return '<div style="display:flex;align-items:center;gap:5px;padding:2px 0;font-size:10.5px">' +
                (window.AV ? AV.box(m.name, { size: 16 }) : '') +
                '<span data-appname="' + encodeURIComponent(m.name) + '" data-apptitle="' + encodeURIComponent(m.title || '') + '" ' +

                (m.isPlayer ? '<span style="font-size:8.5px;background:#fdf4e4;color:#8a6a33;border-radius:3px;padding:0 3px">你</span>' : '') +
                '</div>';
            }).join('') +
            (cnt > 6 ? '<div class="sm dim" style="font-size:9.5px;margin-top:3px">…还有 ' + (cnt - 6) + ' 人</div>' : '') +
          '</div></div>';
      }).join('') + '</div>';

    setTimeout(function () { if (AP.bind) AP.bind(g); }, 60);
    h += '<div class="sm dim" style="margin-top:10px;padding-top:8px;border-top:1px dashed #e6dcc8;font-size:10.5px;line-height:1.7">' +

      '免职位高者会得罪整个派系，反噬风险累积在“人情往来”里。</div>';

    return h + '</div>';
  };
})();

  /* 格式：FY-XXXX-XXXX-XXXX，用一次就失效 */
  /* 激活码：{ code, days } —— days 为可用天数（3 个月 = 90 天） */
  const CODE_LIST = [
    ['FY-27-ZF5K-RMLB', 90],
    ['FY-27-H5Q3-SKM3', 90],
    ['FY-27-2BJ3-GACP', 90],

    ['FY-27-2PSX-UHW4', 90],
    ['FY-27-KVPZ-XGT8', 90],
    ['FY-27-9MQW-NBUD', 90],
    ['FY-27-7GBZ-J5C4', 90],
    ['FY-27-Q73S-U356', 90],
    ['FY-27-UAMM-5A9Z', 90],

    ['FY-27-E3C6-RART', 90],
    ['FY-27-KT8L-ZBYX', 90],
    ['FY-27-46LM-AT67', 90],
    ['FY-27-UWF5-BGTM', 90],
    ['FY-27-ZN6L-A84U', 90],
    ['FY-27-3ZZK-TEBN', 90],
  ];
  const CODES = CODE_LIST.map(function (x) { return x[0]; });
  const CODE_DAYS = {};
  CODE_LIST.forEach(function (x) { CODE_DAYS[x[0]] = x[1]; });
  const LS_USEDCODES = 'fy_used_codes_v1';

  const A = {};
  window.AUTH = A;

  /* ---------- 存储 ---------- */
  function rd(k, def) {
    try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; }
  }
  function wr(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }

  A.users = function () { return rd(LS_USERS, {}); };
  A.usedCodes = function () { return rd(LS_USEDCODES, []); };

  A.current = function () {
    const s = rd(LS_SESSION, null);
    if (!s) return null;
    const u = A.users()[s.u];
    if (!u) return null;
    return { user: s.u, nick: u.nick, since: u.since, expireAt: u.expireAt || 0, days: u.days || 0 };
  };

  /* ---------- 密码哈希（简单不可逆，够本地用） ---------- */
  function hash(pw, salt) {
    let h = 2166136261;
    const s = 'fy|' + salt + '|' + pw + '|' + salt;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    let h2 = 5381;
    for (let i = s.length - 1; i >= 0; i--) { h2 = ((h2 << 5) + h2) + s.charCodeAt(i); h2 |= 0; }
    return (h >>> 0).toString(36) + (h2 >>> 0).toString(36);

  function mkSalt() { return Math.random().toString(36).slice(2, 10); }

  A.checkUser = function (u) {

    if (!/^[a-zA-Z0-9_]{4,20}$/.test(u)) return '账号需 4~20 位字母、数字或下划线';
    return '';
  };
  A.checkPass = function (p) {
    if (!p) return '请输入密码';
    if (p.length < 6) return '密码至少 6 位';
    return '';
  };

  const LS_CODE_OWNER = 'fy_code_owner_v1';
  A.codeOwner = function () { return rd(LS_CODE_OWNER, {}); };
  A.ownerOfCode = function (code) {
    const m = A.codeOwner();
    return m[String(code || '').toUpperCase()] || null;
  };
  A.bindCode = function (code, user) {
    const m = A.codeOwner();
    m[String(code || '').toUpperCase()] = user;
    wr(LS_CODE_OWNER, m);
    /* 同时写进「已用」列表 */
    const used = A.usedCodes();
    if (used.indexOf(code) < 0) { used.push(code); wr(LS_USEDCODES, used); }
  };

  /* ---------- 注册 ---------- */
  A.register = function (u, p, nick, code) {
    const e1 = A.checkUser(u); if (e1) return { ok: false, msg: e1 };
    const e2 = A.checkPass(p); if (e2) return { ok: false, msg: e2 };
    const users = A.users();
    if (users[u]) return { ok: false, msg: '这个账号已经注册过了' };
    /* 校验激活码 */
    const c = String(code || '').trim().toUpperCase();
    if (!c) return { ok: false, msg: '请输入激活码' };
    if (CODES.indexOf(c) < 0) return { ok: false, msg: '激活码无效' };
    /* 校验是否已被使用（本地记录 + 归属记录） */
    const used = A.usedCodes();
    const owner = A.ownerOfCode(c);
    if (owner && owner !== u) {
      return { ok: false, msg: '这个激活码已被其他账号使用' };
    }
    if (used.indexOf(c) >= 0 && !owner) {
      return { ok: false, msg: '这个激活码已经被用过了' };
    }

    const salt = mkSalt();
    const days = CODE_DAYS[c] || 90;
    const now = Date.now();
    users[u] = {
      nick: (nick || u).slice(0, 12),
      salt: salt,
      pw: hash(p, salt),
      since: now,
      code: c,
      activatedAt: now,
      expireAt: now + days * 24 * 3600 * 1000,
      days: days,
    };
    wr(LS_USERS, users);
    A.bindCode(c, u);
    wr(LS_SESSION, { u: u, at: Date.now() });
    return { ok: true, msg: '注册成功，开始你的仕途吧' };
  };

  /* ---------- 登录 ---------- */
  A.login = function (u, p) {
    const e1 = A.checkUser(u); if (e1) return { ok: false, msg: e1 };
    const users = A.users();
    const acc = users[u];
    if (!acc) return { ok: false, msg: '账号不存在，请先注册' };
    if (acc.pw !== hash(p, acc.salt)) return { ok: false, msg: '密码不对' };
    /* 检查有效期 */
    if (acc.expireAt && Date.now() > acc.expireAt) {
      return { ok: false, msg: '账号已到期（' + fmtDate(acc.expireAt) + '），请联系 q群 112486331 续期' };
    }
    wr(LS_SESSION, { u: u, at: Date.now() });
    return { ok: true, msg: '欢迎回来，' + acc.nick };
  };

  function fmtDate(ts) {
    const d = new Date(ts);
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  A.fmtDate = fmtDate;

  A.remainDays = function (u) {
    const acc = A.users()[u];
    if (!acc || !acc.expireAt) return null;
    const ms = acc.expireAt - Date.now();
    return ms > 0 ? Math.ceil(ms / 86400000) : 0;
  };

  A.logout = function () { try { localStorage.removeItem(LS_SESSION); } catch (e) {} };

  /* ---------- 存档 ---------- */
  /* 存档 key 必须与 fy-game.js 一致：fy_v2_save_<账号> */
  A.saveKey = function (u) { return 'fy_v2_save_' + (u || (A.current() || {}).user || 'guest'); };
  A.loadSave = function (u) { return rd(A.saveKey(u), null); };
  A.writeSave = function (u, obj) { return wr(A.saveKey(u), obj); };
  A.clearSave = function (u) { try { localStorage.removeItem(A.saveKey(u)); } catch (e) {} };

  /* 导出 / 导入 */
  A.exportSave = function (u) {
    const s = A.loadSave(u);
    if (!s) return null;
    return JSON.stringify({ v: 1, user: u, at: new Date().toISOString(), data: s }, null, 2);
  };
  /* 找回导入前的自动备份 */
  A.restoreBackup = function (u) {
    const bk = localStorage.getItem('fy_backup_before_import_' + u);
    if (!bk) return { ok: false, msg: '没有备份' };
    const r = A.importSave(u, bk);
    if (r.ok) location.reload();

  };

    try {

      A.writeSave(u, o.data);
      return { ok: true, msg: '存档已导入' };

      const el = document.getElementById('authExpire');
      if (!el) return;
      const cur = A.current();

      const left = A.remainDays(cur.user);
      if (left === 0) {
        el.style.color = '#b03a34';
        el.textContent = '账号已于 ' + fmtDate(cur.expireAt) + ' 到期，请联系 q群 112486331 续期';

    const err = document.getElementById('auErr');
    const isLogin = !!document.querySelector('[data-authtab="login"].on');

    const submit = function () {
      const u = (document.getElementById('auUser') || {}).value || '';
      const p = (document.getElementById('auPass') || {}).value || '';

      if (isLogin) {

        const code = (document.getElementById('auCode') || {}).value || '';

      if (onOK) onOK(r);

/* ============================================================

CAR.paint = function (box, model, plate, opts) {
  if (!box) return;
  opts = opts || {};
  box.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:relative;width:100%;height:100%;overflow:hidden;border-radius:inherit';

  const img = new Image();
  img.alt = model.t;
  img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block';
  wrap.appendChild(img);

  /* 车牌（右下角叠加，真实蓝底白字） */
  const plateEl = document.createElement('div');
  const ph = opts.small ? 22 : 30;
  plateEl.style.cssText = [
    'position:absolute', 'right:8px', 'bottom:8px',
    'height:' + ph + 'px', 'padding:0 6px',
    'background:#0a5bd3', 'border:2px solid #fff', 'border-radius:4px',
    'display:flex', 'align-items:center', 'gap:3px',
    'box-shadow:0 2px 6px rgba(0,0,0,.45)',
    'font-family:Arial,sans-serif', 'font-weight:700', 'color:#fff',
    'font-size:' + Math.round(ph * 0.58) + 'px', 'letter-spacing:1px',
    'white-space:nowrap', 'line-height:1'
  ].join(';');
  const has = plate && plate[0] !== '—';
  if (has) {
    plateEl.innerHTML = '<span style="font-family:\'Microsoft YaHei\',sans-serif">' + plate.slice(0, 1) + '</span>' +
      '<span>' + plate.slice(1, 2) + '</span>' +
      '<span style="letter-spacing:2px">' + plate.slice(2) + '</span>';
  } else {
    plateEl.style.background = '#5a6570';
    plateEl.textContent = '未上牌';
    plateEl.style.fontFamily = '"Microsoft YaHei",sans-serif';
  }
  wrap.appendChild(plateEl);

  /* 车型角标 */
  const tag = document.createElement('div');
  tag.style.cssText = 'position:absolute;left:8px;top:8px;padding:2px 8px;border-radius:6px;' +
    'background:rgba(18,24,32,.62);color:#fff;font-size:' + (opts.small ? 10 : 11.5) + 'px;' +
    'font-family:"Microsoft YaHei",sans-serif;letter-spacing:.5px';
  tag.textContent = model.t;
  wrap.appendChild(tag);

  img.onerror = () => {
    /* 没有照片就画一张渲染图 */
    img.remove();
    const cv = document.createElement('canvas');
    cv.style.cssText = 'width:100%;height:100%;display:block';
    wrap.insertBefore(cv, wrap.firstChild);
    CAR.renderToCanvas(cv, model, plate, opts);
  };
  /* 单文件版：优先用内嵌 base64，其次才是相对路径 */
  img.src = (window.__CAR_IMG && window.__CAR_IMG[model.id]) || ('cars/' + model.id + '.jpg');

  box.appendChild(wrap);
};

/* 备用：纯渲染图（照片缺失时） */
CAR.renderToCanvas = function (cv, model, plate, opts) {
  const W = cv.clientWidth || cv.parentElement.clientWidth || 480;
  const H = cv.clientHeight || cv.parentElement.clientHeight || 300;
  if (!W || !H) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const bg = c.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#f6f9fc'); bg.addColorStop(1, '#c6d1db');
  c.fillStyle = bg; c.fillRect(0, 0, W, H);
  const gy = H * .82, bw = W * .8, bx = (W - bw) / 2, bodyH = H * .3;
  c.fillStyle = model.color || '#222';
  c.beginPath();
  c.moveTo(bx, gy);
  c.quadraticCurveTo(bx + bw * .02, gy - bodyH * 1.4, bx + bw * .16, gy - bodyH * 1.5);
  c.lineTo(bx + bw * .84, gy - bodyH * 1.5);
  c.quadraticCurveTo(bx + bw * .98, gy - bodyH * 1.4, bx + bw, gy);
  c.closePath(); c.fill();
  c.fillStyle = '#8fb5d6';
  c.fillRect(bx + bw * .2, gy - bodyH * 2.1, bw * .6, bodyH * .6);
  c.fillStyle = '#111';
  [bx + bw * .2, bx + bw * .78].forEach(x => { c.beginPath(); c.arc(x, gy, H * .1, 0, Math.PI * 2); c.fill(); });
  c.fillStyle = '#0a5bd3';
  c.fillRect(bx + bw * .08, gy - H * .12, 90, 26);
  c.fillStyle = '#fff';
  c.font = 'bold 16px Arial';
  c.fillText(plate || '未上牌', bx + bw * .08 + 8, gy - H * .12 + 19);
};

};

EX.MAKE_LETTERS = 'ABCDEFGHJKLMNPQRSTUVWXYZ';   /* 不含 I、O */

EX.genPlate = function (g, rankLevel, isLeader, usedSet) {

  const cityLetter = pos.city ? (CAR.plateLetter(pos.province, pos.city) || 'A') : 'A';
  const used = usedSet || new Set();
  let plate;
  let guard = 0;
  do {
    guard++;
    if (guard > 400) { plate = prov + cityLetter + String(irnd(10000, 99999)); break; }

    if (isLeader && rankLevel >= 8) {
      plate = prov + cityLetter + String(irnd(1, 9)).padStart(5, '0');
    } else if (rankLevel >= 7) {
      plate = prov + cityLetter + String(irnd(10, 99)).padStart(5, '0');
    } else if (rankLevel >= 5) {
      plate = prov + cityLetter + String(irnd(100, 999)).padStart(5, '0');
    } else if (rankLevel >= 3) {
      plate = prov + cityLetter + String(irnd(1000, 9999));
    } else {
      /* 科级以下：完全是随机五位，还可能带字母（真实情况） */
      const useLetter = Math.random() < 0.55;
      if (useLetter) {
        const a = EX.MAKE_LETTERS[irnd(0, EX.MAKE_LETTERS.length - 1)];
        plate = prov + cityLetter + a + String(irnd(1000, 9999)).slice(0, 4);
      } else {
        plate = prov + cityLetter + String(irnd(10000, 99999));
      }
    }
  } while (used.has(plate));
  used.add(plate);
  return plate;
};

  { key: 'same',   name: '本机关',       weight: 30 },
  { key: 'county', name: '本县区其他部门', weight: 22 },

  { key: 'otherprov', name: '外省交流任职', weight: 8 },
  { key: 'capital', name: '省直机关',     weight: 4 },
];

EX.pickLocKind = function (level) {
  /* 低职级只能本地；职级越高跨区机会越多 */
  const pool = EX.LOC_LEVELS.filter(l => {
    if (level <= 1) return ['same', 'county'].includes(l.key);
    if (level <= 3) return ['same', 'county', 'city'].includes(l.key);
    if (level <= 5) return ['same', 'county', 'city', 'provcity'].includes(l.key);
    return true;
  });
  const tot = pool.reduce((a, b) => a + b.weight, 0);
  let x = Math.random() * tot;
  for (const l of pool) { x -= l.weight; if (x <= 0) return l.key; }
  return 'same';
};

EX.randomProvinceOther = function (cur) {
  const list = FY.PROVINCES.map(p => p.n).filter(n => n !== cur);
  return list[irnd(0, list.length - 1)];
};
EX.randomCityOf = function (prov, exclude) {
  const cs = (FY.cityMap[prov] || [prov]).filter(c => c !== exclude);
  return cs.length ? cs[irnd(0, cs.length - 1)] : prov;
};
EX.randomAreaOf = function (prov, city, exclude) {
  const as = (FY.areaMap[prov + '|' + city] || [city]).filter(a => a !== exclude);
  return as.length ? as[irnd(0, as.length - 1)] : city;
};

  '党校': '党校', '融媒体': '融媒体中心', '法院': '人民法院', '检察院': '人民检察院',

<script>/* ============================================================
   治理者之路 · 职位池生成器：把 JOBS.POOL 模板渲染成可选岗位（含跨区）
   ============================================================ */
(function () {
  'use strict';

  function safeArr(a, d) { return (a && a.length) ? a : d; }

  /* 生成某职级的可选岗位 */
  window.buildJobPool = function (g, level) {
    const pool = (JOBS.POOL[level] || JOBS.POOL[9] || []);
    const p = g.player;
    const pos = p.position || {};
    const curProv = pos.province || '湖南省';
    const curCity = pos.city || '长沙市';
    const curArea = pos.county || '芙蓉区';

    /* 随机挑 12-18 个，保证「本机关」至少一个 */
    const picked = [];
    const used = new Set();
    const desired = Math.min(pool.length, 14 + Math.floor(Math.random() * 5));
    /* 本机关优先 */
    const same = pool.filter(x => x.org === '本机关');
    if (same.length) { picked.push(same[0]); used.add(same[0].t); }
    const rest = pool.filter(x => !used.has(x.t));
    for (let i = rest.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [rest[i], rest[j]] = [rest[j], rest[i]]; }
    for (const r of rest) {
      if (picked.length >= desired) break;
      picked.push(r);
    }

    const out = [];
    for (const j of picked) {
      let province = curProv, city = curCity, area = curArea;
      let orgName = j.org;
      let secName = j.sec === 'same' ? (pos.sec || '综合科') : j.sec;
      let label = JOBS.ORG_LABEL[j.org] || j.org;

      switch (j.org) {
        case '本机关':      break;
        case '乡镇':        orgName = area.replace(/(区|县|市|旗|林区)$/, '') + (area.endsWith('区') ? '街道' : '乡'); label = '街道乡镇'; break;
        case '街道':        orgName = area.replace(/(区|县|市|旗|林区)$/, '') + '街道'; label = '街道'; break;
        case '县委': case '区县委': orgName = area + '县委'; label = '县委'; break;
        case '区政府': case '区县政府':
                            orgName = area + '人民政府'; label = '区县人民政府';
                            if (j.t === '市长') { orgName = curCity + '人民政府'; label = '市人民政府'; }
                            else if (j.t === '区长' || j.t === '县长') { orgName = area + '人民政府'; }
                            else if (j.t === '副市长') { orgName = curCity + '人民政府'; label = '市人民政府'; }
                            else if (j.t === '市委书记') { orgName = curCity + '市委'; label = '市委'; }
                            else if (j.t === '副省长') { orgName = curProv + '人民政府'; label = '省人民政府'; }
                            else if (j.t === '省长') { orgName = curProv + '人民政府'; label = '省人民政府'; }
                            break;
        case '市政府':      orgName = curCity + '人民政府'; label = '市人民政府';
                            if (j.t === '副省长') { orgName = curProv + '人民政府'; label = '省人民政府'; }
                            if (j.t === '省长') { orgName = curProv + '人民政府'; label = '省人民政府'; }
                            break;
        case '市委':        orgName = curCity + '市委'; label = '市委';
                            if (j.t === '省委常委·宣传部长') { orgName = curProv + '省委·宣传部'; label = '省委'; }
                            if (j.t === '省委常委·组织部长') { orgName = curProv + '省委·组织部'; label = '省委'; }
                            if (j.t === '省委常委·政法委书记') { orgName = curProv + '省委·政法委'; label = '省委'; }
                            if (j.t === '省委常委·纪委书记') { orgName = curProv + '省委·纪委'; label = '省委'; }
                            if (j.t === '省委常委·常务副省长') { orgName = curProv + '省委'; label = '省委'; }
                            if (j.t === '省委常委·秘书长') { orgName = curProv + '省委·办公室'; label = '省委'; }
                            if (j.t === '省委副书记') { orgName = curProv + '省委'; label = '省委'; }
                            if (j.t === '市委书记') { orgName = curCity + '市委'; }
                            break;
        case '纪委':        orgName = area + '纪委监委'; label = '纪委监委'; break;
        case '组织部':      orgName = area + '委组织部'; label = '区委组织部'; break;
        case '发改委':      orgName = area + '发展和改革委员会'; label = '发改委'; break;
        case '财政局':      orgName = area + '财政局'; label = '财政局'; break;
        case '公安局':      orgName = area + '公安局'; label = '公安局'; break;
        case '教育局':      orgName = area + '教育局'; label = '教育局'; break;
        case '人社局':      orgName = area + '人力资源和社会保障局'; label = '人社局'; break;
        case '住建局':      orgName = area + '住房和城乡建设局'; label = '住建局'; break;
        case '交通局':      orgName = area + '交通运输局'; label = '交通局'; break;
        case '卫健委':      orgName = area + '卫生健康委员会'; label = '卫健委'; break;
        case '市局':        orgName = curCity + '·' + (pos.org || '市局'); label = '上级市局';
                            if (j.t === '市局局长') { orgName = curCity + '·' + (pos.org || '市直部门'); }
                            if (j.t === '市公安局副局长' || j.t === '市公安局长') { orgName = curCity + '公安局'; label = '市公安局'; }
                            if (j.t === '市发改局副局长') { orgName = curCity + '发展和改革委员会'; label = '市发改委'; }
                            if (j.t === '市财政副局长') { orgName = curCity + '财政局'; label = '市财政局'; }
                            if (j.t === '市中级人民法院副院长') { orgName = curCity + '中级人民法院'; label = '市中级人民法院'; }
                            if (j.t === '市检察院副检察长') { orgName = curCity + '人民检察院'; label = '市检察院'; }
                            break;
        case '团县委':      orgName = '共青团' + area + '委'; label = '共青团'; break;
        case '党校':        orgName = area + '委党校'; label = '党校'; break;
        case '融媒体':      orgName = area + '融媒体中心'; label = '融媒体中心'; break;
        case '法院':        orgName = area + '人民法院'; label = '人民法院'; break;
        case '检察院':      orgName = area + '人民检察院'; label = '人民检察院'; break;
        case '异地': {
          const c2 = EX.randomCityOf(curProv, curCity);
          const a2 = EX.randomAreaOf(curProv, c2);
          area = a2; city = c2;
          orgName = a2 + '人民政府';
          label = '异地交流 · ' + c2;
          break;
        }
        case '异地市': {
          const c3 = EX.randomCityOf(curProv, curCity);
          city = c3;
          orgName = c3 + (j.t.indexOf('市委') >= 0 ? '市委' : '人民政府');
          label = '异地地市 · ' + c3;
          break;
        }
        case '外省': {
          const pv = EX.randomProvinceOther(curProv);
          const c4 = EX.randomCityOf(pv);
          const a4 = EX.randomAreaOf(pv, c4);
          province = pv; city = c4; area = a4;
          orgName = pv + '·' + (j.t.indexOf('副省长') >= 0 || j.t.indexOf('省长') >= 0 ? c4 : a4);
          label = '外省交流 · ' + pv;
          break;
        }
        case '异地省': {
          const pv2 = EX.randomProvinceOther(curProv);
          province = pv2; city = pv2; area = pv2;
          orgName = pv2;
          label = '异地省份 · ' + pv2;
          break;
        }
        case '省直': {
          province = curProv; city = curProv;
          if (j.t === '省厅厅长' || j.t === '省厅副厅长') { orgName = curProv + '·' + (pos.org || '省直部门'); }
          else if (j.t === '省发改委主任' || j.t === '省发改委副主任') { orgName = curProv + '发展和改革委员会'; }
          else if (j.t === '省财政厅长') { orgName = curProv + '财政厅'; }
          else if (j.t === '省公安厅长') { orgName = curProv + '公安厅'; }
          else if (j.t === '省高院副院长') { orgName = curProv + '高级人民法院'; }
          else if (j.t === '省检察院副检察长') { orgName = curProv + '人民检察院'; }
          else { orgName = curProv + '·省直机关'; }
          label = '省直机关';
          break;
        }
        case '省厅': {
          orgName = curProv + '财政厅'; label = '省财政厅';
          break;
        }
        case '省委': {
          orgName = curProv + '省委'; label = '省委';
          break;
        }
        case '省政府': {
          orgName = curProv + '人民政府'; label = '省人民政府';
          break;
        }
        case '省会市委': {
          const capital = safeArr(FY.cityMap[curProv], [curProv])[0];
          city = capital; area = capital;
          orgName = capital + '市委'; label = '省会市委';
          break;
        }
        case '单列市': {
          const big = ['深圳市', '厦门市', '宁波市', '青岛市', '大连市'];
          const found = big.find(x => (FY.cityMap[curProv] || []).includes(x));
          city = found || curCity; area = city;
          orgName = city + '人民政府'; label = '计划单列市';
          break;
        }
        case '开发区': case '新区': {
          orgName = area + (j.org === '新区' ? '新区管委会' : '经济开发区管委会');
          label = j.org === '新区' ? '新区' : '开发区';
          break;
        }
        case '国企': {
          orgName = curProv + '·省属国有企业'; label = '省属国企';
          break;
        }
        case '人大': {
          orgName = (j.t.indexOf('省') >= 0 ? curProv : area) + '人大常委会';
          label = '人大常委会';
          break;
        }
        case '政协': {
          orgName = (j.t.indexOf('省') >= 0 ? curProv : area) + '政协';
          label = '政协';
          break;
        }
        case '县': {
          orgName = area + '县委'; label = '县委';
          break;
        }
        case '市辖区': {
          const a5 = EX.randomAreaOf(curProv, curCity);
          area = a5;
          orgName = a5 + '区委'; label = '市辖区区委';
          break;
        }
        case '州政府': {
          const zhou = (FY.cityMap[curProv] || []).find(x => /自治州/.test(x));
          city = zhou || curCity; area = city;
          orgName = city + '人民政府'; label = '自治州政府';
          break;
        }
        case '部委': {
          province = '北京市'; city = '北京市'; area = '西城区';
          orgName = '中央部委'; label = '中央部委';
          break;
        }
        case '直辖市': {
          province = '北京市'; city = '北京市'; area = '朝阳区';
          orgName = '北京市委'; label = '直辖市';
          break;
        }
        default: break;
      }

      const fullLoc = [province, city, area].filter(Boolean).filter((x, i, a) => a.indexOf(x) === i).join('·');
      out.push({
        t: j.t, note: j.note, label,
        province, city, area,
        orgName,
        sec: secName,
        unit: fullLoc + '·' + orgName + (secName && secName !== fullLoc ? '·' + secName : ''),
        level,
      });
    }
    return out;
  };
})();
</script>

  if ((p.level || 0) < h.need) return { ok: false, msg: '职级不够，买卖不出去' };
  if (p.house === h.key) return { ok: false, msg: '已经住在这里了' };
  if (p.netWorthInspect !== undefined && h.price > p.netWorth * 3.2) {
    return { ok: false, msg: '房价与你的收入不匹配，容易被举报（净资产 ' + p.netWorth.toFixed(1) + ' 万）' };
  }
  if (p.netWorth < h.price) return { ok: false, msg: '钱不够，还差 ' + (h.price - p.netWorth).toFixed(1) + ' 万' };
  p.netWorth -= h.price;
  p.house = key;
  p.houseName = h.name;
  p.exposure = (p.exposure || 0) + (h.price > 300 ? 1 : 0);
  g.news.unshift({ t: `搬进了${h.name}（${h.price} 万）`, date: `${g.year}/${g.month}` });
  return { ok: true, house: h };
};

/* ---------------- 纪委约谈 ---------------- */
LF.disciplineRisk = function (g) {
  const p = g && g.player;
  let risk = 0;
  risk += Math.max(0, (60 - (p.attrs.clean || 60))) * 0.9;
  risk += (p.exposure || 0) * 6;
  risk += (p.cars || (p.garage || []).length) * 2;
  risk -= (p.level || 0) * 1.2;
  return _clamp(risk, 0, 100);
};

LF.maybeDiscipline = function (g) {
  const p = g && g.player;
  const risk = LF.disciplineRisk(g);
  if (Math.random() * 100 > risk * 0.22) return null;
  const q = _pick([
    { q: '你名下的车，购买资金从哪来的？',        good: '按规定登记，车款来自家庭储蓄和配偶收入', bad: '朋友借的，具体不方便说' },
    { q: '有群众反映你经常出入高档场所，怎么解释？', good: '都是公务接待，有审批单据',           bad: '个人社交，跟工作无关' },
    { q: '你和某企业老板关系密切，是否存在利益输送？', good: '没有不当往来，随时可以核查',     bad: '就是普通朋友吃个饭' },
    { q: '你配偶名下这笔大额转账说明一下。',        good: '配偶自己经营所得，完税凭证齐全',     bad: '家里亲戚给的，没凭证' },
  ]);
  return { id: ++g.seq, ...q, risk };
};

LF.answerDiscipline = function (g, good) {
  const p = g && g.player;
  if (good) {
    p.attrs.clean = _clamp((p.attrs.clean || 60) + 4, 0, 100);
    p.examPts += 3;
    g.news.unshift({ t: '纪委谈话：如实说明，未发现问题。', date: `${g.year}/${g.month}` });
    return { ok: true, msg: '如实说明通过，廉洁 +4，考察分 +3' };
  }
  p.attrs.clean = _clamp((p.attrs.clean || 60) - 10, 0, 100);
  p.perf = Math.max(0, (p.perf || 0) - 5);
  p.examPts = Math.max(0, p.examPts - 8);
  p.level = Math.max(0, (p.level || 0) - 1);
  p.exposure = Math.max(0, (p.exposure || 0) - 2);
  g.news.unshift({ t: '纪委谈话：交代问题，受到诫勉谈话处理。', date: `${g.year}/${g.month}` });
  return { ok: false, msg: '被诫勉谈话：廉洁 -10，考察分 -8，职级降一级' };
};

    { k: 'people', n: '全省满意度提升',         need: 5,  unit: '点', ap: 3, reward: { exam: 25, liv: 8 } },
    { k: '两会',   n: '主持 N 次省委全会',      need: 1,  unit: '次', ap: 4, reward: { exam: 30, rep: 15 } },
    { k: '换届',   n: '完成 N 次干部换届',      need: 1,  unit: '次', ap: 4, reward: { exam: 28, rep: 12 } },
  ],
};

TASK.init = function (g, level) {
  const p = g.player;
  const pool = TASK.TEMPLATES[level] || TASK.TEMPLATES[0];
  /* 任务数量：基层多一点，高层少而重 */
  const n = level <= 1 ? 4 : level <= 4 ? 5 : level <= 6 ? 4 : 3;
  const list = pool.slice().sort(() => Math.random() - 0.5).slice(0, Math.min(n, pool.length));
  p.tasks = list.map((t, i) => ({
    id: i, key: t.k,
    /* 把模板里的 N 替换成实际数字 */
    name: String(t.n).replace(/N/g, String(t.need)),
    need: t.need, done: 0, unit: t.unit,
    ap: t.ap, reward: Object.assign({}, t.reward), desc: t.desc || '',
  }));
  p.tasksLevel = level;
};

TASK.allDone = g => {
  const p = g.player;
  if (!p.tasks || !p.tasks.length) return false;
  return p.tasks.every(t => t.done >= t.need);
};
TASK.progress = g => {
  const p = g.player;
  if (!p.tasks || !p.tasks.length) return 0;
  const tot = p.tasks.reduce((a, t) => a + t.need, 0);
  const dn = p.tasks.reduce((a, t) => a + Math.min(t.done, t.need), 0);
  return tot ? dn / tot : 0;
};

/* 执行任务：花行动点 */
TASK.run = function (g, id) {
  const p = g.player;
  const t = (p.tasks || []).find(x => x.id === id);
  if (!t) return { ok: false, msg: '没有这个任务' };
  if (t.done >= t.need) return { ok: false, msg: '这个任务已经完成了' };
  if ((p.ap || 0) < t.ap) return { ok: false, msg: '行动点不够（需要 ' + t.ap + ' 点）' };
  p.ap -= t.ap;
  const step = 1;
  t.done = Math.min(t.need, t.done + step);
  /* 立即奖励 */
  const r = t.reward;
  if (r.exam) p.examPts = (p.examPts || 0) + r.exam / t.need;
  if (r.perf) p.perf = (p.perf || 0) + r.perf / t.need;
  if (r.integ) p.attrs.clean = _c((p.attrs.clean || 60) + r.integ / t.need, 0, 100);
  if (r.rep) p.examPts += 0.2;
  if (r.gdp) g.metrics.gdp = _c((g.metrics.gdp || 50) + r.gdp / t.need, 0, 100);
  if (r.stab) g.metrics.stable = _c((g.metrics.stable || 50) + r.stab / t.need, 0, 100);
  if (r.liv) g.metrics.livelihood = _c((g.metrics.livelihood || 50) + r.liv / t.need, 0, 100);
  return { ok: true, task: t, done: TASK.allDone(g) };
};

/* ---------------- 风险系统 ---------------- */
RISK.VALUES = {
  house: 12,      /* 超出收入的大房子 */
  car: 6,         /* 每多一辆好车 */
  nepotism: 18,   /* 安排一个亲戚 */
  promoteOwn: 10, /* 提拔一个自己人 */
  fire: 14,       /* 免职一个人 */
  gift: 15,       /* 给领导送大礼 */
};
RISK.SOURCES = [];   /* 记录来源，方便展示 */

RISK.get = function (g) {
  const p = g.player;
  /* 基础风险来自廉洁反向 + 明面来源 */
  /* 基础风险：廉洁低于 55 才开始累积（廉洁 60 的普通干部开局风险为 0） */
  let base = _c(55 - (typeof p.attrs.clean === 'number' ? p.attrs.clean : 60), 0, 55);
  let sum = base;
  (p.riskLog || []).forEach(x => { sum += x.v; });
  return Math.round(_c(sum, 0, 100));
};

RISK.add = function (g, kind, note, mult) {
  const p = g.player;
  p.riskLog = p.riskLog || [];
  const v = Math.round((RISK.VALUES[kind] || 8) * (mult || 1));
  p.riskLog.push({ kind, note, v, date: `${g.year}/${g.month}` });
  return v;
};

RISK.clearSome = function (g, ratio) {
  const p = g.player;
  p.riskLog = (p.riskLog || []).filter(() => Math.random() > (ratio || 0.4));
};

/* 消掉最大的一条，返回被消掉的记录 */
RISK.clearTop = function (g) {
  const p = g.player;
  p.riskLog = p.riskLog || [];
  if (!p.riskLog.length) return null;
  let mi = 0;
  p.riskLog.forEach((x, i) => { if (x.v > p.riskLog[mi].v) mi = i; });
  const gone = p.riskLog.splice(mi, 1)[0];
  return gone;
};

/* 时间消磨：每 6 个月淡出最早的一条 */
RISK.tick = function (g) {
  const p = g.player;
  p.riskLog = p.riskLog || [];
  if (!p.riskLog.length) return null;
  g.__riskTick = (g.__riskTick || 0) + 1;
  if (g.__riskTick >= 6) {
    g.__riskTick = 0;
    const gone = p.riskLog.shift();
    return gone;
  }
  return null;
};

/* 风险 > 70 触发约谈 */
RISK.check = function (g) {
  const v = RISK.get(g);
  return v >= 70 ? v : 0;
};

/* ---------------- 人情：送礼 / 安排亲戚 / 提拔自己人 / 免职 ---------------- */
FAVOR.GIFTS = [
  { key: 'tea',   name: '名茶一盒',     cost: 2,  gain: 6,  risk: 0,   desc: '不花钱，意思到了' },
  { key: 'liquor',name: '两瓶茅台',     cost: 6,  gain: 12, risk: 4,   desc: '常见的见面礼' },
  { key: 'watch', name: '一块手表',     cost: 25, gain: 22, risk: 12,  desc: '领导会记得你' },
  { key: 'cash',  name: '一个"心意"',   cost: 80, gain: 40, risk: 30,  desc: '风险极高，但能破格提拔' },
  { key: 'art',   name: '一幅字画',     cost: 150,gain: 55, risk: 38,  desc: '这个风险就不是一点了' },
];

FAVOR.leaders = function (g) {
  const p = g.player;
  const pos = p.position || {};
  const lvl = p.level || 0;
  if (!g.leaderCache || g.leaderCache.lv !== lvl) {
    const sur = ['周', '吴', '郑', '王', '赵'];
    const giv = ['立新', '国强', '守成', '明远', '德昌'];
    const titles = lvl >= 6 ? ['市委秘书长', '省委组织部处长'] : lvl >= 4 ? ['市委副秘书长', '组织部副部长'] : lvl >= 2 ? ['县委副书记', '县委组织部长'] : ['办公室主任', '分管副职'];
    g.leaderCache = {
      lv: lvl,
      list: titles.map((t, i) => ({
        id: i, name: sur[i] + giv[i], title: t, favor: 30 + i * 5,
      })),
    };
  }
  return g.leaderCache.list;
};

FAVOR.giveGift = function (g, leaderId, giftKey) {
  const p = g.player;
  const L = FAVOR.leaders(g).find(x => x.id === leaderId);
  const G2 = FAVOR.GIFTS.find(x => x.key === giftKey);
  if (!L || !G2) return { ok: false, msg: '参数错误' };
  if (p.netWorth < G2.cost) return { ok: false, msg: '钱不够（需 ' + G2.cost + ' 万）' };
  p.netWorth -= G2.cost;
  L.favor = _c(L.favor + G2.gain, 0, 100);
  /* 好感影响考察分与破格几率 */
  p.examPts = (p.examPts || 0) + G2.gain * 0.35;
  p.giftTotal = (p.giftTotal || 0) + G2.cost;
  if (G2.risk) RISK.add(g, 'gift', `给${L.title}${L.name}送${G2.name}`, G2.risk / 15);
  g.news.unshift({ t: `给${L.title}${L.name}送了${G2.name}，好感 +${G2.gain}`, date: `${g.year}/${g.month}` });
  return { ok: true, leader: L, gift: G2 };
};

/* 破格提拔：领导好感 ≥ 80 */
FAVOR.canBreakPromote = function (g) {
  const list = FAVOR.leaders(g);
  const best = list.slice().sort((a, b) => b.favor - a.favor)[0];
  return best && best.favor >= 80 ? best : null;
};

/* 亲戚 */
FAVOR.RELATIVES = [
  { name: '表弟', role: '进事业单位', post: '县文联办公室科员' },
  { name: '外甥', role: '进国企',     post: '城投公司综合部职员' },
  { name: '堂妹', role: '进学校',     post: '第三小学会计' },
  { name: '侄子', role: '进街道',     post: '街道办城管科' },
  { name: '小舅子', role: '进医院',   post: '人民医院后勤科' },
];

FAVOR.placeRelative = function (g, idx) {
  const p = g.player;
  const r = FAVOR.RELATIVES[idx];
  if (!r) return { ok: false, msg: '参数错误' };
  if ((p.level || 0) < 2) return { ok: false, msg: '至少要正科级才安排得动' };
  p.relativeCount = (p.relativeCount || 0) + 1;
  const v = RISK.add(g, 'nepotism', `安排${r.name}${r.role}`, 1);
  p.examPts = (p.examPts || 0) + 3;
  g.news.unshift({ t: `把${r.name}安排进了${r.post}（风险 +${v}）`, date: `${g.year}/${g.month}` });
  return { ok: true, rel: r, risk: v };
};

/* 提拔自己人 */
FAVOR.FOLLOWERS = ['周立新', '陈海峰', '王静怡', '李国强', '张明远', '刘守成', '杨德昌', '赵振华'];

FAVOR.promoteFollower = function (g, name) {
  const p = g.player;
  if ((p.level || 0) < 3) return { ok: false, msg: '副处级才有人事权' };
  p.followers = p.followers || [];
  if (p.followers.some(x => x.name === name)) return { ok: false, msg: '已经提拔过了' };
  p.followers.push({ name, at: `${g.year}/${g.month}`, from: '普通干部', to: '科长' });
  const v = RISK.add(g, 'promoteOwn', `提拔自己人 ${name}`, 1);
  p.examPts = (p.examPts || 0) + 4;
  g.news.unshift({ t: `提拔了老同事${name}当科长（风险 +${v}）`, date: `${g.year}/${g.month}` });
  return { ok: true, name, risk: v };
};

/* 免职别人 */
FAVOR.fire = function (g, name, reason) {
  const p = g.player;
  if ((p.level || 0) < 3) return { ok: false, msg: '副处级才动得了人' };
  const v = RISK.add(g, 'fire', `免职 ${name}（${reason}）`, 1);
  p.enemies = p.enemies || [];
  p.enemies.push({ name, at: `${g.year}/${g.month}`, reason });
  p.examPts = Math.max(0, (p.examPts || 0) - 4);
  g.news.unshift({ t: `免去了${name}的职务（${reason}），风险 +${v}`, date: `${g.year}/${g.month}` });
  return { ok: true, name, risk: v };
};

/* ---------------- 约谈（风险 > 70） ---------------- */
FAVOR.QUESTIONS = [
  { q: '有反映说你安排了不少亲戚进单位，你解释一下。',
    good: '确实有，是我考虑不周，愿意主动清理', bad: '都是正常招聘，跟我没关系' },
  { q: '有人举报你收受贵重礼品。',
    good: '我主动上交，接受组织处理',           bad: '那是正常人情往来，不值钱' },
  { q: '你提拔的干部，和你都是老关系，这个怎么讲？',
    good: '我看的是能力，如果程序有问题我配合调查', bad: '用人不疑，我相信他' },
  { q: '你免掉的那位同志，现在实名举报你打击报复。',
    good: '我愿意说明原因，该纠正就纠正',       bad: '是他自己有问题，不该我的事' },
  { q: '你名下的房子，和你的收入明显不符。',
    good: '是家里父母出资，凭证我整理给您',     bad: '家里的事，不方便细说' },
];
window.__EXAM = FAVOR.QUESTIONS;
</script>

        <span style="text-align:right;font-weight:700;color:${danger ? '#a5463e' : '#5b3b6f'}">${v}</span></div>
      ${danger ? '<p class="sm" style="color:#a5463e;margin:6px 0 0">⚠ 风险已过线，随时可能被纪委约谈。</p>' : ''}
      ${(p.riskLog && p.riskLog.length) ? `<div style="margin-top:8px">

      ${(p.riskLog && p.riskLog.length) ? `

        </div>
        <div class="prog" style="margin:5px 0 6px"><i style="width:${L.favor}%;background:${L.favor >= 70 ? 'linear-gradient(90deg,#c96b5b,#a5463e)' : 'linear-gradient(90deg,#9a79bd,#5b3b6f)'}"></i></div>
        <div style="display:flex;flex-wrap:wrap;gap:4px">
          ${FAVOR.GIFTS.map(gf => `<button class="btn sm" data-gift="${L.id}:${gf.key}"

        </div>
      </div>`).join('')}

      ${bp ? `<button class="btn primary wide" style="margin-bottom:10px" data-breakpromote="1">
        ⚡ 找${bp.title}${bp.name}破格提拔（好感 ${bp.favor}）</button>` : ''}

      <div class="ch" style="margin-top:12px"><span class="ic green">亲</span><h3>安排亲戚</h3></div>
      ${lv < 2 ? '<p class="sm dim" style="margin:0">正科级才能安排动。</p>' : `
        <div style="display:flex;flex-wrap:wrap;gap:5px">
          ${FAVOR.RELATIVES.map((r, i) => `<button class="btn sm" data-relative="${i}">
            ${r.name}→${r.post}</button>`).join('')}

        <p class="sm dim" style="margin:6px 0 0">每安排一个，风险 +18。</p>`}

      ${(p.enemies && p.enemies.length) ? `<div class="sm" style="margin-top:4px;color:#a5463e">

<script>/* ============================================================
   治理者之路 · 全国地图 + 政务沙盘
   真实中国省级轮廓 · 按级别开放事务 · 拆迁建造
   ============================================================ */
(function () {
  'use strict';

  const MAP = window.CHINA_MAP;
  const $ = s => document.querySelector(s);
  let selProv = null;      /* 当前选中的省 */
  let VIEW = 'nation';     /* nation | prov */

  /* ---------------- 级别 → 可办事项 ---------------- */
  const ACTIONS = [

      fx: g => { g.player.examPts += 2; g.player.metrics.welfare = cl((g.player.metrics.welfare||50)+3); },
