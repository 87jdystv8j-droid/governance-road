        { n: '只留茶叶，退回其余', cost: 0, risk: 0, fx: g => { addPts(g, 'rep', 2); addPts(g, 'integ', 2); } },
        { n: '原样退回，批评一顿', cost: 0, risk: -4, fx: g => { addPts(g, 'rep', 4); addPts(g, 'integ', 4); } },
      ],
    },
    {
      key: 'retired', title: '探望老领导', icon: '老', cd: 9,
      desc: '退休的老书记住院了，当年提携过你。',
      opts: [
        { n: '亲自去医院（-3万）', cost: 3, risk: 0, fx: g => { addPts(g, 'exam', 3); addPts(g, 'rep', 2); } },
        { n: '托人送个果篮', cost: 0, risk: 0, fx: g => { addPts(g, 'rep', 1); } },
        { n: '太忙，先记着', cost: 0, risk: 0, fx: g => { addPts(g, 'rep', -2); } },
      ],
    },
    {
      key: 'banner', title: '群众送锦旗', icon: '旗', cd: 7,
      desc: '几位居民送来一面锦旗，说要感谢你把积水路修好了。',
      opts: [
        { n: '收下，挂办公室（-0万）', cost: 0, risk: 0, fx: g => { addPts(g, 'rep', 5); } },
        { n: '让他们送给施工队', cost: 0, risk: 0, fx: g => { addPts(g, 'rep', 8); } },
      ],
    },
    {
      key: 'letter', title: '匿名举报信', icon: '告', cd: 10,
      desc: '纪委收到一封匿名信，反映你在某项目上有问题，目前还在核实阶段。',
      opts: [
        { n: '主动说明情况', cost: 0, risk: -12, fx: g => { addPts(g, 'integ', 3); } },
        { n: '找人打听是谁写的', cost: 5, risk: 15, fx: g => { addPts(g, 'integ', -3); } },
        { n: '不动声色', cost: 0, risk: 5, fx: g => {} },
      ],
    },
    {
      key: 'classmate', title: '同学请托', icon: '同', cd: 7,
      desc: '大学室友来电话，说孩子想进市里的事业单位，问能不能"关注一下"。',
      opts: [
        { n: '答应帮忙（-8万）', cost: 8, risk: 16, fx: g => { addPts(g, 'rep', 3); } },
        { n: '让他孩子正常报考', cost: 0, risk: 0, fx: g => { addPts(g, 'rep', 1); addPts(g, 'integ', 2); } },
        { n: '装作没听见', cost: 0, risk: 0, fx: g => { addPts(g, 'rep', -1); } },
      ],
    },
    {
      key: 'banquet', title: '企业座谈会', icon: '谈', cd: 6,
      desc: '你分管的行业要开座谈会，几家企业表示想"单独汇报"。',
      opts: [
        { n: '集体座谈，公开透明', cost: 0, risk: -2, fx: g => { addPts(g, 'perf', 2); addPts(g, 'rep', 2); } },
        { n: '挨个单独谈', cost: 0, risk: 12, fx: g => { addPts(g, 'perf', 4); } },
        { n: '让处室去办', cost: 0, risk: 0, fx: g => {} },
      ],
    },
  ];

  /* ---------------- 辅助 ---------------- */
  function addPts(g, kind, v) {
    const p = g.player;
    g.__lastFx = g.__lastFx || [];
    const nm = { exam: '考察分', perf: '绩效分', rep: '声望', integ: '廉洁' }[kind] || kind;
    if (v) g.__lastFx.push({ txt: nm + ' ' + (v > 0 ? '+' : '') + (Math.round(v * 10) / 10), col: v > 0 ? '#3f7d5c' : '#a5463e' });
    if (kind === 'exam') p.examPts = (p.examPts || 0) + v;
    else if (kind === 'perf') p.perf = (p.perf || 0) + v;
    else if (kind === 'rep') { p.rep = cl((p.rep || 60) + v, 0, 100); p.examPts = (p.examPts || 0) + v * 0.3; }
    else if (kind === 'integ') p.attrs.clean = cl((p.attrs.clean || 60) + v, 0, 100);
  }
  function boostLeader(g, v) {
    if (window.FAVOR && FAVOR.leaders) {
      const list = FAVOR.leaders(g);
      if (list && list[0]) list[0].favor = cl(list[0].favor + v, 0, 100);
    }
  }
  function addFollower(g) {
    const p = g.player;
    p.followers = p.followers || [];
    const names = ['周立新', '陈海峰', '王静怡', '李国强', '张明远', '刘守成', '杨德昌', '赵振华', '孙志刚', '钱文博'];
    const avail = names.filter(n => !p.followers.some(x => x.name === n));
    if (avail.length) p.followers.push({ name: avail[0], at: (g.year || 0) + '/' + (g.month || 0), from: '无阵营干部', to: '核心团队' });
  }

  /* ---------------- 状态 ---------------- */
  SC.init = function (g) {
    g.socialState = g.socialState || {};
  };
  const monthIdx = g => (g.year || 2024) * 12 + (g.month || 1);

  SC.status = function (g, ev) {
    SC.init(g);
    if (ev.cond && !ev.cond(g)) return { state: 'locked', cd: 0 };
    const st = g.socialState[ev.key];
    if (!st) return { state: 'ready', cd: 0 };
    const passed = monthIdx(g) - (st.lastMonth || 0);
    if (passed < (ev.cd || 3)) return { state: 'cooldown', cd: (ev.cd || 3) - passed };
    return { state: 'ready', cd: 0 };
  };

  SC.exec = function (g, key, optIdx) {
    const ev = SC.EVENTS.find(e => e.key === key);
    if (!ev) return { ok: false, msg: '事件不存在' };
    const st = SC.status(g, ev);
    if (st.state === 'locked') return { ok: false, msg: '条件不满足' };
    if (st.state === 'cooldown') return { ok: false, msg: '冷却中（还有 ' + st.cd + ' 个月）' };
    const opt = ev.opts[optIdx];
    g.__lastFx = [];
    if (!opt) return { ok: false, msg: '选项不存在' };
    const p = g.player;
    if (opt.ap && (p.ap || 0) < opt.ap) return { ok: false, msg: '行动点不够' };
    if (opt.cost && (p.netWorth || 0) < opt.cost) return { ok: false, msg: '钱不够（需 ' + opt.cost + ' 万）' };
    if (opt.ap) p.ap -= opt.ap;
    if (opt.cost) p.netWorth -= opt.cost;
    if (opt.gain) p.netWorth += opt.gain;
    if (opt.risk && window.RISK) RISK.add(g, 'gift', ev.title + '：' + opt.n, opt.risk / 15);
    if (opt.fx) opt.fx(g);
    g.socialState[ev.key] = { lastMonth: monthIdx(g), count: ((g.socialState[ev.key] || {}).count || 0) + 1 };
    /* 记录真实效果 */
    const eff = [];
    if (opt.risk) eff.push({ txt: '风险 +' + opt.risk, col: '#a5463e' });
    if (opt.cost) eff.push({ txt: '支出 ' + opt.cost + ' 万', col: '#8a6a33' });
    if (opt.gain) eff.push({ txt: '收入 ' + opt.gain + ' 万', col: '#3f7d5c' });
    if (opt.ap) eff.push({ txt: '行动点 -' + opt.ap, col: '#7a7186' });
    if (g.__lastFx && g.__lastFx.length) g.__lastFx.forEach(x => eff.push(x));
    const effTxt = eff.map(x => x.txt).join(' · ');
    const effColor = (opt.risk && opt.risk >= 15) ? '#a5463e' : (eff.some(x => x.col === '#3f7d5c') ? '#3f7d5c' : '#7a7186');
    if (g.news) g.news.unshift({
      t: '【' + ev.title + '】' + opt.n,
      date: (g.year || '') + '/' + (g.month || ''),
      eff: effTxt || null, effColor,
      kind: opt.risk >= 15 ? 'bad' : 'info',
    });
    return { ok: true, ev, opt, eff: effTxt };
  };

  /* ---------------- 渲染 ---------------- */
  window.renderSocialCenter = function (g) {
    SC.init(g);
    const p = g.player;
    const lv = p.level || 0;

    const cards = SC.EVENTS.map(ev => {
      const st = SC.status(g, ev);
      const badge = st.state === 'ready'
        ? '<span class="tag" style="background:#e6f2e9;color:#3f7d5c">可执行</span>'
        : st.state === 'cooldown'
          ? '<span class="tag" style="background:#efedf1;color:#8b8592">冷却中（' + st.cd + '月）</span>'
          : '<span class="tag" style="background:#f4f4f4;color:#b0b0b0">未解锁</span>';
      const btns = ev.opts.map((o, i) => {
        const canAp = !o.ap || (p.ap || 0) >= o.ap;
        const canMoney = !o.cost || (p.netWorth || 0) >= o.cost;
        const ok = st.state === 'ready' && canAp && canMoney;
        return '<button data-social="' + ev.key + ':' + i + '" ' + (ok ? '' : 'disabled') + ' ' +
          'style="display:block;width:100%;text-align:left;margin-top:5px;padding:8px 12px;' +
          'border:1px solid ' + (o.risk >= 15 ? '#e0b8b2' : 'var(--line)') + ';' +
          'background:' + (o.risk >= 15 ? '#fff8f7' : '#fffdfa') + ';border-radius:9px;' +
          'font-size:12.5px;cursor:' + (ok ? 'pointer' : 'not-allowed') + ';opacity:' + (ok ? 1 : .45) + '">' +
          o.n + (o.risk >= 15 ? '<span style="color:#a5463e;font-size:10.5px"> · 风险大</span>' : '') + '</button>';
      }).join('');
      return '<div style="border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:9px;' +
        'background:' + (st.state === 'ready' ? '#fffdfa' : '#fbf9fc') + '">' +
        '<div style="display:flex;align-items:center;gap:7px;margin-bottom:5px">' +
          '<span class="ic" style="width:20px;height:20px;border-radius:6px;background:#f3edf8;color:#5b3b6f;' +
            'display:grid;place-items:center;font-size:10.5px">' + ev.icon + '</span>' +
          '<b style="font-size:13.5px;color:#5b3b6f">' + ev.title + '</b>' +
          '<span style="margin-left:auto">' + badge + '</span>' +
        '</div>' +
        '<div class="sm" style="color:#7a7186;line-height:1.65;margin-bottom:2px">' + ev.desc + '</div>' +
        btns +
      '</div>';
    }).join('');

    return '<div class="card">' +
      '<div class="ch"><span class="ic">往</span><h3>人际往来 · 事件中心</h3>' +
        '<span class="tail">声望 ' + Math.round(p.rep || 60) + ' · 净资产 ' + (p.netWorth || 0).toFixed(1) + ' 万</span></div>' +
      '<p class="sm dim" style="margin:0 0 10px">人情世故都在这里。不同选择影响声望、考察分、风险，有的要花钱，有的会留下隐患。</p>' +
      '<div style="max-height:64vh;overflow:auto;padding-right:4px">' + cards + '</div>' +
    '</div>';
  };
})();
</script>
<script>/* ============================================================
   治理者之路 · 人物关系（完整用人框架）
   按级别扩充 · 具体职务 · 平调升职选岗 · 常委会表决 · 亲属安置
   ============================================================ */
(function () {
  'use strict';
  const cl = (v, a, b) => Math.max(a, Math.min(b, v));
  const PL = {};
  window.PL = PL;
  const RN = lv => (window.RANK ? RANK.byIndex(cl(lv, 0, 9)).name : '科员');

  const SUR = ['周','陈','王','李','张','刘','杨','黄','赵','吴','徐','孙','马','朱','胡','郭','何','高','林','罗','郑','梁','谢','宋','唐','许','韩','冯'];
  const GIV = ['建军','志明','文博','海峰','晓峰','立新','永鹏','天佑','子明','振华','国强','春生','承志','向东','卫东','俊杰','晓东','继伟','培源','思远','浩然','欣怡','雨桐','静怡','雅琴','秀兰','桂英'];

  function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return Math.abs(h); }
  const seeded = k => { let s = hash(k) || 1; return () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; }; };
  const pick = (rnd, a) => a[Math.floor(rnd() * a.length)];

  /* 具体职务库（按职级） */
  /* 职务库：按行政区 + 职级动态生成 */
  const TITLES_GET = (lv) => (window.JOBPOOL ? JOBPOOL.titlesFor(lv, (g_ && g_.player && g_.player.position ? g_.player.position.county : '') || '') : ['科员']);
  let g_ = null;
  const TITLES = new Proxy({}, {
    get(_, lv) {
      const area = (window.JOBPOOL && JOBPOOL.areaOf ? JOBPOOL.areaOf(g_) : '') || '';
      return (window.JOBPOOL ? JOBPOOL.titlesFor(Number(lv), area) : ['科员']);
    },
    has() { return true; },
  });;
  const DEPTS = {
    prov: ['省委办公厅','省委组织部','省委宣传部','省委政法委','省纪委','省发改委','省财政厅','省公安厅','省教育厅','省卫健委','省住建厅','省交通运输厅','省人社厅','省自然资源厅','省生态环境厅'],
    city: ['市委办公室','市委组织部','市委宣传部','市发改委','市财政局','市教育局','市公安局','市住建局','市卫健委','市人社局','市自然资源局','市交通运输局'],
    county: ['县委办公室','县委组织部','县政府办公室','县发改局','县财政局','县教育局','县公安局','县住建局','县卫健委','县人社局','县自然资源局','县民政局'],
  };
  const LEVEL_NAME = lv => (lv >= 7 ? '省级' : lv >= 5 ? '市级' : lv >= 2 ? '县级' : '基层');

  const RELATIVE_POSTS = [
    { n: '县文联办公室科员', lv: 0, dept: '县文联', risk: 12 },
    { n: '街道办城管科科员', lv: 0, dept: '街道办', risk: 14 },
    { n: '城投公司综合部职员', lv: 0, dept: '城投公司', risk: 16 },
    { n: '人民医院后勤科科员', lv: 0, dept: '人民医院', risk: 12 },
    { n: '县财政局预算科科员', lv: 0, dept: '财政局', risk: 20 },
    { n: '县教育局人事科副科长', lv: 1, dept: '教育局', risk: 26 },
    { n: '市交通局办公室主任', lv: 2, dept: '交通局', risk: 34 },
    { n: '区住建局副局长', lv: 3, dept: '住建局', risk: 44 }
  ];

  /* ---------------- 生成团队 ---------------- */
  PL.roster = function (g) {
    g_ = g;
    const p = g.player;
    const pos = p.position || {};
    const lv = p.level || 0;
    const key = 'r4|' + (g.seed || 0) + '|' + (pos.province || '') + '|' + (pos.city || '') + '|' + (pos.county || '') + '|' + lv;
    if (g.__roster && g.__roster.key === key) return g.__roster;

    const rnd = seeded(key);
    const used = new Set();
    const nm = () => { let n, g2 = 0; do { n = pick(rnd, SUR) + pick(rnd, GIV); } while (used.has(n) && g2++ < 99); used.add(n); return n; };
    const dp = lv >= 7 ? DEPTS.prov : lv >= 4 ? DEPTS.city : DEPTS.county;
    let id = 0;

    const mk = (lv2, title, dept, rel, note) => {
      /* 职务从玩家层级的职务库里取（保证省委书记的下属就是省级领导） */
      const _area = (window.JOBPOOL && JOBPOOL.areaOf) ? JOBPOOL.areaOf(g) : ((g.player.position || {}).county || '');
      /* 上级必须真的更高：用 lv2 那一级的职务库，且不含科员类 */
      let allow;
      if (rel === 'up') {
        const upTitles = {
          1: ['副科长', '办公室副主任'],
          2: ['科长', '办公室主任', '乡镇长'],
          3: ['区委常委、常务副区长', '区委常委、组织部长', '区委常委、纪委书记', '副区长'],
          4: ['区委书记', '区长', '区委常委、常务副区长', '区财政局局长'],
          5: ['市委常委、常务副市长', '副市长', '市委常委、组织部长'],
          6: ['市委书记', '市长', '市委副书记'],
          7: ['省委常委、组织部长', '省委常委、纪委书记', '副省长'],
          8: ['省委副书记', '省长', '省政协主席'],
          9: ['省委书记'],
        };
        allow = upTitles[Math.min(9, Math.max(1, lv2))] || ['科长'];
      } else {
        allow = (window.JOBPOOL && JOBPOOL.titlesFor)
          ? JOBPOOL.titlesFor(lv, _area)
          : (TITLES[lv2] || TITLES[0]);
      }
      if (!allow || !allow.length) { /* 兜底 */ }
      else if (allow.indexOf(title) < 0) title = pick(rnd, allow);
      return {
      id: ++id, name: nm(), lv: lv2, title, dept, rel,
      /* 上级/同级/下级：开局好感统一 60（不再随机） */
      favor: 60, loyal: 20 + Math.floor(rnd() * 60),
      sex: rnd() < 0.72 ? '男' : '女',
      note: note || '', since: (g.year || 2024) - Math.floor(rnd() * 6),
    }; };

    const list = [];

    /* 上级 + 同级（班子） */
    if (lv >= 9) {
      [['省委副书记',8],['省长',8],['省委常委·常务副省长',7],['省委常委·组织部长',7],['省委常委·宣传部长',7],
       ['省委常委·政法委书记',7],['省委常委·纪委书记',7],['省委常委·秘书长',7],['省委常委·统战部长',7]]
        .forEach(([t, l]) => list.push(mk(l, t, '省委常委会', 'peer', '省委常委会成员')));
    } else if (lv >= 7) {
      [['省委书记',9],['省委副书记',8],['省长',8],['省委常委·常务副省长',7],['省委常委·组织部长',7],
       ['省委常委·宣传部长',7],['省委常委·政法委书记',7],['省委常委·纪委书记',7],['省委常委·秘书长',7]]
        .forEach(([t, l]) => list.push(mk(l, t, '省委常委会', l > lv ? 'up' : 'peer', '省委常委会成员')));
    } else if (lv >= 5) {
      [['市委书记',6],['市委副书记',5],['市长',5],['市委常委·常务副市长',5],['市委常委·组织部长',5],
       ['市委常委·宣传部长',5],['市委常委·纪委书记',5],['市委常委·秘书长',5],['副市长',5]]
        .forEach(([t, l]) => list.push(mk(l, t, '市委常委会', l > lv ? 'up' : 'peer', '市委常委')));
    } else if (lv >= 3) {
      [['县委书记',4],['县长',4],['县委副书记',3],['县委常委·组织部长',3],['县委常委·常务副县长',3],
       ['副县长',3],['县委常委·纪委书记',3],['县人大常委会主任',3],['县政协主席',3]]
        .forEach(([t, l]) => list.push(mk(l, t, '县(区)领导班子', l > lv ? 'up' : 'peer', '')));
    } else if (lv >= 1) {
      list.push(mk(lv + 2, '局长', dp[0], 'up', '单位一把手'));
      list.push(mk(lv + 1, '分管副局长', dp[0], 'up', '你的直接上级'));
      for (let i = 0; i < 3; i++) list.push(mk(lv, pick(rnd, TITLES[lv] || ['科长']), pick(rnd, dp), 'peer', '同级别'));
    } else {
      list.push(mk(2, '科长', pick(rnd, dp), 'up', '科室负责人'));
      list.push(mk(1, '副科长', pick(rnd, dp), 'up', '直接上级'));
      for (let i = 0; i < 2; i++) list.push(mk(0, pick(rnd, TITLES[0]), pick(rnd, dp), 'peer', '同事'));
    }

    /* 下级（职务严格按职级取） */
    const subN = lv >= 8 ? 14 : lv >= 6 ? 11 : lv >= 4 ? 9 : lv >= 2 ? 7 : 4;
    for (let i = 0; i < subN; i++) {
      const dl = Math.max(0, lv - 1 - Math.floor(rnd() * Math.min(3, Math.max(1, lv))));
      const dlTitles = TITLES[dl] || TITLES[0];
      list.push(mk(dl, pick(rnd, dlTitles), pick(rnd, dp), 'down', '你分管的干部'));
    }

    /* 亲属 */
    const famNames = ['表弟','外甥','堂妹','侄子','小舅子','表哥','外甥女'];
    const famN = lv >= 5 ? 4 : lv >= 2 ? 3 : 2;
    for (let i = 0; i < famN; i++) {
      list.push({ id: ++id, name: nm(), lv: 0, title: '待业', dept: '—', rel: 'family',
        relation: famNames[i], favor: 75 + Math.floor(rnd() * 25), loyal: 90,
        sex: rnd() < 0.6 ? '男' : '女',
        note: '你的' + famNames[i], placed: false, since: 0 });
    }

    g.__roster = { key, list };
    return g.__roster;
  };

  /* ---------------- 可选岗位池 ---------------- */
  PL.jobPoolFor = function (g, person, kind) {
    const myLv = g.player.level || 0;
    const curLv = (typeof person.lv === 'number') ? person.lv : 1;
    /* 提拔：升一级；平调：同级（不能降级） */
    let target = kind === 'promote' ? curLv + 1 : curLv;
    /* 只能提到你自己的下一级，但平调不能因此把他的职级压下去 */
    const capLv = myLv - 1;
    if (kind === 'promote') target = Math.min(target, capLv);
    else target = curLv;                     /* 平调就是同级，不动 */
    /* 目标职级不能低于被调人当前职级 */
    target = Math.max(target, curLv);
    if (target < 0) target = 0;
    if (target > 9) target = 9;

    const a = window.ADM;
    const pos = g.player.position || {};
    const area = (window.JOBPOOL && JOBPOOL.areaOf) ? JOBPOOL.areaOf(g) : (pos.county || '');
    const prov = pos.province || '本省';
    const city = pos.city || '本市';
    const county = pos.county || '本区';
    /* 按区县名判断行政区类型，全部由 ADM 统一生成 */
    const cType = (function () {
      if (/区$/.test(county)) return '区';
      if (/县$/.test(county)) return '县';
      if (/市$/.test(county)) return '市';
      if (/旗$/.test(county)) return '旗';
      return '区';
    })();
    const c = cType;
    const countyPartyFull = county + '委';
    const party = countyPartyFull;
    const top = countyPartyFull + '书记';
    const head = cType === '县' ? '县长' : cType === '市' ? '市长' : cType === '旗' ? '旗长' : '区长';
    const exec = cType === '县' ? '常务副县长' : '常务副区长';
    const dep = cType === '县' ? '副县长' : '副区长';
    const bar = party.replace(/委$/, '');
    const government = county + '人民政府';
    const cityGov = city + '人民政府';
    const provGov = prov + '人民政府';
    /* 街道 / 乡 用真实感地名 */
    const pick = function (arr) { return arr[Math.floor(Math.random() * arr.length)]; };
    const STREETS = ['城关街道', '临江街道', '东胜街道', '西华街道', '南山街道', '北苑街道'];
    const TOWNS = ['长丰乡', '永安乡', '兴隆乡', '太平乡', '临河乡', '青峰乡'];
    const st = pick(STREETS), tw = pick(TOWNS);
    const RN = function (n) { return (window.RANK && RANK.byIndex) ? ((RANK.byIndex(Math.min(9, n)) || {}).name || '') : ''; };

    /* 每个岗位 = { 职务, 单位 } —— 严格对应，单位层级必须与职务匹配 */
    const SEATS = {
      /* 0 科员：区县部门科室 */
      0: [
        { t: '科员', u: county + '办公室·综合科' },
        { t: '一级科员', u: county + '办公室·秘书科' },
        { t: '科员', u: county + '财政局·预算科' },
        { t: '科员', u: county + '人社局·人事科' },
      ],
      /* 1 副科级：区县部门科 */
      1: [
        { t: '副科长', u: county + '办公室·综合科' },
        { t: '办公室副主任', u: county + '办公室' },
        { t: '副主任科员', u: county + '财政局·预算科' },
      ],
      /* 2 正科级：区县部门科 / 乡镇街道 */
      2: [
        { t: '科长', u: county + '办公室·综合科' },
        { t: '办公室主任', u: county + '办公室' },
        { t: '街道办事处主任', u: county + st + '办事处' },
        { t: '乡长', u: county + tw + '人民政府' },
      ],
      /* 3 副处级：区县班子副职 / 区县局副局长 */
      3: [
        { t: countyPartyFull + '常委、' + exec, u: countyPartyFull },
        { t: countyPartyFull + '常委、组织部长', u: countyPartyFull + '组织部' },
        { t: countyPartyFull + '常委、纪委书记', u: countyPartyFull + '纪委' },
        { t: dep, u: government },
        { t: c + '财政局副局长', u: county + '财政局' },
        { t: c + '住建局副局长', u: county + '住建局' },
      ],
      /* 4 正处级：区县一把手 / 区县局长 / 乡镇书记 */
      4: [
        { t: top, u: countyPartyFull },
        { t: head, u: government },
        { t: countyPartyFull + '常委、' + exec, u: countyPartyFull },
        { t: c + '财政局局长', u: county + '财政局' },
        { t: c + '住建局局长', u: county + '住建局' },
        { t: c + '教育局局长', u: county + '教育局' },
        { t: '乡党委书记', u: county + tw + '党委' },
      ],
      /* 5 副厅级：市班子副职 / 市局局长 */
      5: [
        { t: '市委常委、常务副市长', u: cityGov },
        { t: '副市长', u: cityGov },
        { t: '市委常委、组织部长', u: city + '委组织部' },
        { t: '市委常委、纪委书记', u: city + '纪委监委' },
        { t: '市委常委、宣传部长', u: city + '委宣传部' },
        { t: '市财政局局长', u: city + '财政局' },
        { t: '市住建局局长', u: city + '住建局' },
      ],
      /* 6 正厅级：市一把手 / 省厅副职 */
      6: [
        { t: '市委书记', u: city + '委' },
        { t: '市长', u: cityGov },
        { t: '市委副书记', u: city + '委' },
        { t: '市人大常委会主任', u: city + '人大常委会' },
        { t: '市政协主席', u: city + '政协' },
        { t: '省财政厅副厅长', u: prov + '财政厅' },
        { t: '省发改委副主任', u: prov + '发展和改革委员会' },
      ],
      /* 7 副部级：省班子副职 */
      7: [
        { t: '副省长', u: provGov },
        { t: '省委常委、组织部长', u: prov + '委组织部' },
        { t: '省委常委、纪委书记', u: prov + '纪委监委' },
        { t: '省委常委、常务副省长', u: provGov },
        { t: '省委常委、宣传部长', u: prov + '委宣传部' },
        { t: '省人大常委会副主任', u: prov + '人大常委会' },
        { t: '省政协副主席', u: prov + '政协' },
      ],
      /* 8 正部级：省班子正职 */
      8: [
        { t: '省委副书记', u: prov + '委' },
        { t: '省长', u: provGov },
        { t: '省政协主席', u: prov + '政协' },
        { t: '省人大常委会主任', u: prov + '人大常委会' },
      ],
      /* 9 一把手 */
      9: [
        { t: '省委书记', u: prov + '委' },
      ],
    };

    const seats = SEATS[target] || SEATS[0];
    const pool = seats.map(function (s) { return { title: s.t, dept: s.u, lv: target, lvName: RN(target) }; });
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp; }
    return pool;
  };

  /* ---------------- 破格提拔（找上级领导） ---------------- */
  PL.breakReason = function (g, x) {
    if (x.rel !== 'up') return '这人不算你的上级领导';
    if ((x.favor || 0) < 70) return '好感 ' + (x.favor || 0) + '/70，还够不上';
    const myLv = g.player.level || 0;
    if (myLv >= 9) return '你已经是省委书记，没有可破格的余地';
    if ((g.player.ap || 0) < 6) return '行动点不够（需要 6 点）';
    return '';
  };

  PL.breakPromote = function (g, x) {
    const why = PL.breakReason(g, x);
    if (why) return { ok: false, msg: why };
    const p = g.player;
    p.ap -= 6;
    /* 成功率：好感 90 → 40%，每高 1 点 +3.5% */
    const rate = Math.min(0.90, 0.35 + ((x.favor || 0) - 70) * 0.025);
    const roll = Math.random();
    if (roll > rate) {
      /* 失败：好感下降，再花点人情 */
      x.favor = Math.max(0, (x.favor || 0) - 8);
      if (window.RISK) RISK.add(g, 'other', '托' + x.name + '向上说情未成', 0.5);
      if (g.news) g.news.unshift({
        t: '你托' + x.name + '帮忙向上推荐，被婉拒了',
        date: (g.year || '') + '/' + (g.month || ''),
        eff: '好感 -12', effColor: '#a5463e', kind: 'bad',
      });
      return { ok: false, msg: x.name + '摇头："这事不好办，再等等。"（成功率 ' + Math.round(rate * 100) + '%）' };
    }
    /* 成功：升一级，由该领导出面 */
    const oldLv = p.level || 0;
    p.level = Math.min(9, oldLv + 1);
    p.rank = (window.LVNAMES || {})[p.level] || (window.RANK ? RANK.byIndex(p.level).name : p.rank);
    p.rankId = p.rank;
    p.tenureInLevel = 0;
    /* 职务跟着升 */
    const pos = p.position || {};
    const tn = window.titleForLevel ? titleForLevel(p.level) : p.rank;
    pos.title = tn;
    pos.role = tn;
    p.title = tn;
    g.__orgX2 = null; g.__roster = null;
    if (window.AP) {
      AP.push(g, '升', p.name, (window.LVNAMES || {})[oldLv] || '', tn + '（破格提拔 · ' + x.name + '推荐）', 'self');
    }
    if (g.news) g.news.unshift({
      t: '你托' + x.name + '出面做工作，破格提拔为' + p.rank + '（' + tn + '）',
      date: (g.year || '') + '/' + (g.month || ''),
      eff: '跳过任职年限 · 好感 -20', effColor: '#3f7d5c', kind: 'good',
    });
    x.favor = Math.max(0, (x.favor || 0) - 15);
    if (window.RISK) RISK.add(g, 'nepotism', '走关系破格提拔（' + x.name + '推荐）', 2.2);
    return { ok: true, msg: '破格提拔成功：' + p.rank + ' · ' + tn };
  };

  /* ---------------- 权限 ---------------- */  /* ---------------- 权限 ---------------- */
  PL.canManage = function (g, x) {
    if (x.rel === 'up') return false;
    if (x.rel === 'peer') return false;
    if (x.rel === 'family') return x.placed === true && x.lv < (g.player.level || 0);
    return x.lv < (g.player.level || 0);
  };
  PL.denyReason = function (g, x) {
    if (x.rel === 'up') return '上级，不能动';
    if (x.rel === 'peer') return '同级，无管辖权';
    if (x.rel === 'down' && x.lv >= (g.player.level || 0)) return '职级不低于你';
    if (x.rel === 'down' && window.PERM) {
      const o = PERM.ownerOf(x);
      if (o === '市管') return '市管干部，只能提建议';
      if (o === '省管') return '省管干部，不归你管';
      if (PERM.elected(x)) return '人大选举，须先过罢免案';
    }
    return '';
  };

  /* ---------------- 常委会表决 ---------------- */
  PL.needVote = targetLv => targetLv >= 5;

  PL.vote = function (g) {
    const rs = PL.roster(g);
    const voters = rs.list.filter(x => (x.rel === 'up' || x.rel === 'peer') && x.dept === '省委常委会' || x.dept === '市委常委会' ||
      (x.rel === 'up' || x.rel === 'peer') && x.note && x.note.indexOf('常委') >= 0);
    const pool = voters.length ? voters : rs.list.filter(x => x.rel === 'up' || x.rel === 'peer');
    if (!pool.length) return { need: false, pass: true, detail: [], yes: 0, total: 0 };

    /* 玩家派系（从组织架构拿自己席位上的 faction） */
    const myFaction = (function () {
      try {
        if (window.FX && FX.myFaction) {
          const r = FX.myFaction(g);
          if (r) return typeof r === 'string' ? r : (r.k || r.name || '');
        }
      } catch (e) {}
      return (g.player && g.player.faction) || '无派系';
    })();

    const detail = pool.map(v => {
      const isBoss = /书记$|省长$|市长$/.test(v.title);
      const w = isBoss ? 2 : 1;

      /* 派系加成：同派系 +15%，对立派系 -10% */
      const vf = v.faction || '无派系';
      let factionBonus = 0;
      let factionTag = '';
      if (myFaction && myFaction !== '无派系' && vf !== '无派系') {
        if (vf === myFaction) {
          factionBonus = 0.15;
          factionTag = '同派系';
        } else if (PL.FACTION_RIVAL && PL.FACTION_RIVAL[myFaction] === vf) {
          factionBonus = -0.10;
          factionTag = '对立派系';
        }
      }

      const rate = cl(v.favor / 100 + (isBoss ? 0.05 : 0) + factionBonus, 0.05, 0.95);
      const yes = Math.random() < rate;
      return {
        name: v.name, title: v.title, favor: Math.round(v.favor), yes, w,
        faction: vf, factionTag, rate: Math.round(rate * 100),
      };
    });
    const yesW = detail.filter(d => d.yes).reduce((a, b) => a + b.w, 0);
    const totW = detail.reduce((a, b) => a + b.w, 0);
    return { need: true, pass: yesW / totW >= 0.5, yes: yesW, total: totW, detail, myFaction };
  };

  /* 派系对立关系表 */
  PL.FACTION_RIVAL = {
    '学院派':   '军转干部',
    '军转干部': '学院派',
    '组织系统': '改革派',
    '改革派':   '组织系统',
    '本地派':   '技术官僚',
    '技术官僚': '本地派',
  };

  /* ---------------- 执行 ---------------- */
  PL.act = function (g, pid, kind, jobIdx) {
    const rs = PL.roster(g);
    const person = rs.list.find(x => x.id === pid);
    if (!person) return { ok: false, msg: '找不到这个人' };
    /* 上级：你动不了他（只能送礼拉关系，走 favor 分支） */
    if (person.rel === 'up' && kind !== 'favor') {
      return { ok: false, msg: '这是你的上级，你动不了他' };
    }
    /* 同级：也没有管辖权 */
    if (person.rel === 'peer' && kind !== 'favor') {
      return { ok: false, msg: '同级干部，你没有管辖权' };
    }
    const p = g.player;
    const lv = p.level || 0;

    /* 亲属安置 */
    if (kind === 'place') {
      if (lv < 2) return { ok: false, msg: '正科级才安排得动' };
      const post = RELATIVE_POSTS[jobIdx || 0];
      if (!post) return { ok: false, msg: '岗位不存在' };
      if (post.lv >= lv) return { ok: false, msg: '岗位不能高于你自己' };
      if (person.placed) return { ok: false, msg: '已经安排过了' };
      if ((p.netWorth || 0) < 5) return { ok: false, msg: '打点需要 5 万' };
      p.netWorth -= 5;
      person.placed = true; person.title = post.n; person.dept = post.dept; person.lv = post.lv;
      if (window.RISK) RISK.add(g, 'nepotism', '安排' + (person.relation || '亲属') + person.name + '进' + post.dept, post.risk / 60);
      if (window.AP) AP.push(g, '任', person.name, '待业', post.n + '（' + post.dept + '）');
      if (g.news) g.news.unshift({ t: '把' + (person.relation || '亲属') + person.name + '安排进' + post.n,
        date: (g.year || '') + '/' + (g.month || ''), eff: '风险 +' + Math.round(post.risk / 4) + ' · 支出 5 万', effColor: '#a5463e', kind: 'bad' });
      return { ok: true, msg: person.name + ' 已安排为 ' + post.n };
    }

    if (!PL.canManage(g, person)) return { ok: false, msg: PL.denyReason(g, person) || '无权操作' };

    if (kind === 'transfer' || kind === 'promote') {
      const pool = PL.jobPoolFor(g, person, kind);
      const job = pool[jobIdx || 0];
      if (!job) return { ok: false, msg: '需要选择具体职位' };
      if (job.lv >= lv) return { ok: false, msg: '职位会跟你同级，需报上级' };
      const ap = 1, cost = kind === 'promote' ? 3 : 0;
      if ((p.ap || 0) < ap) return { ok: false, msg: '行动点不够' };
      if (cost && (p.netWorth || 0) < cost) return { ok: false, msg: '钱不够（需 ' + cost + ' 万）' };

      let voteRes = null;
      if (PL.needVote(job.lv)) {
        voteRes = PL.vote(g);
        if (!voteRes.pass) {
          p.ap -= ap;
          if (g.news) g.news.unshift({ t: '常委会否决：提名 ' + person.name + ' 任 ' + job.title,
            date: (g.year || '') + '/' + (g.month || ''), eff: '同意 ' + voteRes.yes + '/' + voteRes.total + ' 票', effColor: '#a5463e', kind: 'bad' });
          return { ok: false, msg: '常委会表决未通过（' + voteRes.yes + '/' + voteRes.total + '）', vote: voteRes, job };
        }
      }

      p.ap -= ap;
      if (cost) p.netWorth -= cost;
      const old = person.title;
      person.title = job.title; person.dept = job.dept; person.lv = job.lv;
      person.favor = cl(person.favor + (kind === 'promote' ? 18 : -5), 0, 100);
      if (kind === 'promote') person.loyal = cl(person.loyal + 25, 0, 100);
      const riskAdd = kind === 'promote' ? 3 + job.lv : 1;
      if (window.RISK) RISK.add(g, kind === 'promote' ? 'promoteOwn' : 'fire',
        (kind === 'promote' ? '提拔 ' : '平调 ') + person.name + ' 为' + job.title, riskAdd / 10);
      /* 任免通知留档 */
      if (window.AP) AP.push(g, kind === 'promote' ? '升' : '调', person.name, old, job.title + '（' + job.dept + '）');
      if (g.news) g.news.unshift({
        t: (kind === 'promote' ? '提拔 ' : '平调 ') + person.name + ' 任 ' + job.title + '（' + job.dept + '）' +
          (voteRes ? '，常委会通过 ' + voteRes.yes + '/' + voteRes.total : ''),
        date: (g.year || '') + '/' + (g.month || ''),
        eff: (voteRes ? '常委会通过 · ' : '') + '风险 +' + riskAdd, effColor: '#7a7186', kind: 'info'
      });
      if (p.history) p.history.push((g.year || '') + '年' + (g.month || '') + '月 · ' + old + ' → ' + job.title);
      return { ok: true, msg: person.name + ' → ' + job.title, vote: voteRes, job };
    }

    if (kind === 'fire') {
      /* ---- 三道判定 ---- */
      if (window.PERM) {
        const chk = PERM.check(g, person, 'fire');
        if (!chk.pass) {
          return { ok: false, msg: chk.msg, perm: chk };
        }
      }
      if ((p.ap || 0) < 2) return { ok: false, msg: '行动点不够（需 2 点）' };
      const old = person.title;
      p.ap -= 2;
      rs.list.splice(rs.list.indexOf(person), 1);
      p.enemies = p.enemies || [];
      p.enemies.push({ name: person.name, at: (g.year || '') + '/' + (g.month || ''), reason: '被免职' });
      if (window.RISK) RISK.add(g, 'fire', '免职 ' + person.name, 1.2);
      if (p.metrics) p.metrics.security = cl((p.metrics.security || 50) - 1, 0, 100);
      if (window.AP) AP.push(g, '免', person.name, old, '免职');
      if (g.news) g.news.unshift({ t: '免去 ' + person.name + ' 的 ' + old + '职务',
        date: (g.year || '') + '/' + (g.month || ''), eff: '风险 +12 · 结仇', effColor: '#a5463e', kind: 'bad' });
      /* 如果这个人在组织架构的常委席上，把岗位空出来 */
      const ox = window.ORGX && ORGX.build(g);
      if (ox && window.PERSON) {
        ox.columns.forEach(col => {
          col.seats.forEach(s => {
            if (s.person && s.person.name === person.name) {
              PERSON.vacate(g, s.title, s.person);
              /* 把席位标记成空缺 */
              s.person = null;
            }
          });
        });
      }
      return { ok: true, msg: '已免去 ' + person.name + (window.PERSON ? '，岗位已空缺' : '') };
    }
    return { ok: false, msg: '未知操作' };
  };

  /* ---------------- 渲染 ---------------- */
  window.renderPeoplePage = function (g) {
    const p = g.player;
    const pos = p.position || {};
    const lv = p.level || 0;
    const list = PL.roster(g).list;
    const byRel = r => list.filter(x => x.rel === r);
    var sp = p.spouse;

    const row = x => {
      const can = PL.canManage(g, x);
      const isFam = x.rel === 'family';
      let btns;
      if (isFam) {
        /* 亲属：先安排进体制，安排后也有完整用人权 */
        if (!x.placed) {
          btns = (lv >= 2)
            ? '<button class="btn sm primary" data-fam="' + x.id + '">安排岗位</button>'
            : '<span class="sm dim" style="font-size:10.5px">正科级才能安排</span>';
        } else {
          /* 已安排 → 走三道判定，给完整按钮 */
          const chk = window.PERM ? PERM.check(g, x, 'fire') : { pass: true };
          const fireStyle = chk.pass ? 'color:#a5463e;border-color:#e0b8b2' : 'color:#b0806e;border-color:#e8dcd8';
          const fireTip = chk.pass ? '免职' : (chk.stage === 3 ? '免职（需罢免案）' : '免职（受限）');
          btns = '<button class="btn sm" data-pick="' + x.id + ':promote">升职</button>' +
                 '<button class="btn sm" data-pick="' + x.id + ':transfer">平调</button>' +
                 '<button class="btn sm" data-pl="' + x.id + ':fire" style="' + fireStyle + '">' + fireTip + '</button>' +
                 (!chk.pass && chk.stage === 3
                   ? '<button class="btn sm" data-recall="' + x.id + '" style="color:#6b477f;border-color:#d8cbe2;font-size:10px">罢免案</button>' : '') +
                 (!chk.pass && chk.action === 'suggest'
                   ? '<button class="btn sm" data-suggest="' + x.id + '" style="color:#8a6a33;border-color:#e0d2a8;font-size:10px">建议</button>' : '');
        }
      } else if (x.rel === 'up') {
        /* 上级：你动不了他。只能送礼拉关系，好感 90 后请他出面破格提拔 */
        const fv = x.favor || 0;
        const canBreak = fv >= 70 && (g.player.level || 0) < 9;
        if (canBreak) {
          btns = '<button class="btn sm" data-break="' + x.id + '" style="color:#8a6a33;border-color:#e0d2a8;background:#fffdf4;font-weight:600">找领导破格提拔</button>' +
                 '<button class="btn sm" data-pick="' + x.id + ':favor">送礼拉关系</button>';
        } else {
          btns = '<button class="btn sm" data-pick="' + x.id + ':favor">送礼拉关系</button>' +
                 '<span class="sm dim" style="font-size:10px">好感 ' + fv + '/70</span>';
        }
      } else if (x.rel === 'peer') {
        /* 同级：无管辖权，只能送礼拉关系 */
        const fv2 = x.favor || 0;
        btns = '<button class="btn sm" data-pick="' + x.id + ':favor">送礼拉关系</button>' +
               '<span class="sm dim" style="font-size:10px">好感 ' + fv2 + '/100</span>';
      } else if (can) {
        /* 三个按钮永远显示；三道判定在点击时拦截 */
        const chk = window.PERM ? PERM.check(g, x, 'fire') : { pass: true };
        const fireStyle = chk.pass ? 'color:#a5463e;border-color:#e0b8b2' : 'color:#b0806e;border-color:#e8dcd8';
        const fireTip = chk.pass ? '免职' : (chk.stage === 3 ? '免职（需罢免案）' : '免职（受限）');
        btns = '<button class="btn sm" data-pick="' + x.id + ':promote">升职</button>' +
               '<button class="btn sm" data-pick="' + x.id + ':transfer">平调</button>' +
               '<button class="btn sm" data-pl="' + x.id + ':fire" style="' + fireStyle + '">' + fireTip + '</button>' +
               (!chk.pass && chk.stage === 3
                 ? '<button class="btn sm" data-recall="' + x.id + '" style="color:#6b477f;border-color:#d8cbe2;font-size:10px">罢免案</button>' : '') +
               (!chk.pass && chk.action === 'suggest'
                 ? '<button class="btn sm" data-suggest="' + x.id + '" style="color:#8a6a33;border-color:#e0d2a8;font-size:10px">建议</button>' : '');
      } else {
        btns = '<span class="sm dim" style="font-size:10.5px">' + PL.denyReason(g, x) + '</span>' +
          '<button class="btn sm" data-errand="' + x.id + '">跑腿</button>';
      }
      return '<div style="display:flex;align-items:center;gap:7px;border-bottom:1px dashed var(--line);' +
        'padding:7px 0;font-size:12.5px;flex-wrap:wrap">' +
        '<span data-personid="' + x.id + '" style="cursor:pointer;display:inline-flex">' +
        (window.AV ? AV.box(x.name, { size: 22, age: x.age, sex: x.sex }) : x.name[0]) + '</span>' +
        '<span style="font-weight:600;min-width:56px;cursor:pointer" data-personid="' + x.id + '">' + x.name + '</span>' +
        '<span class="tag" style="font-size:10px;background:#f6f2fa">' + x.title + '</span>' +
        '<span class="sm dim" style="font-size:10.5px">' + x.dept + '</span>' +
        (x.relation ? '<span class="tag" style="font-size:10px;background:#fdf4e4;color:#8a6a33">' + x.relation + '</span>' : '') +
        '<span class="sm dim" style="margin-left:auto;font-size:10.5px">好感 ' + Math.round(x.favor) + '</span>' +
        '<div style="display:flex;gap:4px">' + btns + '</div></div>' +
        (can && window.PERM && !PERM.check(g, x, 'fire').pass
          ? '<div style="font-size:9.5px;color:#b0806e;padding:0 0 4px 30px">' +
            PERM.check(g, x, 'fire').msg + '</div>' : '');
    };

    const sec = (title, arr, color, note) => {
      if (!arr.length) return '';
      return '<div class="sm dim" style="margin:11px 0 5px;display:flex;align-items:center;gap:6px">' +
        '<span style="width:6px;height:6px;border-radius:50%;background:' + color + '"></span>' +
        title + '（' + arr.length + ' 人）' +
        (note ? '<span style="font-size:10px;opacity:.7">' + note + '</span>' : '') + '</div>' + arr.map(row).join('');
    };

    return '<div class="card">' +
      '<div class="ch"><span class="ic">人</span><h3>人物关系</h3>' +
        '<span class="tail">' + (pos.county || '') + '·' + (pos.org || '') + '</span></div>' +
      '<p class="sm dim" style="margin:0 0 4px">你现在是 <b style="color:var(--plum)">' + RN(lv) + '</b>，' +
        '管辖 <b>' + LEVEL_NAME(lv) + '</b>，团队共 ' + list.length + ' 人。</p>' +
      (sp ? '<div style="margin:10px 0 6px;padding:9px 12px;border:1px solid #e0d2a8;background:#fffdf4;border-radius:10px">' +
        '<div style="display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap">' +
          (window.AV ? AV.box(sp.name, { size: 22, sex: '女', age: sp.age }) : sp.name[0]) +
          '<b>' + sp.name + '</b>' +
          '<span class="tag" style="font-size:10px;background:#fdf4e4;color:#8a6a33">配偶</span>' +
          '<span class="sm dim">' + (sp.placed ? sp.post || sp.role : sp.role + ' · 月收入 ' + Math.round((sp.salary || 0) / 1000) + 'k') + '</span>' +
          '<span style="margin-left:auto">' +
            (sp.placed
              ? '<span class="tag" style="background:#e6f2e9;color:#3f7d5c;font-size:10px">已安排 · ' + (sp.dept || '') + '</span>'
              : ((lv >= 2)
                  ? '<button class="btn sm primary" data-spouse="1">安排编制</button>'
                  : '<span class="sm dim" style="font-size:10.5px">正科级才能安排</span>')) +
          '</span></div>' +
        (sp.placed ? '' : '<div class="sm dim" style="margin-top:4px;font-size:10.5px">配偶可以安排进公务员或事业单位编制</div>') +
      '</div>' : '') +
      sec('上级领导', byRel('up'), '#c9a227', '不能动，只能靠人情往来') +
      sec('同级 / 班子', byRel('peer'), '#7b5a96', lv >= 5 ? '常委会表决成员' : '同级别') +
      sec('下级干部', byRel('down'), '#3f7d5c', '可升职 / 平调 / 免职') +
      sec('亲属', byRel('family'), '#8a6a33', '正科级以上可安排岗位') +
      '<div class="sm dim" style="margin-top:12px;padding-top:8px;border-top:1px dashed var(--line);line-height:1.85">' +
        '<b style="color:#5b3b6f">用人规则</b><br>' +
        '· <b>升职 / 平调</b>：会列出 8 个具体岗位供你挑<br>' +
        '· <b>副厅级及以上岗位</b>需<b style="color:#a5463e">常委会表决</b>，票数取决于你和各位领导的关系<br>' +
        '· <b>免职</b>：2 行动点，风险 +12，对方会记仇<br>' +
        '· <b>安排亲属</b>：需 5 万打点，风险按岗位高低递增' +
      '</div></div>';
  };

  window.renderJobPicker = function (g, person, kind) {
    const pool = PL.jobPoolFor(g, person, kind);
    return '<p class="sm dim" style="margin:0 0 10px">为 <b>' + person.name + '</b>（现：' + person.title + '）选择新岗位：</p>' +
      pool.map((j, i) => {
        const need = PL.needVote(j.lv);
        return '<button data-jobpick="' + person.id + ':' + kind + ':' + i + '" style="display:block;width:100%;' +
          'text-align:left;margin-bottom:6px;padding:9px 12px;border:1px solid ' + (need ? '#e0d2a8' : 'var(--line)') + ';' +
          'background:' + (need ? '#fffdf4' : '#fffdfa') + ';border-radius:9px;font-size:12.5px;cursor:pointer">' +
          '<b style="color:#5b3b6f">' + j.title + '</b><span class="sm dim"> · ' + j.dept + '</span>' +
          '<span class="tag" style="float:right;font-size:10px">' + RN(j.lv) + '</span>' +
          (need ? '<div class="sm" style="color:#8a6a33;margin-top:3px;font-size:10.5px">需常委会表决</div>' : '') +
          '</button>';
      }).join('');
  };

  window.renderVoteResult = function (vote) {
    if (!vote) return '';
    const myF = vote.myFaction && vote.myFaction !== '无派系' ? vote.myFaction : null;
    return '<div style="text-align:center;padding:6px 0 12px">' +
      '<div style="font-size:24px;font-weight:700;color:' + (vote.pass ? '#3f7d5c' : '#a5463e') + '">' +
      (vote.pass ? '表决通过' : '表决未通过') + '</div>' +
      '<div class="sm dim">同意 ' + vote.yes + ' / ' + vote.total + ' 票</div>' +
      (myF ? '<div class="sm" style="margin-top:5px;color:#6b477f">你的派系：' + myF +
        ' <span class="sm dim">（同派系 +15%，对立派系 −10%）</span></div>' : '') +
      '</div>' +
      vote.detail.map(d => {
        let ft = '';
        if (d.factionTag === '同派系') {
          ft = '<span style="font-size:9.5px;padding:1px 5px;border-radius:4px;background:#e6f2e9;color:#3f7d5c">' + (d.faction || '同派系') + ' +15%</span>';
        } else if (d.factionTag === '对立派系') {
          ft = '<span style="font-size:9.5px;padding:1px 5px;border-radius:4px;background:#fbe6e4;color:#a5463e">' + (d.faction || '对立') + ' −10%</span>';
        } else if (d.faction && d.faction !== '无派系') {
          ft = '<span style="font-size:9.5px;padding:1px 5px;border-radius:4px;background:#f3edf8;color:#7a7186">' + d.faction + '</span>';
        }
        return '<div style="display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px dashed var(--line);font-size:12px">' +
          '<span style="width:18px;height:18px;border-radius:5px;background:' + (d.yes ? '#e6f2e9' : '#fbe6e4') + ';' +
            'color:' + (d.yes ? '#3f7d5c' : '#a5463e') + ';display:grid;place-items:center;font-size:10px;flex:none">' + (d.yes ? '✓' : '✕') + '</span>' +
          '<span style="font-weight:600">' + d.name + '</span>' +
          ft +
          '<span class="sm dim" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + d.title + '</span>' +
          '<span class="sm dim" style="margin-left:auto;flex:none">好感 ' + d.favor +
            (d.rate != null ? ' · 通过率 ' + d.rate + '%' : '') + '</span></div>';
      }).join('');
  };

  /* ---------------- 跑腿办事（任何职级都能做） ---------------- */
  PL.ERRANDS = [
    { k: 'doc',   n: '帮领导写材料',  ap: 1, money: 0, favor: 8,  exam: 2, desc: '熬个通宵，把稿子写漂亮' },
    { k: 'run',   n: '跑腿送文件',    ap: 1, money: 0, favor: 5,  exam: 1, desc: '楼上楼下跑一趟' },
    { k: 'meet',  n: '张罗会议',      ap: 1, money: 0, favor: 7,  exam: 1.5, desc: '会务、茶水、记录' },
    { k: 'drink', n: '陪酒应酬',      ap: 1, money: 0, favor: 12, exam: 1, risk: 6, desc: '酒桌上替领导挡几杯，伤身但拉关系' },
    { k: 'gift',  n: '送礼打点',      ap: 1, money: 3, favor: 15, exam: 2, risk: 5, desc: '花点钱，意思到了' },
    { k: 'care',  n: '照顾领导家事',  ap: 2, money: 2, favor: 20, exam: 3, risk: 4, desc: '领导家里有事，跑前跑后' },
  ];

  PL.runErrand = function (g, pid, key) {
    const rs = PL.roster(g);
    const person = rs.list.find(x => x.id === pid);
    if (!person) return { ok: false, msg: '找不到这个人' };
    if (person.rel !== 'up' && person.rel !== 'peer') return { ok: false, msg: '只能给上级或同事跑腿' };
    const e = PL.ERRANDS.find(x => x.k === key);
    if (!e) return { ok: false, msg: '任务不存在' };
    const p = g.player;
    if ((p.ap || 0) < e.ap) return { ok: false, msg: '行动点不够' };
    if (e.money && (p.netWorth || 0) < e.money) return { ok: false, msg: '钱不够（需 ' + e.money + ' 万）' };
    p.ap -= e.ap;
    if (e.money) p.netWorth -= e.money;
    person.favor = cl(person.favor + e.favor, 0, 100);
    p.examPts = (p.examPts || 0) + e.exam;
    p.perf = (p.perf || 0) + e.exam * 0.5;
    person.errands = (person.errands || 0) + 1;
    if (e.risk && window.RISK) RISK.add(g, 'gift', '给' + person.title + person.name + e.n, e.risk / 20);
    if (g.news) g.news.unshift({
      t: '给' + person.title + person.name + e.n,
      date: (g.year || '') + '/' + (g.month || ''),
      eff: '好感 +' + e.favor + ' · 考察分 +' + e.exam + (e.risk ? ' · 风险 +' + e.risk : ''),
      effColor: e.risk ? '#a5463e' : '#3f7d5c', kind: e.risk ? 'bad' : 'info',
    });
    return { ok: true, msg: e.n + '：' + person.name + ' 好感 ' + Math.round(person.favor), favor: person.favor };
  };

  /* 配偶可安排的编制岗位 */
  const SPOUSE_POSTS = [
    { n: '县直机关工勤人员',     lv: 0, dept: '县机关事务局', risk: 18 },
    { n: '街道办事处科员',       lv: 0, dept: '街道办',       risk: 22 },
    { n: '县财政局科员',         lv: 0, dept: '财政局',       risk: 28 },
    { n: '县教育局人事科副科长', lv: 1, dept: '教育局',       risk: 34 },
    { n: '市属国企中层',         lv: 1, dept: '市属国企',     risk: 30 },
    { n: '市卫健委医政科科长',   lv: 2, dept: '卫健委',       risk: 42 },
    { n: '区委办公室副主任',     lv: 3, dept: '区委办公室',   risk: 52 }
  ];
  PL.SPOUSE_POSTS = SPOUSE_POSTS;

  /* 给配偶安排编制 */
  PL.placeSpouse = function (g, idx) {
    const p2 = g.player;
    const sp = p2.spouse;
    if (!sp) return { ok: false, msg: '你还没结婚' };
    if ((p2.level || 0) < 2) return { ok: false, msg: '正科级才安排得动' };
    if (sp.placed) return { ok: false, msg: '已经安排过了' };
    const post = SPOUSE_POSTS[idx];
    if (!post) return { ok: false, msg: '岗位不存在' };
    if (post.lv >= (p2.level || 0)) return { ok: false, msg: '安排的岗位不能高于你' };
    const cost = 8;
    if ((p2.netWorth || 0) < cost) return { ok: false, msg: '打点需要 ' + cost + ' 万' };
    p2.netWorth -= cost;
    sp.placed = true;
    sp.post = post.n;
    sp.dept = post.dept;
    /* 配偶进了体制后就不再算「企业高管」那类收入，改为工资 */
    if (sp.role && /企业高管|律师|商人/.test(sp.role)) sp.salary = 8000;
    else sp.salary = 6500;
    /* 进名单，出现在人物关系里 */
    const rs = PL.roster(g);
    rs.list.push({
      id: 90000 + Math.floor(Math.random() * 9000), name: sp.name, lv: post.lv, title: post.n,
      dept: post.dept, rel: 'family', relation: '配偶', favor: 95, loyal: 100,
      note: '你的妻子', placed: true, since: g.year || 2024,
    });
    if (window.RISK) RISK.add(g, 'nepotism', '安排配偶' + sp.name + '进' + post.dept, post.risk / 60);
    if (window.AP) AP.push(g, '任', sp.name, '待业', post.n + '（' + post.dept + '）');
    if (g.news) g.news.unshift({
      t: '把妻子' + sp.name + '安排进' + post.n,
      date: (g.year || '') + '/' + (g.month || ''),
      eff: '风险 +' + Math.round(post.risk / 4) + ' · 支出 ' + cost + ' 万',
      effColor: '#a5463e', kind: 'bad',
    });
    return { ok: true, msg: sp.name + ' 已安排为 ' + post.n };
  };

  PL.RELATIVE_POSTS = RELATIVE_POSTS;

  /* 点人看档案（带直接领导 / 下属） */
  PL.bindPersonClick = function (g) {
    document.querySelectorAll('[data-personid]').forEach(function (el) {
      el.onclick = function (ev) {
        ev.stopPropagation();
        const pid = Number(el.getAttribute('data-personid'));
        const list = PL.roster(g).list;
        const person = list.find(function (x) { return x.id === pid; });
        if (!person || !window.openPersonCard) return;
        /* 直接领导：比他高职级里最接近的；没有同级上级就用玩家自己 */
        const ups = list.filter(function (x) { return x.lv > person.lv; })
                        .sort(function (a, b) { return a.lv - b.lv; });
        let sup = ups[0] || null;
        if (!sup) {
          /* 他是顶层 → 直接领导就是玩家 */
          const me = g.player;
          sup = { name: (me.name || '你') , title: (window.RANK ? RANK.byIndex(me.level || 0).name : '') + '（你）' };
        }
        /* 下属：比他低一级的 */
        const subs = list.filter(function (x) { return x.lv === person.lv - 1; }).slice(0, 10);
        const pos = g.player.position || {};
        /* 操作按钮 */
        const actHtml = window.renderActionBar ? renderActionBar(g, person) : '';
        window.openPersonCard(person, {
          area: pos.county || '', province: pos.province || '', city: pos.city || '',
          superior: sup ? { name: sup.name, title: sup.title } : null,
          subordinates: subs.map(function (s) { return { name: s.name, title: s.title }; }),
          moves: [],
          actions: actHtml,
          onAction: function (act, per) {
            window.__closeModal && window.__closeModal();
            if (act === 'promote' || act === 'transfer') {
              window.__openJobPicker && window.__openJobPicker(per.id, act, { name: per.name, title: per.title, faction: per.faction, sex: per.sex });
            } else if (act === 'fire') {
              window.__doFire && window.__doFire(per.id, { name: per.name, title: per.title, faction: per.faction, sex: per.sex });
            } else if (act === 'recall') {
              window.__doRecall && window.__doRecall(per.id, { name: per.name, title: per.title, faction: per.faction, sex: per.sex });
            } else if (act === 'suggest') {
              window.__doSuggest && window.__doSuggest(per.id, { name: per.name, title: per.title, faction: per.faction, sex: per.sex });
            }
          },
        });
      };
    });
  };

})();
</script>
<script>/* ============================================================
   治理者之路 · 组织架构（按参考站结构）
   省级 / 市级 / 区县 三档切换 · 四套班子列 · 常委席 · 下设机构展开
   ============================================================ */
(function () {
  'use strict';
  const cl = (v, a, b) => Math.max(a, Math.min(b, v));
  const O = {};
  window.ORGX = O;

  const SUR = ['高','崔','丁','赵','唐','沈','郭','曹','周','肖','谢','林','沈','罗','李','王','张','刘','陈','杨','黄','吴','徐','孙'];
  const GIV = ['彬刚','平鹏','远勇','睿涛','旭浩','斌宇','凯鹏','伟旭','文涛','丹欣','谢超','旭磊','远嘉','明志','建华','国强','海峰','志明','建军','文博'];

  const hash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return Math.abs(h); };
  const seeded = k => { let s = hash(k) || 1; return () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; }; };
  const pick = (r, a) => a[Math.floor(r() * a.length)];
  const pk = pick;

  /* 职务谱系（按层级） */
  /* 常委职务：按行政区名动态生成（县→县委书记，区→区委书记） */
  const standingPosts = area => {
    const A = window.ADM;
    if (!A) return ['书记'];
    return A.standingPosts(area);
  };
    const FACTION = ['学院派', '组织系统', '无派系', '改革派', '本地派', '军转干部', '技术官僚'];
  const EDU = ['本科', '硕士', '博士'];

  /* 各系统下设机构 */
  const DEPTS = {
    party: ['__PREFIX__办公室','__PREFIX__组织部','__PREFIX__宣传部','__PREFIX__统一战线工作部','__PREFIX__政法委员会',
            '__PREFIX__政策研究室','__PREFIX__全面深化改革委员会办公室','__PREFIX__网络安全和信息化委员会办公室',
            '__PREFIX__机构编制委员会办公室','__PREFIX__直属机关工作委员会','__PREFIX__巡察工作领导小组办公室'],
    gov: ['__GOV__办公室','交通运输局','教育局','科学技术局','工业和信息化局','公安局','民政局',
          '司法局','财政局','人力资源和社会保障局','自然资源和规划局','生态环境局',
          '住房和城乡建设局','水利局','农业农村局','商务局','文化和旅游局','卫生健康委员会',
          '退役军人事务局','应急管理局','审计局','市场监督管理局','统计局','医疗保障局',
          '城市管理局','林业局','政务服务管理局','投资促进局'],
    npc: ['__NPC__人大常委会办公室','财政经济工作委员会','监察和司法工作委员会','教育科学文化卫生工作委员会'],
    cppcc: ['__CPPCC__政协办公室','提案委员会','经济委员会','教科文卫体委员会','文史和学习委员会','社会和法制委员会'],
    cdi: ['__CDI__纪委监委办公室','案件监督管理室','第一纪检监察室','第二纪检监察室','审查调查室','案件审理室'],
    court: ['__COURT__人民法院','__COURT__人民检察院'],
    union: ['__UNION__总工会','团__UNION__委','__UNION__妇女联合会','__UNION__工商联','__UNION__残联','__UNION__红十字会'],
    town: ['街道党工委','街道办事处','乡镇党委','乡镇人民政府','街道人大工委','街道纪工委'],
  };

  /* 深一层：政府机构的内设科室 */
  const SECTS = ['办公室','综合科','人事科','财务科','法制科','行政审批科','监督管理科',
                 '执法监督科','规划科','计划科','第一业务科','第二业务科','信息技术科',
                 '宣传教育科','信访科','纪检组','机关党委','工会'];

  /* 生成一份班子 */
  O.build = function (g, forceScope) {
    const p = g.player;
    const pos = p.position || {};
    const lv = p.level || 0;
    /* 层级：先看职级（位置决定层级），再看单位名 */
    const orgName0 = pos.org || '';
    let autoScope;
    /* 职级决定层级（单位名只作兜底） */
    if (lv >= 7) autoScope = 'province';
    else if (lv >= 5) autoScope = 'city';
    else if (lv >= 0) autoScope = 'district';
    else if (/^省|省委|省政府|自治区/.test(orgName0)) autoScope = 'province';
    else if (/^市|市委|市政府/.test(orgName0)) autoScope = 'city';
    else autoScope = 'district';
    const scope = forceScope || viewScope || autoScope;
    const key = 'orgx3|' + (g.seed || 0) + '|' + (pos.county || '') + '|' + (pos.org || '') + '|' + scope;
    if (g.__orgX && g.__orgX.key === key) return g.__orgX;

    const r = seeded(key);
    const people = [];
    const names = new Set();
    const nm = () => { let n, guard = 0; do { n = pick(r, SUR) + pick(r, GIV); } while (names.has(n) && guard++ < 99); names.add(n); return n; };

    /* 机构名（按行政区生成，供分管领域用） */
    /* 该层级对应的行政区名 */
    const areaName = scope === 'province' ? (pos.province || pos.county || '')
                   : scope === 'city' ? (pos.city || pos.county || '')
                   : (pos.county || '');
    const AORG = (window.ADM && window.ADM.orgsFor) ? window.ADM.orgsFor(areaName) : null;

    /* 1. 常委席（10 席） */
    const seats = standingPosts(areaName).map((title, i) => {
      const rank = i === 0 ? 4 : i < 3 ? 3 : 3;
      return {
        title,
        person: {
          name: nm(),
          title,
          level: scope === 'province' ? (i === 0 ? '正部级' : i < 3 ? '副部级' : '副部级')
               : scope === 'city' ? (i === 0 ? '正厅级' : '副厅级')
               : (i === 0 ? '正处级' : '副处级'),
          age: 42 + Math.floor(r() * 15),
          sex: r() < 0.75 ? '男' : '女',
          edu: pick(r, EDU),
          faction: pick(r, FACTION),
          supervise: i >= 2 ? (function () {
            const pool = (AORG && AORG.gov) ? AORG.gov : DEPTS.gov;
            const picked = [];
            const used = {};
            for (let k = 0; k < 4; k++) {
              const one = pk(r, pool);
              if (!used[one]) { used[one] = 1; picked.push(one); }
            }
            return picked.join('、');
          })() : '',
        },
      };
    });

    /* 1.5 玩家自己占一个席位（按他的职位名匹配） */
    (function () {
      const myTitle = (pos.title || p.title || '') || '';
      const myName = p.name || '你';
      /* 匹配：完全相等 或 包含关系 */
      let hitIdx = -1;
      for (let k = 0; k < seats.length; k++) {
        const t = seats[k].title;
        if (t === myTitle || t.indexOf(myTitle) >= 0 || myTitle.indexOf(t) >= 0) { hitIdx = k; break; }
      }
      /* 没匹配上但职级是最高（省委书记/市长/县长），塞到第 0 席 */
      if (hitIdx < 0 && seats.length) {
        /* 职级 → 该层级的一把手位置 */
        if (lv >= 8) hitIdx = 0;                    /* 省委书记/市长/县长 → 第 0 席 */
        else if (lv >= 4) hitIdx = 0;               /* 正处级 → 一把手 */
        else if (lv >= 2) hitIdx = 2 + (lv % 3);    /* 科级 → 常委中段 */
      }
      if (hitIdx >= 0 && seats[hitIdx]) {
        seats[hitIdx].person = {
          name: myName,
          title: seats[hitIdx].title,
          level: seats[hitIdx].person.level,
          age: p.age,
          sex: p.sex,
          edu: p.edu,
          faction: '—',
          supervise: '主持全面工作',
          isPlayer: true,
        };
      }
    })();

    /* 2. 各系统下设机构 */
    const buildOrg = (name, sys) => {
      const nsec = 3 + Math.floor(r() * 5);
      const secs = [];
      const pool = SECTS.slice();
      for (let i = 0; i < nsec && pool.length; i++) {
        const idx = Math.floor(r() * pool.length);
        const sn = pool.splice(idx, 1)[0];
        secs.push({ name: sn, head: nm(), rank: '科员', post: '主任' });
      }
      return { name, sys, secs, head: secs.length ? secs[0].head : '' };
    };

    /* 按层级替换机构名前缀 */
    const A = window.ADM;
    const isProv = scope === 'province';
    const PFX  = isProv ? '省委' : scope === 'city' ? '市委' : A.prefix(areaName);
    const GOV  = isProv ? '省政府' : scope === 'city' ? '市政府' : A.gov(areaName);
    const NPC  = isProv ? '省' : scope === 'city' ? '市' : A.char(areaName);
    const CPPCC = NPC;
    const CDI  = NPC;
    const COURT = NPC;
    const UNION = NPC;
    const fix = n => n.split('__PREFIX__').join(PFX).split('__GOV__').join(GOV)
      .split('__NPC__').join(NPC).split('__CPPCC__').join(CPPCC)
      .split('__CDI__').join(CDI).split('__COURT__').join(COURT).split('__UNION__').join(UNION);

    const DEPTS_USE = AORG || DEPTS;
    const columns = [
      { key: 'party', name: '党委系统', color: '#c0392b', icon: '党',
        seats, orgs: DEPTS_USE.party.map(n => buildOrg(fix(n), 'party')) },
      { key: 'gov', name: '政府系统', color: '#2b6cb0', icon: '政',
        seats: [], orgs: DEPTS_USE.gov.map(n => buildOrg(fix(n), 'gov')) },
      { key: 'npc', name: '人大政协', color: '#6b477f', icon: '人',
        seats: [], orgs: DEPTS_USE.npc.concat(DEPTS_USE.cppcc).map(n => buildOrg(fix(n), 'npc')) },
      { key: 'cdi', name: '纪委监委', color: '#8a4038', icon: '纪',
        seats: [], orgs: DEPTS_USE.cdi.map(n => buildOrg(fix(n), 'cdi')) },
      { key: 'court', name: '两院', color: '#4a5f8a', icon: '两',
        seats: [], orgs: DEPTS_USE.court.map(n => buildOrg(fix(n), 'court')) },
      { key: 'union', name: '群团组织', color: '#3f7d5c', icon: '群',
        seats: [], orgs: DEPTS_USE.union.map(n => buildOrg(fix(n), 'union')) },
      { key: 'town', name: '街镇', color: '#8a6a33', icon: '街',
        seats: [], orgs: DEPTS_USE.town.map(n => buildOrg(n, 'town')) },
    ];

    g.__orgX = { key, scope, columns, seats };
    return g.__orgX;
  };

  /* 统计 */
  O.stats = function (g) {
    const x = O.build(g);
    let orgs = 0, secs = 0;
    x.columns.forEach(c => { orgs += c.orgs.length; c.orgs.forEach(o => secs += o.secs.length); });
    return { cols: x.columns.length, seats: x.columns.reduce((a, c) => a + c.seats.length, 0), orgs, secs };
  };

  /* ---------------- 渲染 ---------------- */
  let openSet = {};
  let viewScope = null;   /* 用户手动切换的层级 */

  /* 按科室名推断分管领域（没有 supervise 字段时用） */
  window.guessSupervise = function (title, sec, org) {
    const all = String(sec || '') + String(org || '') + String(title || '');
    const MAP = [
      [/组织|人事|编制|干部/, '干部人事、机构编制'],
      [/宣传|新闻|舆情|文明/, '宣传教育、新闻舆论'],
      [/统战|民族|宗教|侨务/, '统一战线、民族宗教'],
      [/政法|综治|维稳|信访/, '政法综治、信访维稳'],
      [/纪检|监察|巡察|党风/, '纪检监察、党风廉政'],
      [/财政|税务|金融|审计/, '财政税收、金融审计'],
      [/发改|计划|投资|项目/, '发改投资、重点项目'],
      [/教育|学校|教学/, '教育工作'],
      [/科技|创新|信息|数据/, '科技信息、数据管理'],
      [/工业|工信|经济|商务|招商/, '工业经济、招商引资'],
      [/公安|交警|治安/, '公安治安、交通管理'],
      [/民政|救助|低保|养老|福利/, '民政救助、社会福利'],
      [/司法|法制|法务/, '司法行政、法制建设'],
      [/自然资源|国土|规划/, '自然资源、国土规划'],
      [/生态|环境|环保/, '生态环境保护'],
      [/住建|建设|房产|城建/, '城乡建设、房产管理'],
      [/交通|公路|运输/, '交通运输'],
      [/水利|水务|供水/, '水利水务'],
      [/农业农村|扶贫|乡村振兴/, '农业农村、乡村振兴'],
      [/文化|旅游|文物|体育/, '文化旅游、体育事业'],
      [/卫生|医疗|健康|疾控/, '卫生健康、疾控医疗'],
      [/退役军人/, '退役军人事务'],
      [/应急|安全|消防/, '应急管理、安全生产'],
      [/市场|工商|质监|食药/, '市场监管、食品药品'],
      [/统计|调查/, '统计调查'],
      [/医保/, '医疗保障'],
      [/城管|市容|环卫/, '城市管理、市容环卫'],
      [/林业|园林|绿化/, '林业园林、绿化'],
      [/政务服务|审批|政务/, '政务服务、行政审批'],
      [/办公室|综合|秘书|文秘/, '综合协调、文秘档案'],
      [/档案|机要|保密/, '档案机要、保密工作'],
    ];
    for (const [re, label] of MAP) if (re.test(all)) return label;
    return '';
  };

  window.renderOrgPage = function (g) {
    const x = O.build(g);
    const st = O.stats(g);
    const p = g.player;
    const pos = p.position || {};
    const lv = p.level || 0;
    const myOrg = pos.org || '';
    const mySec = pos.sec || '';

    const levelName = x.scope === 'province' ? '省级' : x.scope === 'city' ? '市级' : '区县';
    const sub = (pos.county || '') + ' · ' + levelName + ' · 四大班子 · 纪委监委 · 两院 · 群团 · 街镇';

    return '<div class="card">' +
      '<div class="ch"><span class="ic">构</span><h3>组织架构</h3>' +
        '<span class="tail">' + HG_date(g) + ' · ' + sub + '</span></div>' +

      /* 层级切换 */
      '<div style="display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap">' +
        '<span class="sm dim" style="font-size:11px">层级</span>' +
        ['省级','市级','区县'].map((n, i) => {
          const on = (i === 0 && x.scope === 'province') || (i === 1 && x.scope === 'city') || (i === 2 && x.scope === 'district');
          return '<button class="btn sm ' + (on ? 'primary' : '') + '" data-orglevel="' + i + '" style="font-size:11px">' + n + '</button>';
        }).join('') +
        '<button class="btn sm ' + (viewScope === null ? 'primary' : '') + '" data-orglevel="auto" style="font-size:11px">跟随职级</button>' +
        '<span class="sm dim" style="margin-left:auto;font-size:10.5px">' +

      /* 统计 */
      '<div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px;font-size:11.5px;color:#5c5268">' +
        '<span>' + st.cols + ' 个系统</span><span>' + st.seats + ' 个常委席</span>' +
        '<span>' + st.orgs + ' 个机构</span><span>' + st.secs + ' 个内设科室</span>' +
      '</div>' +
