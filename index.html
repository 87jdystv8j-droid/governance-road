                 g.player.metrics.security = cl((g.player.metrics.security||50)-6); },
      note: 'GDP 涨得最猛，但稳定度会掉，风险高' },
    { key: 'road',     n: '修建道路',      lv: 2, ap: 2, cash: 800,   risk: 5,
      fx: g => { g.player.metrics.gdp = cl((g.player.metrics.gdp||50)+4); g.player.metrics.biz = cl((g.player.metrics.biz||50)+4); g.town.roads++; },
      note: '营商环境和 GDP 双涨' },
    { key: 'park',     n: '建公园绿地',    lv: 2, ap: 2, cash: 600,   risk: 2,
      fx: g => { g.player.metrics.eco = cl((g.player.metrics.eco||50)+6); g.player.metrics.welfare = cl((g.player.metrics.welfare||50)+3); g.town.parks++; },
      note: '民生和生态双涨，政绩好看' },
    { key: 'school',   n: '建学校',        lv: 3, ap: 2, cash: 1000,  risk: 3,
      fx: g => { g.player.metrics.welfare = cl((g.player.metrics.welfare||50)+8); g.town.schools++; },
      note: '民生重点，老百姓看得见' },
    { key: 'hospital', n: '建医院',        lv: 3, ap: 2, cash: 2000,  risk: 4,
      fx: g => { g.player.metrics.welfare = cl((g.player.metrics.welfare||50)+10); g.town.hospitals++; },
      note: '最实在的民生项目' },
    { key: 'invest',   n: '招商引资',      lv: 3, ap: 2, cash: 0,     risk: 6,
      fx: g => { g.player.metrics.gdp = cl((g.player.metrics.gdp||50)+7); g.player.perf = (g.player.perf||0)+3; },
      note: 'GDP 增长的关键，但接触面广' },
    { key: 'clean',    n: '专项整治',      lv: 3, ap: 1, cash: 0,     risk: -5,
      fx: g => { g.player.metrics.security = cl((g.player.metrics.security||50)+5); g.player.attrs.clean = cl((g.player.attrs.clean||60)+5); },
      note: '降风险、涨廉洁的唯一办法' },
    { key: 'land',     n: '出让土地',      lv: 4, ap: 2, cash: 0,     risk: 14,
      fx: g => { g.player.netWorth += 200; g.player.metrics.gdp = cl((g.player.metrics.gdp||50)+10); },
      note: '来钱最快，也最容易被查' },
    { key: 'zone',     n: '设立开发区',    lv: 5, ap: 3, cash: 5000,  risk: 8,
      fx: g => { g.player.metrics.gdp = cl((g.player.metrics.gdp||50)+12); g.player.metrics.biz = cl((g.player.metrics.biz||50)+10); g.town.zones++; },
      note: '一方主官的看家本领' },
    { key: 'reform',   n: '推动改革试点',  lv: 5, ap: 3, cash: 0,     risk: 3,
      fx: g => { g.player.examPts += 12; g.player.perf = (g.player.perf||0)+8; },
      note: '考察分大涨，提拔的硬通货' },
    { key: 'people',   n: '人事任免',      lv: 6, ap: 2, cash: 0,     risk: 8,
      fx: g => { g.player.examPts += 5; g.player.followers = g.player.followers || []; },
      note: '一把手才有的权力' },
  ];
  function cl(v, a, b) { return Math.max(a === undefined ? 0 : a, Math.min(b === undefined ? 100 : b, v)); }
  /* 指标真实位置：g.player.metrics，键 fiscal/gdp/welfare/eco/biz/security */
  function mt(g, k, d) {
    const p = g.player;
    if (!p.metrics) p.metrics = { fiscal: 32, gdp: 28, welfare: 49, eco: 53, biz: 40, security: 31 };
    if (!(k in p.metrics)) return 0;
    p.metrics[k] = cl(p.metrics[k] + (d || 0), 0, 100);
    return p.metrics[k];
  }

  /* ---------------- 城市建筑生成（等距沙盘） ---------------- */
  function genTown(g, province, area) {
    const seed = hash(province + '|' + area + '|' + (g.seed || 0));
    let s = seed;
    const r = () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
    const blocks = [];
    const N = 6;
    const cell = 100;
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        if (r() < 0.12) continue;
        blocks.push({
          x: x * cell + 14, y: y * cell + 14,
          w: cell - 30 - Math.floor(r() * 10),
          h: cell - 30 - Math.floor(r() * 10),
          hgt: 20 + Math.floor(r() * (x > 1 && x < 4 ? 90 : 45)),
          kind: r() < 0.08 ? 'gov' : r() < 0.15 ? 'park' : r() < 0.2 ? 'water' : 'bldg',
          tone: Math.floor(r() * 4),
        });
      }
    }
    /* 地标：政府大楼放中间 */
    blocks.push({ x: 2 * cell + 10, y: 2 * cell + 10, w: cell + 20, h: cell + 20, hgt: 70, kind: 'hall', tone: 0 });
    return { blocks, build: 0, demolished: 0, roads: 0, parks: 0, schools: 0, hospitals: 0, zones: 0 };
  }
  function hash(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  /* ---------------- 渲染全国地图 ---------------- */
  /* 任意省份的干部列表（按种子确定性生成，缓存） */
  /* 各省干部规模权重（按真实人口/辖区规模） */
  const PROV_WEIGHT = {
    '广东': 1.85, '山东': 1.72, '河南': 1.70, '四川': 1.55, '江苏': 1.50,
    '河北': 1.35, '湖南': 1.30, '安徽': 1.25, '湖北': 1.22, '浙江': 1.20,
    '广西': 1.10, '云南': 1.05, '江西': 0.98, '辽宁': 0.95, '福建': 0.92,
    '陕西': 0.90, '贵州': 0.88, '山西': 0.85, '重庆': 0.80, '黑龙江': 0.78,
    '新疆': 0.75, '甘肃': 0.68, '上海': 0.66, '北京': 0.64, '吉林': 0.60,
    '内蒙古': 0.58, '天津': 0.52, '海南': 0.42, '宁夏': 0.34, '青海': 0.30,
    '西藏': 0.24, '台湾': 0.70, '香港': 0.38, '澳门': 0.16,
  };
  function provWeight(prov) {
    for (const k in PROV_WEIGHT) if (prov.indexOf(k) >= 0) return PROV_WEIGHT[k];
    return 0.6;
  }

  function cadresOfProvince(g, prov) {
    g.__cadreCache = g.__cadreCache || {};
    if (g.__cadreCache[prov]) return g.__cadreCache[prov];
    const pos = g.player.position || {};
    const myProv = (pos.province || '').replace(/(省|市|自治区|特别行政区)$/, '');
    let list = [];
    if (window.RANK && RANK.buildCadreList) {
      const full = (MAP.shapes.find(x => x.n === prov) || {}).full || prov;
      const base = RANK.buildCadreList(String(g.seed) + '|' + prov, full);
      const target = Math.max(18, Math.round(682 * provWeight(prov)));
      let acc = base.slice();
      let round = 1;
      while (acc.length < target && round <= 6) {
        acc = acc.concat(RANK.buildCadreList(String(g.seed) + '|' + prov + '#' + round, full));
        round++;
      }
      /* 玩家所在省：用真实排行榜数据 */
      if (prov === myProv && g.cadres && g.cadres.length) acc = g.cadres.concat(acc);
      list = acc.slice(0, target);
    }
    g.__cadreCache[prov] = list;
    return list;
  }

  window.renderChinaMap = function (g) {
    if (!MAP) return '<p class="sm dim">地图数据没加载</p>';
    const p = g.player;
    const pos = p.position || {};
    const myProv = (pos.province || '').replace(/(省|市|自治区|特别行政区)$/, '');

    /* 全部省级区划 + 干部数 */
    const all = MAP.shapes.map(sp => {
      const isMe = sp.n === myProv || sp.full === pos.province ||
        (pos.province && pos.province.indexOf(sp.n) === 0);
      const cadres = cadresOfProvince(g, sp.n);
      return { n: sp.n, full: sp.full, d: sp.d, me: isMe, count: cadres.length, top: cadres[0] };
    }).sort((a, b) => b.count - a.count);

    const maxC = Math.max(1, ...all.map(x => x.count));

    const shapes = all.map(sp => {
      const isSel = selProv === sp.n;
      let fill = 'rgba(155,125,186,' + (0.08 + (sp.count / maxC) * 0.55).toFixed(2) + ')';
      if (sp.me) fill = '#c9a227';
      if (isSel) fill = '#8a4038';
      return '<path d="' + sp.d + '" data-prov="' + sp.n + '" fill="' + fill + '" stroke="#fff" ' +
        'stroke-width="' + (sp.me || isSel ? 2.4 : 1) + '" stroke-linejoin="round" style="cursor:pointer" ' +
        'data-cadres="' + sp.count + '" data-name="' + sp.full + '">' +
        '<title>' + sp.full + ' · ' + sp.count + ' 名在册干部</title></path>';
    }).join('');

    /* 全部省份列表 */
    const list = all.map((sp, idx) =>
      '<div class="provRow" data-prov="' + sp.n + '" style="display:flex;align-items:center;gap:6px;' +
      'padding:3px 6px;border-radius:6px;cursor:pointer;font-size:11.5px;' +
      (sp.me ? 'background:#fdf4e4;font-weight:700;' : selProv === sp.n ? 'background:#fbeeec;' : '') + '">' +
      '<span style="width:16px;color:#7a7186;font-size:10px">' + (idx + 1) + '</span>' +
      '<span class="grow" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + sp.full + '</span>' +
      '<span style="color:' + (sp.me ? '#8a6a33' : '#5b3b6f') + ';font-variant-numeric:tabular-nums">' + sp.count + '</span>' +
      '</div>').join('');

    const totalCadres = all.reduce((a, b) => a + b.count, 0);

    return '<div class="card">' +
      '<div class="ch"><span class="ic blue">图</span><h3>全国政务地图</h3>' +
        '<span class="tail">' + (myProv ? '你在 ' + myProv : '未定岗') + ' · 全国 ' + totalCadres.toLocaleString() + ' 名在册干部</span></div>' +
      '<div style="display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:10px">' +
        '<div>' +
          '<div style="position:relative;width:100%;overflow:hidden;border-radius:10px;background:#fbf8fd">' +
            '<svg viewBox="0 0 ' + MAP.w + ' ' + MAP.h + '" style="width:100%;height:auto;display:block" id="chinaSvg">' + shapes + '</svg>' +
          '</div>' +
          '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:10.5px;color:#7a7186">' +
            '<span><span style="display:inline-block;width:9px;height:9px;background:#c9a227;border-radius:2px;vertical-align:-1px"></span> 你在这里</span>' +
            '<span><span style="display:inline-block;width:9px;height:9px;background:#8a4038;border-radius:2px;vertical-align:-1px"></span> 选中</span>' +
            '<span><span style="display:inline-block;width:9px;height:9px;background:rgba(155,125,186,.5);border-radius:2px;vertical-align:-1px"></span> 干部密度</span>' +
          '</div>' +
        '</div>' +
        '<div style="border-left:1px solid var(--line);padding-left:9px;max-height:420px;overflow:auto">' +
          '<div class="sm dim" style="margin-bottom:4px">全部 ' + all.length + ' 个省级区划</div>' +
          list +
        '</div>' +
      '</div>' +
      (selProv ? renderProvPanel(g, selProv) : '<p class="sm dim" style="margin:8px 0 0">点地图或右侧列表任意省份，查看该省详情。</p>') +
    '</div>';
  };

  function renderProvPanel(g, prov) {
    const p = g.player;
    const pos = p.position || {};
    const myProv = (pos.province || '').replace(/(省|市|自治区|特别行政区)$/, '');
    const isHere = prov === myProv;
    const sp = MAP.shapes.find(x => x.n === prov);
    const cadres = cadresOfProvince(g, prov);
    const top = cadres.slice(0, 4);
    const lv = p.level || 0;
    const avail = ACTIONS.filter(a => lv >= a.lv);
    return `<div style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px">
      <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:8px">

        ${isHere ? '<span class="tag" style="background:#fdf4e4;color:#8a6a33">你在这里</span>' : ''}
        <span class="sm dim" style="margin-left:auto">在册干部 ${cadres.length} 人</span>
      </div>
      ${top.length ? `<div class="sm dim" style="margin-bottom:8px">${top.map(c => c.name + '（' + c.title + '）').join(' · ')}</div>` : ''}
      <div class="sm dim" style="margin-bottom:6px">你的级别可办：</div>
      <div style="display:flex;flex-wrap:wrap;gap:5px">
        ${avail.map(a => `<span class="tag" style="background:${a.risk > 8 ? '#fbe6e4' : '#f3edf8'};color:${a.risk > 8 ? '#a5463e' : '#5b3b6f'}">${a.n}</span>`).join('')}
      </div>
      ${lv < 6 ? `<div class="sm dim" style="margin-top:6px">还有 ${ACTIONS.length - avail.length} 项事务需要更高职级才能办。</div>` : ''}
    </div>`;
  }

  /* ---------------- 政务沙盘：可办事项 ---------------- */
  window.renderGovPanel = function (g) {
    const p = g.player;
    const lv = p.level || 0;
    const avail = ACTIONS.filter(a => lv >= a.lv);
    const locked = ACTIONS.filter(a => lv < a.lv);
    return `<div class="card">
      <div class="ch"><span class="ic green">办</span><h3>政务沙盘</h3>
        <span class="tail">按级别开放 · ${avail.length}/${ACTIONS.length} 项</span></div>
      <p class="sm dim" style="margin:0 0 9px">你现在是 <b>${(window.RANK ? RANK.byIndex(lv).name : '科员')}</b>，能办下面这些事。</p>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px">
        ${avail.map(a => {
          const canAp = (p.ap || 0) >= a.ap;
          const canCash = (g.finance || 0) * 10000 >= a.cash;
          const ok = canAp && canCash;
          return `<button class="govAct" data-act="${a.key}" ${ok ? '' : 'disabled'}
            style="text-align:left;border:1px solid ${a.risk > 8 ? '#e0b8b2' : 'var(--line)'};
            background:${a.risk > 8 ? '#fff8f7' : '#fffdfa'};border-radius:10px;padding:8px 10px;cursor:pointer;
            opacity:${ok ? 1 : .5}">
            <div style="font-size:12.5px;font-weight:600;color:${a.risk > 8 ? '#a5463e' : '#5b3b6f'}">${a.n}</div>

              ${a.ap} 行动点${a.cash ? ' · ' + (a.cash / 10000).toFixed(2) + ' 亿' : ''}${a.risk ? ' · 风险+' + a.risk : ''}

        <div class="sm dim" style="margin-bottom:5px">职级不够，还办不了：</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px">

        </div>
      </div>` : ''}
    </div>`;
  };

  /* ---------------- 等距城市沙盘（Canvas） ---------------- */
  window.drawTown = function (canvas, g) {
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.clientWidth, H = canvas.clientHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const p = g.player;
    const pos = p.position || {};
    if (!g.town) g.town = genTown(g, pos.province || '', pos.county || '');
    const T = g.town;

    const OX = W / 2 - 250, OY = 70;
    const ISO = (x, y) => [OX + (x - y) * 0.86, OY + (x + y) * 0.5];

    /* 地面 */
    ctx.fillStyle = '#eef3ec';
    const g0 = ISO(-40, -40), g1 = ISO(660, -40), g2 = ISO(660, 660), g3 = ISO(-40, 660);
    ctx.beginPath(); ctx.moveTo(...g0); ctx.lineTo(...g1); ctx.lineTo(...g2); ctx.lineTo(...g3); ctx.closePath(); ctx.fill();

    /* 道路 */
    ctx.fillStyle = '#4b5158';
    for (let i = 0; i <= 6; i++) {
      const a = ISO(i * 100 - 8, -40), b = ISO(i * 100 + 8, -40);
      const c = ISO(i * 100 + 8, 660), dd = ISO(i * 100 - 8, 660);
      ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...c); ctx.lineTo(...dd); ctx.lineTo(...b); ctx.closePath(); ctx.fill();
      const e = ISO(-40, i * 100 - 8), f = ISO(-40, i * 100 + 8);
      const g4 = ISO(660, i * 100 + 8), h4 = ISO(660, i * 100 - 8);
      ctx.beginPath(); ctx.moveTo(...e); ctx.lineTo(...g4); ctx.lineTo(...f); ctx.lineTo(...h4); ctx.closePath(); ctx.fill();
    }
    /* 道路虚线 */
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1; ctx.setLineDash([6, 8]);
    for (let i = 0; i <= 6; i++) {
      let a = ISO(i * 100, 0), b = ISO(i * 100, 600);
      ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke();
      a = ISO(0, i * 100); b = ISO(600, i * 100);
      ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke();
    }
    ctx.setLineDash([]);

    /* 建筑（按 y 排序，远的先画） */
    const blocks = T.blocks.slice().sort((a, b) => (a.x + a.y) - (b.x + b.y));
    const TONES = [
      ['#dbe7f3', '#b9cfe6', '#93aecb'], /* 玻璃蓝 */
      ['#f0e6dc', '#dccbb8', '#bda994'], /* 米白 */
      ['#f5d9d4', '#e0b4ac', '#c08f86'], /* 红砖 */
      ['#e6f0e4', '#c8dcc6', '#a3bfa0'], /* 青绿 */
    ];
    blocks.forEach(b => {
      const tone = TONES[b.tone % 4];
      const isGov = b.kind === 'hall' || b.kind === 'gov';
      const A = ISO(b.x, b.y), B = ISO(b.x + b.w, b.y), C = ISO(b.x + b.w, b.y + b.h), D = ISO(b.x, b.y + b.h);
      if (b.kind === 'water') {
        ctx.fillStyle = '#a8cfe0';
        ctx.beginPath(); ctx.moveTo(...A); ctx.lineTo(...B); ctx.lineTo(...C); ctx.lineTo(...D); ctx.closePath(); ctx.fill();
        return;
      }
      if (b.kind === 'park') {
        ctx.fillStyle = '#a9d18a';
        ctx.beginPath(); ctx.moveTo(...A); ctx.lineTo(...B); ctx.lineTo(...C); ctx.lineTo(...D); ctx.closePath(); ctx.fill();
        return;
      }
      const hgt = isGov ? b.hgt * 0.7 : b.hgt;
      const lift = (pt) => [pt[0], pt[1] - hgt];
      const A2 = lift(A), B2 = lift(B), C2 = lift(C), D2 = lift(D);
      /* 顶面 */
      ctx.fillStyle = isGov ? '#fff6e0' : tone[0];
      ctx.beginPath(); ctx.moveTo(...A2); ctx.lineTo(...B2); ctx.lineTo(...C2); ctx.lineTo(...D2); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.08)'; ctx.stroke();
      /* 侧面 */
      ctx.fillStyle = isGov ? '#e8d5a8' : tone[1];
      ctx.beginPath(); ctx.moveTo(...B); ctx.lineTo(...C); ctx.lineTo(...C2); ctx.lineTo(...B2); ctx.closePath(); ctx.fill();
      ctx.fillStyle = isGov ? '#d4bd8c' : tone[2];
      ctx.beginPath(); ctx.moveTo(...C); ctx.lineTo(...D); ctx.lineTo(...D2); ctx.lineTo(...C2); ctx.closePath(); ctx.fill();
      /* 窗户 */
      if (hgt > 34) {
        ctx.fillStyle = 'rgba(255,255,255,.42)';
        const floors = Math.floor(hgt / 14);
        for (let f = 1; f <= floors; f++) {
          const dy = f * 14;
          const p1 = [B[0], B[1] - dy], p2 = [C[0], C[1] - dy];
          const steps = Math.max(2, Math.round(b.w / 22));
          for (let s2 = 0; s2 < steps; s2++) {
            const t0 = s2 / steps, t1 = t0 + 0.6 / steps;
            const q1 = [p1[0] + (p2[0] - p1[0]) * t0, p1[1] + (p2[1] - p1[1]) * t0];
            const q2 = [p1[0] + (p2[0] - p1[0]) * t1, p1[1] + (p2[1] - p1[1]) * t1];
            ctx.fillRect(q1[0], q1[1] - 5, Math.max(2, q2[0] - q1[0]), 5);
          }
        }
      }
      /* 政府楼标签 */
      if (isGov && !b.__lab) {
        const lx = (A2[0] + C2[0]) / 2, ly = A2[1] - 14;
        ctx.font = '600 11px "Microsoft YaHei",sans-serif';
        const txt = (pos.county || '本地') + (b.kind === 'hall' ? '人民政府' : '机关');
        const tw = ctx.measureText(txt).width;
        ctx.fillStyle = 'rgba(255,253,250,.95)';
        roundRect(ctx, lx - tw / 2 - 7, ly - 12, tw + 14, 18, 5); ctx.fill();
        ctx.strokeStyle = '#c9a227'; ctx.lineWidth = 1; ctx.stroke();
        ctx.fillStyle = '#8a6a33';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(txt, lx, ly - 3);
        ctx.textAlign = 'start';
      }
    });

    /* 底部说明 */
    ctx.font = '11px "Microsoft YaHei",sans-serif';
    ctx.fillStyle = '#7a7186';
    ctx.fillText(`已建 ${T.buildings || 0} · 已拆 ${T.demolished || 0} · 修路 ${T.roads || 0} · 公园 ${T.parks || 0}`, W - 190, 18);
  };

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  window.renderTownCard = function (g) {
    const pos = (g.player.position) || {};
    return `<div class="card">
      <div class="ch"><span class="ic">城</span><h3>辖区沙盘</h3>
        <span class="tail">${pos.county || '本地'} · ${pos.city || ''}</span></div>
      <canvas id="townCanvas" style="width:100%;height:320px;display:block;border-radius:10px;background:#fbf8fd"></canvas>
      <p class="sm dim" style="margin:8px 0 0">施工、拆迁、修路后，这片区域的地貌会跟着变。</p>
    </div>`;
  };

  /* ---------------- 执行事务 ---------------- */
  window.runGovAction = function (g, key) {
    const a = ACTIONS.find(x => x.key === key);
    if (!a) return { ok: false, msg: '没有这个事项' };
    const p = g.player;
    if ((p.level || 0) < a.lv) return { ok: false, msg: '职级不够：需 ' + RANK.byIndex(a.lv).name };
    if ((p.ap || 0) < a.ap) return { ok: false, msg: '行动点不够' };
    if (a.cash && (g.finance || 0) * 10000 < a.cash) return { ok: false, msg: '财政不够（需 ' + (a.cash / 10000).toFixed(2) + ' 亿）' };
    p.ap -= a.ap;
    if (a.cash) g.finance -= a.cash / 10000;
    /* 先确保沙盘存在，fx 里要用 */
    if (!g.town) { const pos0 = p.position || {}; g.town = genTown(g, pos0.province || '', pos0.county || ''); }
    a.fx(g);
    if (a.risk > 0 && window.RISK) RISK.add(g, 'house', a.n, a.risk / 12);
    if (a.risk < 0 && window.RISK) RISK.clearSome(g, 0.3);
    if (!g.town) {
      const pos = p.position || {};
      g.town = genTown(g, pos.province || '', pos.county || '');
    }
    if (a.key === 'build') { g.town.blocks.push(makeNew(g, 'bldg')); g.town.buildings = (g.town.buildings || 0) + 1; }
    if (a.key === 'demolish') { g.town.blocks = g.town.blocks.slice(0, Math.max(6, g.town.blocks.length - 2)); g.town.demolished++; }
    if (a.key === 'park') { g.town.blocks.push(makeNew(g, 'park')); g.town.parks = (g.town.parks || 0) + 1; }
    if (a.key === 'road') g.town.roads++;
    if (a.key === 'zone') { for (let i = 0; i < 4; i++) g.town.blocks.push(makeNew(g, 'bldg')); }
    return { ok: true, action: a };
  };

  function makeNew(g, kind) {
    const T = g.town;
    const x = 20 + Math.random() * 480, y = 20 + Math.random() * 480;
    return {
      x, y, w: 60 + Math.random() * 20, h: 60 + Math.random() * 20,
      hgt: kind === 'park' ? 0 : 30 + Math.random() * 70,
      kind, tone: Math.floor(Math.random() * 4), fresh: true,
    };
  }

  window.__mapState = { get selProv() { return selProv; }, set selProv(v) { selProv = v; } };
})();
</script>

(function () {

    g1:  { code: 'G1', n: '公园绿地',           c: '#c3e88d', cost: 0.003, lv: 1, eco: 2, happy: 2, cat: '绿地' },
    g2:  { code: 'G2', n: '防护绿地',           c: '#a9d18a', cost: 0.002, lv: 1, eco: 1.5, cat: '绿地' },
    g3:  { code: 'G3', n: '广场用地',           c: '#e0d6c0', cost: 0.004, lv: 2, happy: 1, cat: '绿地' },
    e2:  { code: 'E2', n: '农林用地',           c: '#bfe0b0', cost: 0.002, lv: 1, eco: 1, cat: '绿地' },
  };
  const CATS = ['居住', '商业', '工业', '物流', '公共', '绿地'];

  /* 别名只在内部用，不进工具列表 */
  const ZONE_KEYS = ['r1','r2','r3','b1','b2','m1','m2','m3','w','a1','a3','a5','g1','g2','g3','e2'];

  /* 城市规模分级（2014 国务院《关于调整城市规模划分标准的通知》） */
  function cityScale(pop) {
    if (pop >= 10000000) return { n: '超大城市', up: '特大城市', need: 10000000 };
    if (pop >= 5000000)  return { n: '特大城市', up: '超大城市', need: 10000000 };
    if (pop >= 1000000)  return { n: '大城市',   up: '特大城市', need: 5000000 };
    if (pop >= 500000)   return { n: '中等城市', up: '大城市',   need: 1000000 };
    return { n: '小城市', up: '中等城市', need: 500000 };
  }

  /* ---------------- 线性设施（拉线） ---------------- */
  const LINE = {
    road:  { n: '道路',   c: '#f0d78c', w: 4,  cost: 0.003, lv: 1 },
    metro: { n: '地铁',   c: '#6a7fa8', w: 5,  cost: 0.06,  lv: 4 },
    expwy: { n: '高速',   c: '#d8b840', w: 6,  cost: 0.08,  lv: 5 },
    rail:  { n: '铁路',   c: '#3a3a3a', w: 5,  cost: 0.12,  lv: 7, tick: true },
    hsr:   { n: '高铁',   c: '#e05050', w: 5,  cost: 0.25,  lv: 6, tick: true },
  };

  /* 单点设施（点击放置） */
  const POINT = {
    water:   { n: '自来水厂', c: '#7fd0e8', cost: 0.30, lv: 3 },
    power:   { n: '变电站',   c: '#f0c060', cost: 0.40, lv: 3 },
    waste:   { n: '垃圾处理厂',c: '#c0b8a8', cost: 0.35, lv: 3 },
    fire:    { n: '消防站',   c: '#e88a7a', cost: 0.20, lv: 2 },
    airport: { n: '机场',     c: '#5d6f8c', cost: 1.20, lv: 6 },
    port:    { n: '港口码头', c: '#3a7ca5', cost: 0.90, lv: 6 },
    station: { n: '高铁站',   c: '#e05050', cost: 0.60, lv: 5 },
  };

  const TERRAIN = {
    water:  { n: '水域', c: '#a8d5e8' },
    forest: { n: '林地', c: '#9ed18a' },
    mtn:    { n: '山地', c: '#cfcfc0' },
    farm:   { n: '农田', c: '#dceeb5' },
    empty:  { n: '空地', c: '#f5f2ea' },
  };

  /* ---------------- 管辖范围 ---------------- */
  window.GOV_SCOPE = function (g) {
    const p = g.player;
    const pos = p.position || {};
    const lv = p.level || 0;
    const prov = pos.province || '某省';
    const city = pos.city || '某市';
    const county = pos.county || '某县';

    if (lv <= 1) return { key: 'dept', name: (pos.org || '机关') + '周边', w: 22, h: 15, lv,
      prov, city, county, canBuild: false, canDemolish: false, showsCities: false,
      areaText: county + '·' + (pos.org || '') + ' 附近约 1 平方公里',
      note: '科员/副科级：只有知情权，没有审批权' };
    if (lv <= 2) return { key: 'county', name: county + '全境', w: 40, h: 26, lv,
      prov, city, county, canBuild: true, canDemolish: false, showsCities: false,
      areaText: prov + '·' + city + '·' + county + '（全县域规划）',
      note: '正科级：可批建设项目，征地拆迁要报上级' };
    if (lv <= 3) return { key: 'county2', name: county + '全境', w: 40, h: 26, lv,
      prov, city, county, canBuild: true, canDemolish: true, showsCities: false,
      areaText: prov + '·' + city + '·' + county + '（副处级全县域）',
      note: '副处级：副县长/区长，可批征收拆迁' };
    if (lv <= 5) {
      const cs = (window.FY && FY.areaMap) ? (FY.areaMap[prov + '|' + city] || []) : [];
      return { key: 'city', name: city + '辖区', w: 56, h: 34, lv,
        prov, city, county, canBuild: true, canDemolish: true, showsCities: true,
        cities: cs, areaText: prov + '·' + city + '（下辖 ' + cs.length + ' 个区县）',
        note: lv === 4 ? '正处级：市长/县委书记，全市规划与征地审批权' : '副厅级：副市长，全市重大项目审批' };
    }
    const cs2 = (window.FY && FY.cityMap) ? (FY.cityMap[prov] || []) : [];
    return { key: 'prov', name: prov, w: 78, h: 46, lv,
      prov, city, county, canBuild: true, canDemolish: true, showsCities: true,
      cities: cs2, areaText: prov + '（下辖 ' + cs2.length + ' 个地级市）',
      note: lv >= 7 ? '省级：副省长及以上，可批铁路、高铁、机场' : '厅级：全省域规划权' };
  };

  /* ---------------- 生成城市 ---------------- */
  function genCity(g, scope) {
    const seedStr = g.seed + '|' + scope.key + '|' + scope.prov + '|' + scope.city + '|' + scope.county;
    let s = 2166136261;
    for (let i = 0; i < seedStr.length; i++) { s ^= seedStr.charCodeAt(i); s = Math.imul(s, 16777619); }
    s = Math.abs(s);
    const r = () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };

    const W = scope.w, H = scope.h;
    const terr = [], zone = [];
    const cx = W / 2, cy = H / 2;
    const riverY = x => cy + Math.sin(x / 5.5) * (H * 0.09) + (x - cx) * 0.09;

    /* 先算城市中心：省级/市级每个市区一个城区 */
    const labels = [];
    const centers = [];
    if (scope.showsCities && scope.cities && scope.cities.length) {
      const n = scope.cities.length;
      const cols = Math.ceil(Math.sqrt(n * 1.5));
      const rows = Math.ceil(n / cols);
      for (let i = 0; i < n; i++) {
        const col = i % cols, row = Math.floor(i / cols);
        const lx = 6 + col * ((W - 12) / Math.max(1, cols - 1)) + (r() - 0.5) * 2.5;
        const ly = 6 + row * ((H - 12) / Math.max(1, rows - 1 || 1)) + (r() - 0.5) * 2;
        const cx2 = Math.round(lx), cy2 = Math.round(ly);
        const rad = 4.2 + r() * 2.6;
        labels.push({ x: cx2, y: cy2, t: scope.cities[i], rad });
        centers.push({ x: cx2, y: cy2, rad });
      }
    } else {
      centers.push({ x: Math.round(cx), y: Math.round(cy), rad: Math.min(W, H) * 0.32 });
    }

    const line = [];   /* 三区三线：urban 城镇开发边界 / farmP 永久基本农田 / eco 生态保护红线 / other 一般区域 */
    for (let y = 0; y < H; y++) {
      const tr = [], zr = [], ln = [];
      for (let x = 0; x < W; x++) {
        /* 与最近城市中心的距离 */
        let best = 1e9, bc = null;
        for (const cn of centers) {
          const dd = Math.hypot(x - cn.x, y - cn.y) / cn.rad;
          if (dd < best) { best = dd; bc = cn; }
        }
        let t = 'empty';
        if (best > 1.35) t = r() < 0.55 ? 'forest' : r() < 0.9 ? 'farm' : 'mtn';
        else if (best > 0.95) t = r() < 0.3 ? 'forest' : r() < 0.62 ? 'farm' : 'empty';
        if (Math.abs(y - riverY(x)) < 1.1 && x > 2 && x < W - 2 && best > 0.55) t = 'water';
        tr.push(t);
        /* 城区：中心是建成区 */
        let z = null;
        if (t === 'empty' && best < 0.78) {
          const rr = r();
          if (rr < 0.30) z = 'r2';
          else if (rr < 0.40) z = 'r1';
          else if (rr < 0.56) z = 'b1';
          else if (rr < 0.68) z = 'm2';
          else if (rr < 0.74) z = 'm1';
          else if (rr < 0.80) z = 'g1';
          else if (rr < 0.85) z = 'a3';
          else if (rr < 0.89) z = 'a5';
          else if (rr < 0.93) z = 'w';
          else if (rr < 0.96) z = 'g3';
          else z = 'a1';
        }
        zr.push(z);
        /* 三区三线判定 */
        let lc = 'other';
        if (best <= 0.78 || z) lc = 'urban';                       /* 城镇开发边界内 */
        else if (t === 'water' || t === 'mtn') lc = 'eco';         /* 生态保护红线 */
        else if (t === 'forest') lc = r() < 0.55 ? 'eco' : 'other'; /* 一半林地划入红线 */
        else if (t === 'farm') lc = r() < 0.62 ? 'farmP' : 'other'; /* 大部分是永久基本农田 */
        ln.push(lc);
      }
      terr.push(tr); zone.push(zr); line.push(ln);
    }

    /* 初始路网：每个城区一条横纵主干（线条） */
    const roads = [];
    centers.forEach(cn => {
      const my = Math.round(cn.y), mx = Math.round(cn.x);
      const h = [], v = [];
      for (let x = Math.max(1, mx - Math.round(cn.rad * 1.6)); x <= Math.min(W - 2, mx + Math.round(cn.rad * 1.6)); x++) {
        if (terr[my] && terr[my][x] !== 'water') h.push([x, my]); else if (h.length) { roads.push(h.slice()); h.length = 0; }
      }
      if (h.length) roads.push(h);
      for (let y = Math.max(1, my - Math.round(cn.rad * 1.3)); y <= Math.min(H - 2, my + Math.round(cn.rad * 1.3)); y++) {
        if (terr[y] && terr[y][mx] !== 'water') v.push([mx, y]); else if (v.length) { roads.push(v.slice()); v.length = 0; }
      }
      if (v.length) roads.push(v);
    });
    if (!roads.length) { const tmp = []; for (let x = 2; x < W - 2; x++) tmp.push([x, Math.round(cy)]); roads.push(tmp); }

    /* 机关用地 */
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const y = Math.round(cy) + dy - 2, x = Math.round(cx) + dx;
      if (zone[y] && zone[y][x] !== undefined && terr[y][x] !== 'water') zone[y][x] = 'a1';
    }

    return {
      W, H, terr, zone, line, roads, labels,
      points: [],   /* {x,y,kind} */
      lines: [],
      history: [],
      name: scope.name, scopeKey: scope.key,
    };
  }

  /* ---------------- 城市数据统计 ---------------- */
  function cityStats(g) {
    const c = g.townGrid;
    const cnt = {};
    Object.keys(ZONE).forEach(k => cnt[k] = 0);
    ['r1','r2','r3','b1','b2','m1','m2','m3','w','a1','a3','a5','g1','g2','g3','e2'].forEach(k => cnt[k] = cnt[k] || 0);
    c.zone.forEach(r => r.forEach(z => { if (z && cnt[z] !== undefined) cnt[z]++; }));
    const res = (cnt.r1||0) + (cnt.r2||0) + (cnt.r3||0);
    const com = (cnt.b1||0) + (cnt.b2||0);
    const ind = (cnt.m1||0) + (cnt.m2||0) + (cnt.m3||0);
    const green = (cnt.g1||0) + (cnt.g2||0) + (cnt.g3||0);
    const edu = cnt.a3||0, med = cnt.a5||0, gov = cnt.a1||0, logi = cnt.w||0, util = cnt.e2||0;

    let roadLen = 0, railLen = 0, metroLen = 0, expLen = 0;
    c.roads.forEach(line => {
      for (let i = 1; i < line.length; i++) {
        const [x1, y1] = line[i - 1], [x2, y2] = line[i];
        roadLen += Math.hypot(x2 - x1, y2 - y1);
      }
    });
    (c.lines || []).forEach(L => {
      if (L.kind === 'rail' || L.kind === 'hsr') railLen += L.pts.length;
      if (L.kind === 'metro') metroLen += L.pts.length;
      if (L.kind === 'expwy') expLen += L.pts.length;
    });

    /* 每格 200m × 200m = 4 公顷 = 0.04 km² */
    const scope0x = window.GOV_SCOPE(g);
    const TILE_KM2 = { dept: 0.04, county: 0.25, county2: 0.25, city: 1.0, prov: 4.0 }[scope0x.key] || 0.04;
    const TILE_M = { dept: 200, county: 500, county2: 500, city: 1000, prov: 2000 }[scope0x.key] || 200;
    const built = res + com + ind + edu + med + gov + logi + util + green + Math.round(roadLen * 0.35);
    const landKm2 = built * TILE_KM2;
    g.townGrid.__tileM = TILE_M;
    const landHa = landKm2 * 100;

    const scope0 = window.GOV_SCOPE(g);
    const POP_MULT = { dept: 1, county: 30, county2: 30, city: 120, prov: 450 }[scope0.key] || 1;
    const popRaw = (cnt.r1||0) * ZONE.r1.pop + (cnt.r2||0) * ZONE.r2.pop + (cnt.r3||0) * ZONE.r3.pop;
    const pop = Math.round(popRaw * POP_MULT);
    const jobsRaw = (cnt.b1||0)*ZONE.b1.jobs + (cnt.b2||0)*ZONE.b2.jobs
      + (cnt.m1||0)*ZONE.m1.jobs + (cnt.m2||0)*ZONE.m2.jobs + (cnt.m3||0)*ZONE.m3.jobs
      + (cnt.a1||0)*ZONE.a1.jobs + (cnt.a3||0)*ZONE.a3.jobs + (cnt.a5||0)*ZONE.a5.jobs
      + (cnt.w||0)*ZONE.w.jobs;
    const jobs = Math.round(jobsRaw * POP_MULT);
    const labor = pop * 0.62;
    const unemp = labor > 0 ? cl((labor - jobs) / labor * 100, 0, 45) : 0;
    const gdp = (com * 0.05 + ind * 0.11 + res * 0.02 + gov * 0.01 + logi * 0.04 +
      (roadLen + expLen) * 0.004 + railLen * 0.01);
    const revenue = gdp * 10000 * 0.042;
    const expense = 120 + (roadLen + expLen + railLen) * 1.6 + built * 0.6 + (c.points || []).length * 30;
    const firms = com * 4 + ind * 7 + logi * 3;

    /* ===== 中国规划标准指标 ===== */
    const greenRate = built > 0 ? green / built * 100 : 0;
    const resRate = built > 0 ? res / built * 100 : 0;
    const indRate = built > 0 ? ind / built * 100 : 0;
    const roadRate = built > 0 ? Math.round(roadLen * 0.35) / built * 100 : 0;
    const perCapitaLand = pop > 0 ? landHa * 10000 / pop : 0;
    const scale = cityScale(pop);

    /* 公共服务覆盖率（按建成区规模，规模无关） */
    const eduNeed = Math.max(1, built / 15);
    const medNeed = Math.max(1, built / 20);
    const eduCov = cl(edu / eduNeed * 100, 0, 100);
    const medCov = cl(med / medNeed * 100, 0, 100);

    /* 公园绿地占建设用地比例（国标 ≥5%） */
    const parkRate = built > 0 ? (cnt.g1 || 0) / built * 100 : 0;
    const parkArea = (cnt.g1 || 0) * TILE_KM2 * 1000000;
    const parkPerCap = pop > 0 ? parkArea / pop : 0;
    const parkCov = cl(parkRate / 5 * 100, 0, 100);

    /* 生态：林地水面占比 + 工业扣分 */
    const eco = cl(45 + green / Math.max(1, built) * 120 - ind / Math.max(1, built) * 80, 0, 100);

    /* 宜居：绿地率 30% 满分 + 就业 + 公共服务 - 工业污染 */
    const happy = cl(
      30
      + Math.min(30, greenRate / 30 * 30)
      + (unemp < 5 ? 15 : unemp < 10 ? 9 : unemp < 20 ? 4 : 0)
      + Math.min(25, (eduCov + medCov) / 2 * 0.25)
      - Math.max(0, indRate - 25) * 0.8
      , 0, 100);

    /* ===== 三区三线统计 ===== */
    let urbanCnt = 0, farmPCnt = 0, ecoCnt = 0, otherCnt = 0, occupy = c.occupy || 0;
    (c.line || []).forEach(row => row.forEach(l => {
      if (l === 'urban') urbanCnt++;
      else if (l === 'farmP') farmPCnt++;
      else if (l === 'eco') ecoCnt++;
      else otherCnt++;
    }));
    const totalTile = c.W * c.H;
    const urbanPct = urbanCnt / totalTile * 100;
    const farmPPct = farmPCnt / totalTile * 100;
    const ecoPct = ecoCnt / totalTile * 100;
    const occupyRate = occupy / Math.max(1, built) * 100;

    /* ===== 扩展指标 ===== */
    const builtSafe = Math.max(1, built);
    const popDensity = landKm2 > 0 ? pop / landKm2 : 0;              /* 人/km² */
    const urbanRate = cl(30 + (res + com + ind + gov) / builtSafe * 100, 0, 99);  /* 城镇化率 */
    const aging = cl(12 + (1 - eduCov / 100) * 8 + unemp * 0.1, 5, 40);           /* 老龄化率 */
    const migrant = cl((com + ind) / builtSafe * 100 * 0.8, 0, 60);               /* 外来人口占比 */
    /* 三次产业（按用地与产值推算） */
    const p1 = cl(100 - (com + ind) / builtSafe * 140, 0.5, 40);                   /* 一产占比 */
    const p2 = cl(ind / builtSafe * 130, 5, 65);                                   /* 二产占比 */
    const p3 = cl(100 - p1 - p2, 10, 80);                                          /* 三产占比 */
    /* 财政细项 */
    const landRevenue = res * 0.0015 + com * 0.002;                                /* 土地出让金 亿 */
    const landWan = landRevenue * 10000;
    const landDepend = (revenue + landWan) > 0 ? cl(landWan / (revenue + landWan) * 100, 0, 95) : 0;
    const transfer = Math.round(gdp * 10000 * 0.08);                               /* 年度转移支付 万 */
    const taxRate = cl(6 + (com + ind) / builtSafe * 20, 3, 30);
    /* 居民收入 */
    const income = Math.round(28000 + gdp * 10000 * 0.0009 + (1 - unemp / 100) * 12000);
    /* 生态环境 */
    const aqi = Math.round(cl(120 - green / builtSafe * 200 + ind / builtSafe * 120, 15, 180));
    const waterQ = Math.round(cl(40 + green / builtSafe * 160 - ind / builtSafe * 60, 20, 100));
    const noise = Math.round(cl(45 + (roadLen + expLen) / builtSafe * 30, 35, 75));
    const greenCover = cl(greenRate * 1.6, 0, 60);
    /* 治安 */
    const crime = Math.round(built * 0.35 + pop / 20000 * (1 - (happy / 100)) * 40);
    const petition = Math.round((1 - happy / 100) * built * 0.8 + unemp * 1.5);
    const order = cl(happy * 0.9 + 10, 0, 100);
    /* 财政景气 */
    const balance = revenue - expense;
    const debtRate = cl(60 - balance / Math.max(1, revenue) * 40, 0, 100);
    /* 房屋与财政 */
    const housingCap = res * 6;                                  /* 每格住宅 6 套 */
    const housingOcc = Math.round(Math.min(housingCap, pop / 3.2));
    const vacancy = housingCap > 0 ? cl((housingCap - housingOcc) / housingCap * 100, 0, 60) : 0;
    const rateNow = g.taxRate || 2;                              /* 税率 % */
    const budget = Math.round((revenue - expense) * 12);         /* 年度预算 万 */
    const landArea = c.W * c.H * TILE_KM2;                       /* 总面积 km² */

    return { res, com, ind, green, edu, med, gov, logi, util,
      built: builtSafe, popDensity, urbanRate, aging, migrant, p1, p2, p3,
      urbanCnt, farmPCnt, ecoCnt, otherCnt, urbanPct, farmPPct, ecoPct, occupy, occupyRate,
      housingCap, housingOcc, vacancy, rateNow, budget, landArea,
      landRevenue, landDepend, transfer, taxRate, income,
      aqi, waterQ, noise, greenCover, crime, petition, order, balance, debtRate,
      roadLen: Math.round(roadLen), railLen: Math.round(railLen),
      metroLen: Math.round(metroLen), expLen: Math.round(expLen),
      pop, jobs, unemp, gdp, revenue, expense, eco, happy, firms,
      built, landKm2, landHa, perCapitaLand, greenRate, resRate, indRate, roadRate,
      scale, cnt, eduCov, medCov, parkCov, parkPerCap, parkRate, eduNeed, medNeed };
  }

  /* ---------------- 视图状态 ---------------- */

              <div class="sm dim" style="margin:9px 0 4px">生态环境</div>

              <div class="kv" style="padding:2px 0"><span>绿化覆盖率</span><span>${st.greenCover.toFixed(1)}%</span></div>

              ${Object.keys(ZONE).filter(k => ZONE[k].code).map(k => {

                const z = ZONE[k];

                  '<span class="swatch" style="background:' + z.c + '"></span>' +

              <p class="sm dim" style="margin:8px 0 0">R 居住 · A 公共管理 · B 商业 · M 工业 · W 物流 · S 交通 · U 公用 · G 绿地</p>

  };

  /* ---------------- 画布 ---------------- */
  window.initCityCanvas = function (g) {
    const scope = window.GOV_SCOPE(g);
    const cv = $('#cityCanvas');
    if (!cv || !g.townGrid) return;
    const ctx = cv.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const W = cv.clientWidth, H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const c = g.townGrid;

    if (!view.init) {
      view.size = Math.max(8, Math.floor(Math.min(W / c.W, H / c.H)));
      view.ox = (W - c.W * view.size) / 2;
      view.oy = (H - c.H * view.size) / 2;
      view.init = true;
    }
    const sz = () => view.size;
    const px = x => view.ox + x * sz();
    const py = y => view.oy + y * sz();

    const toTile = ev => {
      const r = cv.getBoundingClientRect();
      const x = Math.floor((ev.clientX - r.left - view.ox) / sz());
      const y = Math.floor((ev.clientY - r.top - view.oy) / sz());
      return { x, y };
    };

    const draw = () => {
      const S = sz();
      ctx.fillStyle = '#eef4ec'; ctx.fillRect(0, 0, W, H);

      /* 地形 */
      for (let y = 0; y < c.H; y++) for (let x = 0; x < c.W; x++) {
        const t = c.terr[y][x];
        ctx.fillStyle = (TERRAIN[t] || TERRAIN.empty).c;
        ctx.fillRect(px(x), py(y), S + 1, S + 1);
      }
      /* 三区三线底纹 */
      const LN = c.line || [];
      for (let y = 0; y < c.H; y++) for (let x = 0; x < c.W; x++) {
        const l = LN[y] && LN[y][x];
        if (l !== 'eco' && l !== 'farmP') continue;
        const px0 = px(x), py0 = py(y);
        if (px0 + S < -4 || py0 + S < -4 || px0 > W + 4 || py0 > H + 4) continue;
        ctx.save();
        ctx.beginPath(); ctx.rect(px0, py0, S + 1, S + 1); ctx.clip();
        ctx.strokeStyle = l === 'eco' ? 'rgba(40,120,80,.22)' : 'rgba(180,140,40,.20)';
        ctx.lineWidth = 1;
        const step = Math.max(4, S / 3);
        for (let k = -S; k < S * 2; k += step) {
          ctx.beginPath();
          ctx.moveTo(px0 + k, py0);
          ctx.lineTo(px0 + k + S, py0 + S);
          ctx.stroke();
        }
        ctx.restore();
      }

      /* 分区 */
      for (let y = 0; y < c.H; y++) for (let x = 0; x < c.W; x++) {
        const z = c.zone[y][x];
        if (!z || !ZONE[z]) continue;
        const px0 = px(x), py0 = py(y);
        if (px0 + S < -4 || py0 + S < -4 || px0 > W + 4 || py0 > H + 4) continue;
        ctx.fillStyle = ZONE[z].c;
        ctx.fillRect(px0, py0, S + 1, S + 1);
        /* 住宅画小窗，商业画竖条，工业画屋顶 */
        if (S >= 9) {
          ctx.fillStyle = 'rgba(255,255,255,.45)';
          if (z === 'res') { ctx.fillRect(px0 + S * .22, py0 + S * .22, S * .24, S * .24); ctx.fillRect(px0 + S * .54, py0 + S * .22, S * .24, S * .24); }
          else if (z === 'com') { ctx.fillRect(px0 + S * .3, py0 + S * .18, S * .4, S * .64); }
          else if (z === 'ind') { ctx.fillRect(px0 + S * .18, py0 + S * .3, S * .64, S * .4); }
        }
      }
      /* 网格线（淡） */
      if (S >= 8) {
        ctx.strokeStyle = 'rgba(0,0,0,.05)'; ctx.lineWidth = .5;
        for (let x = 0; x <= c.W; x++) { ctx.beginPath(); ctx.moveTo(px(x), py(0)); ctx.lineTo(px(x), py(c.H)); ctx.stroke(); }
        for (let y = 0; y <= c.H; y++) { ctx.beginPath(); ctx.moveTo(px(0), py(y)); ctx.lineTo(px(c.W), py(y)); ctx.stroke(); }
      }

      /* 线性设施：先画底，再画虚线 */
      const drawLine = (pts, color, w, dashed) => {
        if (!pts || pts.length < 2) return;
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.strokeStyle = color;
        ctx.lineWidth = w;
        ctx.beginPath();
        ctx.moveTo(px(pts[0][0]) + S / 2, py(pts[0][1]) + S / 2);
        for (let i = 1; i < pts.length; i++) ctx.lineTo(px(pts[i][0]) + S / 2, py(pts[i][1]) + S / 2);
        ctx.stroke();
        if (dashed) {
          ctx.setLineDash([w * 1.6, w * 1.4]);
          ctx.strokeStyle = 'rgba(255,255,255,.9)';
          ctx.lineWidth = Math.max(1, w * 0.45);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      };
      /* 道路 */
      c.roads.forEach(line => drawLine(line, LINE.road.c, LINE.road.w, false));
      /* 其他线性 */
      (c.lines || []).forEach(L => {
        const def = LINE[L.kind] || LINE.road;
        drawLine(L.pts, def.c, def.w, !!def.tick);
      });
      /* 单点设施 */
      (c.points || []).forEach(pt => {
        const def = POINT[pt.kind];
        if (!def) return;
        const cx0 = px(pt.x) + S / 2, cy0 = py(pt.y) + S / 2;
        ctx.fillStyle = def.c;
        ctx.beginPath(); ctx.arc(cx0, cy0, Math.max(4, S * .55), 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
        if (S >= 10) {
          ctx.fillStyle = '#fff'; ctx.font = 'bold ' + Math.max(7, S * .42) + 'px "Microsoft YaHei"';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(def.n[0], cx0, cy0 + .5);
          ctx.textAlign = 'start';
        }
      });

      /* 城市名标注（省市级） */
      if (c.labels && c.labels.length) {
        c.labels.forEach(L => {
          const x0 = px(L.x), y0 = py(L.y);
          ctx.font = '600 11px "Microsoft YaHei",sans-serif';
          const tw = ctx.measureText(L.t).width;
          ctx.fillStyle = 'rgba(255,253,250,.92)';
          ctx.strokeStyle = '#c9a227'; ctx.lineWidth = 1;
          roundRect(ctx, x0 - tw / 2 - 6, y0 - 9, tw + 12, 17, 5);
          ctx.fill(); ctx.stroke();
          ctx.fillStyle = '#8a6a33'; ctx.textBaseline = 'middle';
          ctx.fillText(L.t, x0 - tw / 2, y0);
          ctx.textBaseline = 'alphabetic';
          ctx.fillStyle = '#c9a227';
          ctx.beginPath(); ctx.arc(x0, y0 + 11, 2, 0, Math.PI * 2); ctx.fill();
        });
      }

      /* 拖动预览 */
      if (drag && drag.active) {
        ctx.save();
        if (curKind === 'zone' || curKind === 'demolish') {
          const x0 = Math.min(drag.sx, drag.cx), x1 = Math.max(drag.sx, drag.cx);
          const y0 = Math.min(drag.sy, drag.cy), y1 = Math.max(drag.sy, drag.cy);
          const isDem = curKind === 'demolish';
          ctx.fillStyle = isDem ? 'rgba(200,60,50,.22)' : ((ZONE[curTool] ? ZONE[curTool].c : '#ccc') + 'aa');
          ctx.fillRect(px(x0), py(y0), (x1 - x0 + 1) * S, (y1 - y0 + 1) * S);
          ctx.strokeStyle = isDem ? '#c0392b' : '#5b3b6f';
          ctx.lineWidth = 2;
          ctx.setLineDash(isDem ? [6, 4] : []);
          ctx.strokeRect(px(x0), py(y0), (x1 - x0 + 1) * S, (y1 - y0 + 1) * S);
          ctx.setLineDash([]);
          /* 显示格数 */
          const cnt = (x1 - x0 + 1) * (y1 - y0 + 1);
          ctx.fillStyle = isDem ? '#c0392b' : '#5b3b6f';
          ctx.font = 'bold 11px "Microsoft YaHei"';
          ctx.fillText((isDem ? '拆 ' : '') + (x1 - x0 + 1) + '×' + (y1 - y0 + 1) + ' = ' + cnt + ' 格',
            px(x0) + 4, py(y0) - 4);
        } else if (curKind === 'line') {
          const pts = lineBetween(drag.sx, drag.sy, drag.cx, drag.cy);
          const def = LINE[curTool] || LINE.road;
          ctx.strokeStyle = def.c; ctx.lineWidth = def.w; ctx.lineCap = 'round';
          ctx.beginPath();
          pts.forEach((pt, i) => { const X = px(pt[0]) + S / 2, Y = py(pt[1]) + S / 2; i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); });
          ctx.stroke();
        }
        ctx.restore();
      }

      /* 比例尺 */
      ctx.fillStyle = 'rgba(60,60,80,.55)';
      ctx.font = '10px "Microsoft YaHei"';
      ctx.fillText('每格 ≈ 200 米', 10, H - 8);
    };

    const hover = { x: -1, y: -1 };
    cv.onmousedown = ev => {
      const t = toTile(ev);
      if (!t) return;
      if (ev.button === 2) { view.drag2 = { mx: ev.clientX, my: ev.clientY, ox: view.ox, oy: view.oy }; return; }
      drag = { sx: t.x, sy: t.y, cx: t.x, cy: t.y, active: true };
    };
    cv.oncontextmenu = e => e.preventDefault();
    window.addEventListener('mousemove', ev => {
      if (view.drag2) {
        const r = cv.getBoundingClientRect();
        if (ev.buttons & 2) {
          view.ox = view.drag2.ox + (ev.clientX - view.drag2.mx);
          view.oy = view.drag2.oy + (ev.clientY - view.drag2.my);
          draw();
        } else view.drag2 = null;
        return;
      }
      if (!drag) return;
      const t = toTile(ev);
      if (!t) return;
      drag.cx = cl(t.x, 0, c.W - 1); drag.cy = cl(t.y, 0, c.H - 1);
      const hi = $('#hoverInfo');
      if (hi) {
        if (curKind === 'zone') hi.textContent = `刷 ${Math.abs(drag.cx-drag.sx)+1}×${Math.abs(drag.cy-drag.sy)+1} 格 ${ZONE[curTool]?ZONE[curTool].n:''}`;
        else if (curKind === 'line') { const len = lineBetween(drag.sx,drag.sy,drag.cx,drag.cy).length; hi.textContent = '拉线 ' + len + ' 格 ' + (LINE[curTool]?LINE[curTool].n:'') + ' · 约 ' + (len*LINE[curTool].cost).toFixed(2) + '亿'; }
        else if (curKind === 'demolish') { const c2 = (Math.abs(drag.cx-drag.sx)+1)*(Math.abs(drag.cy-drag.sy)+1); hi.textContent = '拆除 ' + (Math.abs(drag.cx-drag.sx)+1) + '×' + (Math.abs(drag.cy-drag.sy)+1) + ' = ' + c2 + ' 格'; }
      }
      draw();
    });
    window.addEventListener('mouseup', ev => {
      view.drag2 = null;
      if (!drag || !drag.active) { drag = null; return; }
      const d = drag; drag = null;
      applyTool(g, scope, d, draw);
    });
    cv.onmousemove = ev => {
      if (drag) return;
      const t = toTile(ev);
      const hi = $('#hoverInfo');
      if (!t) { hover.x = -1; return; }
      hover.x = t.x; hover.y = t.y;
      if (hi && !drag) {
        const z = c.zone[t.y][t.x], tr = c.terr[t.y][t.x];
        hi.textContent = '(' + t.x + ',' + t.y + ') ' + (z && ZONE[z] ? ZONE[z].n : (TERRAIN[tr] || TERRAIN.empty).n);
      }
    };
    draw();

    function roundRect(ctx9, x, y, w, h, r) {
      ctx9.beginPath();
      ctx9.moveTo(x + r, y);
      ctx9.arcTo(x + w, y, x + w, y + h, r);
      ctx9.arcTo(x + w, y + h, x, y + h, r);
      ctx9.arcTo(x, y + h, x, y, r);
      ctx9.arcTo(x, y, x + w, y, r);
      ctx9.closePath();
    }
  };

  /* 两点之间取格点（Bresenham） */
  function lineBetween(x0, y0, x1, y1) {
    const pts = [];
    let dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
    let sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx - dy;
    let x = x0, y = y0, guard = 0;
    while (guard++ < 4000) {
      pts.push([x, y]);
      if (x === x1 && y === y1) break;
      const e2 = 2 * err;
      if (e2 > -dy) { err -= dy; x += sx; }
      if (e2 < dx) { err += dx; y += sy; }
    }
    return pts;
  }

  /* ---------------- 应用工具 ---------------- */
  function applyTool(g, scope, d, draw) {
    const T = m => window.__toast && window.__toast(m);
    const c = g.townGrid;
    const p = g.player;
    const lv = p.level || 0;

    if (!curTool) { T('先选一个工具'); return; }
    if (!scope.canBuild && curKind !== 'demolish') { T('你还没有建设审批权（至少正科级）'); return; }

    /* 拆除 */
    if (curKind === 'demolish') {
      if (lv < 3) { T('拆迁权在副处级及以上（副县长/区长）'); return; }
      let n = 0, nZone = 0, nForest = 0, nFarm = 0, nEco = 0, nFarmP = 0, blockedEco = 0, blockedFarmP = 0;
      for (let y = Math.min(d.sy, d.cy); y <= Math.max(d.sy, d.cy); y++)
        for (let x = Math.min(d.sx, d.cx); x <= Math.max(d.sx, d.cx); x++) {
          let changed = false;
          const lcx = (c.line && c.line[y] && c.line[y][x]) || 'other';
          const tt = c.terr[y][x];
          if (c.zone[y][x]) { c.zone[y][x] = null; nZone++; changed = true; }
          if (tt === 'forest' || tt === 'farm') {
            if (lcx === 'eco') {
              /* 生态红线：副部级（lv>=7）才能调整，代价大 */
              if (lv >= 7) { c.terr[y][x] = 'empty'; nEco++; changed = true; }
              else { blockedEco++; continue; }
            } else if (lcx === 'farmP') {
              /* 永久基本农田：正处级（lv>=4）可占，需占补平衡 */
              if (lv >= 4) { c.terr[y][x] = 'empty'; nFarmP++; changed = true; }
              else { blockedFarmP++; continue; }
            } else {
              c.terr[y][x] = 'empty';
              if (tt === 'forest') nForest++; else nFarm++;
              changed = true;
            }
          }
          if (changed) n++;
        }
      if (!n) {
        if (blockedEco) T('生态保护红线内林地需副部级（副省长）以上才能调整，你还不够');
        else if (blockedFarmP) T('永久基本农田需正处级（县长/区长）以上才能调整');
        else T('这片没有可拆的');
        return;
      }
      /* 代价：普通 0.002/格，基本农田 0.01/格（占补平衡），生态红线 0.03/格（异地补划） */
      const cost = nZone * 0.002 + nForest * 0.002 + nFarm * 0.004 + nFarmP * 0.010 + nEco * 0.030;
      if ((g.finance || 0) < cost) { T('财政不够（需 ' + cost.toFixed(2) + ' 亿）'); return; }
      g.finance -= cost;
      c.history.push({ t: 'demolish', n });
      if (window.RISK) {
        const base = n * 0.02;
        const extra = nEco * 0.9 + nFarmP * 0.5;   /* 动红线风险极大 */
        RISK.add(g, 'house', '征地拆迁 ' + n + ' 格' + (nEco ? '（含生态红线 ' + nEco + ' 格）' : ''), Math.min(3, base + extra));
      }
      if (p.metrics) p.metrics.security = cl((p.metrics.security || 50) - n * 0.06, 0, 100);
      if (p.metrics && nEco) p.metrics.eco = cl((p.metrics.eco || 50) - nEco * 0.4, 0, 100);
      draw && draw();
      const parts2 = ['拆迁 ' + n + ' 格'];
      if (nEco) parts2.push('生态红线 ' + nEco + ' 格（风险大增）');
      if (nFarmP) parts2.push('基本农田 ' + nFarmP + ' 格（已占补平衡）');
      if (blockedEco) parts2.push('红线内 ' + blockedEco + ' 格需副部级');
      if (blockedFarmP) parts2.push('基本农田 ' + blockedFarmP + ' 格需正处级');
      T(parts2.join(' · '));
      if (window.__render) setTimeout(() => window.__render(), 16);
      if (window.__save) window.__save();
      return;
    }

    /* 区域刷 */
    if (curKind === 'zone') {
      const z = ZONE[curTool];
      if (!z) return;
      if (lv < z.lv) { T(z.n + ' 需要 ' + RN(z.lv)); return; }
      let n = 0, blockedEco = 0, blockedFarm = 0, forestCnt = 0, farmCnt = 0, ecoCnt = 0, farmPCnt = 0;
      for (let y = Math.min(d.sy, d.cy); y <= Math.max(d.sy, d.cy); y++)
        for (let x = Math.min(d.sx, d.cx); x <= Math.max(d.sx, d.cx); x++) {
          const cur0 = c.terr[y][x];
          const lc0 = (c.line && c.line[y] && c.line[y][x]) || 'other';
          if (cur0 === 'water' || cur0 === 'mtn') continue;
          /* 三区三线约束：高职位可突破 */
          if (lc0 === 'eco' && cur0 === 'forest') {
            if (lv < 7) { blockedEco++; continue; }
            ecoCnt++;
          }
          if (lc0 === 'farmP' && cur0 === 'farm') {
            if (lv < 4) { blockedFarm++; continue; }
            farmPCnt++;
          }
          if (c.zone[y][x] === curTool) continue;
          if (cur0 === 'forest') forestCnt++;
          if (cur0 === 'farm') farmCnt++;
          c.terr[y][x] = 'empty';
          c.zone[y][x] = curTool; n++;
        }
      if (!n) {
        if (blockedEco) T('生态保护红线内不得开发（' + blockedEco + ' 格被拦）');
        else if (blockedFarm) T('永久基本农田不得占用（' + blockedFarm + ' 格被拦）');
        else T('这片不能规划');
        return;
      }
      /* 占林占耕要加钱 */
      let cost = n * z.cost + forestCnt * z.cost * 0.6 + farmCnt * z.cost * 1.2
        + farmPCnt * z.cost * 4 + ecoCnt * z.cost * 10;
      if ((g.finance || 0) < cost) { T('财政不够（需 ' + cost.toFixed(2) + ' 亿，含占林占耕补偿）'); return; }
      g.finance -= cost;
      const occTotal = forestCnt + farmCnt + farmPCnt + ecoCnt;
      if (occTotal) {
        c.occupy = (c.occupy || 0) + occTotal;
        if (window.RISK) RISK.add(g, 'house', '占用林地耕地', Math.min(2.5, occTotal / 40 + ecoCnt * 0.6));
      }
      c.history.push({ t: curTool, n });
      if (p.metrics) {
        if (curTool === 'm') p.metrics.gdp = cl((p.metrics.gdp||50) + n * 0.12, 0, 100);
        if (curTool === 'b') p.metrics.biz = cl((p.metrics.biz||50) + n * 0.08, 0, 100);
        if (curTool === 'g1' || curTool === 'g2') p.metrics.eco = cl((p.metrics.eco||50) + n * 0.1, 0, 100);
        if (curTool === 'a3' || curTool === 'a5' || curTool === 'res') p.metrics.welfare = cl((p.metrics.welfare||50) + n * 0.1, 0, 100);
      }
      draw && draw(); T('规划 ' + z.n + ' ' + n + ' 格');
      if (window.__render) setTimeout(() => window.__render(), 16);
      if (window.__save) window.__save();
      return;
    }

    /* 线性拉线 */
    if (curKind === 'line') {
      const def = LINE[curTool];
      if (!def) return;
      if (lv < def.lv) { T(def.n + ' 需要 ' + RN(def.lv)); return; }
      const pts = lineBetween(d.sx, d.sy, d.cx, d.cy);
      if (pts.length < 2) { T('太短了'); return; }
      const cost = pts.length * def.cost;
      if ((g.finance || 0) < cost) { T('财政不够（需 ' + cost.toFixed(2) + ' 亿）'); return; }
      g.finance -= cost;
      if (curTool === 'road') c.roads.push(pts);
      else { c.lines = c.lines || []; c.lines.push({ kind: curTool, pts }); }
      c.history.push({ t: curTool, n: pts.length });
      draw && draw(); T('建成 ' + def.n + ' ' + pts.length + ' 格');
      if (window.__render) setTimeout(() => window.__render(), 16);
      if (window.__save) window.__save();
      return;
    }

    /* 单点设施 */
    if (curKind === 'point') {
      const def = POINT[curTool];
      if (!def) return;
      if (lv < def.lv) { T(def.n + ' 需要 ' + RN(def.lv)); return; }
      if (c.terr[d.sy][d.sx] === 'water') { T('水域不能建'); return; }
      const cost = def.cost;
      if ((g.finance || 0) < cost) { T('财政不够（需 ' + cost.toFixed(2) + ' 亿）'); return; }
      g.finance -= cost;
      c.points = c.points || [];
      c.points.push({ x: d.sx, y: d.sy, kind: curTool });
      c.history.push({ t: curTool, n: 1 });
      draw && draw(); T('建成 ' + def.n);
      if (window.__render) setTimeout(() => window.__render(), 16);
      if (window.__save) window.__save();
    }
  }


  /* 绘制全国地图 */
  window.initNationCanvas = function (g) {
    const cv = document.getElementById('nationCanvas');
    if (!cv || !window.CHINA_MAP) return;
    const MAP = window.CHINA_MAP;
    const ctx = cv.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const W = cv.clientWidth, H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const sc = Math.min(W / MAP.w, H / MAP.h) * 0.94;
    const ox = (W - MAP.w * sc) / 2, oy = (H - MAP.h * sc) / 2;
    const pos = g.player.position || {};
    const myProv = (pos.province || '').replace(/(省|市|自治区|特别行政区)$/, '');

    const shapes = MAP.shapes.map(sp => {
      const nums = [];
      sp.d.split('Z').forEach(seg => {
        const arr = seg.replace(/[ML]/g, ',').split(',').filter(Boolean).map(Number);
        if (arr.length >= 6) nums.push(arr);
      });
      return { sp, nums };
    });

    const isMine = sp => sp.n === myProv || (pos.province && pos.province.indexOf(sp.n) === 0);
    const drawAll = (hoverIdx) => {
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#f7f4fb'; ctx.fillRect(0, 0, W, H);
      shapes.forEach((sh, i) => {
        ctx.beginPath();
        sh.nums.forEach(arr => {
          for (let k = 0; k < arr.length; k += 2) {
            const X = ox + arr[k] * sc, Y = oy + arr[k + 1] * sc;
            if (k === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
          }
          ctx.closePath();
        });
        const mine = isMine(sh.sp);
        ctx.fillStyle = mine ? '#c9a227' : (i === hoverIdx ? '#b79fd4' : '#e4dced');
        ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = mine ? 2 : 1; ctx.stroke();
      });
      /* 省名 */
      ctx.font = '10px "Microsoft YaHei"';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      shapes.forEach(sh => {
        const c = sh.sp.center;
        if (!c) return;
        const X = ox + ((c[0] - 73.5) / (135.1 - 73.5)) * MAP.w * sc;
        const Y = oy + (1 - (c[1] - 3.8) / (53.6 - 3.8)) * MAP.h * sc;
        ctx.fillStyle = isMine(sh.sp) ? '#fff' : '#6b5f7a';
        ctx.fillText(sh.sp.n, X, Y);
      });
      ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
    };
    drawAll(-1);

    let hoverIdx = -1;
    const hitTest = (ev) => {
      const r = cv.getBoundingClientRect();
      const mx = ev.clientX - r.left, my = ev.clientY - r.top;
      for (let i = 0; i < shapes.length; i++) {
        const sh = shapes[i];
        ctx.beginPath();
        sh.nums.forEach(arr => {
          for (let k = 0; k < arr.length; k += 2) {
            const X = ox + arr[k] * sc, Y = oy + arr[k + 1] * sc;
            if (k === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
          }
          ctx.closePath();
        });
        if (ctx.isPointInPath(mx, my)) return i;
      }
      return -1;
    };
    cv.onmousemove = ev => {
      const i = hitTest(ev);
      if (i !== hoverIdx) { hoverIdx = i; drawAll(i); }
      const tip = document.getElementById('nationTip');
      if (tip) tip.textContent = i >= 0 ? shapes[i].sp.full : '点省份查看详情';
    };
    cv.onclick = ev => {
      const i = hitTest(ev);
      if (i < 0) return;
      const sp = shapes[i].sp;
      const cities = (window.FY && FY.cityMap) ? (FY.cityMap[sp.full] || FY.cityMap[sp.n] || []) : [];
      const cadres = (g.cadres || []).filter(c => (c.unit || '').indexOf(sp.n) >= 0);
      const side = document.getElementById('nationSide');
      if (side) {
        side.innerHTML = '<b style="color:var(--plum);font-size:13px">' + sp.full + '</b>' +
          '<div class="kv" style="margin-top:6px"><span>地级市</span><span>' + cities.length + ' 个</span></div>' +
          '<div class="kv"><span>在册干部</span><span>' + cadres.length + ' 人</span></div>' +
          (isMine(sp) ? '<div class="sm" style="color:#8a6a33;margin-top:6px">✓ 这是你任职的省份</div>' : '') +
          '<div class="sm dim" style="margin:8px 0 4px">下辖市</div>' +
          '<div style="font-size:11px;line-height:1.9">' + (cities.slice(0, 24).join('、') || '—') + '</div>' +
          (cadres.length ? '<div class="sm dim" style="margin:8px 0 4px">主要领导</div>' +
            '<div style="font-size:11px">' + cadres.slice(0, 5).map(c => c.name + '（' + c.title + '）').join('<br>') + '</div>' : '') +
          (isMine(sp) ? '<button class="btn sm primary wide" style="margin-top:10px" id="btnEnterProv">进入本省规划图 →</button>' : '');
        const b = document.getElementById('btnEnterProv');
        if (b) b.onclick = () => { window.__setNationMode(false); (window.__render ? window.__render() : 0); };
      }
    };
  };

  /* ---------------- 绑定 ---------------- */
  window.bindCityTools = function (g) {
    document.querySelectorAll('[data-tool]').forEach(b => {
      b.onclick = () => {
        curTool = b.dataset.tool;
        curKind = b.dataset.kind;
        document.querySelectorAll('[data-tool]').forEach(x => { x.style.outline = ''; x.style.boxShadow = ''; });
        b.style.outline = '2px solid #7b5a96';
        b.style.outlineOffset = '1px';
      };
    });
    document.querySelectorAll('[data-zoom]').forEach(b => {
      b.onclick = () => {
        const d = Number(b.dataset.zoom);
        if (d === 0) { view.init = false; window.initCityCanvas(g); return; }
        view.size = cl(view.size + d * 3, 5, 40);
        window.initCityCanvas(g);
      };
    });
    /* 页签切换 */
    document.querySelectorAll('[data-tab]').forEach(btn => {
      btn.onclick = () => {
        const i = Number(btn.dataset.tab);
        document.querySelectorAll('[data-tab]').forEach(b2 => {
          const on = Number(b2.dataset.tab) === i;
          b2.style.background = on ? '#f4eefa' : 'transparent';
          b2.style.color = on ? '#5b3b6f' : '#7a7186';
          b2.style.borderBottom = '2px solid ' + (on ? '#7b5a96' : 'transparent');
        });
        document.querySelectorAll('[data-tabpane]').forEach(p2 => {
          p2.style.display = Number(p2.dataset.tabpane) === i ? '' : 'none';
        });
      };
    });
    const bn = document.getElementById('btnNation');
    if (bn) bn.onclick = () => { window.__setNationMode(true); (window.__render ? window.__render() : 0); };
    const bb = document.getElementById('btnBackProv');
    if (bb) bb.onclick = () => { window.__setNationMode(false); (window.__render ? window.__render() : 0); };
    if (document.getElementById('nationCanvas')) window.initNationCanvas(g);
  };

  window.__cityState = {
    get tool() { return curTool; }, get kind() { return curKind; },
    set(t, k) { curTool = t; curKind = k; },
    get view() { return view; },
    stats: cityStats,
  };
})();
</script>
