  button{font-family:inherit;cursor:pointer}
  .hidden{display:none!important}
  .flex{display:flex}.ac{align-items:center}.g6{gap:6px}
  .grow{flex:1;min-width:0}
  .dim{color:var(--soft)}
  .sm{font-size:11.5px}
  .r{text-align:right}
  .c{text-align:center}

  .top{position:sticky;top:0;z-index:50;background:rgba(255,253,251,.97);
    border-bottom:1px solid var(--line);box-shadow:0 2px 14px rgba(70,50,90,.09)}
  .topRow{display:flex;align-items:center;gap:16px;padding:9px 20px 4px;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:8px;flex:none}
  .brand b{font-size:20px;letter-spacing:4px;color:var(--plum);font-weight:600}
  .brand span{font-size:11.5px;color:var(--soft);letter-spacing:2px}
  .navs{display:flex;flex-wrap:wrap;gap:2px 4px;flex:1}
  .navs a{display:flex;align-items:center;gap:5px;padding:3px 9px;border-radius:7px;
    color:#4c4159;text-decoration:none;font-size:13px;position:relative}
  .navs a:hover{background:rgba(91,59,111,.09)}
  .navs a.on{background:rgba(91,59,111,.14);color:var(--plum);font-weight:600}
  .navs a i{width:17px;height:17px;border-radius:5px;background:#efeaf5;color:var(--plum);
    display:grid;place-items:center;font-style:normal;font-size:10.5px}
  .navs a em{position:absolute;top:-4px;right:-2px;background:#e04b4b;color:#fff;font-style:normal;
    font-size:9.5px;border-radius:8px;padding:0 4px;line-height:14px;min-width:14px;text-align:center}
  .topRight{display:flex;align-items:center;gap:8px;flex:none;font-size:12.5px;color:#4c4159}
  .ap{background:#eef0fb;border:1px solid #c9d2f5;color:#4656a8;border-radius:7px;padding:2px 9px}
  .seed{background:#f6f3fa;border:1px solid var(--line);border-radius:7px;padding:2px 9px;color:var(--soft)}
  .btn{border:1px solid var(--gold);color:var(--gold);background:transparent;border-radius:8px;
    padding:4px 11px;font-size:12.5px}
  .btn:hover{background:rgba(138,106,51,.1)}
  .btn.primary{background:linear-gradient(180deg,#6b477f,#543468);color:#fdf8ee;border-color:#543468}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.ghost{border-color:var(--line);color:#5c5268}
  .btn.sm{padding:2px 8px;font-size:11.5px}
  .btn.wide{width:100%;padding:9px;font-size:14px;letter-spacing:2px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .notice{margin:0 20px 6px;background:#2d2733;color:#ffd9a0;border-radius:8px;padding:6px 14px;
    font-size:12.5px;letter-spacing:.3px}

  .wrap{display:grid;grid-template-columns:322px minmax(0,1fr) 366px;gap:12px;padding:12px 20px 54px}
  .col{display:flex;flex-direction:column;gap:12px;min-width:0}
  .card{background:var(--paper);border:1px solid rgba(91,59,111,.13);border-radius:13px;
    box-shadow:0 4px 16px rgba(70,50,90,.06);padding:13px 15px}
  .ch{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .ch .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:11px;
    background:#f3edf8;color:var(--plum)}
  .ch .ic.blue{background:#e9eefb;color:#4656a8}
  .ch .ic.green{background:#e6f2e9;color:#3f7d5c}
  .ch .ic.orange{background:#fbeee0;color:#a5713a}
  .ch h3{margin:0;font-size:14px;color:var(--plum);font-weight:600}
  .ch .tail{margin-left:auto;font-size:11.5px;color:var(--soft);font-weight:400}

  .pfHead{display:flex;gap:10px;align-items:center}
  .face{width:46px;height:46px;border-radius:9px;background:linear-gradient(160deg,#e7ddf1,#cdd6ee);
    display:grid;place-items:center;font-size:20px}
  .pfName{font-size:15px;font-weight:700;color:var(--plum);line-height:1.3}
  .pfPos{font-size:11.5px;color:var(--soft);line-height:1.4}
  .kv{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:3px 0;
    border-bottom:1px dashed rgba(91,59,111,.11)}
  .kv:last-child{border-bottom:none}
  .kv>span:first-child{color:var(--soft);flex:none}
  .tag{font-size:10.5px;border:1px solid var(--line);border-radius:6px;padding:0 5px;color:var(--soft)}
  .linkbtn{background:none;border:none;color:var(--plum);font-size:11.5px;text-decoration:underline;padding:0}
  .histBar{margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px;
    color:#5c5268;text-align:center;background:#fbf8fd;cursor:pointer}
  .expBar{margin-top:8px}
  .prog{height:7px;border-radius:4px;background:#ece7f2;overflow:hidden}
  .prog>i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#9a79bd,#5b3b6f)}

  .attr{display:grid;grid-template-columns:44px 1fr 30px;align-items:center;gap:8px;font-size:12px;margin:5px 0}
  .attr .n{color:var(--soft)}
  .attr b{font-size:12px;color:#3d3546;text-align:right;font-variant-numeric:tabular-nums}
  .tenRow{display:flex;justify-content:space-between;font-size:12px;color:#5c5268;margin-bottom:5px}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
  .kpi{border-radius:10px;padding:8px 11px;border:1px solid rgba(91,59,111,.1)}
  .kpi.g1{background:#e9f5ec}.kpi.g2{background:#ecf0fb}.kpi.g3{background:#fdf4e4}.kpi.g4{background:#f3ecfa}
  .kpi label{display:block;font-size:11px;color:#5c5268}
  .kpi b{font-size:17px;font-variant-numeric:tabular-nums}
  .kpi b em{font-size:11px;font-style:normal;color:#5c5268;margin-left:2px}
  .kpi .s{font-size:10.5px;color:#7a7186}
  .skyline{height:86px;border-radius:10px;background:linear-gradient(180deg,#d8e6ef,#eef3f7);
    display:grid;place-items:center;font-size:11px;color:#6d7c8b;border:1px solid var(--line)}

  .miniStats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .miniStat{background:#faf7fc;border:1px solid var(--line);border-radius:9px;padding:7px 9px;text-align:center}
  .miniStat b{display:block;font-size:16px;color:var(--plum)}
  .miniStat span{font-size:10.5px;color:var(--soft)}

  .mx{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  .m{border-radius:9px;padding:7px 9px;background:#faf7fc;border:1px solid var(--line)}
  .m b{display:block;font-size:15px}
  .m .d{font-size:10.5px;color:var(--soft)}
  .up{color:var(--ok)} .down{color:var(--err)}

  .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

<script>/* ============================================================
   治理者之路 · 全国行政区称呼（对所有省市县通用）
   省级：省委 / 省政府 / 省人大 / 省政协
   市级：市委 / 市政府 / 市人大 / 市政协
   县级：县委 / 县政府 / 县人大 / 县政协
   区级：区委 / 区政府 / 区人大 / 区政协
   旗级：旗委 / 旗政府（内蒙古）
   ============================================================ */
(function () {
  'use strict';
  const ADM = window.ADM || {};
  window.ADM = ADM;


  /* ============================================================
     香港 / 澳门特别行政区（SAR）专属职务体系
     与内地不同：行政长官、政务司司长、立法会主席…
     ============================================================ */
  ADM.isSAR = function (area) {
    const s = String(area || '');
    return /特别行政区$/.test(s) || s === '香港' || s === '澳门';
  };

  /* 行政长官（相当于省委书记+省长合一） */
  ADM.sarChief = function (area) {
    const s = String(area || '');
    return /澳门/.test(s) ? '澳门特别行政区行政长官' : '香港特别行政区行政长官';
  };

  /* 三司：政务司 / 财政司 / 律政司 */
  ADM.sarSecretaries = function (area) {
    const s = String(area || '');
    const pre = /澳门/.test(s) ? '澳门特别行政区' : '香港特别行政区';
    if (/澳门/.test(s)) {
      return ['行政法务司司长', '经济财政司司长', '保安司司长', '社会文化司司长', '运输工务司司长'];
    }
    return ['政务司司长', '财政司司长', '律政司司长'];
  };

  /* 行政区类型判定（覆盖全国所有命名） */
  ADM.kindOf = function (area) {
    const s = String(area || '');
    if (/自治区$|自治州$/.test(s)) return 'autonomous';
    if (/特别行政区$/.test(s)) return 'sar';
    if (/新区$|开发区$|高新区$|经济区$|管理区$|园区$|试验区$|示范区$/.test(s)) return 'zone';
    if (/旗$|自治旗$/.test(s)) return 'banner';       /* 内蒙古旗县 */
    if (/林区$|特区$/.test(s)) return 'forest';        /* 神农架林区、六枝特区 */
    if (/县$|自治县$/.test(s)) return 'county';
    if (/区$/.test(s)) return 'district';
    if (/市$/.test(s)) return 'city';
    if (/省$/.test(s)) return 'province';
    return 'district';
  };

  /* 一级称呼字：省 / 市 / 县 / 区 / 旗 */
  ADM.char = function (area) {
    const k = ADM.kindOf(area);
    if (k === 'province') return '省';
    if (k === 'autonomous' && /自治区$/.test(area)) return '自治区';
    if (k === 'sar') return '区';
    if (k === 'banner') return '旗';
    if (k === 'forest') return '区';
    if (k === 'zone') return '区';
    if (k === 'county') return '县';
    if (k === 'city') return '市';
    if (k === 'district') return '区';
    return '区';
  };

  /* 党委前缀：省委 / 市委 / 县委 / 区委 / 旗委 */
  ADM.prefix = function (area) {
    const k = ADM.kindOf(area);
    if (k === 'autonomous' && /自治区$/.test(area)) return '自治区党委';
    return ADM.char(area) + '委';
  };

  /* 政府前缀：省政府 / 市政府 / 县政府 / 区政府 / 旗政府 */
  ADM.gov = function (area) {
    const k = ADM.kindOf(area);
    if (k === 'autonomous' && /自治区$/.test(area)) return '自治区人民政府';
    return ADM.char(area) + '政府';
  };

  /* 人大：省人大 / 市人大 / 县人大 / 区人大 */
  /* ---- 人大 / 政协 / 纪委 / 法院 / 检察院 / 工会（SAR 用不同名称） ---- */
  ADM.npc = function (area) {
    if (ADM.isSAR(area)) return '立法会';
    return ADM.char(area) + '人大';
  };
  ADM.cppcc = function (area) {
    if (ADM.isSAR(area)) return /澳门/.test(area) ? '行政会' : '行政会议';
    return ADM.char(area) + '政协';
  };
  ADM.cdi = function (area) {
    if (ADM.isSAR(area)) return '廉政公署';
    return ADM.char(area) + '纪委监委';
  };
  ADM.court = function (area) {
    if (ADM.isSAR(area)) return '终审法院';
    return ADM.char(area) + '人民法院';
  };
  ADM.proc = function (area) {
    if (ADM.isSAR(area)) return '律政司';
    return ADM.char(area) + '人民检察院';
  };
  ADM.union_ = function (area) {
    if (ADM.isSAR(area)) return /澳门/.test(area) ? '澳门工会联合总会' : '香港工会联合会';
    return ADM.char(area) + '总工会';
  };

  /* 一把手：省委书记 / 市委书记 / 县委书记 / 区委书记 / 旗委书记 */
  ADM.topTitle = function (area) {
    const k = ADM.kindOf(area);
    if (k === 'sar' || ADM.isSAR(area)) return ADM.sarChief(area);
    if (k === 'autonomous' && /自治区$/.test(area)) {
      return area + '党委书记';
    }
    return ADM.char(area) + '委书记';
  };
  /* 政府正职：省长 / 市长 / 县长 / 区长 / 旗长 */
  ADM.headTitle = function (area) {
    const k = ADM.kindOf(area);
    if (k === 'sar' || ADM.isSAR(area)) return /澳门/.test(area) ? '行政法务司司长' : '政务司司长';
    if (k === 'banner') return '旗长';
    const c = ADM.char(area);
    return c === '省' ? '省长' : c + '长';
  };
  ADM.viceTop = function (area) {
    if (ADM.isSAR(area)) return ADM.sarChief(area).replace('行政长官', '政务司司长');
    return ADM.topTitle(area).replace('书记', '副书记').replace('委副书记', '委副书记');
  };
  ADM.govHead = function (area) {
    const k = ADM.kindOf(area);
    const c = ADM.char(area);
    const gov = k === 'province' ? '省人民政府' : c === '市' ? '市人民政府' : c === '县' ? '县人民政府' : c === '旗' ? '旗人民政府' : '区人民政府';
    return gov + ADM.headTitle(area) + '、党组书记';
  };
  /* 常务：常务副省长 / 常务副市长 / 常务副县长 / 常务副区长 */
  ADM.execHead = function (area) {
    if (ADM.isSAR(area)) return /澳门/.test(area) ? '经济财政司司长' : '财政司司长';
    const c = ADM.char(area);
    return c === '省' ? '常务副省长' : '常务副' + ADM.headTitle(area);
  };
  ADM.deputy = function (area) {
    if (ADM.isSAR(area)) return /澳门/.test(area) ? '保安司司长' : '律政司司长';
    const c = ADM.char(area);
    return c === '省' ? '副省长' : '副' + ADM.headTitle(area);
  };

  /* 常委班子名：省委常委 / 市委常委 / 县委常委 / 区委常委 */
  ADM.standing = function (area) {
    if (ADM.isSAR(area)) return '行政会议成员';
    const k = ADM.kindOf(area);
    if (k === 'autonomous' && /自治区$/.test(area)) return '自治区党委常委';
    return ADM.char(area) + '委常委';
  };

  /* 徽标 */
  ADM.badge = function (area) {
    const k = ADM.kindOf(area);
    if (k === 'province' || (k === 'autonomous' && /自治区$/.test(area))) return '省级政府';
    if (k === 'sar') return '特别行政区政府';
    if (k === 'city') return '市级政府';
    if (k === 'banner') return '县级政府（旗）';
    if (k === 'county') return '县级政府';
    return '区级政府';
  };

  /* 域名前缀：去掉行政级别后缀 */
  ADM.urlName = function (area) {
    let s = String(area || '').trim();
    /* 1. 剥离层级后缀 */
    const SUF = /(特别行政区|自治区|自治州|自治县|自治旗|林区|特区|新区|开发区|高新区|经济区|管理区|园区|试验区|示范区|省|市|县|旗|区)$/;
    let guard = 0;
    while (SUF.test(s) && guard++ < 4) s = s.replace(SUF, '');
    /* 2. 去民族名（放在剥后缀之后，避免"自治旗"先被吃掉） */
    s = s.replace(/(蒙古族|回族|维吾尔族?|壮族|藏族|苗族|彝族|侗族|布依族|白族|傣族|景颇族|傈僳族|哈尼族|朝鲜族|土家族?|羌族|土族|撒拉族|仡佬族|瑶族|黎族|畲族|水族|纳西族|拉祜族|佤族|东乡族|保安族|裕固族|锡伯族|塔吉克族|乌孜别克族|俄罗斯族|鄂温克族|达斡尔族|鄂伦春族|赫哲族|门巴族|珞巴族|基诺族|布朗族|阿昌族|普米族|怒族|德昂族|独龙族|高山族|满族|毛南族|京族|塔塔尔族|柯尔克孜族)/g, '');
    /* 3. 去掉残留"自治" */
    s = s.replace(/自治$/, '');
    /* 4. 带上级地名的取末段：武汉市新洲 → 新洲 */
    if (/^[\u4e00-\u9fa5]{2,}(市|省).+/.test(s)) s = s.split(/市|省/).pop();
    /* 5. 兜底：剥空了就用原名前两个字（鄂温克族自治旗 → 鄂温克） */
    if (!s) {
      s = String(area || '').replace(/自治[县旗区州]$|特别行政区$/, '').replace(/族/g, '');
      s = s.replace(/[省市区县旗]$/, '');
      if (!s) s = String(area || 'gov').slice(0, 2);
    }
    return s || 'gov';
  };

  /* 英文后缀 */
  ADM.enSuffix = function (area) {
    const k = ADM.kindOf(area);
    if (k === 'province') return ' Province';
    if (k === 'autonomous') return /自治区$/.test(area) ? ' Autonomous Region' : ' Prefecture';
    if (k === 'sar') return ' SAR';
    if (k === 'city') return ' Municipality';
    if (k === 'county') return ' County';
    if (k === 'banner') return ' Banner';
    return ' District';
  };

  /* 常委 10 席职务 */
  ADM.standingPosts = function (area) {
    /* ---- 港澳特别行政区 ---- */
    if (ADM.isSAR(area)) {
      const isMacau = /澳门/.test(area);
      const pre = isMacau ? '澳门特别行政区' : '香港特别行政区';
      const secs = ADM.sarSecretaries(area);
      const base = [
        pre + '行政长官',
        '政务司司长',
        '财政司司长',
        '律政司司长',
        '保安局局长',
        '教育局局长',
        '民政事务局局长',
        '房屋局局长',
        '运输及物流局局长',
        '发展局局长',
        '卫生署署长',
        '警务处处长',
      ];
      if (isMacau) {
        return [
          pre + '行政长官',
          '行政法务司司长',
          '经济财政司司长',
          '保安司司长',
          '社会文化司司长',
          '运输工务司司长',
          '警察总局局长',
          '司法警察局局长',
          '行政公职局局长',
          '财政局副局长',
          '卫生局局长',
          '教育及青年发展局局长',
          '市政署管理委员会主席',
        ];
      }
      return base;
    }
    const k = ADM.kindOf(area);
    const isAR = k === 'autonomous' && /自治区$/.test(area);
    const c = ADM.char(area);
    const partyName = isAR ? '自治区党委' : c + '委';
    return [
      isAR ? '自治区党委书记' : c + '委书记',
      ADM.govHead(area),
      partyName + '常委、专职副书记',
      partyName + '常委、' + ADM.execHead(area),
      partyName + '常委、' + c + '纪委书记',
      partyName + '常委、组织部部长',
      partyName + '常委、宣传部部长',
      partyName + '常委、统战部部长',
      partyName + '常委、政法委书记',
      partyName + '常委、办公室主任',
    ];
  };

  /* 四套班子分组名 */
  ADM.groups = function (area) {
    const k = ADM.kindOf(area);
    if (k === 'autonomous' && /自治区$/.test(area)) {
      return ['自治区党委领导', '自治区政府领导', '自治区人大领导', '自治区政协领导'];
    }
    const c = ADM.char(area);
    return [c + '委领导', c + '政府领导', c + '人大领导', c + '政协领导'];
  };

  /* 机构名（按层级生成） */
  ADM.orgsFor = function (area) {
    /* ===== 港澳特别行政区：层级为 司/局/署/处 ===== */
    if (ADM.isSAR(area)) {
      const isMacau = /澳门/.test(area);
      if (isMacau) {
        return {
          party: ['行政长官办公室', '行政法务司', '经济财政司', '保安司', '社会文化司', '运输工务司',
                  '行政公职局', '法务局', '身份证明局'],

                '中央政策组', '行政署', '效率促进办公室'],
        gov: ['政务司司长办公室', '财政司司长办公室', '公务员事务局', '政制及内地事务局',
              '教育局', '环境及生态局', '食物及卫生局', '民政及青年事务局',
              '劳工及福利局', '保安局', '商务及经济发展局', '发展局',
              '房屋局', '创新科技及工业局', '运输及物流局', '文化体育及旅游局',
              '税务局', '海关', '入境事务处', '政府统计处'],
        npc: ['立法会', '立法会秘书处', '立法会内务委员会', '立法会财务委员会',
              '立法会法案委员会', '立法会事务委员会'],
        cppcc: ['行政会议', '行政会议秘书处', '行政会议成员办事处'],
        cdi: ['廉政公署', '审计署', '廉政公署执行处', '廉政公署防止贪污处',
              '廉政公署社区关系处', '申诉专员公署'],
        court: ['终审法院', '高等法院', '区域法院', '裁判法院', '土地审裁处'],
        union: ['香港工会联合会', '香港中华总商会', '香港总商会', '香港工业总会',
                '香港社会服务联会', '香港妇女联合会'],
        town: ['区议会', '区议会秘书处', '地区服务及关爱队伍', '分区委员会'],
      };
    }

    const c = ADM.char(area);
    const party = c + '委';
    const gov = c + '政府';
    const court = c + '人民法院';

      court: [court, proc],

      town: ['街道党工委', '街道办事处', '乡镇党委', '乡镇人民政府', '街道人大工委', '街道纪工委'],
    };
  };

  /* 全国省市县统计（用于展示"全覆盖"） */
  ADM.stats = function () {
    const CA = window.CHINA_AREAS || [];
    let prov = CA.length, city = 0, district = 0;
    CA.forEach(([p, cities]) => {
      (cities || []).forEach(([c, ds]) => {
        city++;
        district += (ds || []).length;
      });
    });
    return { prov, city, district };
  };
})();

<script>/* ============================================================
   治理者之路 · 头像生成器 v2（精细版）
   按姓名哈希生成：脸型/发型/五官/眼镜/胡须/服装/背景

(function () {

window.FY = window.FY || {};

FY.PROVINCES = GEO.PROVINCES;
FY.cityMap = {};       // 省名 → [市名]
FY.areaMap = {};       // "省|市" → [区县名]
RAW_AREAS.forEach(([pName, cities]) => {
  FY.cityMap[pName] = cities.map(c => c[0]);
  cities.forEach(([cName, areas]) => {
    FY.areaMap[pName + '|' + cName] = areas.slice();
  });
});
/* 补全没有区县数据的省份（直辖市/特别行政区/台湾） */
FY.PROVINCES.forEach(p => {
  if (FY.cityMap[p.n]) return;
  const cities = GEO.CITIES[p.k] || [p.n];
  FY.cityMap[p.n] = cities.slice();
  cities.forEach(c => {
    if (!FY.areaMap[p.n + '|' + c]) FY.areaMap[p.n + '|' + c] = [c.replace(/市$/, '') + '市辖区'];
  });
});
/* 直辖市特殊处理：北京市 → 朝阳区… */

const SECTIONS = ORG.SECTIONS || ['办公室'];
const POLICE = ORG.POLICE_SECTIONS || ['指挥中心'];

/* 某区县的全部机构（分组名 → 岗位类型/科室池） */
FY.orgGroups = function () {
  const groups = [];
  PARTY.forEach(([n, t]) => groups.push({ n, t, kind: 'party', sect: SECTIONS }));
  GOV.forEach(([n, t]) => {
    if (n === '公安局') groups.push({ n, t, kind: 'gov', sect: POLICE });
    else groups.push({ n, t, kind: 'gov', sect: SECTIONS });
  });
  OTHER.forEach(([n, t]) => {

};

    const pos = (g && g.player && g.player.position) || {};
    const org = pos.org || '';
    const prov = pos.province || '';
    const city = pos.city || '';
    const county = pos.county || '';
    const ZXS = ['北京市', '天津市', '上海市', '重庆市'];
    if (ZXS.includes(prov)) return prov;
    if (/^省/.test(org) || /省委|省政府|自治区|省人大|省政协/.test(org)) return prov || county;
    if (/^市|市委|市政府/.test(org)) return city || county;

    const p = party.replace(/委$/, '');     /* 省委 → 省 */
    const npc = c + '人大常委会主任';
    const cppcc = c + '政协主席';

      /* ---- 正科级 ---- */
      2: [
        { title: '科长', org: '本机关', sec: '同上', note: '本机关内设科室一把手' },
        { title: '乡镇长', org: '街道乡镇', sec: '政府', note: '基层行政一把手' },

  /* 部门池（按层级） */
  JP.deptsFor = function (gameLevel, area) {

    if (gameLevel >= 4) return orgs.gov.slice(0, 14);

  };
})();

  const hsh = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return Math.abs(h); };
  const sd = k => { let s = hsh(k) || 1; return () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; }; };

    const gdp = Math.max(180, Math.round(pa.gdp / nCity * scale));

      财政资金: Math.min(100, Math.round(d.rev / Math.max(1, d.gdp) * 700)),

      民生福祉: Math.min(100, Math.round(Math.min(95, d.income / 1000))),

  CD.allCities = function () {

    CA.forEach(([p, cs]) => {

        const cname = isZX ? p : c;

      Object.keys(ind).map(k => indBox(k, ind[k])).join('') + '</div>';

    html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">' +
        '<div>' + kv('地区生产总值', d.gdp, ' 亿元') + kv('一般公共预算收入', d.rev, ' 亿元') + kv('常住人口', d.pop, ' 万人') + '</div>' +
        '<div>' + kv('人均可支配收入', d.income, ' 元') + kv('城镇化率', d.urb, '%') + kv('第二产业占比', d.ind[1], '%') + '</div>' +
      '</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">' +
        '<div>' + kv('第三产业占比', (100 - d.ind[0] - d.ind[1]).toFixed(1), '%') + '</div>' +
        '<div>' + kv('第一产业占比', d.ind[0], '%') + '</div>' +
      '</div>';

    /* 40 个二级 */
    Object.keys(sub).forEach(k => {
      html += '<div style="margin:10px 0 4px;display:flex;align-items:baseline;gap:8px">' +
        '<b style="font-size:12.5px;color:#5b3b6f">' + k + '</b>' +
        '<span style="margin-left:auto;font-size:11px;color:#8a6a33">' + ind[k] + '</span></div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:0 14px">' +
        sub[k].map(([n, v]) => '<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:11.5px;border-bottom:1px dotted rgba(91,59,111,.1)">' +
          '<span>' + n + '</span><b style="color:' + (v >= 60 ? '#3f7d5c' : v >= 40 ? '#8a6a33' : '#a5463e') + '">' + v + '</b></div>').join('') +
        '</div>';
    });

    html += '<p class="sm dim" style="margin-top:12px;font-size:10.5px">' +
      '数据口径：2023 年国民经济和社会发展统计公报。区县指标由所属地市按产业结构与规模派生，' +
      '用于模拟推演，不代表官方统计。' + (d.real ? '（本市为实测数据）' : '') + '</p>';
    return html + '</div>';
  };

  window.renderCityData = function (g) {
    const C = window.CDATA;
    if (!C) return '<p class="sm dim">数据未加载</p>';
    const pos = g.player.position || {};
    const myCity = pos.city || '';
    const all = C.allCities();
    const my = all.find(x => x.city === myCity) || all[0];

    const row = x => {
      const isMine = x.city === myCity;
      return '<div style="display:flex;align-items:center;gap:7px;padding:4px 9px;font-size:11.5px;' +
        'border-bottom:1px dotted rgba(91,59,111,.12);' + (isMine ? 'background:#fdf4e4;' : (x.rank <= 10 ? 'background:#fdf9f3' : '')) + '">' +
        '<span style="width:32px;text-align:right;color:' + (x.rank <= 10 ? '#8b2020' : '#b0a288') + ';font-size:10.5px;font-weight:600">' + x.rank + '</span>' +
        '<span style="min-width:76px;font-weight:600;' + (isMine ? 'color:#8a6a33' : '') + '">' + x.city +
          (isMine ? '<span class="tag" style="font-size:9px;background:#fdf4e4;color:#8a6a33;margin-left:3px">你在这</span>' : '') + '</span>' +
        '<span class="sm dim" style="font-size:10px;min-width:56px">' + x.province.replace(/省$|市$|自治区$|壮族|回族|维吾尔/g, '') + '</span>' +
        '<span style="flex:1;text-align:right"><b>' + x.gdp + '</b><span class="sm dim" style="font-size:9.5px"> 亿</span></span>' +
        '<span style="width:64px;text-align:right"><b>' + x.rev + '</b><span class="sm dim" style="font-size:9.5px"> 亿</span></span>' +
        '<span style="width:56px;text-align:right"><b>' + x.pop + '</b><span class="sm dim" style="font-size:9.5px"> 万</span></span>' +
        '<span style="width:58px;text-align:right"><b>' + x.income + '</b><span class="sm dim" style="font-size:9.5px"> 元</span></span>' +
        '<span style="width:40px;text-align:right" class="sm dim">' + x.districts + '区县</span>' +
        '</div>';
    };

    return '<div class="card"><div class="ch"><span class="ic">市</span><h3>全国城市数据</h3>' +
      '<span class="tail">共 ' + all.length + ' 个地级行政区 · 按 2023 年 GDP 排序</span></div>' +

      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">' +
        '<div style="border:1px solid #e6dcc8;border-radius:8px;padding:7px 12px;background:#fdf8f0">' +
          '<div class="sm dim" style="font-size:10px">你在的城市</div><b style="font-size:15px;color:#8b2020">' + my.city + '</b></div>' +
        '<div style="border:1px solid #e6dcc8;border-radius:8px;padding:7px 12px;background:#fdf8f0">' +
          '<div class="sm dim" style="font-size:10px">全国排名</div><b style="font-size:15px;color:#8b2020">' + my.rank + ' / ' + all.length + '</b></div>' +
        '<div style="border:1px solid #e6dcc8;border-radius:8px;padding:7px 12px;background:#fdf8f0">' +
          '<div class="sm dim" style="font-size:10px">GDP</div><b style="font-size:15px;color:#8b2020">' + my.gdp + ' 亿</b></div>' +
        '<div style="border:1px solid #e6dcc8;border-radius:8px;padding:7px 12px;background:#fdf8f0">' +
          '<div class="sm dim" style="font-size:10px">人均可支配收入</div><b style="font-size:15px;color:#8b2020">' + my.income + ' 元</b></div>' +
      '</div>' +

      '<div style="display:flex;gap:6px;align-items:center;padding:5px 9px;font-size:10px;color:#8a8a94;border-bottom:1px solid #e6dcc8">' +
        '<span style="width:32px;text-align:right">排名</span><span style="min-width:76px">城市</span>' +
        '<span style="min-width:56px">省份</span><span style="flex:1;text-align:right">GDP</span>' +
        '<span style="width:64px;text-align:right">财政收入</span><span style="width:56px;text-align:right">人口</span>' +
        '<span style="width:58px;text-align:right">人均收入</span><span style="width:40px;text-align:right">区县数</span>' +
      '</div>' +
      '<div id="cityDataList" style="max-height:60vh;overflow:auto">' + all.map(row).join('') + '</div>' +

      '<p class="sm dim" style="margin-top:10px;font-size:10.5px">' +
        '前 56 个城市为 2023 年统计公报实测数据，其余按所在省份均值与产业结构派生；用于模拟推演。</p>' +
    '</div>';
  };

  window.bindCountyData = function () {};
})();
</script>
<script>/* ============================================================
   治理者之路 · 干部档案 + 岗位空缺
   - 每个人可点开：档案卡（能力/特质/履历/调动记录）
   - 免职后岗位空缺，可自己挑人补位
   - 空岗满 3 个月，中央自动派人
   ============================================================ */
(function () {
  'use strict';
  const PX = {};
  window.PERSON = PX;

  const hsh = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return Math.abs(h); };
  const sd = k => { let s = hsh(k) || 1; return () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; }; };
  const pk = (r, a) => a[Math.floor(r() * a.length)];

  const SCHOOLS = ['北京大学', '清华大学', '中国人民大学', '复旦大学', '浙江大学', '武汉大学', '中山大学',
                   '四川大学', '吉林大学', '山东大学', '厦门大学', '兰州大学', '省委党校', '省行政学院',
                   '南京大学', '华中科技大学', '西安交通大学', '哈尔滨工业大学'];
  const MAJORS = ['法学', '行政管理', '经济学', '财政学', '会计学', '汉语言文学', '公共事业管理',
                  '土木工程', '城市规划', '计算机科学与技术', '政治学与行政学', '社会学', '新闻学'];
  const PERSONALITY = ['独立理性', '务实现实', '温和协调', '沉毅果断', '机敏善言', '严谨细致', '豁达开朗', '内敛深沉'];
  const FAMILY = ['乡村普通家庭', '城镇工薪家庭', '干部家庭', '知识分子家庭', '个体经营者家庭'];
  const TRAITS = ['闷葫芦', '急性子', '稳得住', '话不多但准', '好说话', '认死理', '会来事', '记性好', '爱加班', '护下属'];

  /* 为一个人生成完整档案（按姓名哈希，稳定不重复） */
  PX.profile = function (name, opts) {
    const o = opts || {};
    const r = sd('prof|' + name + '|' + (o.seed || ''));
    const age = Number(o.age) || (28 + (hsh(name) % 26));
    const birthYear = 2024 - age;

    /* 能力 / 执行力 / 情商 / 抗压 / 体质 / 形象 */
    const cap = Math.round(45 + r() * 45);
    const exec = Math.round(42 + r() * 48);
    const eq = Math.round(38 + r() * 58);
    const stress = Math.round(35 + r() * 60);
    const body = Math.round(40 + r() * 55);
    const look = Math.round(40 + r() * 55);

    /* 学校 / 专业 / 学历 / 毕业年份 */
    const edu = o.edu || pk(r, ['本科', '硕士', '博士']);
    const myLv = (o.lv != null) ? o.lv : 4;
    const school = pk(r, SCHOOLS);
    const major = pk(r, MAJORS);
    const gradYear = birthYear + (/博/.test(edu) ? 28 : /硕/.test(edu) ? 25 : 22);

    /* 履历：从大学到现在，按真实职级逐级晋升 */
    const provRaw = o.province || '';
    const provShort = provRaw.replace(/(省|市|自治区|壮族自治区|回族自治区|维吾尔自治区)$/, '');
    const cityRaw = (o.city && o.city !== provRaw) ? o.city : '';
    const areaRaw = (o.area && o.area !== o.city && o.area !== provRaw) ? o.area : '';

    const career = [];

    /* ---- 学历 ---- */
    if (/博/.test(edu)) {
      career.push({ from: birthYear + 22, to: birthYear + 25, post: school + major + '专业硕士研究生学习' });
      career.push({ from: birthYear + 25, to: birthYear + 28, post: school + major + '专业博士研究生学习' });
    } else if (/硕/.test(edu)) {
      career.push({ from: birthYear + 18, to: birthYear + 22, post: school + major + '专业本科学习' });
      career.push({ from: birthYear + 22, to: birthYear + 25, post: school + major + '专业硕士研究生学习' });
    } else {
      career.push({ from: birthYear + 18, to: birthYear + 22, post: school + major + '专业本科学习' });
    }

    /* ---- 名称池（全部带后缀，直接用） ---- */
    /* 排除把省名/市名混进区县名的情形 */
    const bad = function (v) {
      if (!v) return true;
      if (v === provRaw || v === provShort) return true;
      if (/^(浙江|江苏|广东|山东|河南|四川|湖北|湖南|河北|山西|陕西|安徽|福建|江西|辽宁|吉林|黑龙江|甘肃|青海|云南|贵州|海南|台湾|内蒙古|广西|西藏|宁夏|新疆|北京|天津|上海|重庆)/.test(v) && /(省|市|自治区)$/.test(v)) return true;
      return false;
    };
    const CTY = (!bad(cityRaw) ? cityRaw : '') || pk(r, ['临江市', '雪江市', '青州市', '南川市', '广元市']);
    const CNA = (!bad(areaRaw) ? areaRaw : '') || pk(r, ['白水县', '临江县', '竹溪县', '潮浦区', '城关区']);
    const CITY = /[市州盟]$/.test(CTY) ? CTY : CTY + '市';
    const CNTY = /[县区市旗]$/.test(CNA) ? CNA : CNA + '县';
    const PROV = provShort ? provShort + '省' : '';
    const P = PROV ? PROV + '·' : '';

    const DEP = pk(r, ['农业农村局', '人力资源和社会保障局', '财政局', '发展改革委员会',
                       '卫生健康局', '教育局', '自然资源和规划局', '市场监督管理局']);
    const SEC = pk(r, ['综合科', '办公室', '人事科', '财务科', '法制科', '业务一科', '监督管理科']);
    const CITYDEP = pk(r, ['市财政局', '市住房和城乡建设局', '市市场监督管理局', '市农业农村局', '市发展改革委']);
    const PROVDEP = pk(r, ['省财政厅', '省住房和城乡建设厅', '省农业农村厅', '省发展和改革委员会']);
    const SUPS_LIST = ['党建、群团、农村、党校', '科技、环保、自然资源', '财政、税收、审计',
                       '民政、退役军人、双拥', '城建、交通、水利', '教育、卫生、医保',
                       '公安、司法、信访', '发改、工信、招商', '人社、市场监管', '农业农村、乡村振兴'];
    let supIdx = 0;

    /* ---- 逐级晋升 ---- */
    const targetLv = Math.min(9, Math.max(0, o.lv != null ? o.lv : 4));
    const STEPS = [
      { lv: 0, t: '科员（试用期）', d: 1 },
      { lv: 0, t: '科员', d: 2 },
      { lv: 1, t: '副主任科员', d: 2 },
      { lv: 1, t: '副科长', d: 2 },
      { lv: 2, t: '主任科员', d: 2 },
      { lv: 2, t: '科长', d: 2 },
      { lv: 3, t: '副处长', d: 3 },
      { lv: 3, t: '副县长', d: 3 },
      { lv: 4, t: '处长', d: 3 },
      { lv: 4, t: '县委书记', d: 3 },
      { lv: 5, t: '副市长', d: 3 },
      { lv: 6, t: '市长', d: 3 },
      { lv: 6, t: '市委书记', d: 3 },
      { lv: 7, t: '副省长', d: 3 },
      { lv: 8, t: '省长', d: 3 },
      { lv: 9, t: '省委书记', d: 99 },
    ];
    let steps = STEPS.filter(function (s) { return s.lv <= targetLv; });
    if (!steps.length) steps = [STEPS[0]];
    /* 段数太少就补中间层级，让履历有厚度 */
    if (targetLv >= 5 && steps.length < 6) {
      const extra = STEPS.filter(function (s) { return s.lv < targetLv && !steps.some(function (x) { return x.t === s.t; }); });
      steps = steps.concat(extra.slice(0, 6 - steps.length));
      steps.sort(function (a, b) { return a.lv - b.lv; });
    }
    /* 最后一步必须是「当前职务」 */
    const curT = (o.curTitle || '').trim();
    if (curT) {
      /* 去掉职务名里的冗余后缀，得到干净的职务 */
      const cleanT = curT
        .replace(/、党组书记$|、党组成员$|、党组$/, '')
        .replace(/^(省人民政府|市人民政府|县人民政府|区人民政府|市人民政府)/, '')
        .trim() || curT;
      steps = steps.filter(function (s2) { return s2.lv < targetLv; });
      steps.push({ lv: targetLv, t: cleanT, d: 99 });
    }

    let y = gradYear;
    const nowY = 2024;
    /* 先把所有步骤的年限分配好，保证最后一步一定落在现在 */
    const nWork = steps.length;
    let avail = nowY - y;
    if (avail < nWork) avail = nWork;
    /* 基础年限 */
    const durs = steps.map(function (s) { return Math.max(1, s.d === 99 ? 1 : s.d); });
    const baseSum = durs.reduce(function (a, b) { return a + b; }, 0);
    /* 按比例缩放到可用年限 */
    const scale = avail / Math.max(1, baseSum);
    const real = durs.map(function (dd) { return Math.max(1, Math.round(dd * scale)); });
    /* 最后一步吃掉剩余 */
    const used = real.reduce(function (a, b) { return a + b; }, 0);
    real[real.length - 1] = Math.max(1, real[real.length - 1] + (avail - used));

    for (let si = 0; si < steps.length; si++) {
      const st = steps[si];
      const isLast = (si === steps.length - 1);

      /* 党校进修（占用一部分年限，插在中间） */
      if (si > 0 && si % 3 === 0 && !isLast && real[si] > 2) {
        const org = st.lv <= 2 ? (provShort ? provShort + '县（区）委党校' : '县（区）委党校')
                  : st.lv <= 4 ? CITY + '委党校' : '中央党校';
        career.push({ from: y, to: y + 1, post: org + '中青年干部进修班（脱产学习）' });
        y += 1;
        real[si] = Math.max(1, real[si] - 1);
      }

      const dur = real[si];
      const to = Math.min(y + dur, nowY);

      /* 单位（全部是完整名） */
      let unit;
      if (st.lv <= 1)      unit = (PROV ? PROV + '·' : '') + CNTY + '·' + DEP + '·' + SEC;
      else if (st.lv === 2) unit = /科长/.test(st.t) ? ((PROV ? PROV + '·' : '') + CNTY + '·' + DEP + '·' + SEC) : ((PROV ? PROV + '·' : '') + CNTY + '·' + DEP);
      else if (st.lv === 3) unit = /副处长/.test(st.t) ? ((PROV ? PROV + '·' : '') + CITYDEP) : ((PROV ? PROV + '·' : '') + CITY + '·' + CNTY + '人民政府');
      else if (st.lv === 4) unit = /处长/.test(st.t) ? ((PROV ? PROV + '·' : '') + PROVDEP) : ((PROV ? PROV + '·' : '') + CITY + '·' + CNTY + '委');
      else if (st.lv === 5) unit = (PROV ? PROV + '·' : '') + CITY + '人民政府';
      else if (st.lv === 6) unit = (PROV ? PROV + '·' : '') + CITY + (/书记/.test(st.t) ? '委' : '人民政府');
      else if (st.lv === 7) unit = PROV ? PROV + '·省人民政府' : '省人民政府';
      else {
        /* 8+ 级：省长在省政府，省委书记/副书记在省委 */
        if (/省委书记|省委副书记|省委常委/.test(st.t)) unit = PROV ? PROV + '·省委' : '省委';
        else unit = PROV ? PROV + '·省人民政府' : '省人民政府';
      }

      let post;
      if (isLast && curT) {
        post = unit + ' ' + st.t + '（至今）';
      } else {
        post = unit + ' ' + st.t;
        if (st.lv >= 3) post = unit + ' ' + st.t + '（分管' + SUPS_LIST[supIdx % SUPS_LIST.length] + '）';
      }
      supIdx++;
      career.push({ from: y, to: to, post: post });
      y = to;
      if (y >= nowY) break;
    }


    /* 强制补「至今」的最后一段：当前职务 */
    if (career.length) {
      const lastY = career[career.length - 1].to || (nowY - 1);
      const startY = Math.min(lastY, nowY - 1);
      /* 当前职务的单位 */
      let curUnit;
      if (targetLv <= 1)      curUnit = (PROV ? PROV + '·' : '') + CNTY + '·' + DEP + '·' + SEC;
      else if (targetLv === 2) curUnit = (PROV ? PROV + '·' : '') + CNTY + '·' + DEP;
      else if (targetLv === 3) curUnit = (PROV ? PROV + '·' : '') + CITY + '·' + CNTY + '人民政府';
      else if (targetLv === 4) curUnit = (PROV ? PROV + '·' : '') + CITY + '·' + CNTY + '委';
      else if (targetLv === 5) curUnit = (PROV ? PROV + '·' : '') + CITY + '人民政府';
      else if (targetLv === 6) curUnit = (PROV ? PROV + '·' : '') + CITY + (/书记/.test(curT) ? '委' : '人民政府');
      else if (targetLv === 7) curUnit = PROV ? PROV + '·省人民政府' : '省人民政府';
      else {
        if (/省委书记|省委副书记|省委常委/.test(curT)) curUnit = PROV ? PROV + '·省委' : '省委';
        else if (/省长|副省长/.test(curT)) curUnit = PROV ? PROV + '·省人民政府' : '省人民政府';
        else curUnit = PROV ? PROV + '·省人民政府' : '省人民政府';
      }
      const curPost = curUnit + ' ' + (curT || (steps[steps.length - 1] || {}).t || '现任职务') + '（至今）';
      /* 倒二与倒一重复则删掉 */
      const prev = career[career.length - 1];
      if (prev && curT && prev.post.indexOf(curT) >= 0) career.pop();
      if (startY < nowY) career.push({ from: startY, to: nowY, post: curPost });
      if (career.length >= 2) career[career.length - 2].to = startY;
    }

    /* ---- 最终修正：年份单调递增 ---- */
    for (let ci = 1; ci < career.length; ci++) {
      if (career[ci].from < career[ci - 1].from) career[ci].from = career[ci - 1].from;
      if (career[ci].to < career[ci].from) career[ci].to = Math.min(career[ci].from + 1, nowY);
      if (career[ci - 1].to > career[ci].from) career[ci - 1].to = career[ci].from;
    }
    /* 最后一条必须到 nowY */
    if (career.length) career[career.length - 1].to = Math.max(nowY, career[career.length - 1].from);

    return {
      name,
      school, major, edu,
      birthYear,
      age,
      cap, exec, eq, stress, body, look,
      personality: pk(r, PERSONALITY),
      family: pk(r, FAMILY),
      traits: [pk(r, TRAITS), pk(r, TRAITS)].filter((v, i, a) => a.indexOf(v) === i),
      career,
      note: '',
    };
  };

  /* ---------------- 岗位空缺（存进存档） ---------------- */
  /* 结构：g.__vacancies = { '层级|区县|职位名': { title, level, since, candidates: [...] } } */
  PX.vacancies = function (g) {
    if (!g.__vacancies) g.__vacancies = {};
    return g.__vacancies;
  };

  PX.vacKey = function (g, title) {
    const pos = g.player.position || {};
    return (pos.county || '') + '|' + title;
  };

  /* 免职 → 岗位空出来 */
  PX.vacate = function (g, title, person) {
    const key = PX.vacKey(g, title);
    const V = PX.vacancies(g);
    V[key] = {
      title,
      level: person && person.level || '',
      since: { y: g.year, m: g.month },
      formerName: person && person.name || '',
      monthsEmpty: 0,
      candidates: [],
    };
    /* 生成 3 个候选（同层级、能力随机） */
    const r = sd('cand|' + key + '|' + g.year + '|' + g.month);
    const SUR = ['高','崔','丁','赵','唐','沈','郭','曹','周','肖','林','罗','李','王','张','刘','陈','杨','黄','吴'];
    const GIV = ['彬刚','平鹏','远勇','睿涛','旭浩','斌宇','凯鹏','伟旭','文涛','丹欣','超','磊','嘉','明志','建华','国强','海峰','志明'];
    for (let i = 0; i < 3; i++) {
      const nm2 = pk(r, SUR) + pk(r, GIV);
      const prof = PX.profile(nm2, { age: 40 + Math.floor(r() * 15), province: g.player.position && g.player.position.province });
      V[key].candidates.push({
        name: nm2, level: person && person.level || '',
        age: prof.age, edu: prof.edu, faction: '待定',
        cap: prof.cap, exec: prof.exec,
        from: '同层级干部',
      });
    }
    return V[key];
  };

  /* 自己挑人补位 */
  PX.fill = function (g, title, candIdx) {
    const key = PX.vacKey(g, title);
    const V = PX.vacancies(g);
    const vac = V[key];
    if (!vac) return { ok: false, msg: '这个岗位没有空缺' };
    const cand = vac.candidates[candIdx];
    if (!cand) return { ok: false, msg: '候选人不存在' };
    /* 从组织架构里把这个席补上 */
    const x = window.ORGX && window.ORGX.build(g);
    if (x) {
      x.columns.forEach(col => {
        col.seats.forEach(s => {
          if (s.title === title && (!s.person || !s.person.name)) {
            s.person = { ...cand, name: cand.name, title, supervise: '', faction: cand.faction };
            s.filledByPlayer = true;
          }
        });
      });
    }
    delete V[key];
    if (g.news) g.news.unshift({
      t: '你提名' + cand.name + '任' + title + '，已任命',
      date: g.year + '/' + g.month,
      eff: '补位成功', effColor: '#3f7d5c', kind: 'info',
    });
    return { ok: true, msg: cand.name + ' 已任命为 ' + title };
  };

  /* 每月检查：空岗满 3 个月 → 中央派人 */
  PX.tickMonth = function (g) {
    const V = PX.vacancies(g);
    const news = [];
    Object.keys(V).forEach(key => {
      const v = V[key];
      v.monthsEmpty = (v.monthsEmpty || 0) + 1;
      if (v.monthsEmpty >= 3) {
        /* 中央派人 */
        const r = sd('fill|' + key + '|' + g.year + '|' + g.month);
        const SUR = ['高','崔','丁','赵','唐','沈','郭','曹','周','肖','林','罗','李','王','张','刘','陈','杨'];
        const GIV = ['彬刚','平鹏','远勇','睿涛','旭浩','斌宇','凯鹏','伟旭','文涛','丹欣','超','磊','嘉','明志','建华'];
        const nm2 = pk(r, SUR) + pk(r, GIV);
        const x = window.ORGX && window.ORGX.build(g);
        if (x) {
          x.columns.forEach(col => {
            col.seats.forEach(s => {
              if (s.title === v.title && (!s.person || !s.person.name)) {
                s.person = { name: nm2, title: v.title, level: v.level, age: 45 + Math.floor(r() * 10),
                  sex: r() < 0.75 ? '男' : '女', edu: pk(r, ['本科', '硕士', '博士']),
                  faction: pk(r, ['学院派', '组织系统', '无派系', '改革派', '本地派']), supervise: '', autoFilled: true };
              }
            });
          });
        }
        news.push({ t: v.title + '空岗 3 个月，中央任命' + nm2 + '到任', date: g.year + '/' + g.month,
          eff: '上级直接任命', effColor: '#8a6a33', kind: 'info' });
        delete V[key];
      }
    });
    if (news.length && g.news) news.forEach(n => g.news.unshift(n));
    return news;
  };

  /* ---------------- 档案卡渲染 ---------------- */
  /* 从职务名反推职级（比 p.lv 更可靠） */
  function lvFromTitle(t) {
    const s = String(t || '');
    if (/中共中央总书记|国家主席|中央军委主席|全国人大常委会委员长|国务院总理|全国政协主席/.test(s)) return 11;
    if (/中央政治局|中央书记处|全国人大常委会副委员长|国务院副总理|国务委员|全国政协副主席|国家副主席|中央纪委书记|最高人民法院院长|最高人民检察院检察长/.test(s)) return 10;
    if (/省委书记|自治区党委书记/.test(s)) return 9;
    /* 副职先判，避免「副省长」被「省长」吃掉 */
    if (/副省长|省委常委|省人大常委会副主任|省政协副主席|省高院|省人民检察院/.test(s)) return 7;
    if (/省长|省委副书记|省政协主席|省人大常委会主任/.test(s)) return 8;
    if (/市委书记|市长|市人大常委会主任|市政协主席|省厅厅长/.test(s)) return 6;
    if (/市委常委|副市长|市人大常委会副主任|市政协副主席/.test(s)) return 5;
    if (/县委书记|区委书记|县长|区长|县人大常委会主任|区人大常委会主任|县政协主席|区政协主席/.test(s)) return 4;
    if (/区委常委|县委常委|副县长|副区长|县人大常委会副主任|区人大常委会副主任/.test(s)) return 3;
    if (/科长|乡镇长|乡长|镇长|街道办事处主任|街道办主任/.test(s)) return 2;
    if (/副科长|副乡镇长|副局长/.test(s)) return 1;
    return 0;
  }
  window.__lvFromTitle = lvFromTitle;

  window.renderPersonCard = function (p, extra) {
    const o = extra || {};
    const pr = PX.profile(p.name, { age: p.age, edu: p.edu, lv: (typeof p.lv === 'number' && p.lv > 0) ? p.lv : lvFromTitle(p.title), curTitle: String(p.title || '').trim(), province: o.province || '', city: o.city || '', area: o.area || '' });
    const bar = (label, v, note) =>
      '<div style="text-align:center"><div class="sm dim" style="font-size:10px">' + label + '</div>' +
      '<div style="font-size:17px;font-weight:700;color:' + (v >= 70 ? '#3f7d5c' : v >= 50 ? '#8a6a33' : '#a5463e') + '">' + v +
        '<span style="font-size:10px;color:#b0a288">/100</span></div>' +
      '<div style="height:3px;background:#eee;border-radius:2px;margin-top:3px"><div style="height:3px;width:' + v + '%;' +
        'background:' + (v >= 70 ? '#3f7d5c' : v >= 50 ? '#8a6a33' : '#a5463e') + ';border-radius:2px"></div></div>' +
      '<div class="sm dim" style="font-size:9px;margin-top:2px">' + note + '</div></div>';

    const kv = (k, v) => '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dotted rgba(91,59,111,.12);font-size:12px">' +
      '<span style="color:#5c5268;flex:none;min-width:52px">' + k + '</span><span style="text-align:right">' + v + '</span></div>';

    let h = '';
    /* 头像 + 头衔 */
    h += '<div style="display:flex;gap:10px;align-items:center;padding:8px 0 12px">' +
      (window.AV ? AV.box(p.name, { size: 54, sex: p.sex, age: p.age }) : '') +
      '<div><div style="font-size:15px;font-weight:700;color:#3a3548">' + p.name + '</div>' +
      '<div style="font-size:11.5px;color:#8a6a33;margin-top:2px">' + (p.title || '') + '</div>' +
      '<div class="sm dim" style="font-size:10px">' + (p.level || '') + ' · ' + (o.area || '') + '</div></div></div>';

    /* 基本信息 */
    h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:0 16px">' +
      '<div>' + kv('年龄', (p.age || pr.age) + ' 岁') + kv('性别', p.sex || '男') + kv('学历', (p.edu || pr.edu) + ' · ' + pr.school) + '</div>' +
      '<div>' + kv('专业', pr.major) + kv('派系', p.faction || '无派系') + kv('出身', pr.family) + '</div>' +
      '</div>';

    /* 能力 / 特质 */
    h += '<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0 8px">' +
      bar('能力', pr.cap, pr.cap >= 70 ? '强' : pr.cap >= 50 ? '中' : '弱') +
      bar('执行力', pr.exec, pr.exec >= 70 ? '强' : pr.exec >= 50 ? '中' : '弱') +
      bar('情商', pr.eq, pr.eq >= 70 ? '突出' : '一般') +
      bar('抗压', pr.stress, pr.stress >= 60 ? '好' : '一般') +
      bar('形象', pr.look, pr.look >= 60 ? '较好' : '一般') +
      '</div>';

    /* 直接领导 / 下属 */
    const sup = o.superior, subs = o.subordinates;
    if (sup || (subs && subs.length)) {
      h += '<div style="background:#faf8fc;border:1px solid #e6dcc8;border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:11px">';
      if (sup) {
        if (sup.none) {
          h += '<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">' +
            '<span style="color:#8a8a94;font-size:10px">直接领导</span>' +
            '<span style="font-size:11px;color:#8a6a33;background:#fdf4e4;border-radius:4px;padding:1px 7px">' +
            sup.title + '</span></div>';
        } else {
          h += '<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">' +
            '<span style="color:#8a8a94;font-size:10px">直接领导</span>' +
            (window.AV ? AV.box(sup.name, { size: 18 }) : '') +
            '<b data-cardname="' + encodeURIComponent(sup.name) + '" data-cardtitle="' + encodeURIComponent(sup.title || '') + '" ' +
            'style="color:#5b3b6f;cursor:pointer;border-bottom:1px dashed #c9b8d4">' + sup.name + '</b>' +
            '<span class="sm dim" style="font-size:10px">' + (sup.title || '') + '</span></div>';
        }
      }
      if (subs && subs.length) {
        h += '<div style="color:#8a8a94;font-size:10px;margin-bottom:3px">分管下属（' + subs.length + ' 人）</div>';
        h += '<div style="display:flex;flex-wrap:wrap;gap:4px">' + subs.slice(0, 12).map(sb =>
          '<span data-cardname="' + encodeURIComponent(sb.name) + '" data-cardtitle="' + encodeURIComponent(sb.title || '') + '" ' +
          'style="cursor:pointer;background:#fff;border:1px solid #e8e0d0;border-radius:4px;padding:1px 6px;font-size:10px">' +
            '<b style="color:#5b3b6f">' + sb.name + '</b> <span style="color:#a89878">' + (sb.title || '') + '</span></span>').join('') + '</div>';
      }
      h += '</div>';
    }

    /* 性格 */
    h += '<div style="background:#faf8fc;border:1px solid #e6dcc8;border-radius:8px;padding:8px 10px;margin-bottom:10px">' +
      '<div style="font-size:11.5px"><b>性格</b> · ' + pr.personality + '　<b>特点</b> ' + pr.traits.join('、') + '</div>' +
      '<div class="sm dim" style="font-size:10.5px;margin-top:4px">分管：' + (p.supervise || '未列明') + '</div>' +
      '</div>';

    /* 履历 */
    if (pr.career.length) {
      h += '<div style="font-size:12px;font-weight:700;color:#5b3b6f;margin:8px 0 5px">履历</div>';
      h += pr.career.map(c => '<div style="display:flex;gap:8px;font-size:11px;padding:3px 0;color:#3a3548;border-bottom:1px dotted #f0eae0">' +
        '<span style="color:#8a8a94;flex:none;min-width:96px">' + c.from + '—' + c.to + '</span>' +
        '<span style="line-height:1.5">' + c.post + '</span></div>').join('');
    }

    /* 调动记录 */
    const moves = (o.moves || []);
    h += '<div style="font-size:12px;font-weight:700;color:#5b3b6f;margin:10px 0 5px">调动记录</div>';
    if (moves.length) {
      h += moves.slice().reverse().map(m => '<div style="font-size:11px;padding:2px 0;color:#3a3548">' +
        '<span style="color:#8a8a94">' + m.date + '</span>　' + m.text + '</div>').join('');
    } else {
      h += '<div class="sm dim" style="font-size:11px">开（本局）以来没有动过 —— 一直在底册那个位置上。</div>';
    }

    /* 操作区：由调用方传入 o.actions */
    if (o.actions) h += o.actions;

    return h;
  };

  /* 点人看档 */
  window.openPersonCard = function (p, extra) {
    const o = extra || {};
    const btns = o.buttons || [{ n: '关闭', c: 'primary' }];
    window.__modal && window.__modal(
      (p.name || '') + '　' + (p.title || '') + '　' + (p.level || ''),
      renderPersonCard(p, o),
      btns
    );
    /* 卡片内的人名也能点 */
    window.__cardCurName = p.name;
